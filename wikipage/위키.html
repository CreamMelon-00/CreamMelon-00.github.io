만 원문의 '살아남은 온건주의 의원 집단'이 대본 용어사전의 '적극적인 강경 노선'과 엇갈려 보였는데, 작가 확인(2026-07-31)으로 축이 다른 것으로 정리됐다 — 대외 투사에는 적극적이고, 연말 위기 때 전쟁에 반대한 쪽이 온건파다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","구 철도파 온건 계열"],["노선","연방의 역량을 전 대륙에 투사"],["지역 기반","남방주 · 서방주"],["힘의 통로","[[연합]] · [[컴퍼니]] 등 해외 세력"],["대표 인물","[[하워드]]"],["강경파의 말로","[[연말 위기]] 화재로 숙청"]],"content":"# 철도파\n\n과거 존재했던 ‘철도파’에서 살아남은 온건주의 의원 집단. 철도의 세계화, 대륙의 철도 이권 장악 등 연방의 철도 정책을 중심적으로 다루는 이들을 지칭한다. ‘남방주’, ‘서방주’ 등을 지역적 기반으로 두고 있으며, ‘비숍스’나 ‘컴퍼니’ 등 해외 세력과의 협력을 통해 정치적 힘을 행사한다.\n\n```표어\n우리가 했던 일을 기억합니다. 반드시 필요했지만, 그릇된 방법을 통해 이루려했던…\n```\n\n## 노선과 계보\n\n구 철도파는 **‘연방의 역량을 전 대륙에 투사해야 한다’**는 입장이었고, 파벌 내부는 강경파와 온건파로 갈렸다.\n\n- **강경파** — [[건국의 아버지들]]을 포함해 철도 연합(유나이티드 레일로드)을 강경하게 추진했고, [[연말 위기]] 때 반 연방 세력과의 전쟁까지 주장했다. [[통일파]]의 쿠데타로 화재 속에서 대부분 사망했다.\n- **온건파** — 전쟁을 반대했던 덕에 생존했고, 이들이 지금의 철도파다. 최후통첩 협상에서 '그렌빌리아 대륙 전체에 연방 체계의 철도망을 설립한다'는 조항을 넣어, 현재까지 이어지는 ‘미트로프 중심 질서’를 만든 일등공신이 되었다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 상대 파벌\n- [[건국의 아버지들]] — 구 철도파 강경 계열\n- [[연말 위기]]\n- [[철도청]] · [[궤간 통일]]\n\n## 여담\n\n**두 '강경'이 다른 뜻이다.** 대본 용어사전은 철도파를 \"국력을 밖으로 뻗는 데 적극적인 강경 노선\"이라 하고, 원문은 \"살아남은 온건주의\"라 한다. 모순이 아니다. **대외 투사**에는 여전히 적극적이고, **연말 위기의 전쟁 찬반**에서는 반대편에 섰던 쪽이다. 축이 둘이라는 것을 놓치면 같은 파벌이 강경이면서 온건인 것처럼 보인다.\n\n**살아남은 이유가 노선을 바꿨다.** 무력으로 투사하려던 쪽이 죽고 협상으로 투사하려던 쪽이 남았으니, 지금의 철도파가 [[연합]]·[[컴퍼니]] 같은 해외 세력과의 **협력**을 통로로 쓰는 것이 자연스럽다. 위 인용문(\"반드시 필요했지만, 그릇된 방법을 통해 이루려했던\")도 그 자리에서 나온 말로 읽힌다.\n\n**서사 인물.** [[하워드]](철도파 의원)가 이 파벌 소속이다.","parentId":"federation"},{"title":"통일파","id":"unionists","type":"세력","folder":"02_지역","sortOrder":10,"era":"근대","canon":"확정","status":"완료","tags":["연방","의회","파벌","해체"],"memo":"원문에 단독 항목이 없던 문서. 197행(작가가 새로 확정한 정의)과 288·292행(분화 서술), 그리고 작가 확인(2026-07-31, '통일파 강경주의는 누스가 소실되고 통일파가 자치파와 통합파로 쪼개지는 과정에서 와해되었다')을 모아 계보 문서로 만들었다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["노선","우선 내부부터 정리"],["내부 갈래","강경파 · 온건파"],["주요 사건","[[연말 위기]] 쿠데타 — 주도"],["후신","[[통합파]] · [[자치파]]"],["해체","연방 헌법 소실과 파벌 분열 과정"]],"content":"# 통일파\n\n연방 의회의 오래된 파벌. **‘우선 내부부터 정리해야 한다’**는 입장을 취했다. 지금의 [[통합파]]와 [[자치파]]가 여기에서 갈라져 나왔다.\n\n## 노선\n\n[[철도파]]가 연방의 역량을 전 대륙에 투사해야 한다고 본 반면, 통일파는 확장보다 내부 정리를 앞세웠다. 두 파벌이 다툰 축이 바로 이것이다.\n\n단, 통일파 역시 ‘무력 사용’을 전제하고 있었다. 그래서 연방의 군비 확장 자체에는 두 파벌 모두 기여했다.\n\n파벌 내부는 다시 **강경파**와 **온건파**로 갈렸다. [[철도파]]도 같은 구조였다.\n\n- 쾨벤하운 병합 당시 통일파는 본토 편입에 반대하고 우선 ‘준주’ 혹은 ‘자치주’로 편입할 것을 주장했으나, 압도적인 승리에 고취된 분위기에서 철도파에게 밀렸다.\n- [[연말 위기]] 때 전쟁을 반대한 쪽이 통일파였고, 결국 쿠데타를 모의해 [[철도파]] 강경파와 [[건국의 아버지들]]을 화재로 제거했다.\n\n## 해체\n\n쿠데타는 성공했으나 파벌 자체가 오래 남지는 못했다.\n\n- **강경파** — [[연방 헌법]]이 소실되고, 통일파가 [[자치파]]와 [[통합파]]로 쪼개지는 과정에서 와해되었다.\n- **온건파** — [[통합파]]와 [[자치파]]로 분화해 서사 시점의 의회를 구성한다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통합파]] · [[자치파]] — 후신\n- [[철도파]] — 상대 파벌\n- [[연말 위기]]\n- [[건국의 아버지들]]\n\n## 여담\n\n**'통일'의 뜻이 헷갈리기 쉽다.** 대륙을 통일한다는 뜻이 아니라 **연방 내부를 정리한다**는 뜻이다. 대외 투사를 주장한 쪽은 [[철도파]]이며, 강경·온건은 두 파벌 각각의 안에서 갈리는 축이다. 대본 용어사전의 [[통합파]](\"연방의 결속과 궤간 통일 등 내부적인 통합\") 설명도 새 정의와 맞는다.\n\n**강경파의 와해와 헌법 소실이 이어지는 것으로 보인다.** 의회 직속 무력인 [[헌병대]]의 매개체가 [[연방 헌법]]다. 내부를 무력으로 통합하려던 통일파 강경파에게는 그것이 실행 수단이었을 텐데, 연말 위기에 헌법이 80~90% 불타면서 수단을 잃은 셈이 된다. 두 사실이 나란히 전해지므로 이렇게 읽히지만, 명시적으로 설명된 적은 없다.","parentId":"federation"},{"title":"통합파","id":"integrationists","type":"세력","folder":"02_지역","sortOrder":20,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 287~290행 문장 그대로. 원문 소제목은 '통합파 의원'이지만, 세력명은 '통합파'이고 '통합파 의원'은 직함이므로(대본 용어사전·인물관계도의 용법) 문서 제목은 '통합파'로 두었다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","[[통일파]] 온건 계열"],["목표","연방의 결속 · [[궤간 통일]]"],["지역 기반","수도주"],["힘의 통로","[[경찰청]] · [[철도청]]"],["대표 인물","[[잭]] · [[로버트]]"]],"content":"# 통합파\n\n과거 존재했던 ‘통일파’에서 분화된 성향을 가진 의원 집단. 연방의 결속과, 궤간 통일 등의 내부적인 통합을 핵심 목표로 삼고 활동하는 이들을 지칭한다. ‘수도주’를 지역적 기반으로 두고 있으며, ‘경찰청’과 ‘철도청’ 등의 정부기구를 통해 정치적 힘을 행사한다.\n\n```표어\n‘연말 위기’ 이후, 연방의 연결은 위태로워졌습니다, 우리는, 더 단단히 뭉쳐야합니다!\n```\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 전신\n- [[자치파]] — 같은 뿌리에서 갈라진 상대 파벌\n- [[경찰청]] · [[철도청]] — 정치적 힘의 통로\n\n## 여담\n\n**기반이 대비를 이룬다.** 통합파는 ‘수도주’를 기반으로 [[경찰청]]·[[철도청]]이라는 **중앙 기구**를 통해 힘을 쓰고, [[자치파]]는 북방주·동방주를 기반으로 [[대가문]]·[[보안관]]이라는 **지역 세력**을 통해 힘을 쓴다. 서사에서 경찰과 보안관이 관할을 다투는 것이 그대로 의회의 파벌 다툼이기도 하다.\n\n**서사 인물.** [[잭]](통합파 의원), [[로버트]](통합파 의원 · 전 경찰청장)가 이 파벌 소속이다. 인물 문서는 §3에서 착수 예정.","parentId":"federation"},{"title":"헌병대","id":"gendarmerie","type":"세력","folder":"02_지역","sortOrder":70,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","무력","노에마","헌병"],"memo":"원문 314~317행 문장 그대로. 작가 확인(2026-07-31)으로 '초자연적인 힘'의 정체가 확정됐다 — 헌병은 구사자가 아니라 노에마 능력자이고, 매개체는 연방 헌법이다. 지휘 계통은 건국의 아버지들의 혈족을 따른다.","image":"resource/wiki/헌병대.png","imageCaption":"헌병의 무장","summary":[["소속","[[의회]] 직속"],["성격","연방의 유일한 군사조직"],["존속 근거","[[연말 위기]] 비무장화 조항 — 정규군 중 가장 작은 조직만 잔존"],["전력의 정체","[[노에마]] 능력자 (구사자 아님)"],["매개체","[[연방 헌법]]"],["개인 역량","1인이 하나의 군단에 버금간다"],["규모","제한된 인원을 집중 양성"],["동원 조건","법적 절차 + 의원 간 이해관계 합치"],["지휘 계통","[[건국의 아버지들]]의 혈족"]],"content":"# 헌병대 🗡️\n\n```틀\n연방\n```\n\n연방의 유일한 군사조직이자 의회 직속 무력집단. 대외적으로는 군대 내 치안조직만 남겨둠으로서 전쟁 수행 능력을 완전히 상실시켜버리는 목적으로 유지된 집단이지만, 연방 내부적으로는 제한된 인원을 집중적으로 양성하고, ‘초자연적인 힘’을 다루는 이들로 구성하여 헌병 1인의 역량을 하나의 군단에 버금갈 정도로 육성해둔 상태이다.\n\n하지만 헌병대를 동원하는 것은 법적 절차를 거쳐야하고, 의원들간의 이해관계가 맞아떨어져야 하는 등의 제한적인 상황에서만 가능한 행동이기 때문에, 연방 내에서 ‘헌병대’가 실제로 활동하는 모습을 본 이들은 거의 존재하지 않는다.\n\n## 초자연적인 힘의 정체\n\n헌병은 [[노에마]]를 구사하지만 **구사자가 아니라 노에마 능력자**다. 매개체가 [[연방 헌법]]이기 때문이다.\n\n이 구조에서 두 가지가 따라 나온다.\n\n- **헌법이 훼손되면 힘을 잃는다.** [[누스]]는 파손될 경우 그것을 통해 능력을 얻은 이가 능력을 잃을 가능성이 높다. 헌법은 [[연말 위기]]에 80~90%가 소실되었다.\n- **지휘 계통이 혈통을 따른다.** [[건국의 아버지들]]의 혈족이 헌병을 부를 수 있다. 그래서 [[애덤스]]의 딸인 [[세라]]는 의원도 관료도 아닌 민간인 신분으로 헌병을 거느린다.\n\n## 스스로에 대한 규정\n\n헌병은 자신을 이렇게 부른다.\n\n```대사\n연방을 지켜온 최초의 ‘방패’ 이자, 지금은 최후의 ‘칼날’…\n— 세라가 전하는 아버지의 말, 6편\n```\n\n그러나 [[연방 헌법]]이 소실된 뒤로는 그 규정을 스스로 부정한다. 6편에서 한 헌병이 [[세라]]에게 말한다.\n\n```대사\n지금의 우리는 ‘칼날’도, ‘방패’도 될 수 없습니다. 헌법은 그날 무너졌으니.\n집행할 법이 없다면, 헌병이 무슨 의미가 있을까요. 경찰도, [보안관]도 마찬가지고.\n— 연방 헌병, 6편\n```\n\n**신념을 확인하고 따른다.** 같은 장면에서 헌병은 헌법을 복원하겠다는 세라에게 딱 하나를 묻는다 — \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\" 세라의 대답은 \"…‘가족’ 이요\"였다.\n\n**수도주 광장에 나타난다.** 수도주에 사는 아이들 사이에는 \"매년 5월, 이맘때가 되면 새벽의 광장에서 아주 무서운 일이 벌어진다\"는 이야기가 돈다.\n\n## 서사에서의 등장\n\n- **6편** — 수도주 광장과 밀실. [[세라]]가 헌법을 들고 있는 것을 보고 [[건국의 아버지들]]과의 관계를 짐작한다.\n- **17편** — [[해리엇]]이 세라의 의회 진입을 막으려 하자 \"현재 ‘헌법 복원’이 시급합니다, 귀하께서 비서관을 방해한다면, 우선순위에 따라 배제하겠습니다\"라며 물러서게 만든다. 경찰청장이 \"당신 같은 민간인이 어떻게 헌병을 데리고 있는 거야!?\"라 외치는 장면이다.\n- **18편** — 본회의장. [[데이비스]]가 \"헌병… 세라!! 설마…!\"라 알아채는 순간 판이 뒤집힌다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]]\n- [[노에마]] · [[누스]] · [[연방 헌법]]\n- [[건국의 아버지들]] · [[애덤스]] · [[세라]]\n- [[연말 위기]]\n- [[경찰청]] · [[보안관]] · [[기동대]] — 연방에 남은 다른 무력\n\n## 여담\n\n**비무장화 조항의 구멍이 이 조직이다.** 반 연방 세력은 연방의 전쟁 수행 능력을 없애려 정규군 중 가장 작은 조직만 남기게 했는데, 연방은 그 작은 조직에 초자연 전력을 몰아넣었다. 겉으로는 군대 내 치안조직, 실제로는 1인이 군단급인 집단이다. 조약을 어기지 않으면서 조약의 목적을 무너뜨린 셈이다.\n\n**'소문으로만 아는 무력'이라는 설정이 두 번 설명된다.** 동원 절차가 까다로운 것이 하나, 매개체인 헌법이 대부분 불타 없어진 것이 둘이다. 대본 용어사전이 헌병을 \"좀처럼 모습을 드러내지 않아, 소문으로만 아는 이가 대부분\"이라 적은 것과 맞물린다.\n\n**서사에서 가장 무거운 카드다.** 마왕이 될 [[세라]]가 연방의 유일한 초자연 무력을 쥐고 있고, 그 근거가 혈통이며, 무력화 방법이 헌법 파괴라는 것까지 한 줄로 이어진다.","parentId":"federation"},{"title":"네빌","id":"neville","type":"인물","folder":"04_인물","sortOrder":20,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","스프링필드","네빌"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 프롤로그·1·2·3·5·14·16·17편, _인물관계.md, 주역·기호 배정. 사투리는 의도된 연출이므로 인용에서 고치지 않는다.","image":"resource/wiki/네빌.png","imageCaption":"네빌","summary":[["소속","[[철도청]]"],["직함","비서"],["기호","🎫"],["첫 등장","프롤로그"],["주역 편","1 · 14"],["등장 편","프롤로그 · 1 · 2 · 3 · 5 · 14 · 16 · 17"],["혈연","[[스프링필드]] 가 — 10년 전 떠났다 · [[코네트]]"],["목표","미정 — 자기 일을 의심하지만 대안을 말하지 않는다"],["방식","낮은 자리에서 할 말을 한다"],["훗날","미정"],["말투","~함다 / ~슴다 / ~임다 / ~검다"]],"content":"# 네빌\n\n[[철도청]] 비서. 1부의 시선이자, [[스프링필드]] 가를 10년 전에 떠난 사람이다. 청장의 '특별 지시'를 품고 고향 [[북방주]]로 돌아오는 것이 1편이다.\n\n## 인물\n\n**사투리를 쓴다.** `~함다` `~슴다` `~임다` `~검다`로 끝나는 말투가 그의 표식이며, 지방 출신이라는 사실을 문장마다 드러낸다.\n\n낮은 자리에서 정직한 말을 하는 역할이다. 프롤로그에서 이미 자기가 하는 일을 의심한다.\n\n```대사\n…저희가 하는 일이 ‘약탈’이랑 다른 게 뭠까?\n— 네빌, 프롤로그\n```\n\n```대사\n딴 소리 하지 마십쇼. 안되는 건 안되는 검다, 저는 분명 경고했슴다.\n— 네빌, 1편\n```\n\n## 두 번의 이탈\n\n네빌은 같은 일을 두 번 한다. **속한 곳을 스스로 떠나는 것**이다.\n\n- **10년 전** — [[스프링필드]] 가를 떠나 고향을 등졌다. 4편의 회상이다.\n- **3년 전** — [[대가문]]을 등지고 [[철도청]]에 제 발로 지원했다. [[세라]]가 면접해 받아들였다. 16편의 회상이다.\n\n그리고 서사 안에서 세 번째로 이탈한다. 5편의 사건이 \"[[세라]], 무단이탈한 네빌의 흔적을 쫓기 시작하다\"다.\n\n## 행적\n\n### 프롤로그 — 의뢰인의 일\n\n정체를 감춘 인물들과 함께 있다. 자기 일이 약탈과 무엇이 다른지 묻고, 어릴 때 친하게 지냈던 '가족'이 있다고 말한다. 그 가족이 [[코네트]]다.\n\n### 1편 — 귀향\n\n열두 번의 환승을 거쳐 [[스프링필드]] A 역에 도착한다. 청장의 특별 지시를 품고 있다. 편 부제가 「피는 물보다 진하다」다.\n\n### 2~3편 — 설득\n\n[[철도청]]이 [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'하는 과정에 놓인다. 2편에서 [[기동대]]를 쓰자고 제안했다가 [[앤드루]]에게 거절당한다 — 기록이 남기 때문이다.\n\n### 14편 — 소년의 영광\n\n반역죄로 몰리고, [[잭슨]]에게 구출된다. 이 편의 주역이며 부제가 「모든 답은 나왔다. 어떻게 살 것인가만 빼고」다.\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[앤드루]] | 고용 | 철도청장과 그를 따라다니는 비서 |\n| [[세라]] | 고용 | 3년 전, 대가문을 등지고 온 그를 면접해 받아들였다 |\n| [[코네트]] | 혈연 | 같은 [[스프링필드]] 가. 어릴 때 친하게 지냈다 |\n| [[잭슨]] | 협력 | 반역죄로 몰린 그를 열차 강도가 빼내다 |\n\n## 여담\n\n**기호가 🎫(승차권)인 이유.** 1편이 열두 번의 환승으로 시작하고, 그가 소속을 바꿔 가며 옮겨 다니는 사람이라는 점과 겹친다. [[철도]]가 이 나라의 뼈대라는 설정에서 가장 낮은 자리의 표가 그의 상징이 된다.\n\n**1부의 눈이지만 주인공은 아니다.** 발화량은 199로 [[세라]] 다음이고 프롤로그의 시선도 그인데, 2부에 들어가면 5편 이후 14·16·17편에만 나온다. 이 작품이 개인의 활약이 아니라 이해관계를 축으로 굴러간다는 방침([[세계관 대문]])이 인물 배치에서도 드러나는 자리다.\n\n**사투리는 교정하지 않는다.** `~검다` `~함다`는 오타가 아니라 의도된 연출이다. `독ㄹ —` 같은 자모 파편도 말이 중간에 끊기는 연출이므로 손대지 않는다.","parentId":"people"},{"title":"데이비스","id":"davis","type":"인물","folder":"04_인물","sortOrder":40,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","의회","북부동맹","데이비스"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·7·8·9·11·12·13·17·18편, _인물관계.md. '명백한 운명'이 그의 말을 상징으로 채택한 조직이라는 것은 작가 확인(2026-07-31)이며, 8편의 해당 대사는 조직명이 아니라 관용구다.","image":"resource/wiki/데이비스.png","imageCaption":"데이비스","summary":[["소속","[[의회]]"],["직함","자치파 의원 → [[북부동맹]] 위원장"],["기호","🎭"],["첫 등장","5편"],["주역 편","8"],["등장 편","5 · 7 · 8 · 9 · 11 · 12 · 13 · 17 · 18"],["혈연","알려진 것 없음"],["목표","북부·동부의 분리 독립"],["방식","남이 먼저 나서게 만든다"],["훗날","[[미트로프 내전]]에서 분쇄 → [[명백한 운명]]이 그의 말을 상징으로 삼는다"]],"content":"# 데이비스\n\n[[자치파]] 의원에서 [[북부동맹]] 위원장으로 옮겨간 인물. 2부의 판을 짜는 쪽이며, [[대가문]]들을 포섭해 **분리 독립**까지 밀고 간다.\n\n## 인물\n\n기호가 🎭(가면)이다. 실제로 그의 행동은 대부분 **다른 사람이 먼저 나서게 만드는 것**이다.\n\n- [[스프링필드 가주]]에게 '분리 독립'을 제안한다 (8편)\n- [[연방 의원 A]]를 움직여 동방주가 먼저 조례를 던지게 만들고, 나머지는 자기가 맡는다 (9편)\n- [[타게니아]] 감독관의 개입마저 자기 판의 말로 쓴다 (13편)\n\n말투는 여유롭고 능글맞다. 8편의 \"이것도 어쩌면 ‘명백한 운명’ 일지도 모르겠어요~\" 같은 어투가 그의 것이다. 이 표현은 이때는 그냥 관용구인데, 훗날 그를 잇겠다는 자들이 조직 이름으로 삼는다. → [[명백한 운명]]\n\n## 연말 위기 당시\n\n지금은 [[잭]]과 서로의 마지막 걸림돌이지만, 두 사람은 **한때 같은 [[통일파]]**였다. 둘 다 온건파였고, 통일파가 [[철도파]]를 제거한 쿠데타의 **실행자가 아니라 방관자**에 가까웠다.\n\n[[먼로]]가 헌병을 앞세워 개전 반대파를 침묵시킬 때 그 자리에 함께 있었고, 함께 침묵당했다.\n\n## 행적\n\n### 8편 — 소문\n\n연회장에 '분리 독립'의 소문이 돌고, 북부 습격 소식이 당도한다. 이 편의 주역이며 부제가 「그는 우리의 대변자이시다」다.\n\n### 9편 — 조례\n\n동방주가 심야 조례를 앞세워 경찰 무장해제에 나선다. [[연방 의원 A]]와 [[필립]]이 현장에서 집행하고, 데이비스는 뒤에 있다.\n\n### 11~13편 — 장악\n\n[[북부동맹]]이 의회를 장악한다. 13편에서는 [[연합]] 감독관 [[타게니아]]의 개입까지 자기 판에 끌어들인다.\n\n### 18편 — 독립 선언\n\n본회의장에서 독립을 선언한다. [[연방 헌법]] 제4조를 근거로 삼고, 독립에 가담한 여섯 [[대가문]]의 이름을 부른다.\n\n```대사\n콩코드, 하트퍼드, [스프링필드]! 그리고 도버, 윌밍턴, 밀퍼드 가문의 인민들은!!\n— 데이비스, 18편 독립 선언\n```\n\n그러나 판은 곧 다시 뒤집힌다. [[세라]]가 [[헌병대]]와 함께 나타난 순간이다.\n\n```대사\n헌병… *뿌득* 세라!! 설마…!\n— 데이비스, 18편\n```\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[잭]] | 적대 | 한때 같은 [[통일파]], 지금은 서로의 마지막 걸림돌 |\n| [[스프링필드 가주]] | 포섭 | 북부 대가문에 '분리 독립'을 제안했다 |\n| [[연방 의원 A]] | 포섭 | 동방주가 먼저 조례를 던지게 만들고, 나머지는 자기가 맡았다 |\n| [[타게니아]] | 이용 | 감독관의 개입마저 자기 판의 말로 썼다 |\n| [[먼로]] | 억압 | [[연말 위기]] 당시 헌병 앞에서 함께 침묵당했다 |\n\n## 여담\n\n**연말 위기의 피해자가 다음 위기의 설계자가 된다.** 헌병 앞에서 침묵당한 온건파 의원이, 몇 년 뒤 헌병을 앞세운 [[세라]]에게 다시 판을 빼앗긴다. 두 장면이 같은 구도로 겹친다.\n\n**그의 실패가 조직을 남긴다.** [[미트로프 내전]]에서 독립파가 분쇄된 뒤, 그를 잇겠다는 자들이 [[명백한 운명]]을 세운다. 정작 데이비스 본인은 그 조직을 만들지 않았고, 그가 무심코 쓴 관용구만 상징으로 남는다.\n\n**아직 모르는 것.** 내전 이후 데이비스 본인이 어떻게 되는지. [[명백한 운명]]이 \"그를 잇겠다\"고 하는 것으로 보아 그 시점에는 이미 무대에서 사라진 듯하나, 확인되지 않았다.","parentId":"people"},{"title":"세라","id":"sarah","type":"인물","folder":"04_인물","sortOrder":10,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","마왕","세라"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·6·8·14·16·17·18편, _인물관계.md, 주역·기호 배정. '세라가 마왕'과 '헌법 누스를 복구해 연방을 장악하려 한다'는 작가 확인(2026-07-31). 마왕화의 구조를 노모스로 읽은 부분은 추론이며 메모에만 두었다.","image":"resource/wiki/세라.png","imageCaption":"세라","summary":[["소속","[[철도청]]"],["직함","비서관"],["기호","📕"],["첫 등장","5편"],["주역 편","16 · 17 · 18 — 3편 연속"],["등장 편","5 · 6 · 8 · 14 · 16 · 17 · 18"],["혈연","[[애덤스]] — 아버지. [[건국의 아버지들]]"],["목표","'가족'의 이름으로 [[연방]]을 다시 세운다"],["방식","[[연방 헌법]] 복원과 개헌 · [[헌병대]]"],["훗날","마왕"]],"content":"# 세라\n\n[[철도청]] 비서관. 겉으로는 [[앤드루]] 청장 밑의 실무자이고, 실제로는 소실된 [[연방 헌법]]을 복구해 [[연방]]을 장악하려는 인물이다. 훗날 **마왕**이 된다.\n\n## 인물\n\n부드러운 말씨를 쓴다. 협박할 때조차 존대를 놓지 않고, 상대가 화를 내면 \"너무 걱정하지 마세요\"로 받는다. [[네빌]]이 \"비서관님은 가끔 보면 참 재밌단 말이죠…\"라 평하고, 스스로도 \"고작 단어 하나에도 정을 붙이시다니, 이상하신 분이라니까요\"라는 말을 듣는다.\n\n이 온화함이 곧 위험이다. 17편에서 [[해리엇]] 경찰청장을 [[헌병대]]로 물러서게 만들면서도 그가 하는 말은 이것뿐이다.\n\n```대사\n너무 걱정하지 마세요, 제 가족을 해칠 생각은 없으니까요.\n— 세라, 17편\n```\n\n경찰청장에게 '가족'이라 부르는 대목이 핵심이다. 세라에게 가족은 혈연이 아니라 **자기 편으로 규정한 모든 것**이다.\n\n## 유년\n\n아버지 [[애덤스]]와 둘뿐이었다. 어머니가 없고 [[대가문]] 사람도 아니라는 이유로 학교에서 놀림받았다.\n\n```대사\n나는 엄마도 없고… 다른 애들처럼 ‘가문’ 사람도 아니라면서… *훌쩍*\n— 어린 세라, 17편 회상\n```\n\n애덤스는 이렇게 답했다.\n\n```대사\n너무 걱정하지 마. 아빠가 다 해결해줄테니까.\n아빠가 전에 ‘가족’은 뭐라고 했었지?\n— 애덤스, 17편 회상\n```\n\n세라의 대답이 \"무슨 일이 있어도 항상 내 편\"이었다. **이 한 줄이 훗날 헌법 조문이 된다.**\n\n## 행적\n\n### 5편 — 등장\n\n무단이탈한 [[네빌]]의 흔적을 쫓기 시작한다. 이 시점에는 유능한 비서관으로만 보인다. 3년 전 [[대가문]]을 등지고 철도청에 제 발로 지원한 네빌을 면접해 받아들인 것도 그였다.\n\n### 6편 — 헌법\n\n수도주 광장에서 [[헌병대]]와 만난다. 헌병이 헌법 소실로 존재 의의를 잃었다고 말하자 세라는 책을 내보인다.\n\n```대사\n*슬쩍* 제가 다시 세울 수 있다면요?\n— 세라, 6편\n```\n\n헌병은 그가 [[건국의 아버지들]]과 관계가 있음을 알아채고, 딱 하나를 묻는다. \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\"\n\n```대사\n…‘가족’ 이요.\n— 세라, 6편\n```\n\n이후 밀실에서 조력자([[식스]])와 함께 헌법을 복원한다. 이 편의 사건 요약은 \"밀실에서 '폭탄'이 완성되어 가다\"다.\n\n### 16편 — 그림자\n\n지하 심문실에서 세라의 그림자가 처음 모습을 드러낸다. 이 편부터 3편 연속 주역이다.\n\n### 17편 — 넘어선 선\n\n[[해리엇]]의 저지를 헌병으로 물리치고 의회로 향한다. 같은 편에서 [[앤드루]]와 서로의 뒷일을 캐지 않기로 합의한 과거가 밝혀지고, 아버지 [[애덤스]]와의 관계도 공개된다. 편 제목이 「가족에 의한 가족」이다.\n\n### 18편 — 수정헌법\n\n본회의장. [[데이비스]]의 독립 선언으로 판이 뒤집힌 직후, 세라가 나타나 판을 다시 뒤집는다.\n\n```조문\n모든 인민은. 가족을 위해. 봉사하라.\n— 수정헌법 제 1 조, 18편\n```\n\n그리고 이렇게 마친다 — \"가족의, 가족에 의한, 가족을 위한 국가가… 지상에서 사라지지 않기를 바라며…\"\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[애덤스]] | 혈연 | 아버지. [[건국의 아버지들]]의 지도자 |\n| [[네빌]] | 고용 | 3년 전, 대가문을 등지고 온 그를 면접해 받아들였다 |\n| [[앤드루]] | 감시 | 서로가 뒤에서 무슨 일을 벌이는지 알면서도 캐지 않기로 했다 |\n| [[식스]] | 조력 | 떠나라는 말에도 \"세라님만 두고 갈 순 없다\"며 곁에 남았다 |\n| [[코네트]] | 신뢰 | 코네트가 '세라 언니'라 부르며 위기에 먼저 연락했다 |\n| [[해리엇]] | 적대 | 헌병을 거느린 민간인 앞에서 의회 진입을 저지당했다 |\n| [[헌병대]] | 지휘 | 건국의 아버지들의 혈족이므로 부를 수 있다 |\n\n## 여담\n\n**가족이라는 말의 뜻이 계속 넓어진다.** 아버지와 둘뿐인 집 → 자기가 거둔 사람들([[네빌]]·[[식스]]·[[코네트]]) → [[헌병대]] → 마지막에는 연방의 모든 인민. 넓어질수록 원래 뜻에서 멀어지는데, 정작 조문에 박히는 문장은 아버지가 딸을 달래던 그 말과 같다.\n\n**마왕화가 입법 절차의 형태를 취한다**. [[노모스]]는 진입자를 주체의 신념에 동화시키는 영역이고, [[연방 헌법]]은 [[누스]]다. 그 누스에 \"모든 인민은 가족을 위해 봉사하라\"를 새기는 것은 국가 전체를 세라의 신념으로 덮는 일이 된다. 즉 초자연적 폭주가 아니라 개헌이라는 합법 절차로 마왕이 되는 것으로 추정된다.\n\n**대본은 세라가 마왕이라고 한 번도 말하지 않는다.** 초자연 층 자체가 《가문과 가족》에서 은폐되어 있으므로([[세계관 대문]]), 이 문서에는 독자가 아직 모르는 것이 적혀 있다.\n\n**아직 모르는 것.** 어머니가 누구인지, 그리고 어떤 경로로 마왕에 이르는지. [[연방 헌법]]이 마왕 토벌 과정에서 파괴된다는 것까지만 정해져 있다.","parentId":"people"},{"title":"앤드루","id":"andrew","type":"인물","folder":"04_인물","sortOrder":30,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","앤드루"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 2·3·4·5·7·16·17·19·20편, _인물관계.md. '먼로와의 관계'는 인물관계도에서 '?무슨 사이'로 미공개 처리된 항목이며, 작가 확인에 따라 서사 시점의 먼로 등장은 전부 회상이므로 앤드루가 제지받지 않는 이유는 아직 열려 있다.","image":"resource/wiki/앤드루.png","imageCaption":"앤드루","summary":[["소속","[[철도청]]"],["직함","철도청장"],["기호","🕰️"],["첫 등장","2편"],["주역 편","2 · 19"],["등장 편","2 · 3 · 4 · 5 · 7 · 16 · 17 · 19 · 20"],["혈연","[[잭슨]] — 동생. 20편에서 밝혀진다"],["목표","갈라진 [[연방]]을 봉합한다"],["방식","기록이 남지 않는 손을 쓴다 — 지하철도와 용병단"],["훗날","미정"]],"content":"# 앤드루\n\n[[철도청]]장. **[[궤간 통일]]을 명분으로 연방 전역의 지하를 파는 사업**의 주인이며, 그 일에 [[하노버 용병단]] 같은 외부의 손을 쓴다.\n\n## 방식\n\n앤드루의 원칙은 하나다. **기록을 남기지 않는다.**\n\n```대사\n[기동대]를 움직이면 반드시 기록이 남잖나, 이런 일에는 적합하지 않아.\n— 앤드루, 2편\n```\n\n[[기동대]]는 연방에서 가장 빠르고 유연한 무력이고 그의 부처 산하다. 그런데도 쓰지 않고 용병을 산다. 이 한 줄이 그의 사업 전체의 성격을 정한다.\n\n## 사업\n\n- **두 달 전** — 보안관들이 선로 보수를 거듭 거부하자, \"진짜 문제는 [[대가문]]\"이라 규정한다. 5편의 회상이다.\n- **몇 달 전** — [[궤간 통일]]을 명분으로 지하철도를 비밀리에 파기 시작하고, [[철도파]]의 [[하워드]]가 의회 쪽에서 뒷받침한다. 16편의 회상이다.\n- **과거 어느 날** — [[잭]]에게 갈라진 연방을 봉합하는 '사업'의 협조를 청하나, 왜 하필 그인지는 끝내 답하지 않는다. 7편의 회상이다.\n- **2~3편** — [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'한다. 3편에서 용병단이 [[스프링필드]] 저택을 습격하고, [[레밍턴]]에게 \"땅속에서 무슨 소리가 들리든 눈감으라\" 요구한다.\n- **19편** — 지하에 숨겨진 사업이 마침내 실체를 드러낸다. 이 편의 주역이다.\n\n## 19편\n\n지하에서 [[에른스트]]의 통신을 받는다. 북부와 동부 [[대가문]]이 독립을 선언했다는 소식이다.\n\n```대사\n북동부… 의회… 헌병…\n세라는 결국… 그게 목적이었던 건가…?\n— 앤드루, 19편\n```\n\n같은 편에서 [[프로이센 사단]]의 귀환이 언급되고, 연방군 출신이 거의 전부 독립 쪽에 붙었다는 말이 나온다.\n\n## 이름\n\n동생 [[잭슨]]과 이름을 이어 읽으면 **Andrew Jackson** — 미국 7대 대통령이 된다.\n\n[[연방]]의 이름 계열이 미국 건국사에서 왔고([[건국의 아버지들]] = Founding Fathers, [[명백한 운명]] = Manifest Destiny), 인물 이름도 대통령에서 오는 것을 감안하면 의도된 배치로 추정된다. 한 사람의 이름을 둘로 쪼개, **형은 국가 기구의 수장에게 동생은 열차 강도에게** 나눠 붙인 배치가 된다.\n\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[네빌]] | 고용 | 철도청장과 그를 따라다니는 비서 |\n| [[세라]] | 감시 | 서로가 뒤에서 무슨 일을 벌이는지 알면서도 캐지 않기로 했다 |\n| [[에른스트]] | 고용 | 기록이 남지 않도록 용병단을 앞세워 북부 대가문을 '설득'시켰다 |\n| [[잭]] | 밀약 | 봉합 '사업'에 협조를 청하나, 왜 하필 그인지는 말하지 않았다 |\n| [[하워드]] | 협력 | 지하철도 사업을 의회 쪽에서 뒷받침한다 |\n| [[잭슨]] | 혈연 | 잭슨은 앤드루의 동생. 20편에서 밝혀진다 |\n| [[먼로]] | **?** | 용병을 부려 전역의 지하를 파헤치고도 국가로부터 아무런 제지를 받지 않는다 |\n\n## 여담\n\n**세라와 거울이다.** 둘 다 [[철도청]] 소속이고, 둘 다 정식 절차 밖에서 연방을 다시 만들려 하고, 서로가 그것을 알면서 캐지 않는다. 다른 점은 수단이다. 앤드루는 **기록을 남기지 않는 쪽**으로, 세라는 **기록 그 자체(헌법)를 고쳐 쓰는 쪽**으로 간다. 19편에서 앤드루가 \"세라는 결국… 그게 목적이었던 건가\"라고 뒤늦게 깨닫는 장면이 그 대비의 결말이다.\n\n**제지받지 않는 이유가 미공개다.** [[인물관계도]]에서 [[먼로]]와의 관계가 '?무슨 사이'로 처리되어 있다. 서사 시점에 먼로가 나오는 장면은 전부 회상이므로, [[건국의 아버지들]]이 뒤를 봐주고 있다는 단순한 설명은 성립하지 않는다. 이 자리는 열린 채로 두었다.\n\n**동생이 열차 강도라는 설정이 20편까지 감춰진다.** [[잭슨]]은 9편부터 나오고 [[네빌]]을 구하기까지 하는데, 형제라는 사실은 20편에서야 밝혀진다. 그 사이 앤드루의 사업은 계속 열차와 선로 위에서 굴러간다.","parentId":"people"},{"title":"인물","id":"people","type":"인물","folder":"04_인물","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","안내"],"memo":"원고에 인물 항목이 없어 대본에서 직접 만든 구간이다. 근거는 script/ 대본 22편, _인물관계.md(인물 21·관계 29), _어록.md, storypack의 주역·기호 배정. 인용은 대본에서 화자를 직접 확인한 것만 쓴다 — 어록 파일은 화자를 감춰두었으므로 그것만으로는 귀속하지 않는다.","image":"","imageCaption":"","summary":[["범위","《가문과 가족》 22편"],["등록 인물","21"],["발화 있는 인물","38 (단역 포함)"],["기호를 받은 인물","14"],["무기호","[[식스]] — 의도된 예외"]],"content":"# 인물\n\n```틀\n가문과 가족\n```\n\n《가문과 가족》의 인물들. 이 작품은 개인의 활약보다 **이해관계와 집단**을 축으로 굴러가므로, 인물 문서도 '무엇을 원하는가'와 '누구와 묶여 있는가'를 중심에 둔다.\n\n## 기호\n\n각 편의 주역에게는 기호가 하나씩 배정되어 있다. 화 목록에 이름 대신 각인으로만 표시되며, 독자는 편을 읽고 나서야 그것이 누구였는지 알게 된다.\n\n| 기호 | 인물 | 기호 | 인물 |\n|---|---|---|---|\n| 🎫 | [[네빌]] | 📕 | [[세라]] |\n| 🕰️ | [[앤드루]] | 📰 | [[잭]] |\n| 🧨 | [[에른스트]] | 🎭 | [[데이비스]] |\n| 🛡️ | [[레밍턴]] | 🔦 | [[필립]] |\n| ⛓️ | [[로버트]] | ⚖️ | [[하워드]] |\n| 🎖️ | [[해리엇]] | ♗ | [[타게니아]] |\n| 🗝️ | [[코네트]] | ⚔️ | [[헥터]] |\n\n[[식스]]에게는 기호가 없다. 6편의 주역인데도 비워둔 것이며, 그 이질감이 의도다.\n\n## 세력별\n\n- **[[철도청]]** — [[앤드루]](청장) · [[세라]](비서관) · [[네빌]](비서)\n- **[[의회]]** — [[잭]] · [[로버트]](통합파) · [[데이비스]](자치파 → [[북부동맹]] 위원장) · [[하워드]](철도파) · [[연방 의원 A]](동방주 자치파)\n- **[[경찰청]]** — [[해리엇]](청장)\n- **[[대가문]]** — [[레밍턴]](스프링필드 보안관) · [[필립]](도버 보안관) · [[코네트]](스프링필드 가) · [[스프링필드 가주]]\n- **구 군부** — [[에른스트]](하노버 용병단장) · [[잭슨]](열차 강도) · [[프랑크]](바이에른 그룹)\n- **[[연합]]** — [[타게니아]](올림피아드 감독관) · [[에리스]](엑스포)\n- **[[건국의 아버지들]]** — [[먼로]] · [[애덤스]]\n- **???** — [[식스]](조력자)\n\n## 발화량 순\n\n대본에서 실제로 말하는 분량이다. 비중을 가늠하는 참고치일 뿐, 중요도와 같지는 않다.\n\n| 인물 | 발화 | 등장 편 |\n|---|---|---|\n| [[세라]] | 212 | 5 · 6 · 8 · 14 · 16 · 17 · 18 |\n| [[네빌]] | 199 | 프롤로그 · 1 · 2 · 3 · 5 · 14 · 16 · 17 |\n| [[데이비스]] | 196 | 5 · 7 · 8 · 9 · 11 · 12 · 13 · 17 · 18 |\n| [[앤드루]] | 170 | 2 · 3 · 4 · 5 · 7 · 16 · 17 · 19 · 20 |\n| [[에른스트]] | 128 | 1 · 2 · 3 · 15 · 19 · 20 |\n| [[잭]] | 120 | 7 · 8 · 10 · 12 · 13 · 17 · 18 |\n| [[잭슨]] | 88 | 9 · 13 · 14 · 19 · 20 |\n| [[해리엇]] | 73 | 12 · 14 · 15 · 17 · 19 |\n| [[레밍턴]] | 64 | 3 · 4 |\n| [[로버트]] | 56 | 10 · 12 · 13 · 17 · 18 |\n| [[하워드]] | 51 | 11 · 12 · 13 · 16 · 18 |\n| [[코네트]] | 44 | 5 · 20 |\n| [[필립]] | 44 | 9 |\n| [[식스]] | 30 | 6 |\n| [[프랑크]] | 26 | 15 |\n| [[타게니아]] | 15 | 13 · 18 |\n| [[애덤스]] | 8 | 17 (회상) |\n| [[먼로]] | 4 | 18 (회상) |\n\n## 여담\n\n**아직 안 쓴 인물.** [[잭]] · [[에른스트]] · [[해리엇]] · [[레밍턴]] · [[로버트]] · [[하워드]] · [[필립]] · [[잭슨]] · [[타게니아]] · [[프랑크]] · [[먼로]] · [[에리스]] · [[스프링필드 가주]] · [[연방 의원 A]] · [[헥터]].\n\n**[[세라]]가 2부의 축이다.** 16·17·18편 세 편 연속 주역이며, 작품 제목 《가문과 가족》이 그의 논리에서 나온다. 유년의 상처 → \"가족은 무슨 일이 있어도 항상 내 편\"이라는 아버지의 가르침 → 수정헌법 제1조 \"모든 인민은 가족을 위해 봉사하라\"로 이어지는 한 줄이 서사 전체를 관통한다.\n\n**인용 귀속의 원칙.** `_어록.md`는 화자와 출처를 일부러 감춰둔 파일이다(독자에게 먼저 보여주는 용도). 그래서 어록만 보고 누구의 말이라 단정하지 않고, 대본에서 화자 라벨을 직접 확인한 대사만 인물 문서에 인용했다.","parentId":null},{"title":"코네트","id":"cornet","type":"인물","folder":"04_인물","sortOrder":50,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","대가문","스프링필드","코네트"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·20편, _인물관계.md, 프롤로그의 네빌 대사. 20편 주역이며 기호는 🗝️.","image":"resource/wiki/코네트.png","imageCaption":"코네트","summary":[["소속","[[대가문]] — [[스프링필드]] 가"],["직함","없음 — 가문의 아이"],["기호","🗝️"],["첫 등장","5편"],["주역 편","20"],["등장 편","5 · 20"],["혈연","[[스프링필드 가주]] — 할아버지 · [[네빌]]"],["목표","할아버지와 [[레밍턴]]을 찾는다"],["방식","가문 열쇠를 내주지 않는다"],["훗날","미정"]],"content":"# 코네트\n\n[[스프링필드]] 가의 아이. [[네빌]]이 10년 전 떠난 그 집에 남은 '가족'이며, 20편의 주역이다.\n\n## 인물\n\n아이의 말투를 쓴다. [[세라]]를 '세라 언니', [[레밍턴]]을 '레밍턴 아저씨'라 부른다. 위기가 닥쳤을 때 어른들이 아니라 세라에게 먼저 연락한 것도 그였다(5편).\n\n기호가 🗝️(열쇠)다. 20편에서 그 이유가 나온다. 폐허가 된 저택 앞에서 일행이 문을 열려 하자 코네트는 열쇠를 내놓지 않는다.\n\n```대사\n할아버지가 절대… 절대 우리 가문 열쇠는 남들한테 주면 안된다고 했어요…\n— 코네트, 20편\n```\n\n## 행적\n\n### 프롤로그 — 이름 없이\n\n[[네빌]]이 \"어렸을 때 꽤 친하게 지냈던 ‘가족’이 있는데…\"라 말할 때의 그 가족이다. 이름은 나오지 않는다.\n\n### 5편 — 연락\n\n위기 상황에서 [[세라]]에게 먼저 연락한다. 이 편에서 [[네빌]]과 같은 [[스프링필드]] 가라는 사실, 그리고 네빌이 10년 전 가문을 떠났다는 사실이 공개된다.\n\n### 20편 — 귀환\n\n폐허가 된 [[스프링필드]] 저택으로 일행과 함께 돌아온다. 할아버지와 [[레밍턴]]을 찾지만 찾지 못한다. 편 부제가 「언약의 피는 태중의 물보다 진하다」다.\n\n1편의 부제가 「피는 물보다 진하다」였다. **같은 속담의 뒷문장이 마지막 편의 부제가 된다** — 혈연보다 맺은 약속이 앞선다는 쪽으로 뒤집힌다.\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[네빌]] | 혈연 | 같은 [[스프링필드]] 가. 네빌은 10년 전 가문을 떠났다 |\n| [[세라]] | 신뢰 | '세라 언니'라 부르며 위기에 먼저 연락했다 |\n| [[레밍턴]] | 보호 | 저택의 아이를 지키는 보안관 |\n| [[스프링필드 가주]] | 혈연 | '할아버지'라 부르는 가주 |\n\n## 여담\n\n**작품의 두 축이 이 아이 한 명에게 모인다.** [[네빌]]에게는 등지고 떠난 가문이고, [[세라]]에게는 '가족'이라 거둔 사람이며, [[레밍턴]]에게는 목숨으로 지킨 아이다. 세 인물의 동기가 각각 다른 방향에서 코네트로 향한다.\n\n**부제가 1편과 20편을 잇는다.** 「피는 물보다 진하다」(1편) → 「언약의 피는 태중의 물보다 진하다」(20편). 원래 속담의 온전한 형태가 뒤에 오면서, 혈연이 아니라 약속이 앞선다는 뜻으로 바뀐다. [[세라]]가 혈연 아닌 이들을 가족이라 부르는 것과 같은 방향이다.\n\n**아직 모르는 것.** 코네트의 부모. 할아버지와 함께 살고 어머니·아버지 이야기가 나오지 않는다. [[세라]]가 어머니 없이 자란 것과 겹치는 자리일 수 있다.","parentId":"people"},{"title":"대전쟁","id":"great-war","type":"사건","folder":"05_사건","sortOrder":0,"era":"대전쟁","canon":"확정","status":"작성 중","tags":["대전쟁","구대륙","바다"],"memo":"원문에 항목이 없던 문서. 작가 확인(2026-07-31)으로 만들었다 — '대륙간 전쟁이며, 신대륙에 속하는 그렌빌리아·로디니아·판노티아는 영향권 밖이었지만 구대륙의 세력들이 대륙 단위로 거대한 전쟁을 벌인 것. 바다에 노에시스가 많이 녹아있는 이유이기도 하다.' 전쟁의 경과·참전 세력·시기는 전부 미정.","image":"resource/wiki/대전쟁.png","imageCaption":"대전쟁의 흔적","summary":[["성격","대륙간 전쟁"],["무대","[[판게아 대륙]] — 구대륙"],["영향권 밖","[[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]"],["결과","[[바다]]의 노에시스 농도 급증 → 대륙 간 항해 차단"],["실종","[[바다 민족]]"],["참전 세력","미정"],["시기","미정"]],"content":"# 대전쟁\n\n**대륙간 전쟁.** 구대륙의 세력들이 대륙 단위로 벌인 거대한 전쟁이다.\n\n## 확인된 사실\n\n- 구대륙인 [[판게아 대륙]]에서 일어난 전쟁이며, 신대륙에 속하는 [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]은 **영향권 밖**이었다.\n- 이 전쟁이 [[바다]]에 노에시스가 대량으로 녹아 있는 원인이다.\n- [[바다 민족]]은 이 전쟁 이후 완전히 종적을 감추었다.\n\n## 이 사건이 세계 구조를 만들었다\n\n대전쟁은 직접 무대에 오르지 않지만, 지금 세계의 형태를 결정한 사건이다.\n\n전쟁으로 바다의 노에시스 농도가 올라갔고, 그 결과 대륙 간 항해가 사실상 불가능해졌다. 대륙들이 서로를 거의 모른 채 독립적으로 굴러가는 것도, [[카시마르]]가 바다와 지층의 축적된 노에시스에서 발생하는 것도, 신대륙의 인류가 [[바다 민족]]의 후손이면서 정작 그 조상의 흔적을 기록으로만 아는 것도 전부 여기서 나온다.\n\n## 관련 문서\n\n- [[바다]]\n- [[바다 민족]]\n- [[노에시스]]\n- [[카시마르]]\n\n## 여담\n\n**미정인 것.** 참전 세력, 전쟁의 원인과 경과, 시기, 승패, 그리고 구대륙이 지금 어떤 상태인지 전부 정해지지 않았다.\n\n**구대륙은 [[판게아 대륙]]이다**. 즉 대전쟁의 무대이자 [[바다 민족]]의 출신지다. 정리 문서 §1의 대륙 넷 중 그렌빌리아 · 로디니아 · 판노티아가 신대륙, 판게아가 구대륙이다.","parentId":null},{"title":"연말 위기","id":"year-end-crisis","type":"사건","folder":"05_사건","sortOrder":10,"era":"연말 위기","canon":"확정","status":"작성 중","tags":["사건","연방","연말 위기","비무장화"],"memo":"원고 §1 연방·연합의 「연말 위기」 서술과 대본 18편 회상(3건)을 합쳐 만든 문서다. 헌법 80~90% 소실, 쿠데타 주체가 통일파, 잭·데이비스가 방관자, 철도파 강경파 숙청, 통일파 강경파의 와해 경로는 모두 작가 확인(2026-07-31). 시대는 2026-07-31에 신설한 독립 항목 '연말 위기'다 — 작가가 이 사건을 근대와 서사 시점을 가르는 기준이라 확정했고, 경계는 어느 한쪽에 넣으면 어긋나기 때문이다.","image":"resource/wiki/연말 위기.png","imageCaption":"연말 위기","summary":[["성격","[[연방]]을 비무장국가로 만든 국제 위기"],["발단","크레스티아 제국 해체 후 열강들의 최후통첩"],["갈림","[[철도파]] 개전론 vs [[통일파]] 반대론"],["분기점","[[먼로]]가 [[헌병대]]를 앞세워 만장일치를 통보"],["결말","통일파의 쿠데타 — 화재로 개전파 제거"],["조약","연방 완전 비무장화"],["잃은 것","[[연방 헌법]] 80~90% 소실"],["등장","18편 회상 (3장면)"]],"content":"# 연말 위기\n\n```틀\n연방\n```\n\n[[연방]]이 **완전한 비무장화**를 받아들인 사건. 지금 연방의 모든 문제가 여기서 나온다.\n\n## 발단\n\n[[연방]]은 [[크레스티아 제국]]을 해체시키며 대륙의 새 패권국이 되었다. 그러자 남은 열강들이 뭉쳤다 — [[연합]]이 먼저 [[신성제국]]에 연합을 제의하고, 남부 군도의 왕국과 중견국들까지 끌어들여 **반 연방 세력**이 형성되었다.\n\n최후통첩의 내용은 셋이었다.\n\n1. 점거한 제국 영토를 [[컴퍼니]]에게 전부 반환할 것\n2. [[컴퍼니]]는 연방에 귀속되지 않으며 독립된 권리를 가진 '기업국가'로 존속할 것\n3. 과거 편입한 쾨벤하운 왕국([[북방주]])을 독립시킬 것\n\n## 의회의 분열\n\n[[철도파]]는 싸우자고 했다. 구 패권국에게 이겼으니 나머지도 굴복시킬 수 있다는 계산이었다.\n\n[[통일파]]는 반대했다. 크레스티아 전쟁에서 소모된 역량이 너무 컸고, 연방 정규군은 대륙 중부의 용병으로 이루어져 있어 소모되면 보충이 어려웠다.\n\n18편 회상에서 그 논쟁이 직접 나온다.\n\n```대사\n철도파 의원들은 국제 정세를 읽지 못하는 건가요? 지금 강대국, 약소국 할 것 없이 대륙의 남은 국가들이 모두 ‘반 연방 전선’을 형성하고 있지 않나요?\n— 데이비스, 18편 회상\n```\n\n```대사\n저희가 병합한 ‘크레스티아 제국’ 영토의 정상적인 통제도 불가능한 상태인데, 이 상황에서 전쟁까지 일으키겠다는 건…\n— 잭, 18편 회상\n```\n\n## 먼로의 통보\n\n논쟁은 결론이 나지 않았다. [[건국의 아버지들]]의 [[먼로]]가 본회의장에 들어와 끝냈다.\n\n```대사\n그만, 의미없는 논쟁은 여기까지 하도록.\n지금은 국가적인 비상사태, 이제부터 법적인 논의는 아무 의미 없다.\n— 먼로, 18편 회상\n```\n\n[[잭]]이 무슨 권한이냐 묻자 먼로 옆의 [[헌병대]]가 답을 대신했다. 이름이 나오는 헌병은 **벤자민** 한 명뿐이며, 대사는 없고 침묵으로만 서 있다.\n\n```대사\n하, 하하… ‘헌병’, 연방군 중에서도 특히 애지중지하시더니. 이런 곳에서 쓰려고 했던 건가요?\n— 데이비스, 18편 회상\n```\n\n```대사\n건국의 아버지들 내에서 만장일치로 결정된 사안이니, 더 이상 이 안건으로 논쟁하지 말도록. 이상.\n— 먼로, 18편 회상\n```\n\n[[데이비스]]가 [[잭]]에게 남긴 말이 이 장면의 결론이다.\n\n```대사\n이딴 식으로 일을 처리할거면, 우리가 왜 이 자리에 앉아있어야 하는 거냐?\n— 데이비스, 18편 회상\n```\n\n## 쿠데타\n\n선전포고문 발표 사흘 전, 전쟁을 반대한 [[통일파]] 의원들이 쿠데타를 모의했다. [[철도파]] 의원들을 한 곳에 모아 한 번에 제거하는 계획이었다.\n\n과정에 극적인 대목이 둘 있었다. 계획이 철도파 의원 한 명에게 노출되었으나 그가 통일파 의원에게 감화되어 묵인했고, 장소로의 유인을 위해 통일파 의원 한 명이 끝까지 그곳을 지키다 사망했다.\n\n준비된 큰 화재가 발생했다. 급진적인 철도파 의원과 전쟁에 우호적이었던 의원이 대부분 사망하고, [[건국의 아버지들]]도 이 자리에서 대부분의 인원을 잃었다.\n\n[[잭]]과 [[데이비스]]는 당시 통일파 온건파였고, 쿠데타의 **실행자가 아니라 방관자**에 가까웠다.\n\n## 조약\n\n통일파는 곧바로 협상에 들어가, 최후통첩을 받아들이되 [[북방주]]만은 지켰다. 대가는 **완전한 비무장화**였다.\n\n| 조항 | 내용 |\n|---|---|\n| 비무장화 | 정규군을 특정 국가에 속하지 않은 용병단으로 환원. 가장 작은 조직이던 [[헌병대]]만 잔존 |\n| 쾨벤하운 | 독립시키지 않고 [[북방주]]로 유지 |\n| [[컴퍼니]] | 기업국가화 승인. 단 무역권 독점 조항 추가 |\n| 철도망 | 영토 반환 대신 [[그렌빌리아 대륙]] 전체에 연방 체계의 철도망 설립 |\n\n마지막 조항은 살아남은 [[철도파]] 온건파의 의견이었고, 굴욕적이라 비판받았으나 현재까지 이어지는 '미트로프 중심 질서'를 만들었다.\n\n## 남긴 것\n\n- **[[연방 헌법]]이 80~90% 소실되었다.** 그래서 [[헌병대]]가 사실상 무력화되었다 — 매개체를 잃었기 때문이다.\n- **[[철도파]] 강경파와 [[건국의 아버지들]]이 사라졌다.** 철도를 정비할 세력이 통째로 죽어, 궤간과 사유 철도가 난립한 채 남았다.\n- **[[통일파]]도 오래가지 않았다.** 강경파는 헌법 소실과 파벌 분열 과정에서 와해되고, 온건파가 [[통합파]]와 [[자치파]]로 갈라졌다.\n- **의회가 신뢰를 잃었다.** 일부 [[대가문]]이 독자 행동을 시작했다.\n- **치안 공백이 생겼다.** [[경찰청]]을 대폭 늘리고 [[보안관]]을 확대해 메웠고, 그 과정에서 두 조직의 관할 다툼이 생겼다.\n- **[[연합]] 내부도 바뀌었다.** 연방을 잇는 창구였던 [[건국의 아버지들]]이 와해되면서 [[올림피아드]]를 앞세운 엑스포 세력의 발언권이 약해지고, 길드가 다시 권력을 양분하게 되었다.\n\n## 18편에서의 반복\n\n이 회상은 [[세라]]가 본회의장에 들어오기 직전에 배치되어 있다. 그리고 세라의 첫마디가 먼로의 말과 같다.\n\n```대사\n조약이니, 연방법이니 하는 것들… 법적인 논의는 더 이상 아무런 의미가 없습니다.\n— 세라, 18편\n```\n\n그 자리에 있었던 [[잭]]이 즉시 알아챈다.\n\n```대사\n아무 의미 없다고… 하, 하하. 옆은 헌병이겠군 그래…?\n— 잭, 18편\n```\n\n같은 본회의장, 같은 문장, 옆에 선 같은 [[헌병대]]. 연말 위기에 침묵당한 쪽이 다시 침묵당하는 구도다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[연방 헌법]] · [[헌병대]]\n- [[통일파]] · [[철도파]] · [[통합파]] · [[자치파]] · [[건국의 아버지들]]\n- [[먼로]] · [[잭]] · [[데이비스]] · [[세라]]\n- [[크레스티아 제국]] · [[컴퍼니]] · [[연합]] · [[북방주]]\n- [[경찰청]] · [[보안관]] · [[궤간 통일]]\n\n## 여담\n\n**이 사건이 시대의 경계다**. 근대와 서사 시점을 가르는 기준이며, 그래서 위키의 시대 축에 **`연말 위기`라는 독립 항목**을 두었다. 경계를 어느 한쪽에 넣으면 반드시 어긋나기 때문이다 — 근대에 넣으면 대본의 `< 얼마 지나지 않은 과거 >`라는 캡션과 맞지 않고, 서사 시점에 넣으면 원인과 결과가 같은 칸에 들어간다. 지금 서사 시점에 있는 문서는 전부 이 사건의 결과물이다.\n\n시점은 **10년 전보다 뒤, 3년 전보다 앞**이다. 플레이어 연표의 시대 순서가 `먼 과거 → 10년 전 → 연말 위기 → 과거 어느 날 → 3년 전`이고, [[잭]]과 [[데이비스]]가 그때도 의원이고 지금도 의원인 것과 맞는다.\n\n**[[통일파]]와 [[건국의 아버지들]]은 '근대'에 그대로 둔다.** 이 사건에서 사라지는 구질서이기 때문이다. 사건 하나가 무대의 인물을 통째로 교체하고, 그 다음 칸부터 [[통합파]]·[[자치파]]가 나온다.\n\n**국가사와 개인사가 여기서 하나로 묶인다.** [[세라]]가 [[연방 헌법]]을 손에 넣을 수 있었던 것은 그것이 이때 불타 흩어졌기 때문이고, [[헌병대]]가 그를 따르는 것은 매개체를 되살릴 사람이 그였기 때문이며, [[데이비스]]가 독립으로 간 것은 이 자리에서 \"우리가 왜 이 자리에 앉아있어야 하는 거냐\"고 물었기 때문이다. 사건 하나가 2부의 세 축을 동시에 낳는다.\n\n**이름이 나오는 헌병 — 벤자민.** 대본 전체에서 헌병이 이름으로 불리는 유일한 자리다(18편 114행). 대사는 없다. 인물 문서를 만들 만한지는 미정이다.","parentId":null},{"title":"가문과 가족 1부","id":"story-family-1","type":"서사","folder":"08_서사","sortOrder":10,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서. 편별 목록은 만들지 않는다(작가 방침).","image":"resource/wiki/가문과 가족 1부.png","imageCaption":"가문과 가족 1부","summary":[["분량","프롤로그 + 1~10편 (+ 3.5편 잡음)"],["기간","xx월 07일 ~ 09일 아침"],["무대","[[북방주]] → [[수도주]]"],["주역","네빌 · 앤드루 · 에른스트 · 레밍턴 · 세라 · 잭 · 데이비스 · 필립 · 로버트"],["표어","달리는 기차 위에 중립은 없다"]],"content":"# 가문과 가족 1부\n\n```틀\n가문과 가족\n```\n\n프롤로그와 1~10편. **판이 깔리는 부분**이다. 북부의 저택 습격으로 시작해, 의회 소집일 아침까지 온 세력이 [[수도주]]로 모인다.\n\n```표어\n달리는 기차 위에 중립은 없다.\n```\n\n## 흐름\n\n[[철도청]]이 [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'하는 것이 발단이다(2~3편). 그 습격이 [[스프링필드]] 저택을 덮치고, 보안관 [[레밍턴]]이 배후를 증언한다(4편).\n\n한편 [[데이비스]]는 [[대가문]]들에게 분리 독립을 제안하고(8편), 동방주는 심야 조례로 경찰 무장해제에 나선다(9편). 10편은 의회 소집일 아침, 낯선 검문을 지나는 장면으로 끝난다.\n\n그 사이 6편에서 [[세라]]가 [[연방 헌법]]을 복원하고 있다. 이 편의 사건 요약이 \"밀실에서 '폭탄'이 완성되어 가다\"다.\n\n## 특징\n\n- **북부에서 수도로 이동한다.** 1편은 열두 번의 환승으로 시작하고, 10편은 의회 앞에 선다.\n- **주역이 아홉 번 바뀐다.** 용병단장·보안관·의원·비서관이 번갈아 시점을 잡는다.\n- **6편만 무기호다.** 주역이 [[식스]]인데 기호가 배정되지 않았다. 의도된 예외다.\n\n## 관련 문서\n\n- [[가문과 가족]] · [[가문과 가족 2부]]\n- [[북방주]] · [[수도주]] · [[스프링필드]]\n- [[철도청]] · [[대가문]] · [[의회]]","parentId":"story-family"},{"title":"가문과 가족 2부","id":"story-family-2","type":"서사","folder":"08_서사","sortOrder":20,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서. 편별 목록은 만들지 않는다(작가 방침).","image":"resource/wiki/가문과 가족 2부.png","imageCaption":"가문과 가족 2부","summary":[["분량","11~20편 + 에필로그 (+ 18.5편 잡음)"],["기간","xx월 09일 하루 → 11~12일 → 며칠 뒤"],["무대","[[의회]] → 지하 → [[스프링필드]] 저택"],["주역","하워드 · 해리엇 · 타게니아 · 네빌 · 에른스트 · 세라(3편) · 앤드루 · 코네트"],["판이 뒤집힌 횟수","3"]],"content":"# 가문과 가족 2부\n\n```틀\n가문과 가족\n```\n\n11~20편과 에필로그. **11~19편이 하루 안에 벌어진다.** [[의회]] 한 곳에서 판이 세 번 뒤집힌다.\n\n## 세 번의 역전\n\n1. **[[북부동맹]]이 의회를 장악한다** (11편). [[하워드]]가 [[연합]]의 개입을 끌어들이는 사이에 벌어진다.\n2. **[[데이비스]]가 독립을 선언한다** (18편). [[연방 헌법]] 제4조를 근거로, 가담한 여섯 [[대가문]]의 이름을 부른다.\n3. **[[세라]]가 수정헌법 제1조를 발표한다** (18편). 같은 편에서 두 번째 역전이 곧바로 뒤집힌다.\n\n그 사이 12편에서 조작된 [[0호 비상사태]] 지령이 경찰청을 흔들고, 13편에는 [[연합]] 감독관 [[타게니아]]가 본회의장에 도착한다.\n\n## 두 겹의 무대\n\n의회에서 정치가 굴러가는 동안, **지하에서 [[앤드루]]의 사업이 따로 굴러간다.** 16편에서 [[궤간 통일]]을 명분으로 파온 지하철도가 언급되고, 19편에서 그 실체가 드러난다. 앤드루가 지하에서 독립 선언 소식을 통신으로 전해 듣는 장면이 두 무대가 만나는 자리다.\n\n## 세라의 세 편\n\n16 · 17 · 18편이 [[세라]] 연속 주역이다. 그림자가 드러나고(16), 돌아올 수 없는 선을 넘고(17), 개헌한다(18). 부제도 이어진다 — 「나는 항상 내 의무에 충실했으며, 죽을 준비를 하고 있었다」 → 「가족은 문명의 핵이다」 → 「…나의 집」.\n\n## 끝\n\n20편은 폐허가 된 [[스프링필드]] 저택으로 돌아오는 이야기다. 주역은 [[코네트]]이고, 부제가 「언약의 피는 태중의 물보다 진하다」다.\n\n에필로그는 [[연합]] 중앙엑스포 청사로 넘어간다. [[타게니아]]의 연락이 끊겼고 연방으로 이어지는 회선이 전부 먹통이라는 보고가 올라오며, 「다음 이야기, ‘마왕과 용사’」로 닫힌다. → [[마왕과 용사]]\n\n## 관련 문서\n\n- [[가문과 가족]] · [[가문과 가족 1부]] · [[마왕과 용사]]\n- [[의회]] · [[북부동맹]] · [[연방 헌법]]\n- [[세라]] · [[앤드루]] · [[데이비스]] · [[코네트]]\n\n## 여담\n\n**독자가 마지막까지 모르는 것.** 이 챕터에서 [[세라]]가 헌법을 고쳐 쓰는 것이 [[누스]]를 이용한 행위라는 사실은 한 번도 설명되지 않는다. 에필로그가 [[연합]] 쪽으로 시점을 옮겨 \"특수 장비\"와 \"최고등급 기술 유출\"을 언급하는 것이 초자연 층으로 넘어가는 첫 단서다.","parentId":"story-family"},{"title":"가문과 가족","id":"story-family","type":"서사","folder":"08_서사","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서다. 편별 목록은 만들지 않기로 했으므로(작가 방침) 챕터의 성격과 구조만 적는다. 근거: 대본 22편, storypack의 챕터·주역·기호 배정.","image":"resource/wiki/가문과 가족.png","imageCaption":"가문과 가족","summary":[["분량","20편 + 프롤로그 · 에필로그 · 잡음 2편"],["챕터","[[가문과 가족 1부]] · [[가문과 가족 2부]]"],["무대","[[연방]]"],["기간","사흘 (xx월 7 · 8 · 9일) + 저택 귀환과 에필로그"],["주역 인물","14명 — 편마다 교대"],["다음 이야기","[[마왕과 용사]]"]],"content":"# 가문과 가족\n\n```틀\n가문과 가족\n```\n\n[[연방]]을 무대로 한 20편의 이야기. 개인의 활약이 아니라 **이해관계와 집단**이 움직이며, 편마다 주역이 교대된다.\n\n## 구조\n\n편마다 다른 인물이 주역을 맡고, 그 인물에게 배정된 기호가 화 목록에 이름 대신 표시된다. 독자는 편을 읽고 나서야 그 각인이 누구였는지 알게 된다. → [[인물]]\n\n주역이 14명이라는 것은 **주인공이 없다는 뜻**이다. 발화량이 가장 많은 [[세라]]도 7편에만 나오고, 1부의 시선인 [[네빌]]은 2부에서 3편에만 등장한다.\n\n## 시간\n\n본편의 사건은 거의 전부 **사흘**에 몰려 있다.\n\n| 날짜 | 편 | 밀도 |\n|---|---|---|\n| xx월 07일 | 1 ~ 4편 | 북부에서 시작 |\n| xx월 08일 | 5 ~ 9편 | 8편 연회장 · 9편 밀퍼드는 저녁~밤 (D-1) |\n| xx월 09일 | 10 ~ 19편 | D-day. 하루에 열 편 |\n| 11~12일 | 20편 | 저택 귀환 |\n| 며칠 뒤 | 에필로그 | 연합 중앙엑스포 |\n\n10~19편이 하루라는 것이 이 작품의 밀도다. 의회 하나에서 필리버스터·조작된 지령·감독관 개입·독립 선언·개헌이 연달아 터진다.\n\n## 두 부\n\n- **[[가문과 가족 1부]]** (1~10편) — 북부에서 시작해 의회로 모인다. 판이 깔리는 쪽\n- **[[가문과 가족 2부]]** (11~20편) — 의회에서 판이 세 번 뒤집힌다\n\n사이에 「잡음」 두 편(3.5 · 18.5)이 끼어 있다.\n\n## 처음과 끝\n\n부제가 하나의 속담을 앞뒤로 나눠 쓴다.\n\n- 1편 「피는 물보다 진하다」\n- 20편 「언약의 피는 태중의 물보다 진하다」\n\n원래 속담의 온전한 형태가 마지막에 오면서 뜻이 뒤집힌다 — 혈연보다 **맺은 약속**이 앞선다. [[세라]]가 혈연 아닌 이들을 가족이라 부르는 것과 같은 방향이다.\n\n## 관련 문서\n\n- [[가문과 가족 1부]] · [[가문과 가족 2부]] · [[마왕과 용사]]\n- [[연방]] · [[의회]] · [[철도청]]\n- [[인물]]\n\n## 여담\n\n**초자연 층이 전부 숨겨져 있다.** 22편에 `노에시스` · `노에마` · `누스` · `카시마르`가 한 번도 나오지 않는다. [[연방 헌법]]이 [[누스]]라는 사실조차 법리로만 설명된다. → [[세계관 대문]]\n\n**편별 목록은 만들지 않는다**. 각 편의 부제·사건·주역·기호는 `script/` 대본의 메타 줄과 `storypack.json`에 이미 있고, 플레이어의 연표·화 목록이 그것을 쓴다. 위키는 챕터 단위까지만 다룬다.","parentId":null},{"title":"위키 작성 규칙","id":"wiki-rules","type":"메모","folder":"09_검토","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["운영","안내"],"memo":"이 문서만은 작가 원고가 아니라 작업 규약이다. 원고 이관 정책이 바뀌면 여기부터 고칠 것.","image":"","imageCaption":"","summary":[],"content":"# 위키 작성 규칙\n\n작가 원고를 이 위키로 옮길 때의 규약. 세계관 설정이 아니라 작업 방식에 대한 문서다.\n\n## 옮길 때 (2026-07-31 확정)\n\n원고의 문장을 다듬지 않는다. 위키가 정사의 기준점이 될 것이므로, 옮기는 과정에서 원고와 위키 사이에 미세한 차이가 쌓이면 나중에 어느 쪽이 맞는지 판별할 수 없게 된다.\n\n- **문장 유지** — 줄바꿈으로 끊긴 한 문장을 잇는 것까지만 허용한다. 어순·조사·종결어미를 바꾸지 않는다.\n- **맞춤법은 고친다** (2026-07-31 확정) — 명백한 오타와 맞춤법 오류는 조용히 교정하고, 무엇을 고쳤는지 `검토메모`에 남긴다. 예: `띈다`→`띤다`, `깊을 수록`→`깊을수록`, `대륙 별`→`대륙별`, `전해져내려오는`→`전해 내려오는`.\n- **문체는 건드리지 않는다** — 맞춤법이 아닌 것은 그대로 둔다. 따옴표 `‘ ’`, 느낌표 개수(`아님!!!!!!`), 문장 중간의 마침표(`차이점으로.`), 쉼표로 끊어가는 terse한 어투. 이건 오류가 아니라 작가의 목소리다. Google Docs 내보내기에서 생긴 이스케이프(`\\!` `\\-` `\\<`)는 제거한다.\n- **소제목은 레벨을 올린다** — 원문이 굵은 글씨로 표시한 소제목(`**형성 과정**`)은 `### 형성 과정`으로 올린다. 그래야 뷰어 오른쪽 목차에 잡히고 긴 문서를 훑을 수 있다. 이름이나 원어 표기처럼 소제목이 아닌 굵은 글씨는 그대로 둔다.\n- **덧붙인 것은 분리** — 옮긴 사람이 넣은 링크·추론·요약·정리는 본문에 섞지 않고 문서 끝 `## 여담` 절과 프론트매터 `검토메모`에만 둔다.\n- **수정에는 근거를 남긴다** — 점검을 거쳐 원문을 고친 자리는 무엇을 어떻게 고쳤는지 `검토메모`에 적는다.\n\n## 목소리 (2026-07-31 확정)\n\n**이 위키는 작품을 읽은 독자가 쓴 글이다.** 본문에 '작가'가 등장하지 않는다.\n\n- **확정되지 않은 것은 `~로 추정된다` · `~로 보인다`** 로 쓴다. \"작가 확인을 받지 않았다\" 같은 제작 사정은 본문에 적지 않는다.\n- **작중에 없는 것은 `알려져 있지 않다` · `작중에서 언급되지 않는다`** 로 쓴다.\n- 작가에게 물어볼 것이 생기면 본문에 묻어두지 말고 **대화로 직접 묻는다.**\n- 문서 끝의 보충 절 제목은 **`## 여담`** 이다. 뷰어가 이 제목을 찾아 접으므로 바꾸면 `tools/wiki_template.html`의 `MEMO_HEAD`도 함께 고쳐야 한다.\n- **예외 둘.** 프론트매터의 `검토메모`는 작업 기록이므로 제작 사정을 그대로 적는다. 그리고 이 문서 자체는 작업 규약이라 제작 목소리를 유지한다.\n\n## 자료의 우선순위 (2026-07-31 확정)\n\n1. **작가가 직접 확정한 것** — 대화로 정한 사항. 가장 위다.\n2. **대본 (`script/`)** — 이미 완성된 작품이므로 정사다. 원고와 어긋나면 대본을 따른다. 예: 행정구역은 원고의 `중심주`가 아니라 대본의 `수도주`를 쓴다(대본 85건 : 원고 1건).\n3. **`세계관 정리.md` 원고** — 위 둘과 충돌하지 않는 범위에서 그대로 옮긴다.\n4. **`세계관_정합성_점검_메모.md`** — 작가 승인을 받은 항목만 반영한다.\n\n**원고에 없어도 필요하면 만든다** (2026-07-31 확정). 옮기는 단계가 끝나면 작업 방식이 바뀐다 — 작가가 원작을 쓰거나 아이디어를 주고, 그것을 위키 내용으로 채워 넣는 쪽이 된다. 그래서 원고 분량 안에 스스로를 묶지 않는다. '위키라면 이 정도는 있어야 한다' 싶은 것이 있으면 **먼저 물어보고 직접 쓴다.** 다만 만든 문서에는 근거를 반드시 남긴다(대본 몇 편, 작가 확인 언제, 추론인지 아닌지).\n\n**개인 사건은 사건 문서로 만들지 않는다** (작가 방침). 인물의 과거(가출·면접·유년 등)는 해당 인물 문서 안에 둔다. `05_사건`은 국가·대륙 단위 사건만 다룬다.\n\n**편별 목록 문서도 만들지 않는다** (작가 방침). 서사는 챕터 단위까지만 문서로 둔다. 편별 부제·사건·주역·기호는 `script/` 대본 메타와 `storypack.json`에 있고 플레이어가 그것을 쓴다.\n\n**플레이버 텍스트(§5)는 위키 문서에 반영하지 않는다.** 작가 방침이다. 등장인물의 대사이지 설정 서술이 아니므로, 여기서 설정을 끌어오지 않는다. 단 작가가 그 내용을 직접 확정해준 경우는 예외이며, 그때는 플레이버가 아니라 **작가 확인**을 출처로 적는다.\n\n## 문체 (2026-07-31 확정)\n\n**평서체(`~이다` / `~한다`)로 통일한다.** 본문이든 메모든 같다.\n\n원고는 구간마다 문체가 달랐다. §핵심 개념과 §1의 이해집단 설명은 평서체였고, §1의 「짤막한 역사」만 음슴체(`~함` / `~됨` / `~임`)였다. 다수인 평서체로 맞추기로 했으므로, 국가 문서의 역사 절은 옮길 때 어미를 바꾼다. **어순과 내용은 그대로 두고 문장 끝만 고친다.**\n\n- 옮긴 사람의 메모도 평서체로 쓴다. 존댓말(`~입니다` / `~십시오`)을 쓰지 않는다.\n- 물어볼 것이 있으면 `확인이 필요하다` 형태로 적는다. 의문문으로 던지지 않는다.\n- **예외: 인용은 손대지 않는다.** 경구, 등장인물의 대사, 세력의 표어는 원문 그대로 둔다.\n- 문체를 바꾼 문서는 `검토메모`에 그 사실을 적는다.\n\n## 속성 어휘\n\n위키 도구(`wikipage/index.html`)의 선택 목록과 일치해야 한다. 없는 값을 쓰면 편집 화면에서 선택이 풀린다.\n\n- **분류** 대문 · 개념 · 국가 · 세력 · 인물 · 사건 · 기술 · 병기 · 지역 · 서사 · 연표 · 메모\n- **정사** 확정 · 잠정 · 구 설정 · 폐기 예정\n- **상태** 작성 중 · 검토 필요 · 충돌 의심 · 완료\n- **시대** 시대 공통 · 대전쟁 이전 · 대전쟁 · 고대 · 고전 · 중세 · 근대 · **연말 위기** · 서사 시점 · 현대(붕괴 이후) · 미정\n  - 2026-07-31 확정. 값을 추가·변경하면 뷰어 템플릿(`tools/wiki_template.html`)의 `ERAS` 배열에도 반영해야 한다. 순서가 곧 연표 순서다.\n  - **`연말 위기`는 경계 칸이다.** [[연말 위기]]가 근대와 서사 시점을 가르는 기준이라 독립 항목으로 두었다. 이 사건에서 사라지는 구질서([[통일파]] · [[건국의 아버지들]])는 `근대`, 이 사건의 결과로 생긴 것들([[통합파]] · [[자치파]] · [[경찰청]] 등)은 `서사 시점`이다. 플레이어 연표의 `ERA_ORDER`도 이 사건을 독립 층으로 둔다.\n  - **마왕 사태는 '서사 시점'이다.** 국가 붕괴의 계기이지만 그 자체는 서사 안의 사건이다.\n- **폴더** 00_홈 · 01_핵심 규칙 · 02_지역 · 03_세력 · 04_인물 · 05_사건 · 06_기술과 병기 · 07_연표 · 08_서사 · 09_검토 · 미분류\n\n## 시대 기준\n\n이 위키의 '현재'는 **국가 체제가 모두 무너진 이후**, 국지 세력이 난립하는 시기다. 메인 서사는 모두 그보다 앞이다. 국가와 그 이해집단을 다루는 문서는 '현대(붕괴 이후)'가 아니라 그 국가가 실제로 기능하던 시대를 적는다.\n\n## 아직 열려 있는 결정\n\n- 13개 대가문 중 이름이 확인된 것은 **6개** — 스프링필드 · 콩코드 · 하트퍼드 · 도버 · 윌밍턴 · 밀퍼드(18편 55행). 나머지 7개는 미정.\n- 하위 문서가 상위 문서의 폴더를 강제로 따라간다([index.html:222](../../wikipage/index.html:222)의 `setFolder`, [:223](../../wikipage/index.html:223)의 `setParent`). 국가 밑에 이해집단을 계층으로 매달려면 이 동작을 풀어야 한다.\n- 읽기는 해결됐다. `python tools/build_wiki.py` 가 `lore/` 를 읽어 단일 HTML 뷰어(`wikipage/위키.html`)를 만든다. 편집은 여전히 md에서 한다. `wikipage/index.html`(localStorage 편집기)은 뷰어로 대체됐으므로 쓰지 않는다.","parentId":null}],"folderOrder":["00_홈","01_핵심 규칙","02_지역","03_세력","04_인물","05_사건","06_기술과 병기","07_연표","08_서사","09_검토","미분류"],"templates":{"가문과 가족":{"title":"가문과 가족","hue":"286","groups":[["챕터","[[가문과 가족 1부]] · [[가문과 가족 2부]] · [[마왕과 용사]]"],["무대","[[연방]] · [[의회]] · [[철도청]] · [[스프링필드]]"],["인물","[[세라]] · [[네빌]] · [[앤드루]] · [[데이비스]] · [[코네트]]   return "";
}
const sortDocs = (a,b) => (a.sortOrder||0)-(b.sortOrder||0) || a.title.localeCompare(b.title,"ko");
const childrenOf = id => docs.filter(d => (d.parentId||null) === (id||null)).sort(sortDocs);

/* ── 분류별 상징색 ── */
const TYPE_HUE = {"대문":32,"개념":264,"국가":208,"세력":14,"인물":338,"사건":42,
                  "기술":192,"병기":2,"지역":152,"서사":286,"연표":96,"메모":222};
const hueOf = t => TYPE_HUE[t] ?? 222;

/* ── 시대 축 ── */
/* '연말 위기'는 근대와 서사 시점을 가르는 경계라서 독립된 칸을 가진다.
   플레이어 연표의 ERA_ORDER 도 이 사건을 독립 층으로 두고 있다. */
const ERAS = ["대전쟁 이전","대전쟁","고대","고전","중세","근대","연말 위기","서사 시점","현대(붕괴 이후)"];
const ERA_SHORT = {"대전쟁 이전":"대전쟁 전","현대(붕괴 이후)":"현대"};
const ERA_EDGE = new Set(["연말 위기"]);   // 경계 칸은 따로 표시한다

function eraBar(d){
  const hue = hueOf(d.type);
  const seg = (e, cls) =>
    `<div class="seg${cls}${ERA_EDGE.has(e) ? " edge" : ""}">${esc(ERA_SHORT[e] || e)}</div>`;
  if(d.era === "시대 공통")
    return `<div class="erabar tone" style="--hue:${hue}">` +
      ERAS.map(e => seg(e, " span")).join("") + `</div>`;
  const i = ERAS.indexOf(d.era);
  if(i < 0)
    return `<div class="erabar flat"><div class="lab">시대 ${esc(d.era || "미정")}</div></div>`;
  return `<div class="erabar tone" style="--hue:${hue}">` +
    ERAS.map((e, j) => seg(e, j === i ? " on" : "")).join("") + `</div>`;
}

/* 대문에 ```연표``` 를 쓰면 전체 연표가 들어간다. */
function chronoHtml(){
  const setting = docs.filter(d => d.type !== "대문" && d.type !== "메모");
  const rows = ERAS.map(e => {
    const list = setting.filter(d => d.era === e).sort(sortDocs);
    return `<div class="row${list.length ? "" : " empty"}${ERA_EDGE.has(e) ? " edge" : ""}">
      <div class="era">${esc(e)}${ERA_EDGE.has(e) ? `<span class="edgetag">근대와 서사 시점의 경계</span>` : ""}</div>
      <div class="docs">${list.length
        ? list.map(d => `<a data-go="${d.id}">${icon(d.type)} ${esc(d.title)}</a>`).join("")
        : `<span class="none">아직 없다</span>`}</div></div>`;
  }).join("");
  const common = setting.filter(d => d.era === "시대 공통").sort(sortDocs);
  const undated = setting.filter(d => d.era === "미정").sort(sortDocs);
  const extra = [["시대 공통", common], ["미정", undated]].filter(([, l]) => l.length).map(([t, l]) =>
    `<div class="row empty"><div class="era">${t}</div><div class="docs">${
      l.map(d => `<a data-go="${d.id}">${icon(d.type)} ${esc(d.title)}</a>`).join("")}</div></div>`).join("");
  return `<div class="chrono">${rows}${extra}</div>`;
}

/* ── 이미지 ──
   lore/ 문서가 가리키는 경로는 저장소 뿌리 기준이다. 뷰어는 wikipage/ 안에 있으므로 ../ 를 붙인다.
   파일이 없으면 빈 상자 대신 제목에서 뽑은 문양을 깐다. */
function imgSrc(p){ return /^(https?:|\.\.\/|\/)/.test(p) ? p : "../" + p }
function hashOf(s){ let h = 0; for(const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h }
function motifSvg(seed, hue){
  const h = hashOf(seed), kind = h % 4;
  const c = `hsl(${hue} 38% 52%)`;
  const g = s => `<svg class="motif" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="${c}" stroke-width=".7">${s}</g></svg>`;
  if(kind === 0) return g([18,28,38,48,58].map(r => `<circle cx="50" cy="52" r="${r}"/>`).join(""));
  if(kind === 1) return g([12,30,48,66,84].map(y => `<path d="M-5 ${y} L50 ${y + 22} L105 ${y}"/>`).join(""));
  if(kind === 2) return g(Array.from({length:9}, (_, i) =>
    `<path d="M${i*14-30} 105 L${i*14+40} -5"/><path d="M${i*14-30} -5 L${i*14+40} 105"/>`).join(""));
  return g(Array.from({length:11}, (_, i) =>
    `<path d="M50 104 L${i*12-10} -6"/>`).join("") + `<circle cx="50" cy="104" r="7"/>`);
}
function placeholder(src, label, type){
  const hue = hueOf(type);
  return `<div class="imgph tone" style="--hue:${hue}">${motifSvg(label || src, hue)}
    <div class="mark">${icon(type)}</div>
    <div class="lab">${esc(label || "이미지 자리")}</div>
    <div class="path">${esc(src)}</div></div>`;
}
/* 이미지가 없을 때. 문양 자리로 바꾸고, 같은 글이 두 번 나오지 않게 캡션 줄은 지운다. */
function imgFail(el){
  const slot = el.closest(".imgslot") || el.closest("figure");
  if(!slot) return;
  const next = slot.nextElementSibling;
  if(next && next.classList.contains("imgcap")) next.remove();
  slot.innerHTML = placeholder(el.dataset.phSrc, el.dataset.phLabel, el.dataset.phType);
}
const phAttrs = (src, label, type) =>
  `data-ph-src="${esc(src)}" data-ph-label="${esc(label || "")}" data-ph-type="${esc(type || "메모")}" onerror="imgFail(this)"`;
let curType = "메모";
function imgHtml(src, alt){
  return `<figure class="body-img"><img src="${esc(imgSrc(src))}" alt="${esc(alt||"")}"
    ${phAttrs(src, alt, curType)}>${alt ? `<figcaption>${esc(alt)}</figcaption>` : ""}</figure>`;
}

/* ── 인용 블록 ──
   ```경구 / ```대사 / ```표어 / ```조문 으로 감싼다.
   '—' 로 시작하는 줄은 출처로 빠진다. */
/* ── 틀 ──
   ```틀
   연방
   ```
   lore/_틀/연방.md 를 불러 탐색 상자로 그린다. */
function navboxHtml(name){
  const t = templates[name];
  if(!t) return `<div class="navbox missing">틀 「${esc(name)}」을 찾지 못했다 — <code>lore/_틀/${esc(name)}.md</code></div>`;
  const hue = t.hue || 222;
  return `<nav class="navbox tone" style="--hue:${hue}">
    <div class="nbhead">${esc(t.title)}</div>
    <table>${t.groups.map(([k, v]) =>
      `<tr><th>${esc(k)}</th><td>${inline(v)}</td></tr>`).join("")}</table></nav>`;
}

/* ── 상세 문서 안내 ──
   ```상세
   연방의 역사
   ``` */
function seeAlsoHtml(lines){
  const names = lines.map(l => l.trim()).filter(Boolean);
  if(!names.length) return "";
  const links = names.map(n => inline(`[[${n}]]`)).join(" · ");
  return `<div class="seealso">자세한 내용은 ${links} 문서를 참고할 것.</div>`;
}

/* ── 연혁 ──
   ```연혁
   건국 | 소국들을 규합했다
   ``` */
function historyHtml(lines){
  let last = "";
  const rows = lines.map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf("|");
    const when = i < 0 ? "" : l.slice(0, i).trim();
    const what = i < 0 ? l : l.slice(i + 1).trim();
    const same = when === last;
    last = when || last;
    return `<li${same ? ' class="same"' : ""}>
      <span class="when">${same ? "" : inline(when)}</span>
      <span class="what">${inline(what)}</span></li>`;
  }).join("");
  return `<ol class="histline">${rows}</ol>`;
}

const FENCE = {"경구":"epigraph", "대사":"dialogue", "표어":"motto", "조문":"article"};
function renderFence(kind, lines){
  if(kind === "연표") return chronoHtml();
  if(kind === "틀") return navboxHtml(lines.map(l=>l.trim()).filter(Boolean)[0] || "");
  if(kind === "상세") return seeAlsoHtml(lines);
  if(kind === "연혁") return historyHtml(lines);
  const cls = FENCE[kind];
  if(!cls) return `<pre><code>${esc(lines.join("\n"))}</code></pre>`;
  const cites = [], body = [];
  lines.forEach(l => (/^\s*—/.test(l) ? cites : body).push(l));
  const text = body.filter(x => x.trim()).map(x => `<p>${inline(x)}</p>`).join("");
  const cite = cites.length
    ? `<cite>${inline(cites.map(c => c.replace(/^\s*—\s*/, "")).join(" · "))}</cite>` : "";
  return `<figure class="quote ${cls}">${text}${cite}</figure>`;
}

/* ── 마크다운 ── */
function inline(raw){
  const tokens = [];
  let s = String(raw).replace(/\[\[([^\]]+)\]\]/g, (_,v) => { tokens.push(v); return `@@W${tokens.length-1}@@` });
  s = esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
            .replace(/\*([^*]+)\*/g,"<em>$1</em>")
            .replace(/~~([^~]+)~~/g,"<del>$1</del>")
            .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_,alt,src) => imgHtml(src, alt))
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  tokens.forEach((v,i) => {
    const p = v.split("|"), target = p[0].split("#")[0].trim(), label = (p[1]||p[0]).trim();
    const cl = findT(target) ? "" : " missing";
    s = s.replace(`@@W${i}@@`, `<a class="wiki${cl}" data-wiki="${esc(target)}">${esc(label)}</a>`);
  });
  return s;
}
function md(text){
  const lines = String(text||"").replace(/\r\n/g,"\n").split("\n");
  let h="", list=null, code=false, buf=[], table=[];
  const close = () => { if(list){ h += `</${list}>`; list=null } };
  const flush = () => {
    if(!table.length) return;
    const row = x => x.trim().replace(/^\||\|$/g,"").split("|").map(v=>v.trim());
    if(table.length>1 && /^\s*\|?[\s:-]+\|/.test(table[1])){
      const hd=row(table[0]), rows=table.slice(2).map(row);
      h += "<table><thead><tr>"+hd.map(x=>`<th>${inline(x)}</th>`).join("")+"</tr></thead><tbody>"
        + rows.map(r=>"<tr>"+r.map(x=>`<td>${inline(x)}</td>`).join("")+"</tr>").join("")+"</tbody></table>";
    } else h += table.map(x=>`<p>${inline(x)}</p>`).join("");
    table=[];
  };
  let fence = "";
  for(const line of lines){
    if(line.startsWith("```")){
      flush();close();
      if(!code){ code=true; fence=line.slice(3).trim(); buf=[] }
      else { h += renderFence(fence, buf); code=false; fence="" }
      continue;
    }
    if(code){ buf.push(line); continue }
    if(line.trim().startsWith("|") && line.includes("|")){ close(); table.push(line); continue } else flush();
    if(!line.trim()){ close(); continue }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.+)$/)){ close(); const n=m[1].length, t=m[2];
      h += `<h${n} id="${slug(t.replace(/[*`\[\]]/g,""))}">${inline(t)}</h${n}>` }
    else if(/^---+$/.test(line.trim())){ close(); h += "<hr>" }
    else if(m = line.match(/^>\s?(.*)$/)){ close(); h += `<blockquote>${inline(m[1])}</blockquote>` }
    else if(m = line.match(/^(\s*)[-*+]\s+(.+)$/)){ if(list!=="ul"){close();list="ul";h+="<ul>"} h += `<li>${inline(m[2])}</li>` }
    else if(m = line.match(/^\s*\d+\.\s+(.+)$/)){ if(list!=="ol"){close();list="ol";h+="<ol>"} h += `<li>${inline(m[1])}</li>` }
    else { close(); h += `<p>${inline(line)}</p>` }
  }
  flush(); close();
  return h || '<p class="empty">내용이 없습니다.</p>';
}

/* ── 상태 ── */
let active = docs.find(d => d.folder === "00_홈") ? docs.find(d => d.folder === "00_홈").id : docs[0].id;
let query = "";

function visibleSet(){
  if(!query) return new Set(docs.map(d=>d.id));
  const q = query.toLowerCase();
  const hit = new Set(docs.filter(d =>
    [d.title,d.folder,d.type,d.era,d.canon,d.status,...(d.tags||[]),d.content,d.memo].join(" ").toLowerCase().includes(q)
  ).map(d=>d.id));
  [...hit].forEach(id => { let d = byId(id); while(d && d.parentId){ hit.add(d.parentId); d = byId(d.parentId) } });
  return hit;
}
/* 목록은 두 단계까지만 보여준다. 그 아래는 문서에 들어가 오른쪽 '하위 문서'로 넘어간다.
   검색 중일 때는 깊이 제한을 풀어, 깊은 문서도 찾을 수 있게 한다. */
const MAX_DEPTH = 1;
function descendantCount(id){
  let n = 0, stack = [id];
  while(stack.length){ const kids = childrenOf(stack.pop()); n += kids.length; kids.forEach(k => stack.push(k.id)) }
  return n;
}
function nodeHtml(d, depth, vis){
  if(!vis.has(d.id)) return "";
  const limited = !query && depth >= MAX_DEPTH;
  const kids = limited ? "" : childrenOf(d.id).map(k => nodeHtml(k, depth + 1, vis)).join("");
  const hidden = limited ? descendantCount(d.id) : 0;
  const badge = hidden ? `<span class="more" title="하위 문서 ${hidden}밋">${hidden}</span>` : "";
  return `<button class="doc${d.id === active ? " on" : ""}" data-id="${d.id}" style="padding-left:${8 + depth * 15}px">
    <span class="ic">${icon(d.type)}</span><span class="tt">${esc(d.title)}</span>${badge}<span class="dot ${dotClass(d)}"></span>
  </button>${kids}`;
}
function renderTree(){
  const vis = visibleSet();
  const groups = new Map();
  docs.filter(d=>vis.has(d.id)).forEach(d => {
    if(!groups.has(d.folder)) groups.set(d.folder,0);
    groups.set(d.folder, groups.get(d.folder)+1);
  });
  const order = [...groups.keys()].sort((a,b)=>{
    const x=folderOrder.indexOf(a), y=folderOrder.indexOf(b);
    return (x<0?999:x)-(y<0?999:y) || a.localeCompare(b,"ko");
  });
  $("#tree").innerHTML = order.map(f => {
    const roots = docs.filter(d => d.folder===f && vis.has(d.id) &&
      (!d.parentId || !byId(d.parentId) || byId(d.parentId).folder !== f)).sort(sortDocs);
    return `<section><div class="foldername">${esc(f)}<span>${groups.get(f)}</span></div>
      ${roots.map(d=>nodeHtml(d,0,vis)).join("")}</section>`;
  }).join("") || '<p class="empty" style="padding:10px">결과가 없습니다.</p>';
  $("#tree").querySelectorAll(".doc").forEach(b => b.onclick = () => go(b.dataset.id));
}

function splitMemo(content){
  const i = content.indexOf(MEMO_HEAD);
  if(i < 0) return [content, ""];
  return [content.slice(0,i).trimEnd(), content.slice(i + MEMO_HEAD.length).trim()];
}
/* ```틀 블록은 본문에서 떼어내 문서 맨 위에 따로 놓는다.
   본문 안에 두면 인포박스에 밀려 아래로 내려가고 위에 빈 자리가 생긴다. */
function pullNavbox(text){
  const m = String(text).match(/(?:^|\n)```틀\n([^\n]*)\n```\n?/);
  if(!m) return { name: "", rest: text };
  return { name: m[1].trim(), rest: text.replace(m[0], "\n") };
}

/* 본문 첫 줄의 `# 제목`은 위에 큰 제목으로 이미 나오므로 덜어낸다. */
function dropH1(text, title){
  const lines = String(text).split("\n");
  let i = 0;
  while(i < lines.length && !lines[i].trim()) i++;
  const m = lines[i] && lines[i].match(/^#\s+(.+)$/);
  if(m && m[1].trim() === String(title).trim()) return lines.slice(i+1).join("\n").replace(/^\n+/,"");
  return text;
}
/* ── 인포박스 ── */
function infoboxHtml(d){
  const hasImg = !!d.image, rows = d.summary || [];
  if(!hasImg && !rows.length) return "";
  const img = hasImg
    ? `<div class="imgslot"><img src="${esc(imgSrc(d.image))}" alt="${esc(d.title)}"
        ${phAttrs(d.image, d.imageCaption || d.title, d.type)}></div>`
    : "";
  const cap = d.imageCaption ? `<div class="imgcap">${inline(d.imageCaption)}</div>` : "";
  const table = rows.length
    ? `<table>${rows.map(([k,v]) => {
        const tbd = /^(미정|미착수|없음)$/.test(String(v).trim()) ? " class=\"tbd\"" : "";
        return `<tr><th>${inline(k)}</th><td${tbd}>${inline(v)}</td></tr>`;
      }).join("")}</table>`
    : "";
  return `<aside class="infobox tone" style="--hue:${hueOf(d.type)};border-top:3px solid var(--tone)">
    <div class="ibhead">${esc(d.title)}</div>${img}${cap}${table}</aside>`;
}

/* ── 항목별 접기 ── */
function foldify(nodes, level){
  const frag = document.createDocumentFragment();
  let i = 0;
  while(i < nodes.length){
    const n = nodes[i];
    if(n.tagName === "H" + level){
      const bucket = [];
      let j = i + 1;
      while(j < nodes.length && nodes[j].tagName !== "H" + level){ bucket.push(nodes[j]); j++ }
      const det = document.createElement("details");
      det.className = "sec lv" + level;
      det.open = true;
      if(n.id) det.id = n.id;
      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="secttl">${n.innerHTML}</span>`;
      det.appendChild(sum);
      const body = document.createElement("div");
      body.className = "secbody";
      body.appendChild(level < 3 ? foldify(bucket, level + 1) : listFrag(bucket));
      det.appendChild(body);
      frag.appendChild(det);
      i = j;
    } else { frag.appendChild(n); i++ }
  }
  return frag;
}
function listFrag(nodes){ const f = document.createDocumentFragment(); nodes.forEach(n => f.appendChild(n)); return f }
function revealTo(el){ let p = el; while(p){ if(p.tagName === "DETAILS") p.open = true; p = p.parentElement } }

function crumbOf(d){
  const path = []; let cur = d;
  while(cur){ path.unshift(cur); cur = cur.parentId ? byId(cur.parentId) : null }
  return [d.folder, ...path.slice(0,-1).map(x=>x.title)].join("  ›  ");
}
function render(){
  const d = byId(active) || docs[0];
  const [main, memo] = splitMemo(d.content);
  $("#crumb").textContent = crumbOf(d);
  $("#title").textContent = d.title;
  $("#chips").innerHTML = [
    `<span class="chip">${esc(d.type)}</span>`,
    `<span class="chip">${esc(d.era)}</span>`,
    `<span class="chip canon-${esc(d.canon)}">정사 ${esc(d.canon)}</span>`,
    `<span class="chip st-${esc(d.status)}">${esc(d.status)}</span>`,
    ...(d.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`),
  ].join("");
  $("#memoFm").innerHTML = d.memo
    ? `<details class="memo"><summary>검토 메모</summary><div class="inner body">${md(d.memo)}</div></details>` : "";
  curType = d.type;
  const nav = pullNavbox(main);
  $("#erabar").innerHTML = eraBar(d);
  $("#navbox").innerHTML = nav.name ? navboxHtml(nav.name) : "";
  $("#infobox").innerHTML = infoboxHtml(d);
  $("#body").innerHTML = md(dropH1(nav.rest, d.title));

  /* 첫 소제목 앞의 문단을 손본다. 아주 짧고 마침표가 없는 한 줄은 부제로,
     그 다음(또는 첫) 문단을 도입부로 표시한다. */
  let sawSub = false;
  for(const el of $("#body").children){
    if(/^H[1-6]$/.test(el.tagName) || el.tagName === "DETAILS") break;
    if(el.tagName !== "P") continue;
    const t = el.textContent.trim();
    if(!sawSub && t.length <= 20 && !/[.!?…다]$/.test(t)){ el.classList.add("subtitle"); sawSub = true; continue }
    el.classList.add("lead"); break;
  }

  const heads2 = [...$("#body").querySelectorAll("h2,h3")];
  if(heads2.length){
    const frag = foldify([...$("#body").children], 2);
    $("#body").innerHTML = "";
    $("#body").appendChild(frag);
  }
  $("#foldbar").hidden = !$("#body").querySelector("details.sec");
  $("#memoBody").innerHTML = memo
    ? `<details class="memo"><summary>여담</summary><div class="inner body">${md(memo)}</div></details>` : "";

  document.querySelectorAll("[data-wiki]").forEach(a => a.onclick = () => {
    const t = findT(a.dataset.wiki);
    if(t) go(t.id); else alert(`아직 없는 문서입니다: ${a.dataset.wiki}`);
  });

  // 오른쪽: 이 문서의 목차 + 하위 문서 + 역링크
  const heads = [...$("#body").querySelectorAll("details.sec")].map(s => ({
    id: s.id, text: s.querySelector(".secttl").textContent, tagName: s.classList.contains("lv3") ? "H3" : "H2"
  }));
  const kids = childrenOf(d.id);
  const backs = docs.filter(x => x.id!==d.id &&
    new RegExp(`\\[\\[${d.title.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(\\||#|\\]\\])`).test(x.content));
  $("#rail").innerHTML =
    (heads.length ? `<div class="box"><h5>이 문서</h5>${heads.map(h =>
      `<a class="${h.tagName==="H3"?"sub":""}" data-jump="${esc(h.id)}">${esc(h.text)}</a>`).join("")}</div>` : "") +
    (kids.length ? `<div class="box"><h5>하위 문서</h5>${kids.map(k =>
      `<a class="backlink" data-go="${k.id}">${esc(k.title)}</a>`).join("")}</div>` : "") +
    (backs.length ? `<div class="box"><h5>여기를 가리키는 문서 ${backs.length}</h5>${backs.map(b =>
      `<a class="backlink" data-go="${b.id}">${esc(b.title)}</a>`).join("")}</div>` : "");
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = () => go(a.dataset.go));
  $("#rail").querySelectorAll("[data-jump]").forEach(a => a.onclick = () => {
    const el = document.getElementById(a.dataset.jump);
    if(!el) return;
    revealTo(el);
    el.scrollIntoView({behavior:"smooth", block:"start"});
  });

  renderTree();
}
function go(id){
  active = id; query = ""; $("#q").value = "";
  render();
  $("#main").scrollTop = 0;
  if(innerWidth <= 1000) closeSide();
  location.hash = encodeURIComponent(byId(id).title);
}

const setFold = open => $("#body").querySelectorAll("details.sec").forEach(s => s.open = open);
$("#foldAll").onclick = () => setFold(false);
$("#openAll").onclick = () => setFold(true);
const closeSide = () => { $("#side").classList.remove("open"); $("#scrim").classList.remove("on") };
$("#menu").onclick = () => {
  const open = $("#side").classList.toggle("open");
  $("#scrim").classList.toggle("on", open);
};
$("#scrim").onclick = closeSide;
$("#q").oninput = e => { query = e.target.value.trim(); renderTree() };
$("#theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("wiki-theme", next) } catch(e) {}
};
addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#q").focus(); $("#q").select() }
  if(e.key==="Escape" && document.activeElement===$("#q")){ query=""; $("#q").value=""; renderTree(); $("#q").blur() }
});
try {
  const t = localStorage.getItem("wiki-theme");
  document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
} catch(e) { document.documentElement.dataset.theme = "light" }

const fromHash = location.hash ? findT(decodeURIComponent(location.hash.slice(1))) : null;
if(fromHash) active = fromHash.id;
render();
</script>
</body>
</html>
