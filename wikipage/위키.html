 [[노에시스]] · [[카시마르]] · [[노모스]] · [[바다]]\n- [[대악몽]] · [[레콩키스타]] · [[연말 위기]] · [[대전쟁]]\n\n## 여담\n\n**여덟 나라의 이름은 실제 국가에서 왔다.** 카고르예는 핀란드, 루블린은 폴란드, 오흐리드는 불가리아, 칼리아리는 사르데냐-피에몬테, 팔레르는 나폴리 왕국, 헬베티는 스위스, 바나토는 베네치아 공화국, 쾨벤하운은 덴마크와 아이슬란드·그린란드다. 위치와 성격도 대체로 그 나라를 따라간다.\n\n**잠든 신이 꿈을 꾸는 대륙에서 모든 것이 꿈의 형태다** (독자의 읽기). [[노모스]]는 작은 방에서 무언가를 강하게 바라면 그 공간이 통째로 변하는 것이고, 붕괴 이후 사람들은 각자 그 안으로 들어가 나오지 않았다. 이 대륙의 괴물 이름은 [[컴퍼니]]가 붙인 러시아어 **'악몽'**이며, 그것이 대량으로 발생한 고대의 사건 이름은 **[[대악몽]]**이다. 잠든 신, 각자의 방, 그리고 악몽 — 같은 계열의 말들이 이 대륙에 겹쳐 있다.\n\n**바실리아인이 이 대륙의 절반을 만들었다** (독자의 읽기). [[대악몽]]으로 분지를 잃은 사람들이 흩어져 남부에 도미누스 제국을 세우고, 그 제국이 중부에 가문 문화를 심고, 그 가문들이 쪼개져 소국이 되고, 그 소국들이 [[연방]]이 된다. 그리고 남은 분지에는 [[신성제국]]이 선다. **[[연방]]과 [[신성제국]]이 같은 뿌리에서 갈라졌다는 것이 [[건국의 아버지들]] 이야기보다 훨씬 앞으로 올라간다.**\n\n**서부만 계보가 다르다.** [[바다 민족]]의 서부 갈래가 세운 헬라스는 도미누스의 지배를 받지 않았고, 고전에 헬레니아 제국으로 성장해 오히려 북도미누스를 무너뜨리는 계기가 되었다. 지금의 [[연합]]이 그 계보다.\n\n**등대를 누가 세웠는지가 사실은 기록에 있다.** [[팔레르 기사단국]] 자신도 모르는 미스터리로 남아 있는데, 그 등대는 도미누스 제국이 항해의 핵심으로 쓰다 반란 뒤에 섬째로 봉쇄한 것이다. 봉쇄가 너무 철저해서 만든 쪽의 기록까지 끊긴 것으로 읽힌다.\n\n**시점이 섞이는 자리.** 위 「중견국 · 약소국」의 [[쾨벤하운 인민연합]]은 서사 시점에는 존재하지 않는다. [[연방]]이 붕괴하고 '유나이티드 레일로드' 중심 체제로 전환할 때를 노려 독립하는 신생국이므로, 이 목록은 위키 기준 현재의 지도다.\n\n**'유나이티드 레일로드'가 무엇인지는 아직 알려지지 않았다.** [[연방]]이 사실상 붕괴한 뒤 이 대륙이 그 체제로 전환한다는 것만 확인된다.","parentId":null},{"title":"기동대","id":"mobile-corps","type":"세력","folder":"02_지역","sortOrder":110,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","철도","무력","치안"],"memo":"원문 329~330행 문장 그대로. 대본 용어사전은 기동대를 '철도청 국내지부의 무력 조직'이라 적는데, 원문은 인력 조달 구조까지 설명한다. 모순이 아니라 보완 관계로 보아 둘 다 반영했다.","image":"resource/wiki/기동대.png","imageCaption":"기동대의 열차 작전","summary":[["소속","[[철도청]] 산하"],["성격","철도 수비를 위한 치안조직"],["주 소속","국내지부"],["인력 조달","[[경찰청]] · [[보안관]]이 제공"],["조달 이유","중립성과 힘의 균형"],["특화","철도 중심 작전"],["평가","연방 내 최고의 기동성"]],"content":"# 기동대 🗡️\n\n철도청 산하의 치안조직. 철도 수비를 위한 조직으로, 철도청의 중립성과 힘의 균형을 유지하기 위해 경찰청과 보안관에게 인력을 제공받아 유지되는 무력조직이다. 철도를 중심으로 수행하는 작전에 특화되어 있어, 연방 내 어떤 무장조직보다 유연하고, 뛰어난 기동성을 자랑하기도한다.\n\n## 기록이 남는다\n\n기동대를 움직이면 **반드시 기록이 남는다.** 2편에서 [[네빌]]이 외부 업체 대신 기동대를 쓰자고 제안하자 [[앤드루]]가 거절하는 근거가 이것이다.\n\n```대사\n[기동대]를 움직이면 반드시 기록이 남잖나, 이런 일에는 적합하지 않아.\n— 앤드루, 2편\n```\n\n기록에 남기고 싶지 않은 일에는 대신 [[하노버 용병단]] 같은 외부 세력을 쓴다. 연방에서 가장 빠른 무력을 손에 쥐고도 굳이 용병을 사는 이유가 여기 있다.\n\n## 관련 문서\n\n- [[연방]] · [[철도청]]\n- [[하노버 용병단]] — 기록을 남기지 않으려 할 때의 대체 수단\n- [[경찰청]] · [[보안관]] — 인력을 제공하는 두 조직\n- [[헌병대]]\n- [[잭슨의 형제단]] — 열차를 노리는 상대\n\n## 여담\n\n**인력 조달 방식이 이 조직의 성격이다.** [[경찰청]](중앙)과 [[보안관]](대가문) 양쪽에서 사람을 받는다. 어느 한쪽에 기울지 않게 만든 장치이고, 그래서 [[철도청]]이 '중립'을 주장할 수 있다. 반대로 말하면 기동대 안에 이미 두 진영의 사람이 섞여 있다는 뜻이기도 하다.\n\n**연방에서 가장 빨리 움직이는 무력이다.** [[헌병대]]는 법적 절차 때문에 사실상 움직이지 못하고, 경찰은 관할에 묶이고, 보안관은 지역에 묶인다. 기동대만 철도를 타고 전국을 오갈 수 있다. 비무장국가에서 가장 실용적인 무력이 철도 부처 산하에 있다는 구조다.\n\n**열차 강도와 짝을 이룬다.** [[잭슨의 형제단]]이 열차만 노리므로, 기동대의 상대는 사실상 이들이다.","parentId":"federation"},{"title":"대가문","id":"great-houses","type":"세력","folder":"02_지역","sortOrder":60,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","대가문","기성 권력"],"memo":"원문 308~312행 문장 그대로. 작가 확인(2026-07-31)으로 북부 대가문의 계보가 정리됐다 — 쾨벤하운 시절의 귀족이 아니라 중부에서 옮겨간 가문이다. 대본 18편 55행에서 6개 가문의 이름을 확인했고, 그 여섯이 독립 가담 가문이다(작가 확인). 남은 7개는 미정.","image":"resource/wiki/대가문.png","imageCaption":"대가문의 문장","summary":[["소속","[[연방]]"],["성격","기성 권력층"],["기원","중부의 소국과 귀족 공동체"],["가문 수","13개 — 이름 확인은 6개"],["북부 3가문","[[스프링필드]] · [[콩코드]] · [[하트퍼드]]"],["그 외 확인된 가문","[[도버]] · [[윌밍턴]] · [[밀퍼드]]"],["의회 진출","대부분 [[자치파]]"],["산하 무력","[[보안관]]"],["가문 간 관계","천차만별"],["표어","품위, 엄숙함, 교양"]],"content":"# 대가문\n\n```틀\n연방\n```\n\n기존 대륙 중부에 위치해있던 소국들과 귀족 공동체들로 구성된 기성 권력층. 대부분 ‘자치파 의원’으로 의회에 진출해있으나, 의회에서 활동하지 않는 대가문 유력자들도 상당수 존재한다. 13개의 대가문이 존재하며, 각 대가문들끼리의 관계도 천차만별인 점이 특징이다.\n\n```표어\n품위, 엄숙함, 교양\n```\n\n## 알려진 가문\n\n13개 중 6개의 이름이 확인된다. 18편에서 [[데이비스]]가 독립 선언문을 읽으며 여섯 가문을 한 줄로 부르는데, 이 여섯이 곧 **독립에 가담한 가문들**이다.\n\n```대사\n콩코드, 하트퍼드, [스프링필드]! 그리고 도버, 윌밍턴, 밀퍼드 가문의 인민들은!!\n— 데이비스, 18편 독립 선언\n```\n\n- **북부 3가문** — [[스프링필드]] · [[콩코드]] · [[하트퍼드]]. 북부 지역의 실질적인 지배세력이다.\n- **그 외** — [[도버]] · [[윌밍턴]] · [[밀퍼드]]\n\n나머지 7개 가문은 이름이 정해지지 않았고, 독립에 가담하지 않은 쪽이다.\n\n## 이름\n\n확인된 여섯 가문이 모두 **미국 동부의 실재 도시**이며, 그중 넷이 주도(州都)다.\n\n| 가문 | 실제 |\n|---|---|\n| [[스프링필드]] | Springfield · 일리노이 주도 |\n| [[콩코드]] | Concord · 뉴햄프셔 주도 |\n| [[하트퍼드]] | Hartford · 코네티컷 주도 |\n| [[도버]] | Dover · 델라웨어 주도 |\n| [[윌밍턴]] | Wilmington · 델라웨어 |\n| [[밀퍼드]] | Milford · 코네티컷 · 델라웨어 |\n\n**주도 이름이 많은 것이 이 세력의 성격과 맞는다.** 원래 소국이었다가 '주'로 편입된 집단이기 때문이다. 미정인 7개 가문의 이름을 지을 때 이 계열을 이어가면 된다.\n\n## 북부 대가문의 계보\n\n[[북방주]]에는 병합한 쾨벤하운 왕국의 영토가 편입되어 있는데, 그곳의 대가문은 쾨벤하운 시절의 귀족이 아니다. **중부에서 옮겨간 가문들**이다. 서부개척시대에 서부로 건너간 이들과 비슷한 위치라고 보면 된다.\n\n**그래서 북부에서는 가문의 장악력이 특히 세다.** 편입된 땅에는 맞설 토착 권력이 남지 않았고, 그 빈자리를 옮겨온 가문들이 채웠다.\n\n병합 당시 쾨벤하운 왕가는 명목상 연방의 ‘대가문’으로 위치할 수 있었으나 얼마 지나지 않아 모두 종적을 감추었고, 남은 쾨벤하운 귀족들은 종적을 감추거나 일반적인 연방 국민으로 살아간다.\n\n## 주별 배분\n\n13개 가문이 [[수도주]]에 하나, 나머지 네 주에 각각 셋씩 나뉜다. **수도주만 하나라는 점이 그 주의 성격을 말해 준다** — 중앙 기구가 모인 곳이라 가문의 힘이 가장 약하다. → [[연방의 지리]]\n\n## 힘이 미치는 범위\n\n**대가문의 힘은 그 지역 안에서만 강하다.** 영지 안에서는 강력한 이권을 가지고 [[보안관]]으로 치안까지 쥐지만, 가문의 영역을 벗어나면 평민과 크게 차이를 느낄 수 없다. → [[연방의 문화]]\n\n그래서 [[네빌]]처럼 가문을 등지고 [[수도주]]로 가서 관청 비서가 되는 길이 열려 있고, 동시에 그 선택은 가문 사람에게 특권을 스스로 버리는 일이 된다.\n\n**교육은 갈린다.** 대가문 자제는 일반적으로 고등교육을 받고, 평민은 대부분 기초교육만 받은 뒤 단순 노동자로 진로가 정해진다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]] · [[자치파]]\n- [[보안관]] — 대가문 산하의 치안조직\n- [[명백한 운명]] — 내전에서 분쇄된 대가문들의 잔존 세력\n\n## 여담\n\n**연방 안의 또 하나의 국가들이다.** 원래 소국이었던 집단이 '주'로 편입되면서 자치권과 각자의 철도 체계를 인정받았다. 그래서 대가문은 자기 영지에 자기 철도와 자기 무력([[보안관]])을 가진다. [[연방]]이 궤간을 통일하지 못하는 이유도, [[경찰청]]과 [[보안관]]이 관할을 다투는 이유도 여기서 나온다.\n\n**의회 밖의 유력자가 중요하다.** \"의회에서 활동하지 않는 대가문 유력자들도 상당수 존재한다\"는 한 줄이 서사에서 큰 자리를 차지한다. 가주와 보안관은 의원이 아니면서 지역을 실질적으로 지배한다.\n\n**미정 7개.** 확인된 여섯 이름(스프링필드 · 콩코드 · 하트퍼드 · 도버 · 윌밍턴 · 밀퍼드)이 모두 미국 동부의 실재 도시명 계열이다. 나머지를 지을 때 참고할 수 있다.\n\n**13개 가문이 6 대 7로 갈렸다**. 독립 선언에서 불린 여섯이 가담한 쪽이고, 남은 일곱이 연방에 남은 쪽이다. 이름이 확인된 가문이 전부 독립파라는 뜻이며, 뒤집어 말하면 **연방에 남은 일곱 가문은 아직 아무 이름도 없다.** [[미트로프 내전]]에서 독립파가 분쇄되므로, 그 뒤 연방의 대가문 층은 이 일곱만 남는다. 이름을 지을 때 그쪽이 더 중요할 수 있다.\n\n**도버는 보안관 이름으로도 확인된다.** 9편에서 [[필립]]이 \"나 민원인 아니고 도버 가 보안관이요\"라 말하며 동방주 경찰 무장해제를 집행한다. 즉 도버는 동방주 쪽 가문으로 보인다.","parentId":"federation"},{"title":"드레드 분지","id":"dread-basin","type":"지역","folder":"02_지역","sortOrder":190,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["신성제국","지리","호수","카시마르"],"memo":"원문 §1 신성제국 여러 절에서 지리 서술만 모은 문서다. 작가 답변(2026-07-31) — 드레드 분지 호수는 카시마르의 지상 유출지 두 곳 중 하나다. 인공 섬 수도는 고유 명칭 없이 '수도성'으로 불렸고, 육지로 옮긴 수도의 이름으로는 '카스티요'가 제안되었다(잠정).","image":"resource/wiki/드레드 분지.png","imageCaption":"드레드 분지와 호수","summary":[["위치","대륙 동부 — 호수를 품은 분지"],["이름의 유래","'드레드'(Dread) — [[대악몽]] 이후"],["호수","[[카시마르]] 지상 유출지"],["바다","호수가 바다와 직접 이어진다"],["물길","네 갈래 — 북 · 서 · 남 · 동"],["옛 수도","'수도성' — 선박을 엮은 인공 섬"],["현 수도","카스티요 (잠정)"],["경계","강과 산맥 — [[연방]] 쪽과 갈린다"]],"content":"# 드레드 분지\n\n```틀\n신성제국\n```\n\n[[신성제국]]의 국토. 호수로 이어지는 분지 지형이며, 이 나라의 역사가 전부 이 안에서 벌어졌다.\n\n## 호수\n\n분지 가운데에 호수가 있다. **[[카시마르]]가 지상으로 새어나오는 두 곳 중 하나다.**\n\n이 호수 하나에 이 나라의 모든 사건이 겹쳐 있다.\n\n| 시대 | 이 호수에서 |\n|---|---|\n| 고대 | 바실리아 공동체가 그 옆에서 [[대악몽]]으로 멸망했다 |\n| 중세 | 잔존 [[카시마르]] 소탕 — [[레콩키스타]] |\n| 근대 | 왕국이 선박을 엮은 인공 섬으로 수도를 옮겨 호수 한가운데에 띄웠다 |\n| 근대 | [[하얀 일요일]]로 그 수도와 황가가 호수 바닥으로 침몰했다 |\n\n## 수도\n\n- **수도성** — 선박을 엮어 만든 인공 섬 수도. 고유 명칭은 따로 없었고 그저 '수도성'이라 불렸다. [[하얀 일요일]] 때 호수 바닥으로 가라앉았다.\n- **카스티요** — 2차 전쟁 승리 후 육지로 옮긴 수도. (잠정)\n\n## 물길과 경계\n\n분지 밖으로 이어지는 강줄기가 **네 갈래**다. 북쪽은 구 [[크레스티아 제국]] 영토로, 서쪽은 대륙 중부의 강줄기([[연방]] 쪽)로, 남쪽은 남부 군도로, 동쪽은 **바다**로 이어진다. 왕국이 배로 외부와 무역하고 분지 내부의 운송을 처리한 통로이며, 2차 전쟁에서 **공포의 함대**가 이 물길을 따라 대륙 중부까지 진군했다.\n\n**호수가 바다와 직접 이어진다.** 그런데도 이 나라에 '바다를 향하는 항구도시'라는 개념은 없다 — [[바다]] 자체가 닫힌 곳이기 때문이다. → [[신성제국의 지리]]\n\n[[연방]] 쪽과는 **강과 산맥으로 갈려** 접점이 적다. 연방이 [[크레스티아 제국]]을 먼저 목표로 삼은 이유 중 하나가 이 지형이었다.\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 역사]]\n- [[카시마르]] · [[대악몽]] · [[레콩키스타]] · [[하얀 일요일]]\n- [[황립 조선소]] · [[잔존 함대]]\n- [[그렌빌리아 대륙]]\n\n## 여담\n\n**분지라는 지형이 이 나라의 성격을 정했다.** 사방이 막혀 있어 [[레콩키스타]]의 \"분지에서 나가지 않는다\"는 조건이 실제로 지켜질 수 있었고, [[크레스티아 제국]]의 침공 때도 호수 한가운데로 물러날 자리가 있었다. 고립이 선택이자 조건이었다.\n\n**[[연방]]과 정반대의 물 사용이다.** 이 나라는 호수와 강줄기를 국가의 축으로 삼아 수도까지 물 위에 올렸고, [[연방]]은 강을 철로의 방해물로 취급해 수운을 발달시키지 않았다. 같은 대륙에서 물과 선로가 완전히 갈렸다.","parentId":"holy-empire"},{"title":"로디니아 대륙","id":"rodinia","type":"지역","folder":"02_지역","sortOrder":1,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["대륙","Vol.1","로디니아","천하","삼국"],"memo":"이 대륙의 국가 문서는 제목을 한자로 쓰고 나라 국(國)자를 포함한다(원고 1097행). 대륙 전체의 모티브는 삼국지연의이고, 무협은 비주얼만 가져온 것이라 그 장르의 문파 설정은 쓰지 않는다. 원문 1094~1160행에는 대륙 머리글 세 줄과 삼국의 개요만 있고 「짤막한 역사」는 세 나라 모두 비어 있다. 2026-08-04 작가 설명으로 확정된 것 — (1) 이 대륙은 '천하'라는 고유 체제로 굴러가며, 천하는 국제기구가 아니라 삼국이 공유하는 질서관이다. 삼국은 명목상 그 아래의 군벌이고 온전한 주권이 없다. 돌아가며 천자를 배출하지만 그 구조가 불균형하며, 서사 시점에는 천자를 배출한 막부가 체제를 뒤집으려다 저지되고 황국이 천자를 독점한다. 서사 시점은 2차 세계대전기 동아시아를 참고했고 정치적으로는 십상시의 난에 가깝다. (2) 지정학은 동아시아를 삼국지 틀에 끼운 것이다 — 황국=중국(베이징)=위, 백국=한국(서울)=촉, 홍국=일본(도쿄)=오. (3) 대륙 전체가 산지 중심이며 무협 비주얼의 영향이다. (4) 카시마르가 없다. 기의 남용으로 주화입마에 빠져 키메라 같은 존재가 되는 쪽이며 그 이름은 아직 구상 단계다. (5) 기는 잘 정련된 노에시스, 무공은 체계화된 노에마다. (6) 포화도는 그렌빌리아(70)보다 높고 그래서 화기가 성립하지 않는다. (7) 이 대륙은 신대륙이며 그렌빌리아·판노티아도 같다. 포화도 순서는 로디니아 > 그렌빌리아(70) > 판노티아다. 확인되지 않은 것 — 포화도 수치, 십이지 중 뱀·말·양의 배정, 종족 간 관계, 종교, 바다와의 관계, 삼국의 역사, 천하 밖 유목민 집단의 정체.","image":"resource/wiki/로디니아 대륙.png","imageCaption":"천하 전도","summary":[["권","Vol.1"],["주제","사랑"],["구분","신대륙"],["모티브","삼국지연의"],["노에시스 포화도","세 대륙 중 가장 높다"],["병기","냉병기만"],["국가","천하 아래의 삼국(三國)"],["종족","십이지 · 그 밖의 동물"],["특이사항","삼국에 온전한 주권이 없다"]],"content":"# 로디니아 대륙\n\nVol.1의 무대 셋 중 하나. 주제는 **사랑**이다. **화약이 성립하지 않고, 나라들이 저마다 주권을 갖지 않는 대륙이다.**\n\n```상세\n큰 그림\n그렌빌리아 대륙\n```\n\n## 천하\n\n이 대륙에는 나라 위에 **'천하'**가 있다.\n\n천하는 국가도 기구도 아니다. 삼국이 함께 인정하는 **질서 그 자체**이며, 그래서 이 이름으로 불린다. 삼국은 그 아래의 **군벌**로 취급되므로 어느 나라도 온전한 주권을 갖지 못한다.\n\n그 질서의 정점이 **천자**다. 삼국 위에 따로 놓인 자리이며, 한 왕조가 물려받는 것이 아니라 **삼국이 번갈아 배출한다.** 어느 나라도 천하를 가질 수 없고 잠시 대리할 뿐이라는 형태다.\n\n**문제는 그 순번이 고르지 않다는 데 있다.** 서사 시점에는 천자를 낸 막부가 체제 자체를 뒤집으려다 저지되었고, 그 실패의 대가로 **황국이 천자를 독점**하게 되었다. 돌아가야 할 자리가 한 나라에 고정되었으므로, 모두의 질서였던 천하가 황국의 다른 이름이 된다.\n\n이 질서의 위에는 **하늘**이 있다. 이 대륙의 신은 활동하지도 잠들지도 않고 관조하기만 하며, 그 신의 자리를 삼국이 아래에서 대리하는 구조다. → [[판노티아 대륙]]\n\n## 삼국\n\n| 국가 | 다른 이름 | 체제 | 핵심 키워드 | 천하에서의 자리 |\n|---|---|---|---|---|\n| **黃國** 황(黃)국 | 노을 제국 · 키이로국 | 제정 | 전통 · 패권 · 질서 | 가장 거대한 대국. 질서의 중심이면서 **외부의 침략을 직접 받는다** |\n| **紅國** 아카무라 막부 | 홍(紅)국 · 태양 막부 | 군정 | 문화 · 명예 · 예술 | 가장 강력한 무력. 스스로 힘을 제한하는 대신 **바다로 천하를 벗어나려 한다** |\n| **白國** 하얀 공화국 | 백(白)국 · 시로국 | 공화정 | 발전 · 군사 · 의료 | 가장 작은 규모. 여러 이점을 살려 **버텨온 강소 세력** |\n\n## 지리\n\n**대륙 전체가 산지다.** 깎아지른 산맥과 협곡, 절벽, 고원이 기본 지형이고, 삼국의 땅은 그 사이에 들어앉아 있다. 트인 땅이 드물다는 점이 이 대륙의 많은 것을 정한다 — 대군을 굴리기 어렵고, 선로를 깔 수 없고, 길목 하나가 나라의 목숨줄이 된다.\n\n| | 黃國 | 白國 | 紅國 |\n|---|---|---|---|\n| 지형 | 광활한 북부 영토, 기름진 땅 | **강** — 강이 많아 삼각주에 가깝다 | **가장 넓은 평야**, 바다와 맞닿았다 |\n| 형태 | 대륙 북부를 통째로 | 대륙에 붙어 있다 | 거대한 본섬과 네 개의 섬 |\n| 그 결과 | **장성** | 물길로 버틴다 | 해상 기술이 발달했다 |\n\n**세 나라가 각각 다른 방식으로 산을 벗어났다.** 황국은 북쪽의 트인 땅을 차지해 가장 커졌고, 白國은 강이 모여드는 자리를 잡아 물길로 버티고, 紅國은 바다로 나갔다. 산이 셋의 성격을 갈라놓았다.\n\n**황국의 장성.** 북쪽에서 내려오는 **유목민 집단**을 막기 위해 쌓은 것이다. 트인 땅을 얻은 대가가 그쪽으로 열려 있다는 것이었으므로, 천하 질서의 중심에 앉은 나라가 동시에 외부 침략의 최전선이 된다.\n\n**紅國은 섬나라이면서 대륙에 속한다.** 본섬과 네 섬으로 이루어졌으나 대륙에 아주 가깝게 붙어 있어 이 대륙의 일부로 헤아려진다. 바다로 나가려는 지향과 대륙 안에 묶여 있는 처지가 이 형태에서 겹친다.\n\n## 종족\n\n인류가 하나가 아니다. 각국에 지배계층을 포함한 **주요 종족**과 **소수 종족**이 따로 있다.\n\n| 국가 | 지배계층 | 그 외 주요 종족 | 소수 종족 |\n|---|---|---|---|\n| 黃國 | **용** | 돼지 · 닭 | 여우 · 늑대 · 사슴 |\n| 紅國 | **개** | 원숭이 · 쥐 | 여우 · 고양이 · 사슴 |\n| 白國 | **호랑이** | 토끼 · 소 | 여우 · 고양이 · 늑대 |\n\n지배계층은 세 나라가 각각 다르고, **소수 종족은 셋이 겹친다.** 여우는 세 나라 모두에서 소수이므로 어디에도 자기 나라를 갖지 못하며, 늑대와 사슴과 고양이도 각각 두 나라에 걸쳐 소수로 존재한다. 국경이 종족을 가르지 않고, 어느 나라에 있어도 소수인 이들이 대륙 전체에 흩어져 있는 구조다.\n\n## 기와 무공\n\n이 대륙은 [[노에시스]]를 **다듬어 놓았다.** 다른 이름을 붙인 것이 아니라 다른 상태로 만들어 부르는 것이다.\n\n| 이곳의 이름 | 정체 |\n|---|---|\n| **기**(氣) | 잘 **정련된** [[노에시스]] |\n| **무공** | **체계화된** [[노에마]] |\n\n정련된 기는 **몸 안에서 돌린다.** 호흡과 자세로 흐름을 잡는 수련이 그 방법이며, 힘의 크기가 타고난 분비량이 아니라 **얼마나 오래 다듬었는지**에 달린다. 다른 대륙에도 노에마를 쓰는 이들이 있지만, 노에시스를 정련하는 법과 그것을 가르치는 체계가 있는 곳은 여기뿐이다.\n\n**다만 그 체계를 쥔 문파 같은 조직은 없다.** 무공은 국가와 종족의 층위에서 다뤄지므로, 개인이 스승을 찾아 유파에 드는 것이 아니라 어느 나라의 어느 종족으로 태어났는지가 먼저 온다.\n\n## 과포화되면 키메라가 된다\n\n노에시스가 과포화된 환경에 오래 노출되면 사람이 변한다. **무엇이 되는지는 그 사람이 노에시스를 어떻게 다뤄왔는지에 따라 갈린다.**\n\n**다룰 줄 알기 때문에 무너지는 방식이 정해져 있다.** 몸 안에서 기를 돌려온 자가 감당할 수 없는 양을 만나면 그 흐름의 **통제를 잃는다.** 이것을 **주화입마**라 하며, 기를 남용하거나 몸을 걸고 실험하는 것도 같은 문에 닿는다.\n\n그 끝에 남는 것이 **키메라**다. 신체가 제멋대로 뒤틀려 원래 형태를 알아볼 수 없게 된 존재이며, 사람만 그렇게 되는 것이 아니라 **자연의 동물들까지** 그 상태에 빠진다.\n\n[[그렌빌리아 대륙]] 사람은 같은 환경에서 다른 것이 된다. 정련하는 법이 없는 대신 **소망**이 강한 이들이므로, 통제를 잃는 것이 아니라 스며들어 **반쯤 [[카시마르]]가 된다.** 다룰 줄 아는 대륙은 폭주하고, 다룰 줄 모르는 대륙은 침식된다.\n\n- **[[카시마르]]는 이 대륙에 없다.** 그 존재는 [[대악몽]]이 [[그렌빌리아 대륙]] 지층에 남긴 것이다.\n- **[[노모스]] 대유행도 벌어지지 않는다.** 그것 역시 그렌빌리아만의 일이다.\n- 이 존재들을 묶는 총칭은 아직 없다. 키메라라는 이름도 확정된 것이 아니다.\n\n## 냉병기의 대륙\n\n[[폭발과 연소]]의 억제 강도는 그 대륙의 [[노에시스]] 포화도를 규칙적으로 따라간다. 이 대륙의 포화도는 **세 대륙 중 가장 높으므로** 억제도 가장 강하다.\n\n그래서 **이곳에서는 화기가 쓰이지 않고 냉병기만 쓰인다.** 그렌빌리아에서 제한적으로나마 가능한 흑색화약의 폭연과 대형 화포조차 여기서는 성립하지 않는다.\n\n지형까지 겹친다. 산지와 협곡이 중심인 땅에는 선로를 깔 수 없으므로, 철도가 국토의 뼈대인 [[그렌빌리아 대륙]]과 이동 방식 자체가 다르다. **화기도 철도도 없는 대륙에서 무공이 체계로 발달한 것이 그 자리를 메운다.**\n\n## 주제 — 사랑\n\n세 나라의 관계가 **정복이 아니라 균형**으로 짜여 있다는 점이 이 대륙의 주제와 이어진다 (독자의 읽기).\n\n가장 큰 나라가 질서의 중심을 맡고, **무력이 가장 강한 나라는 스스로 힘을 제한한다.** [[그렌빌리아 대륙]]의 열강들이 서로를 흡수하려 들다 [[연말 위기]]에 이른 것과 정반대다. → [[큰 그림]]\n\n## 대륙 간 관계\n\n**서사 시점까지 다른 대륙과의 접촉은 없다.** [[바다]]가 대륙 사이를 막고 있다.\n\n**접촉은 국가들이 붕괴한 뒤에 생긴다.** 위키 기준 현재에 이 대륙과 [[그렌빌리아 대륙]] · [[판노티아 대륙]]이 **'대륙 연합'**을 이룬다. → [[바다]]\n\n## 이름\n\n**로디니아**(Rodinia) — 실제로 존재했던 초대륙의 이름이다. [[그렌빌리아 대륙]]의 이름이 된 그렌빌 조산운동이 만들어낸 초대륙이 바로 이것이므로, 두 대륙의 이름은 원래 한 쌍이다.\n\n국명 계열은 **동아시아**다. 세 나라의 이름이 한자 색(黃 · 紅 · 白)이고, 각각의 별칭이 일본어 색 이름과 겹친다 — 키이로(黄色) · 아카(赤) · 시로(白).\n\n## 관련 문서\n\n- [[큰 그림]] · [[그렌빌리아 대륙]] · [[판노티아 대륙]] · [[판게아 대륙]]\n- [[노에시스]] · [[노에마]] · [[폭발과 연소]] · [[노모스]] · [[카시마르]]\n- [[바다]] · [[세계관 대문]]\n\n## 여담\n\n**천하가 무너지는 방식이 [[연방]]과 닮았다** (독자의 읽기). 한쪽에서는 개전을 막으려던 [[통일파]]의 쿠데타가 성공하고 그 대가로 나라가 비무장국이 되었고, 이쪽에서는 막부가 체제를 뒤집으려다 저지되고 그 결과 황국이 천자를 독점하게 되었다. 둘 다 **한 세력의 무리한 시도가 저지되면서 질서가 한쪽으로 쏠린** 형태다.\n\n**'천하'와 '천자'가 그 하늘을 가리킨다** (독자의 읽기). 이 대륙의 신은 하늘로서 관조하고, 이 대륙의 질서관은 **천하**(天下)이고, 그 주권자는 **천자**(天子)다. 삼국이 공유하는 질서의 이름이 곧 그 신의 자리이며, 신이 활동하지 않으므로 그 아래를 삼국이 돌아가며 대리하는 구조가 된다.\n\n**천하 밖에 세력이 있다.** 황국이 장성을 쌓아 막는 유목민 집단이다. [[그렌빌리아 대륙]]에서 대륙 밖의 위협은 [[카시마르]]와 [[바다]]뿐이고 그 둘 다 사람이 아닌데, 이 대륙에는 **사람인 외부**가 있다.\n\n**십이지 중 셋이 비어 있다.** 뱀 · 말 · 양이 어느 나라에도 배정되지 않았다. 천하 밖 유목민이 종족을 가진다면 그 자리일 것으로 추정된다.\n\n**소수 종족은 십이지에 들지 못한 동물들이다** (독자의 읽기). 지배계층과 주요 종족이 전부 십이지다 — 용 · 돼지 · 닭 · 개 · 원숭이 · 쥐 · 호랑이 · 토끼 · 소. 그런데 소수 종족으로 적힌 **여우 · 고양이 · 늑대 · 사슴은 십이지에 없다.**\n\n그리고 **고양이가 쥐에게 속아 십이지에 들지 못했다는 설화**가 있는데, 이 대륙에서 **쥐가 주요 종족인 紅國에 고양이가 소수 종족으로 들어가 있다.** 설화의 구도가 그대로 국가 구성이 된 형태다.\n\n**紅國의 바다가 대륙 연합으로 이어질 자리다** (추정). 붕괴 이후 세 대륙이 대륙 연합을 이루고 달을 계산해 항해하는데, 이 대륙에서 이미 **바다로 나가려던 나라**가 여기다. 해상 기술이 발달한 이유도 그 지향에 있다.\n\n**국명 표기가 셋 다 다르다.** 黃國은 한자 독음(황국), 白國은 우리말 번역(하얀 공화국), 紅國만 고유 명칭(아카무라 막부)이 앞에 온다. 원고의 표기를 그대로 옮긴 것이다.\n\n**아직 알려지지 않은 것.** 포화도의 정확한 수치, 삼국의 역사, 종족 간 관계, 종교, 바다와의 관계, 천자를 배출하는 구체적인 절차, 그리고 천하 밖 유목민 집단의 정체.","parentId":null},{"title":"명백한 운명","id":"manifest-destiny","type":"세력","folder":"02_지역","sortOrder":200,"era":"현대(붕괴 이후)","canon":"확정","status":"작성 중","tags":["연방","음지","테러조직","붕괴 이후"],"memo":"원문 338~343행 문장 그대로. 작가 확인(2026-07-31)으로 시점이 정해졌다 — 미트로프 내전은 《가문과 가족》 후반부의 무력 충돌이고, 이 조직은 그 이후에 결성된다. 8편에서 데이비스가 쓰는 '명백한 운명'은 조직명이 아니라 관용구이며, 그를 잇겠다는 자들이 뒤에 그 말을 상징으로 채택한 것이다.","image":"resource/wiki/명백한 운명.png","imageCaption":"명백한 운명의 표식","summary":[["원어","Manifest Destiny"],["성격","거대한 테러조직"],["결성 계기","[[미트로프 내전]] 이후"],["구성","잔존 세력"],["전력의 축","독립파 [[헌병대]] · [[보안관]]"],["목표","[[연방]]의 붕괴와 구성세력의 독립"],["동기","내전 패배의 보복"],["세력 확장","사설 철도로 북부 [[컴퍼니]]까지"],["이름의 유래","[[데이비스]]의 말"]],"content":"# 명백한 운명 🗡️\n\n**Manifest Destiny**\n\n‘미트로프 내전’으로 독립파에 가담한 대가문들이 분쇄된 이후, 그 잔존 세력들이 뭉쳐서 형성된 거대한 테러조직.\n\n내전에서 패배하게 되며 연방측을 향한 보복심리를 드러내며, 대가문들과 연방 구성세력들의 독립, 곧 ‘연방의 붕괴’를 ‘명백한 운명’으로 규정하며 최종적인 목표로 삼아 활동하고 있다.\n\n주로 독립파에 가담했던 헌병, 보안관을 중심으로 전력이 형성되어 있으며. 연방의 행정력이 크게 약화된 틈을 타 사설 철도를 북부 컴퍼니로 지속적으로 확장해나가며 세를 불리고 있다.\n\n## 이름\n\n**Manifest Destiny** — 19세기 미국의 팽창주의 표어를 그대로 가져왔다. 본래 \"미국이 대륙 전체로 뻗어나가는 것은 명백히 정해진 운명이다\"라는 뜻이었다.\n\n작품에서는 **뜻이 뒤집혀 쓰인다.** 팽창이 아니라 **해체**가 명백한 운명이라는 것이다 — [[대가문]]과 연방 구성세력의 독립, 곧 연방의 붕괴가 정해진 결말이라는 주장이다. [[연방]]의 다른 이름들(Founding Fathers, 미국 동부 도시명)이 건국 쪽에서 왔는데, 이 조직만 같은 우물에서 해체의 명분을 퍼올린다.\n\n조직명이 [[데이비스]]가 쓴 말에서 온 것도 같은 구조다. 서사 안에서 그 표현은 그저 관용구였고, 그가 조직을 만든 것도 아니다. 뒤에 그를 잇겠다고 하는 자들이 상징으로 채택했다.\n\n## 관련 문서\n\n- [[연방]] — 붕괴시키려는 대상\n- [[미트로프 내전]] — 결성의 계기\n- [[데이비스]] · [[자치파]] · [[북부동맹]] — 계보상의 앞자리\n- [[헌병대]] · [[보안관]] — 전력의 출처\n- [[컴퍼니]] — 사설 철도를 뻗는 방향\n- [[잭슨의 형제단]] — 자주 충돌하는 상대\n\n## 여담\n\n**시대가 '현대(붕괴 이후)'인 이유.** 결성 계기인 [[미트로프 내전]]이 《가문과 가족》 후반부이고, 조직 설명이 \"연방의 행정력이 크게 약화된 틈을 타\"를 전제한다. [[연방]] 문서 본체가 서사 시점인 것과 달리 이 문서만 시대가 뒤로 밀리는 이유다.\n\n**독립파의 무력이 그대로 넘어왔다.** 전력의 축이 [[헌병대]]와 [[보안관]]이다. 보안관은 대가문에 직접 소속된 무력이니 대가문이 등지면 함께 등지고, 헌병은 연방의 유일한 초자연 전력이다. 즉 연방을 지키던 두 무력이 연방을 무너뜨리는 쪽에 서 있다.\n\n**연방의 방식으로 연방을 무너뜨린다.** 목표는 연방의 붕괴인데 수단이 철도다. 사설 철도를 북부 [[컴퍼니]]로 뻗어 세를 불리는 방식은, [[건국의 아버지들]]이 철도로 소국들을 규합해 연방을 만든 것과 정확히 같은 수순이다.","parentId":"federation"},{"title":"보안관","id":"sheriffs","type":"세력","folder":"02_지역","sortOrder":90,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","치안","무력","대가문"],"memo":"원문 322~323행 문장 그대로.","image":"resource/wiki/보안관.png","imageCaption":"보안관의 복장과 표식","summary":[["소속","[[대가문]] 산하"],["성격","지역 치안조직"],["운영 형태","지역별로 소수가 활동"],["소속 관계","각 대가문에 직접 소속"],["마찰","[[경찰청]]과 관할 분쟁"],["협력","허가 경찰과 협력 다수"],["정치적 통로","[[자치파]]"]],"content":"# 보안관 🗡️\n\n대가문 산하의 치안조직. 지역별로 소수의 보안관이 활동하는 형태로 운영되고 있으며, 경찰과 달리 각 대가문들에 직접 소속되어 있는 경우만 존재한다. 경찰들과의 치안 관할 분쟁으로 자주 충돌하는 편이지만, ‘허가 경찰’의 경우 경찰대에 따라 보안관과 협력하는 경우도 다수 제보되고 있는 편이다.\n\n## 관할 다툼의 실제\n\n9편에서 [[도버]] 가의 보안관 [[필립]]이 심야 조례를 앞세워 동방주 경찰의 무장해제를 현장에서 집행한다. 경찰이 법적 관할을 따지자 보안관의 대답은 이랬다.\n\n```대사\n관할이고 뭐고.\n— 필립, 9편\n```\n\n법조문보다 그 땅을 실제로 쥔 쪽이 앞선다는 태도이며, 이 편의 다른 장면에서는 \"여기서는 법보다 더 가까운 게 있는 거야\"라는 말도 나온다. 관할 분쟁이 법리 문제가 아니라 실효 지배 문제라는 뜻이다.\n\n**그렇게 될 수밖에 없는 구조다.** [[연말 위기]]로 사법부가 사라진 뒤 재판 기능이 보안관과 [[경찰청]]에 애매하게 승계되었고, 위에서 판정해 줄 기관이 없다. 관할을 정하는 것이 곧 법을 정하는 것이 된다. → [[연방의 정치]]\n\n**[[대가문]]의 힘은 그 지역 안에서만 통한다.** 보안관이 강한 것도 영지 안에서이며, 가문의 영역을 벗어나면 평민과 크게 다르지 않다. 보안관이 지역별 소수로만 운영되는 것과 맞물린다. → [[연방의 문화]]\n\n## 관련 문서\n\n- [[연방]] · [[대가문]] · [[자치파]]\n- [[필립]] · [[레밍턴]] — 대본에 등장하는 보안관\n- [[도버]] · [[스프링필드]]\n- [[경찰청]] — 관할을 다투는 상대\n- [[기동대]] — 인력을 제공하는 곳\n- [[명백한 운명]] — 독립파에 가담한 보안관들이 전력의 축을 이룬다\n\n## 여담\n\n**경찰과 정반대의 구조다.** [[경찰청]]이 파출소를 잔뜩 깔아 양으로 버티는 반면, 보안관은 지역별로 소수만 활동하고 전원이 대가문에 직접 소속된다. 허가 경찰 같은 회색지대가 없다. 그래서 개별 보안관의 위상과 역량이 경찰 한 명보다 훨씬 높다.\n\n**관할 다툼이 곧 국체 문제다.** 연방의 중앙 기구인 경찰과 대가문의 사병인 보안관이 같은 땅에서 치안을 다툰다. 어느 쪽이 그 지역을 실질적으로 지배하는지를 매번 현장에서 정하는 셈이고, 그것이 [[통합파]]와 [[자치파]]의 대립을 현장 층위에서 반복한다.\n\n**붕괴기의 전력이 된다.** [[명백한 운명]]이 독립파에 가담했던 헌병과 보안관을 중심으로 전력을 꾸린다. 대가문에 직접 소속된 무력이라, 대가문이 연방을 등지면 그대로 반연방 전력이 된다.","parentId":"federation"},{"title":"북방주","id":"north-state","type":"지역","folder":"02_지역","sortOrder":310,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","행정구역","북방주","쾨벤하운"],"memo":"원고에 지역 항목이 없어 대본과 배경 에셋에서 만든 문서다. 등록 배경에 '전쟁 중' 변형(북방주_골목_전쟁_중 · 북방주_대로변_전쟁_중)이 있어 미트로프 내전의 전장임을 확인했다. 북부 대가문이 중부에서 옮겨간 가문이라는 것은 작가 확인(2026-07-31).","image":"resource/wiki/북방주.png","imageCaption":"북방주 대로변","summary":[["소속","[[연방]]"],["구성","쾨벤하운 왕국 영토가 편입된 주"],["지배 세력","[[스프링필드]] · [[콩코드]] · [[하트퍼드]]"],["정치 기반","[[자치파]]"],["치안","[[보안관]]"],["등록 배경","10장 (+ 저택 7장)"],["훗날","[[북부동맹]] 독립 선언 → [[미트로프 내전]]"]],"content":"# 북방주\n\n```틀\n연방\n```\n\n[[연방]]의 북부. 병합한 **쾨벤하운 왕국**의 영토가 이 주로 **편입되어** 있다. 주 전체가 옛 왕국인 것은 아니다. 북부 3[[대가문]]의 지배 아래 있다.\n\n## 편입의 흔적\n\n연방의 첫 정복지가 이 주에 들어와 있다. 철도를 통한 기동 작전으로 쾨벤하운 왕국이 함락되고 통째로 병합되었으며, 그 영토가 북방주로 **편입되었다.** 왕국은 지도에서 사라졌고, 쾨벤하운 왕가는 명목상 연방의 [[대가문]]이 되었으나 얼마 지나지 않아 종적을 감추었다.\n\n**[[대가문]]이 이 주를 비교적 쉽게 장악한 이유가 여기 있다.** 편입된 땅에는 맞설 토착 권력이 남지 않았고, 그 자리를 중부에서 옮겨간 가문들이 채웠다. [[스프링필드]]·[[콩코드]]·[[하트퍼드]]가 그들이며, 서부개척시대에 서부로 건너간 이들과 비슷한 위치다. 남은 쾨벤하운 귀족들은 종적을 감추거나 평범한 연방 국민으로 살아간다.\n\n[[연말 위기]]의 최후통첩에는 \"과거 연방이 편입한 쾨벤하운 왕국을 독립시킬 것\"이 들어 있었다. 연방은 **완전한 비무장화**를 대가로 내주고 이 땅만은 지켰다.\n\n## 정치적 위치\n\n[[자치파]]의 지역 기반이다. [[대가문]]과 [[보안관]]이 실질적으로 지배하며, [[경찰청]]의 중앙 통제가 가장 약한 곳이다. 5편에서 \"북방주 관할의 경찰력은 모두 마비시켜두었어요\"라는 보고가 올라오는 것도 이 구조에서 가능하다.\n\n[[잭슨의 형제단]]이 원래부터 활동하던 곳이기도 하다. 연방 열차 강도 사건의 7할이 이 지역에서 나온다.\n\n## 장소\n\n| 장소 | 나오는 자리 |\n|---|---|\n| **[[스프링필드]] A 역 · H 역** | 1편의 도착지. [[네빌]]이 열두 번 환승해 닿는다 |\n| **[[스프링필드]] 저택** | 3편의 습격, 20편의 폐허. 길가·로비·복도 배경이 따로 등록되어 있다 |\n| **하트퍼드 저택** | 저택과 저택 앞 배경이 아침 시각으로 등록되어 있다 |\n| **매표소 · 술집 · 골목 · 대로변** | 지역의 일상 |\n\n## 전쟁\n\n등록된 배경에 **`북방주_골목_전쟁_중`과 `북방주_대로변_전쟁_중`**이 있다. [[스프링필드]] 저택 길가에도 전쟁 중 변형이 있다.\n\n이 주는 [[미트로프 내전]]의 전장이 된다. [[북부동맹]]의 독립 선언에서 불린 여섯 가문 중 셋이 이곳의 가문이고, 내전에서 독립파가 분쇄된 뒤 그 잔존 세력이 [[명백한 운명]]이 된다.\n\n## 관련 문서\n\n- [[연방]] · [[대가문]] · [[보안관]] · [[자치파]]\n- [[스프링필드]] · [[콩코드]] · [[하트퍼드]]\n- [[북부동맹]] · [[미트로프 내전]] · [[명백한 운명]]\n- [[잭슨의 형제단]]\n- [[수도주]] — 대비되는 지역 기반\n\n## 여담\n\n**정복지가 독립의 진원이 된다.** 연방이 비무장화까지 감수하며 지킨 땅이, 결국 연방에서 떨어져 나가려는 쪽의 중심이 된다. 병합 과정에서 [[철도파]]가 \"본토로 편입해 빠르게 철도망을 개발해야 한다\"며 [[통일파]]의 준주·자치주 편입론을 눌렀는데, 소화되지 않은 채 편입된 결과가 여기서 돌아온다.\n\n**아직 모르는 것.** 쾨벤하운 왕가가 \"종적을 감추었다\"는 것의 실제 의미. 그리고 위키 기준 현재의 [[쾨벤하운 인민연합]]이 이 땅에서 어떻게 다시 국가가 되는지.","parentId":"federation"},{"title":"상급기사","id":"senior-knight","type":"세력","folder":"02_지역","sortOrder":120,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","기사","무력","재단"],"memo":"원문 474~475행 문장 그대로.","image":"resource/wiki/상급기사.png","imageCaption":"상급기사","summary":[["서임","재단"],["소속","재단 직속이 다수"],["집단 명칭","기사단"],["역할","재단 간 분쟁의 대표 무력"],["생업","재단 학교 근무 · 의뢰"]],"content":"# 상급기사\n\n```틀\n신성제국\n```\n\n교단이 아닌 재단에게 기사 서임을 받은 기사. 재단에 직접 소속되어 있는 경우가 다수를 차지하나, 개별적으로 활동하는 상급기사들도 흔히 볼 수 있다. 일반적으로 이들이 모인 집단을 ‘기사단’이라고 칭하며, 재단과 재단 사이의 분쟁에서 재단이 동원할 수 있는 대표적인 무력집단이다.\n\n## 평소에 하는 일\n\n소속 재단의 **학교에서 근무**하거나, [[신성제국]] 안에서 **잡다한 의뢰**를 받는다. 재단이 곧 교육기관이므로 무력집단의 평시 업무가 교직이 되는 구조다. → [[신성제국의 문화]]\n\n## 관련 문서\n\n- [[하급기사]] · [[제국기사]] · [[성좌 기사단]] · [[편력기사]]\n- [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n- [[신성제국]]\n\n## 여담\n\n**이 나라의 실질적인 무력이다.** [[제국기사]]는 쓸 때마다 줄고 [[성좌 기사단]]은 교단에 묶여 있으므로, 실제로 분쟁을 처리하는 것은 재단들의 상급기사다. 재단 사이의 다툼이 국가의 정치가 되는 구조에서 이들이 그 다툼의 손발이 된다.\n\n**서임의 출처가 위계를 만든다.** [[교황]]이 직접 서임하면 [[제국기사]], 재단이 서임하면 상급기사, 교육기관을 졸업하면 [[하급기사]]다. 누가 서임했는지가 곧 누구에게 충성하는지가 된다.","parentId":"holy-empire"},{"title":"성좌 기사단","id":"constellation-knights","type":"세력","folder":"02_지역","sortOrder":10,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","기사","무력","교단"],"memo":"원문 470~472행 문장 그대로. 다섯 기사단의 개별 이름은 원고에 없다.","image":"resource/wiki/성좌 기사단.png","imageCaption":"성좌 기사단의 표식","summary":[["소속","[[교단]]"],["충성 대상","[[추기경]]"],["구성","토너먼트 탈락자 중 등용"],["기사단 수","5"],["성격","교단에 충성하는 기사단"]],"content":"# 성좌 기사단\n\n```틀\n신성제국\n```\n\n교황에게 충성하는 ‘제국기사’와 달리, 성좌 기사단은 교단의 ‘추기경’들에게 충성하는 이들로, 교단 토너먼트에서 탈락해 제국 기사가 되지 못했으나, 교단 차원에서 눈여겨본 인물을 직접 등용하여 구성된다.\n\n‘성좌 기사단’은 ‘교단에 충성하는 기사단’을 총칭하는 명칭이며, ‘성좌 기사단’에 속하는 신성제국 내 기사단은 총 5개가 존재한다.\n\n## 관련 문서\n\n- [[교단]] · [[추기경]] · [[제국기사]]\n- [[상급기사]]\n- [[신성제국]]\n\n## 여담\n\n**탈락자로 만든 상비군이다.** [[제국기사]]는 총량이 정해져 있고 쓰면 줄어드는데, 성좌 기사단은 그 토너먼트에서 떨어진 이들로 채워진다. 교단이 실제로 쓸 수 있는 무력은 이쪽이며, 충성이 [[교황]]이 아니라 [[추기경]]에게 향한다는 점이 중요하다.\n\n**[[교황]]이 지시를 내리는 일이 드문 나라에서, 무력을 손에 쥔 쪽은 추기경들이다** (추정). 교단이 \"추기경들을 중심으로\" 굴러간다는 서술과 맞물린다.\n\n**다섯 기사단의 이름은 알려지지 않았다.**","parentId":"curia"},{"title":"수도주","id":"capital-state","type":"지역","folder":"02_지역","sortOrder":300,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","행정구역","수도주"],"memo":"원고에 지역 항목이 없어 대본과 배경 에셋에서 만든 문서다. 이름은 대본을 따랐다 — 원고의 '중심주'가 아니라 '수도주'(대본 85건 : 원고 1건). 등록된 배경 에셋 12장으로 실제 등장 장소를 확인했다.","image":"resource/wiki/수도주.png","imageCaption":"수도주 의회 거리","summary":[["소속","[[연방]]"],["성격","연방의 수도주"],["있는 것","[[의회]] · [[경찰청]] · [[철도청]]"],["정치 기반","[[통합파]]"],["주요 장소","연방의회 건물 · 의회 거리 · 중앙역"],["등록 배경","14장"]],"content":"# 수도주\n\n```틀\n연방\n```\n\n[[연방]]의 수도가 있는 주. **연방의 중앙 기구가 모두 이곳에 있다** — [[의회]], [[경찰청]], [[철도청]].\n\n## 정치적 위치\n\n[[통합파]]의 지역 기반이다. 통합파가 [[경찰청]]·[[철도청]]이라는 중앙 기구를 통해 힘을 쓰는 것도, 그 기구들이 여기 있기 때문이다. 반대편의 [[자치파]]는 [[북방주]]·동방주를 기반으로 [[대가문]]·[[보안관]]을 쓴다.\n\n수도주는 **연방이라는 중앙 체제 그 자체가 서 있는 자리**다. 그래서 《가문과 가족》 2부에서 온 세력이 이곳으로 모이고, 의회 하나에서 판이 세 번 뒤집힌다.\n\n## 장소\n\n| 장소 | 나오는 자리 |\n|---|---|\n| **연방의회 건물** | [[의회]]의 본회의장. 군사 소집·정책 결정·법안 발의가 모두 여기서 결정된다. 11~18편의 무대 |\n| **광장** | [[헌병대]]가 나타나는 자리. 6편에서 [[세라]]가 헌병과 만난다 |\n| **의회 거리** | 아침·낮·저녁 세 시각의 배경이 따로 등록되어 있다. 의회 소집일의 흐름을 이 거리로 보여준다 |\n| **의원실** | 7편에서 [[잭]]이 텅 빈 사무실에서 발버둥을 결심하는 자리 |\n| **중앙역** | 수도주의 철도 관문 |\n| **골목 · 뒷골목 · 대로변** | 아침·낮·저녁 변형이 등록되어 있다 |\n| **누군가의 집** | 새벽 배경 한 장 |\n\n## 광장의 이야기\n\n수도주에 사는 아이들 사이에는 이런 소문이 돈다.\n\n```대사\n매년 5월, 이맘때가 되면… 새벽의 광장에서 아주 무서운 일이 벌어진다고요.\n— 세라, 6편\n```\n\n[[헌병대]]가 나타나는 자리다. 연방에서 헌병을 실제로 본 사람이 거의 없다는 설정이, 이 도시에서는 괴담의 형태로 남아 있다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[경찰청]] · [[철도청]]\n- [[통합파]]\n- [[헌병대]]\n- [[북방주]] — 대비되는 지역 기반\n\n## 여담\n\n**이름이 두 개 있었다.** 원고는 `중심주`, 대본은 `수도주`로 쓴다. 대본이 85건, 원고가 1건이므로 대본을 따랐다. → [[위키 작성 규칙]]\n\n**아직 모르는 것.** 수도 도시의 이름. 주 이름만 나오고 도시명은 대본에 등장하지 않는다. [[대가문]]의 이름이 실재 미국 동부 도시명 계열인 것과 달리, 수도는 이름 없이 '수도주'로만 불린다.","parentId":"federation"},{"title":"스프링필드","id":"springfield","type":"세력","folder":"02_지역","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["대가문","스프링필드","북방주"],"memo":"원고에는 용어 설명 한 줄뿐이었고(13개 대가문 중 하나, 북부 3대가문), 나머지는 대본에서 만들었다. 대본 언급 239건으로 전 고유명사 중 최다. 근거: 1·3·4·5·8·20편, _인물관계.md, 배경 에셋.","image":"resource/wiki/스프링필드.png","imageCaption":"스프링필드 가의 문장","summary":[["소속","[[대가문]] 13개 중 하나"],["지역","[[북방주]]"],["위치","북부 3대가문"],["가주","[[스프링필드 가주]]"],["보안관","[[레밍턴]]"],["가문 사람","[[코네트]] · [[네빌]]"],["대본 언급","239건 — 최다"],["독립 선언","가담"]],"content":"# 스프링필드\n\n[[북방주]]의 [[대가문]]. 13개 대가문 중 하나이며, [[콩코드]]·[[하트퍼드]]와 함께 북부 지역의 실질적인 지배세력이다.\n\n**《가문과 가족》에서 가장 많이 불리는 이름이다.** 대본에 239회 등장하며, 이 작품에서 '가문'이라는 말은 대개 이 가문을 가리킨다.\n\n## 이 가문에 모인 인물\n\n한 가문 안에 서사의 축이 거의 다 들어 있다.\n\n| 인물 | 위치 |\n|---|---|\n| [[스프링필드 가주]] | 가주. [[코네트]]가 '할아버지'라 부른다 |\n| [[레밍턴]] | 저택의 보안관. 아이를 지킨다 |\n| [[코네트]] | 가문의 아이. 20편의 주역 |\n| [[네빌]] | 10년 전 가문을 떠났다. 1부의 시선 |\n\n[[세라]]도 이 집에 걸려 있다 — [[코네트]]가 '세라 언니'라 부르며 위기에 먼저 연락한다.\n\n## 저택\n\n서사의 시작과 끝이 이 저택이다.\n\n- **3편** — [[하노버 용병단]]이 습격한다. [[에른스트]]가 보안관 [[레밍턴]]과 거래하며 \"땅속에서 무슨 소리가 들리든 눈감으라\" 요구한다\n- **4편** — 습격이 지나간 밤. 레밍턴이 술에 기대어 배후를 증언한다\n- **20편** — 폐허가 된 저택으로 일행이 돌아온다. [[코네트]]가 가문 열쇠를 내놓지 않는다\n\n배경 에셋에 저택의 **로비·복도·길가**가 각각 등록되어 있고, 여기에 `수리중`(3편 습격 이후)과 `전쟁 중`([[미트로프 내전]]) 변형이 더해져 일곱 장이다. 같은 장소가 **온전한 상태 → 수리 중 → 전장**으로 세 번 바뀐다.\n\n## 열쇠\n\n```대사\n할아버지가 절대… 절대 우리 가문 열쇠는 남들한테 주면 안된다고 했어요…\n— 코네트, 20편\n```\n\n[[코네트]]의 기호가 🗝️인 이유다. 가문이 무너진 뒤에도 아이가 열쇠를 쥐고 있다.\n\n## 관련 문서\n\n- [[대가문]] · [[북방주]] · [[보안관]]\n- [[스프링필드 가주]] · [[레밍턴]] · [[코네트]] · [[네빌]]\n- [[하노버 용병단]] · [[에른스트]]\n- [[북부동맹]] · [[미트로프 내전]]\n\n## 여담\n\n**작품 제목의 '가문'이 이 가문이다.** 《가문과 가족》에서 가문 쪽 무게를 스프링필드가 거의 혼자 진다. 반대편의 '가족'은 [[세라]]가 혈연 아닌 이들을 묶어 부르는 말이다. 두 낱말이 각각 한 집과 한 사람에게 대응한다.\n\n**지하가 이 저택 밑을 지난다.** 3편에서 [[에른스트]]가 요구한 것이 \"땅속에서 무슨 소리가 들리든 눈감으라\"였다. [[앤드루]]의 지하철도가 이 저택 아래를 파고 있었다는 뜻이며, 습격의 진짜 목적이 그 묵인이었다.\n\n**아직 모르는 것.** 가문의 문장·연혁·규모. 그리고 [[스프링필드 가주]]와 [[코네트]]의 부모 사이가 어떻게 되는지 — 코네트에게 할아버지만 있고 부모 이야기가 없다.","parentId":"great-houses"},{"title":"신성제국","id":"holy-empire","type":"국가","folder":"02_지역","sortOrder":100,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["신성제국","드레드노","바실리아","열강"],"memo":"원문 §1 신성제국(350~513행) 이관. 국명은 드레드노와 바실리아를 혼용하는 것으로 확정됐고 '드레드니아'는 폐기됐다. 작가 답변(2026-07-31)으로 확정된 것 — 기사 체제는 서사 시점에 유지되고 위키 기준 현재에는 종료되었다, 교황의 행방은 앞으로의 이야기에서 밝혀진다, 교황에게 이름이 있으나 아직 공개되지 않았다, 인지 조작은 서사 시점에 유효하고 현재는 무의미하며 분지 안에서 더 강하지만 '드레드노인'이라 여기면 바깥에서도 걸린다, 외부에서는 이를 인지 조작이 아니라 특이한 종교 제의로 본다, 960시간은 신성로마제국 제국기사의 동원 한도 40일 패러디, 인공 섬 수도는 고유 명칭 없이 '수도성'으로 불렸다.","image":"resource/wiki/신성제국.png","imageCaption":"신성제국의 문장","summary":[["정식 명칭","드레드노 신성제국"],["다른 이름","드레드노 · 바실리아"],["체제","신정 — 기사단국 회귀"],["위치","대륙 동부 [[드레드 분지]]"],["수도","카스티요 (잠정)"],["행정구역","카스티야령 · 그라나다령 · 아라곤령"],["기원","바실리아 공동체 → 드레드노 왕국"],["최고 권력","[[교단]] — [[교황]]과 [[추기경]]"],["법","《[[기사행전]]》 — [[누스]]"],["주요 세력","[[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]"],["무력","[[제국기사]] · [[성좌 기사단]]"],["대외 기조","단절 — 창구는 [[아라곤 협회]]"],["현재 상태","붕괴 · 기사 체제 종료"],["서사 축","[[노에시스]] 서사의 핵심"],["핵심 키워드","교육 · 기사 · 선박"]],"content":"# 신성제국\n\n드레드노 · 바실리아\n\n```틀\n신성제국\n```\n\n교육과 기사, 선박이 핵심 키워드인 신정 국가다. 대륙 동부 분지에 위치한 열강으로서, [[노에시스]] 서사의 핵심 축을 담당한다.\n\n**한 아이의 트라우마가 국가 하나를 다시 만든 나라다.**\n\n## 연혁\n\n```연혁\n고대 | 바다 민족이 동부 분지에 정착해 **바실리아 공동체**를 세운다. [[누스]]를 숭배하며 제한적으로 [[노에마]]를 쓴다\n고대 말기 | [[대악몽]]으로 바실리아와 인접 국가들이 모조리 멸망한다. 사람들이 그 땅을 '드레드'라 부르며 피한다\n중세 | 중부의 악명 높은 기사단이 분지를 차지하고, 잔존 [[카시마르]] 소탕 계약 **[[레콩키스타]]**를 맺는다. 조건은 '분지에서 나가지 않는다'\n중세 | 레콩키스타 완수. **드레드노 왕국** 성립. 배를 중심으로 발전한다\n근대 | **1차 크레스티아-드레드노 전쟁.** 수도를 선박을 엮은 인공 섬으로 만들어 호수 한가운데로 옮겨 살아남지만, 드레드 체제 동맹국을 모두 잃는다\n근대 | **눈물의 10년.** 무역권이 종속되고 분지 안까지 제국의 영향력이 미친다. 왕가는 몰래 [[연합]]과 거래해 선박을 무기화한다\n근대 | **2차 전쟁과 재정복.** 기사도를 버리고 선제공격으로 분지를 되찾아 **드레드노 제국**을 선포한다\n근대 | **[[하얀 일요일]].** 한 아이가 발현한 [[노에마]]로 제국이 마비되고, 물 위의 수도와 황가가 호수 바닥에 침몰한다\n근대 | 그 아이가 **[[교황]]**이 되어 **신성제국**을 세운다. 체제가 기사단국 시절로 회귀한다\n[[연말 위기]] | 고립주의를 접고 반 연방 세력에 합류한 뒤, 다시 분지 안으로 물러난다\n현재 | 기사 체제가 종료되었다\n```\n\n## 역사\n\n바다 민족의 동부 갈래가 세운 **바실리아 공동체**가 [[누스]]를 숭배하다 [[대악몽]]을 불러 멸망한다. 사람들이 그 땅을 '드레드'(Dread)라 부르며 피하던 것을, 중부의 기사단이 들어와 차지하고 잔존 [[카시마르]]를 소탕한다. 그 계약이 **[[레콩키스타]]**이며, 조건이 \"분지에서 나가지 않는다\"였다.\n\n이어진 **드레드노 왕국**은 배의 나라가 된다. [[크레스티아 제국]]의 침공을 수도를 호수 한가운데로 옮겨 버티지만 동맹국을 모두 잃고, **눈물의 10년** 동안 [[연합]]과 몰래 거래해 선박을 무기화한다. 2차 전쟁에서는 **기사도를 버리고** 선제공격으로 분지를 되찾아 제국을 선포한다.\n\n그리고 [[하얀 일요일]]이 모든 것을 뒤집는다.\n\n```상세\n신성제국의 역사\n하얀 일요일\n```\n\n## 개관\n\n- **[[신성제국의 역사]]** — 고대 바실리아부터 [[연말 위기]]까지\n- **[[신성제국의 지리]]** — 분지 하나, 네 갈래 강. 바다에 닿는데 항구가 없다\n- **[[신성제국의 정치]]** — 법이 문학이고 재판이 결투다. 후계가 없다\n- **[[신성제국의 문화]]** — 전 국민이 기사이고, 그 기사 대다수가 농민이다\n\n## 지금의 체제\n\n[[하얀 일요일]] 이후 이 나라는 **기사단국 시절로 회귀했다.** [[교황]]의 [[노에시스]]가 [[레콩키스타]] 시기의 기사도 문학으로 상당 부분 이루어져 있었기 때문이다.\n\n- 군부·산업가·학자 계층이 모두 **재단**으로 묶여 **기사단**을 양성한다.\n- 장정한 백성은 모두 교황에게 서임받아 **기사**가 된다.\n- 1순위 목표는 **가상으로 만들어진 [[카시마르]]** 토벌이다.\n- 분지 외부와 철저히 단절한다. [[교황]]의 트라우마가 전쟁에서 나왔기 때문으로 짐작된다.\n- 완전한 단절은 아니며, 구 제국의 외교관들로 이루어진 [[아라곤 협회]]를 통한 교류는 이어진다.\n\n**기사 체제는 서사 시점에 유지되고 있고, 위키 기준 현재에는 종료되었다.** 그 사이에 [[교황]]에게 무슨 일이 있었는지는 아직 알려지지 않았다.\n\n## 이해집단\n\n- [[교단]] — 최고 통치기구. [[교황]]과 [[추기경]]\n- [[제국기사]] 🗡️ — 최대 전력. 교황에게만 충성한다\n- [[성좌 기사단]] 🗡️ — [[추기경]]들에게 충성하는 다섯 기사단\n- [[상급기사]] 🗡️ · [[하급기사]] 🗡️ — 재단과 교육기관이 주는 서임\n- **3대 재단** — [[카스티야 사령부]] 🗡️(구 군부) · [[그라나다 재단]] 🗡️(구 재상) · [[아라곤 협회]] 🗡️(구 외교관)\n- [[잔존 함대]] 🗡️ — 공포의 함대의 잔존 세력\n- [[황립 조선소]] 🗡️ — 대륙에서 거의 유일하게 대형 선박을 짓는다\n\n## 음지의 세력\n\n- [[정복자들]] 🗡️ — 분지 외부를 정복해야 한다는 강경 기사단. 축출되었다\n- [[편력기사]] 🗡️ — 서임 없이 기사를 칭하는 이들\n\n## 이름\n\n세 계열의 이름이 겹쳐 있다.\n\n| 이름 | 정체 |\n|---|---|\n| **바실리아** | βασιλεία, 그리스어 '왕국'. 고대 공동체의 이름이며 [[바다 민족]]의 동부 정착지다 |\n| **드레드노** | Dread + 지명. [[대악몽]] 이후 사람들이 그 분지를 두려워해 붙인 이름이다 |\n| **신성제국** | [[하얀 일요일]] 이후의 국호 |\n\n작품 안에서 어원이 직접 설명되는 드문 이름이 '드레드'다. 그리고 이 나라의 다른 고유명사는 대부분 **스페인**에서 왔다 — [[레콩키스타]](Reconquista), [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]], 그리고 [[카시마르]]가 남긴 말인 '재정복의 날'.\n\n## 관련 문서\n\n- [[신성제국의 역사]] · [[하얀 일요일]] · [[대악몽]] · [[레콩키스타]]\n- [[교단]] · [[제국기사]] · [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n- [[바다 민족]] · [[누스]] · [[노에마]] · [[카시마르]]\n- [[그렌빌리아 대륙]] · [[연방]] · [[연합]] · [[크레스티아 제국]]\n\n## 여담\n\n**[[연방]]과 거울이다.** 이 나라에서 이탈한 귀족 가문이 [[연방]]을 세웠고, 그 이탈 시점이 **이쪽이 신정으로 전환할 때**였다. 그래서 한쪽은 종교가 없는 세속 국가가 되고 다른 쪽은 신정 국가가 되었다. 같은 뿌리에서 정반대로 갈라진 셈이다.\n\n물길과 선로도 반대다. 이 나라는 배를 국가의 축으로 삼아 수도까지 물 위에 올렸고, 연방은 강을 철로의 방해물로 취급한다.\n\n**[[누스]]가 두 번 이 나라를 뒤집었다.** 고대에는 바실리아가 누스로 [[노에마]]를 쓰다 [[대악몽]]을 불러 멸망했고, 근대에는 그 유물을 발견한 아이가 [[하얀 일요일]]을 일으켜 제국을 신정 국가로 바꿨다. 같은 물건이 천 년을 두고 두 번 국가를 갈아치웠다.\n\n**호수가 이 모든 것의 자리다.** [[카시마르]]가 지상으로 새어나오는 두 곳 중 하나가 드레드 분지의 호수다. 바실리아가 그 옆에서 멸망했고, 왕국이 그 위에 수도를 띄웠고, 그 수도가 그 바닥으로 가라앉았다.","parentId":"grenvillia"},{"title":"신성제국의 문화","id":"holy-empire-culture","type":"국가","folder":"02_지역","sortOrder":8,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["신성제국","문화","기사","교육","의례"],"memo":"원고에 문화 항목이 없어 작가 답변(2026-07-31)으로 새로 쓴 문서다. 확정된 것 — 서임 대상은 남녀 모두다. 카시마르 토벌은 정기 의례이며, 하급기사는 평소 농업에 종사하고 상급기사는 소속 재단의 학교에서 근무하거나 신성제국 내에서 잡다한 의뢰를 받는다. '재정복'은 기념일이 아니라 드레드노인에게 상징적인 단어이며, 카시마르가 그 국가적 상징을 사용하는 장면이 있다. 일반 교육은 없고 재단을 거친 의무교육으로 하급기사 서임을 받는다. 하급기사 서임을 받지 않은 사람은 외부인이거나 어린 아이뿐이다. 통신과 언론은 없으며 아라곤 협회 내에서 개인·소규모로 연구되는 수준이다. 문화의 모델은 스페인이 주축이고 프랑스가 보조 축이다.","image":"resource/wiki/신성제국의 문화.png","imageCaption":"서임식","summary":[["본문서","[[신성제국]]"],["다루는 범위","신분 · 교육 · 의례 · 생업"],["신분","전 국민이 [[하급기사]]"],["서임","남녀 모두"],["교육","재단의 의무교육뿐"],["주요 의례","가상 [[카시마르]] 토벌"],["하급기사의 생업","농업"],["상급기사의 생업","재단 학교 근무 · 의뢰"],["통신 · 언론","없다"],["모델","스페인 (보조로 프랑스)"]],"content":"# 신성제국의 문화\n\n```틀\n신성제국\n```\n\n[[신성제국]]의 사회와 생활. **전 국민이 기사이고, 학교가 유일한 관문이고, 소식을 나를 수단이 없는 나라다.**\n\n```상세\n신성제국\n신성제국의 정치\n```\n\n## 국민 전체가 기사다\n\n재단의 **의무교육**을 마치면 [[하급기사]] 서임을 받는다. 이것이 이 나라의 기본 신분이다.\n\n- **남녀 모두** 서임 대상이다.\n- 서임을 받지 않은 사람은 **외부인이거나 어린 아이다.**\n\n기사라 불리지만 [[상급기사]]와 비교하면 민간인 취급이며, 실질은 학교를 마쳤다는 증명에 가깝다. 다만 이 신분 덕에 분쟁을 **결투**로 가리는 것이 사회 전체에서 성립한다. → [[신성제국의 정치]]\n\n## 교육이 유일한 관문이다\n\n일반 교육은 **없다.** 재단 산하 교육기관을 거치는 길만 있다.\n\n세 재단 자체가 교육기관의 형태를 띠므로([[카스티야 사령부]]는 사관학교, [[그라나다 재단]]은 산학복합체), 국민은 태어난 곳의 재단 학교를 통해 국가에 편입된다. **교육을 마치는 것이 곧 국민이 되는 것이다.**\n\n## 기사들이 평소에 하는 일\n\n국민 전체가 기사인 나라에서 실제 생업은 등급에 따라 갈린다.\n\n| 등급 | 평소 |\n|---|---|\n| [[하급기사]] | 농업에 종사한다 |\n| [[상급기사]] | 소속 재단의 학교에서 근무하거나, 제국 내에서 잡다한 의뢰를 받는다 |\n\n이 나라의 기사 대다수는 **농민**이다.\n\n## 카시마르 토벌은 의례다\n\n국가의 1순위 목표인 가상 [[카시마르]] 토벌은 상시 전쟁이 아니라 **정기 의례**다.\n\n바깥에서 이 나라의 기사 체제를 '특이한 종교 제의'로 여기는 것이 그 실상에 가깝다. 외부인은 이들이 인지 조작을 당하고 있다고 생각하지 않는다.\n\n## '재정복'이라는 말\n\n[[레콩키스타]]는 이 나라의 출발점이며, **'재정복'은 드레드노인에게 상징적인 단어다.**\n\n'재정복의 날'이라는 기념일이 따로 있는 것은 아니다. 다만 [[카시마르]]가 그 국가적 상징을 그대로 **사용하는** 장면이 있다.\n\n## 통신도 언론도 없다\n\n소식을 옮기는 수단이 국가 차원에서 존재하지 않는다. 그나마 [[아라곤 협회]] 안에서 개인 단위·소규모로 연구되는 수준이다.\n\n## 이름과 모습\n\n이 나라의 고유명사는 대부분 **스페인**에서 왔다 — [[레콩키스타]](Reconquista), [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]], 수도 카스티요.\n\n여기에 **프랑스**가 보조 축으로 얹힌다. 복장과 음식도 두 계열이 겹친 형태다.\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 정치]] · [[신성제국의 지리]] · [[신성제국의 역사]]\n- [[하급기사]] · [[상급기사]] · [[제국기사]] · [[편력기사]]\n- [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n- [[레콩키스타]] · [[카시마르]] · [[교황]] · [[하얀 일요일]]\n\n## 여담\n\n**언론이 없다는 것이 이 체제의 조건이다** (추정). [[하얀 일요일]]을 드레드노인이 인지하지 못하는 것은 [[노에마]] 때문이지만, 그것을 의심할 재료가 유통되지 않는다는 점도 같은 방향으로 작동한다. 소식을 옮길 수단이 없는 사회에서는 바깥의 시선이 안으로 들어오지 않는다. 유일한 창구인 [[아라곤 협회]]가 통신을 연구하는 쪽이라는 점이 그래서 눈에 띈다.\n\n**[[연방]]과 대비된다.** 연방은 종교를 두지 않는 세속 국가이고, 철도가 생활의 축이고, 수도주에 언론사가 하나 있다. 이 나라는 종교가 곧 국가이고, 생활의 축이 농업이고, 언론이 없다. [[건국의 아버지들]]이 이 나라의 **신정 전환기**에 이탈해 세운 나라라는 점을 생각하면 갈림이 처음부터 정해져 있었다. → [[연방의 문화]]\n\n**신분의 실질은 [[연방]]과 같고 이름만 다르다** (추정). 연방에서 평민은 기초교육만 받고 노동자가 되고, 이 나라에서 같은 층위의 사람들은 의무교육을 마쳐 '기사'가 되고 농사를 짓는다. 하는 일이 비슷한 두 사회가 호칭을 정반대로 붙였다.\n\n**의무교육이 [[편력기사]]가 드물었던 이유로 읽힌다** (추정). 모든 사람이 학교를 거쳐 서임을 받는다면 서임 없이 기사를 칭할 자리가 없다. 그래서 기사 체제가 유지되는 동안 편력기사는 존재감이 크지 않았고, 서임할 사람이 사라진 뒤에 수가 늘어난다.","parentId":"holy-empire"},{"title":"신성제국의 역사","id":"holy-empire-history","type":"국가","folder":"02_지역","sortOrder":5,"era":"근대","canon":"확정","status":"작성 중","tags":["신성제국","역사","드레드노","바실리아"],"memo":"원문 §1 신성제국의 「짤막한 역사」 아홉 절(360~449행)을 옮긴 것이다. 문장은 원고 그대로이며 문체 통일(음슴체 → 평서체)과 소제목 레벨 조정만 적용했다.","image":"resource/wiki/신성제국의 역사.png","imageCaption":"신성제국의 역사","summary":[["본문서","[[신성제국]]"],["다루는 범위","고대 바실리아 ~ [[연말 위기]]"],["절 수","9"],["분기점","[[하얀 일요일]] — 신정 전환"]],"content":"# 신성제국의 역사\n\n```틀\n신성제국\n```\n\n고대 바실리아 공동체부터 [[연말 위기]]까지. 이 나라는 [[누스]] 때문에 두 번 뒤집혔다.\n\n```상세\n신성제국\n하얀 일요일\n```\n\n## 형성 과정\n\n다른 국가에 비해 매우 긴 역사를 보유하고 있다. 고대 그렌빌리아 대륙에 도달한 ‘바다 민족’은 반도 지역으로 돌출된 서부 지역과, 호수로 이어지는 분지 지형인 동부 지역으로 나뉘어 정착했고, 동부 지역에 정착한 민족이 세운 공동체가 바로 ‘바실리아’로, 이 국가가 지금의 신성제국까지 이어지는 긴 역사를 자랑한다고 ‘주장’한다.\n\n바실리아 공동체의 체제는 불분명하지만, 유물을 통해 분지 너머 대륙 중부와 북부 산악지대까지 진출하였음을 추측할 수 있고, 이들의 유물에는 다량의 ‘노에시스’가 검출되었기에, 대륙의 학자들은 바실리아의 사람들이 ‘노에시스’를 다룰 수 있는 특수한 이들이었으리라 추측하고 있다.\n\n바실리아 공동체는 고대 말기까지 존속하였으나 끝내 멸망한 것으로 확인되는데, 이들이 멸망한 이유는 다름아닌 ‘노에시스’ 때문이다. 바실리아 공동체는 노에시스를 ‘다룰 수 있다’기보단, 노에시스와 노에마의 존재를 인지하고 ‘숭배’하였으며, 일종의 종교적 의식을 통한 제한적인 활용에 그쳤던 것이다.\n\n이들에게는 ‘누스’가 존재했고, 이를 통해 노에시스에 대한 이해 없이도 노에마를 사용할 수 있었으나, 이로인해 촉발된 ‘대악몽’ 사건으로 인해 고대 바실리아 공동체와, 그 인접 국가들이 모조리 멸망하게 되었다. 그리고 이러한 사실을 아는 대륙의 역사가는 아직 없는 상태다.\n\n바실리아 공동체가 멸망한 후, 한동안 고대 사람들은 분지를 멀리하였고, 그 지역에 ‘드레드’(Dread)라는 이름을 붙여 사람들이 가까이하지 못하게 했다. 하지만 시대가 발전하면서 대륙 곳곳에 사람들이 퍼져나갔고, 중세 시기에는 다시 이 드레드 분지에 국가가 형성되기에 이른다.\n\n대륙 중부에서 이동한 민족이 세운 국가가 바로 드레드노 기사단국, 현 드레드노 신성제국의 첫 국가다.\n\n## 드레드노 기사단국의 분지 정복\n\n기사단국의 기원은 중부 대륙에서 활동하던 악명 높은 기사단으로, 중부 대륙에서의 약탈과 잔혹함으로 유명했던 기사단이 중부 대륙을 벗어나 주인 없는 땅이었던 ‘드레드 분지’를 차지하면서부터 시작된다. 하지만 당시 드레드 분지는 ‘대악몽’의 여파가 완전히 사라지지 않은 상태, 카시마르들이 소수 잔존하고 있던 상태였다.\n\n당시에는 노에시스와 거기에서 발원한 ‘카시마르’라는 존재에 대한 이해가 매우 부족했던 시기이기에, 기사단은 이들을 단순히 ‘괴물 아니면 악마’로 규정하고 대대적인 소탕에 나섰다. 악명 높은 기사단은 ‘이 분지에서 나가지 않을테니 괴물들을 잡는 것을 도와달라’고 당시 중세 세력들에게 요청했고, 기사단에게 당한게 많았던 세력들은 분지에서 벗어나지 않는다는 조건으로 기사단을 도와 카시마르를 토벌하기로 했다.\n\n이때 맺은 각 세력들, 각 기사단들간의 계약 이름이 ‘레콩키스타’로, 대륙의 남부, 중부, 북부에서 가릴 것 없이 용맹한 이들이 보수와 명예를 위해 드레드 분지로 뛰어들었다. 분지 지역 문화는 특히 ‘기사도 문학’이 크게 발달한 바 있는데, 이 ‘레콩키스타’ 시기를 배경으로 하는 문학들이 큰 인기를 얻은 덕분이다.\n\n## 드레드노 왕국의 성립\n\n결국 오랜 시간이 지나, 중세시기가 끝날 무렵 드레드 분지의 괴물들은 모조리 토벌당하게 되고, ‘레콩키스타’는 완수되었다. 악명 높은 기사단은 계약에 따라 분지 전체의 영유권을 주장하는 대신, 분지 바깥으로는 영향력을 행사하지 않기로 맹세했다. 이후 분지를 개발하여 ‘드레드노 왕국’으로 발전한다.\n\n드레드노 왕국은 분지 내의 호수와 각 지역으로 이어지는 강줄기를 활용하기 위해 ‘배’를 중점적으로 건조하기 시작했다. 배를 이용해 분지 외부의 국가들과 무역을 진행하고, 분지 내부의 운송 수요를 충족하는 등 ‘배’를 적극적으로 활용하기에 이른다.\n\n## 크레스티아-드레드노 전쟁\n\n하지만 이 평화는 오래가지 않았다. 드레드노 왕국은 분지에 인접한 여러 국가들과 ‘드레드 체제’라는 방위 협정을 맺고 있었는데, 새로 건국된 크레스티아 제국이 방위 협정인 ‘드레드 체제’를 ‘드레드노 중심의 세력권’으로 해석하여, 과거 기사단국 시절의 계약을 지키지 않았다는 명분으로 드레드 체제에 속한 독립국 ‘카고르예’를 침공한 것이다.\n\n인접국 ‘카고르예’를 합병하기 위한 허울뿐인 명분이었으므로 드레드노 왕국은 기타 드레드 체제에 속한 국가들과 함께 크레스티아 제국에게 선전포고문을 전달, 제국과의 전쟁 상태에 돌입하게 되었다.\n\n하지만 당시의 크레스티아 제국은 순수 무력으로 대륙의 북부를 완전히 통제하는데 성공한 초강대국으로서, ‘드레드 체제’에 속한 국가들로 카고르예의 병합을 막기에는 역부족이었다. 얼마 지나지 않아 ‘카고르예’는 병합되었으며, 역으로 드레드 분지 내부까지 침공당할 위기에 처해버렸다.\n\n그때 드레드노 왕가는 왕국의 운명을 뒤바꿀 결정을 하게 되는데, 그것은 바로 선박을 엮어 만든 인공 섬으로 수도를 이전하고, 이 인공 섬을 분지 내 호수 한 가운데로 옮겨버린 것이다. 기초적인 차량 기술만 보유하고 있던 크레스티아 제국은 호수 한 가운데로 수도를 이전해버린 드레드노 왕국을 멸망시켜버릴 수는 없었다.\n\n하지만 분지 외부의 ‘드레드 체제’에 속한 국가들은 결국 모두 크레스티아 제국에게 병합당하게 되며, 드레드노 왕국은 결국 병합된 국가들을 모두 정당한 영토로 인정하는 대신 제국과의 평화협상을 맺었다.\n\n## 눈물의 10년\n\n평화협상 이후 시기는 10년간 지속되었는데, 이 시기를 드레드노인들은 ‘눈물의 10년’이라고 부른다. 크레스티아 제국에게 무역권이 종속당하고, 분지 내부까지 영향력을 끼치고 있던 시기이므로, 드레드노 최악의 암흑기로 평가받는다.\n\n다만 이 시기 왕가는 칼을 갈고 있었고, 크레스티아 제국이 극복하지 못한 ‘선박’ 기술에 대대적인 투자를 해 발전시키는 한편, 제국 몰래 비숍스와 거래하여 선박의 무기화를 추진하는 등, 분지 내에서 크레스티아 제국의 영향력을 축출하기 위해 모든 역량을 투자하고 있었다.\n\n## 2차 크레스티아-드레드노 전쟁, 재정복과 드레드노 제국의 성립\n\n결국 계속해서 칼을 갈아온 드레드노 왕국은 다시금 크레스티아에게 전쟁을 선포하게 되었는데, 이번에는 역으로 드레드노 왕국이 크레스티아 제국에게 허울뿐인 명분을 내세우고, 선전포고 없이 선제공격을 감행하는 등, 오로지 승리만을 위해 행동하는 점에서 인상적이다.\n\n드레드노 왕가가 이렇게까지 했던 이유는 왕가 내적인 굴욕감과, ‘드레드 체제’의 붕괴에 대한 죄책감, 불명예스러운 평화협상으로 이어지는 과정에서, 기사단국에서부터 이어지는 ‘기사도’가 아닌, 오로지 ‘국력’에 집중하는 방향으로 노선을 틀어서이기도 하다.\n\n분지 내부에서 활동하던 크레스티아 제국 세력들은 모두 드레드노의 함포로 초전박살, 순식간에 분지 내에서 완전히 제국의 세력을 축출하기에 이르고, 수도를 다시 육지로 옮기기로 결정한 뒤 ‘드레드노 제국’을 선포하기까지 했다.\n\n당시 크레스티아 제국은 북부와 동부뿐만 아닌, 중부와 서부에까지 영향력을 끼치고 있었으므로, 대륙 내 제3국들은 모두 이러한 드레드노의 행보를 묵인, 암묵적인 동맹으로서 지지하게 되었다. 분지 외부로 이어지는 강줄기가 이어진 곳까지 드레드노 제국은 제국의 자랑 ‘공포의 함대’를 앞세워 진군하였고, 대륙 중부로까지 진군하여 크레스티아 제국의 영향력을 무력화시켰다.\n\n## 하얀 일요일\n\n2차 크레스티아-드레드노 전쟁이 한창 진행되던 와중, 훗날 ‘교황’이라 불릴 한 아이에 의해 고대 ‘바실리아’의 유물인 ‘누스’가 발견되었다. 당시 교황은 전쟁으로 인해 가족을 잃은 상태였고, 그 트라우마로 인해 누스와 상호작용할 수 있었다. 그 결과 아주 강력한 노에마를 발현하게 되었다.\n\n분지 외부까지 강력한 영향력을 끼치며 전쟁의 승리까지 얼마 남지 않았던 드레드노 제국은 교황의 노에마로 인해 완전히 마비되었으며, 아직 물 위에 있어 이전 작업이 진행 중이던 제국의 수도와 황가는 노에마로 인해 선박의 평형 유지 장치가 오작동한 결과 그대로 호수 바닥으로 침몰하였다.\n\n한 순간에 지휘부가 모두 사라진 공포의 함대는 그대로 고립, 크레스티아 제국의 공격에서 벗어나는 과정에서 일부 함대를 잃었지만, 안전히 대륙 외곽 지역으로 피신하는데 성공했다.\n\n노에마에 의한 인지 조작을 겪는 드레드노인들은 해당 사건을 인지할 수 없으나, 훗날 미트로프 연방에 속하는 대륙 중부의 소국들과 비숍스, 크레스티아 제국 측에서는 해당 사건을 ‘하얀 일요일’로 칭하였고, 이 사건으로 인해 2차 크레스티아-드레드노 전쟁은 당시 전선 그대로 전쟁을 멈추게 되었다.\n\n다른 국가들도 어디까지나 암묵적인 동맹, 표면적으로는 단순 지지 의사만 표명했기에 별다른 조치를 취하진 않았으며, 국가 역량에 큰 손실을 입은 크레스티아 제국 또한 확장을 멈추고 내정에 집중하게 되는 계기를 마련하였다.\n\n## 신성제국의 탄생\n\n‘교황’ 통치 하의 드레드노는 사회가 초자연적인 힘으로 인해 완전히 개변되는 결과를 맞았다. 명칭은 ‘신성제국’이었으나, 체제는 ‘기사단국’ 시절로 회귀하였으며, 제국 내 군부, 산업가, 학자 계층 모두 ‘재단’이라는 집단으로 묶여 ‘기사단’을 양성하는 기괴한 체제가 탄생했다.\n\n이는 ‘교황’의 노에시스가 ‘레콩키스타’ 시기의 기사도 문학으로 상당 부분 이루어졌기에 이러한 형태를 띠게 된 것이다. 장정한 백성들은 모두 교황에게 서임받아 기사가 되고, 가상으로 만들어진 ‘카시마르’를 토벌하는 것을 1순위 목표로 삼는 것이 ‘신성제국’의 체제였다.\n\n이렇게 변화한 이후부터 드레드노 신성제국은 철저히 분지 외부와의 단절을 기조로 삼았는데, 그 이유는 ‘교황’의 트라우마가 ‘전쟁’으로부터 기인했기 때문으로 추측하곤 한다. 그럼에도 완전한 단절이 아닌 구 제국 시기 ‘외교’를 전담했던 이들로 구성된 ‘재단’을 통한 교류는 여전히 이어지고 있다.\n\n## 연말 위기에 개입\n\n신성제국이 탄생한 후 얼마 지나지 않아 미트로프 연방이 탄생하였고, 약화된 크레스티아 제국과의 전쟁에 돌입했다. 크레스티아가 패퇴하는 와중에도 드레드노 신성제국은 개입하지 않는 고립주의 노선을 택하고 있었으나, 비숍스 연합에서의 동맹을 제의받게 되었다.\n\n그때까지도 개입하지 않는 입장을 고수하였으나, 비숍스측의 외교관이 교황에 대한 트라우마를 간파했다. 미트로프 연방이 크레스티아 제국을 완전히 흡수할 경우, ‘2차 크레스티아-드레드노 전쟁’과 같은 끔찍한 사건이 재발될 것이라며 교황을 지속적으로 회유하였고, 이에 격분하여 동맹에 응하게 되었다.\n\n과거 ‘드레드 체제’에 속하였으나 양차 전쟁에서 크레스티아에 흡수되었다가 드레드노로 인하여 다시 독립한 ‘카고르예 공화국’이나 ‘루블린 공국’ 등의 군소국들을 신성제국이 호출하여 반 연방 세력이 최종적으로 완성되었다.\n\n결국 미트로프 연방은 이들의 최후통첩을 수용하고, 연말 위기는 종결되었다. 신성제국은 다시 분지 내로 고립되기를 택하고, 현재까지도 분지 내에서의 ‘레콩키스타’를 재현하고 있는 상태다.\n\n## 여담\n\n**[[누스]]가 두 번 이 나라를 갈아치웠다.** 고대에는 바실리아가 누스로 [[노에마]]를 쓰다 [[대악몽]]을 불러 멸망했고, 근대에는 그 유물을 발견한 아이가 [[하얀 일요일]]을 일으켜 제국을 신정 국가로 바꿨다. 같은 물건이 천 년을 두고 두 번이다.\n\n**기사도를 버린 대가가 기사의 나라였다.** 2차 전쟁에서 드레드노 왕가는 명예를 버리고 선전포고 없는 선제공격을 감행했다. 그 전쟁의 끝에 나타난 것이 [[레콩키스타]] 기사도 문학으로 이루어진 [[교황]]의 [[노에시스]]였고, 그 결과 국민 전체가 기사가 되는 체제가 세워졌다. 버린 것이 되돌아와 국가의 형태가 되었다.\n\n**[[연합]]이 두 번 이 나라를 움직였다.** 눈물의 10년에는 몰래 선박 무기화를 도와 재정복을 가능하게 했고, [[연말 위기]]에는 [[교황]]의 트라우마를 간파해 고립주의를 깼다. 두 번 다 이 나라의 상처를 정확히 짚었다.\n\n**아직 알려지지 않은 것.** 기사 체제가 어떻게 종료되었는지, 그리고 [[교황]]이 어떻게 되었는지. 위키 기준 현재에는 체제가 끝나 있다.","parentId":"holy-empire"},{"title":"신성제국의 정치","id":"holy-empire-politics","type":"국가","folder":"02_지역","sortOrder":6,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["신성제국","정치","교단","재단","기사행전"],"memo":"원고에 정치 항목이 없어 작가 답변(2026-07-31)으로 새로 쓴 문서다. 확정된 것 — 재단은 3개가 전부이며 카스티야=군부, 그라나다=산업가·자본가, 아라곤=학자·외교관이다. 재단은 모두 '교육기관'의 형태를 띠므로 산학복합체라는 표현이 쓰였다. 법은 교황의 기사도 문학 《기사행전》이고, 그것을 교황이 어떻게 해석하는가가 법에 가깝다. 개인 간 분쟁과 범죄는 결투로 처리하며 대리자를 세울 수 있다. 조세는 재단이 걷고, 교단은 재단에게 작위를 부여하는 것으로 일정량을 공유한다. 교황에게 후계 개념은 없고, 그래서 체제가 붕괴한다. 추기경은 5명이며 임명 기준은 교황과의 관계다.","image":"resource/wiki/신성제국의 정치.png","imageCaption":"교단의 의례","summary":[["본문서","[[신성제국]]"],["다루는 범위","교단 · 재단 · 법 · 조세"],["체제","신정 — 재단이 삼분"],["최고 권력","[[교단]] — [[교황]]과 [[추기경]] 5명"],["실무","[[추기경]] 중심"],["영토","카스티야령 · 그라나다령 · 아라곤령"],["법","《[[기사행전]]》 — [[교황]]의 해석"],["사법","결투 — 대리자 허용"],["조세","재단이 걷고 [[교단]]과 공유"],["후계","없음"]],"content":"# 신성제국의 정치\n\n```틀\n신성제국\n```\n\n[[신성제국]]의 통치 구조. **법이 문학이고, 재판이 결투이고, 후계가 없는 나라다.**\n\n```상세\n신성제국\n교단\n```\n\n## 교단\n\n최고 통치기구는 [[교단]]이다. [[교황]]이 모든 최종 결정권을 쥐고, [[추기경]] **다섯 명**이 그를 보좌한다.\n\n추기경이 되는 기준은 제도가 아니라 **교황과의 관계**다. 시험도 선출도 없다.\n\n다만 교황이 직접 지시를 내리는 일은 흔치 않으므로, 실제로 교단을 굴리는 것은 추기경들이다. 이들이 처리하는 것은 아주 중요한 사안과 의례적인 업무다.\n\n## 세 재단이 나라를 삼분한다\n\n재단은 **셋이며**, 구 드레드노 제국의 계층이 그대로 옮겨온 것이다.\n\n| 재단 | 출신 계층 | 교육기관 | 영지 |\n|---|---|---|---|\n| [[카스티야 사령부]] | 군부 | 사관학교 | 카스티야령 |\n| [[그라나다 재단]] | 산업가 · 자본가 | 산학복합체 | 그라나다령 |\n| [[아라곤 협회]] | 학자 · 외교관 | — | 아라곤령 |\n\n세 재단이 분지를 나눠 갖고 있으며, 각 재단은 자기 영지에 **수도로 삼는 도시**를 하나씩 두고 있다.\n\n**세 재단의 본질은 전부 교육기관이다.** 그라나다의 산하 기관을 '산학복합체'라 부르는 것도 재단 자체가 학교의 형태를 띠기 때문이다. 국가의 무력·경제·학문이 모두 학교를 통해 굴러가는 구조이며, 그 학교가 [[하급기사]]를 배출한다.\n\n재단과 재단 사이의 분쟁에서 동원되는 무력이 [[상급기사]]다. 위에서 정리해 주는 기구가 없으므로, 재단 사이의 다툼이 곧 이 나라의 정치가 된다.\n\n## 법은 《기사행전》이다\n\n이 나라에 성문 헌법은 없다. 대신 [[교황]]의 기사도 문학 **《[[기사행전]]》**이 있다. 이것은 단순한 책이 아니라 **[[누스]]**다 — [[연방]]의 [[연방 헌법]]과 같은 자리에 있는 물건이다.\n\n법의 내용은 그 책에 적힌 것이 아니라 **교황이 그것을 어떻게 해석하는가**다. 법의 출처가 문헌이 아니라 한 사람의 독법이다.\n\n## 재판 대신 결투\n\n개인 간 분쟁과 범죄는 대부분 **결투**로 처리된다.\n\n이것이 성립하는 이유는 국민 대부분이 [[하급기사]]이기 때문이다. 의무교육을 마치면 서임을 받으므로, 결투에 나설 자격이 전 국민에게 있다.\n\n당사자가 직접 나서지 않고 **대리자를 세우는 것도 허용된다.**\n\n## 조세\n\n세금은 존재하며, 걷는 주체는 **재단**이다.\n\n[[교단]]은 재단에게 **작위를 부여하는 것으로** 그 조세의 일정량을 공유한다. 교단이 직접 징수 기구를 두지 않고, 작위를 내주는 대가로 몫을 받는 구조다.\n\n## 후계가 없다\n\n[[교황]]에게는 **후계 개념이 없다.** 다음 교황을 정하는 절차도, 후보도 없다.\n\n이 나라의 모든 것이 교황 한 사람에게서 나온다 — 법의 해석, [[제국기사]]의 서임, 국민 전체의 기사 신분, 토벌해야 할 [[카시마르]], 그리고 [[하얀 일요일]]을 인지하지 못하게 만드는 힘까지. 그것을 이어받을 자리가 비어 있다.\n\n**그래서 체제가 붕괴한다.**\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 지리]] · [[신성제국의 문화]] · [[신성제국의 역사]]\n- [[교단]] · [[교황]] · [[추기경]]\n- [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n- [[제국기사]] · [[성좌 기사단]] · [[상급기사]] · [[하급기사]]\n\n## 여담\n\n**[[연방]]과 정확히 거울이다.** 연방에는 최고 규범이 [[연방 헌법]]이라는 물건으로 존재하지만 행정부도 사법부도 없다. 이 나라에는 최종 결정권자가 한 사람으로 분명히 있지만 법이 물건이 아니라 해석이다. 한쪽은 규범만 남고 집행이 없고, 다른 쪽은 집행만 있고 규범이 사람 안에 있다.\n\n**두 나라의 붕괴 원인도 대칭이다** (추정). 연방은 [[연말 위기]]에 최상위 의결 기구가 사라져 무너지기 시작했고, 이 나라는 그 자리를 이어받을 사람이 없어 무너진다. 하나는 비어 버린 자리 때문이고 하나는 채울 수 없는 자리 때문이다.\n\n**결투가 사법인 것이 신분 제도의 결과다.** 국민 전체를 기사로 만든 체제에서는 모두가 무기를 들 자격이 있으므로, 분쟁을 칼로 가리는 것이 제도적으로 가능해진다. 대리자를 세울 수 있다는 것은 그 결투가 이미 **형식화된 절차**라는 뜻으로 읽힌다.\n\n**작위가 곧 재정 수단이다** (추정). [[교단]]이 작위를 주고 조세를 나눠 받는다면, 서임은 명예이기만 한 것이 아니라 국가 재정의 통로다. [[제국기사]]의 작위 수가 정해져 있고 소집 한도 960시간을 다 쓰면 반납해야 하는 것도 같은 계열의 관리로 보인다.","parentId":"holy-empire"},{"title":"신성제국의 지리","id":"holy-empire-geography","type":"국가","folder":"02_지역","sortOrder":7,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["신성제국","지리","드레드 분지","호수","강"],"memo":"원고에 지리 항목이 없어 작가 답변(2026-07-31)으로 새로 쓴 문서다. 확정된 것 — 분지의 호수가 바다와 직접 이어지므로 이 나라는 바다에 닿는다. 분지 밖으로 나가는 강줄기는 네 갈래이며 북쪽은 구 크레스티아 영토, 서쪽은 대륙 중부의 강줄기, 남쪽은 남부 군도, 동쪽은 바다로 향한다. 분지 내부는 세 재단이 삼분하며 카스티야령·그라나다령·아라곤령으로 불린다. 재단마다 수도로 삼는 도시가 하나씩 있고 황립 조선소도 도시를 보유한다. 바다가 폐쇄적이므로 '바다를 향하는 항구도시'라는 개념은 존재하지 않는다. 호수 이름, 산맥 이름, 강 이름은 모두 미정이다.","image":"resource/wiki/신성제국의 지리.png","imageCaption":"드레드 분지 전도","summary":[["본문서","[[신성제국]]"],["다루는 범위","분지 · 호수 · 네 강 · 재단 3령"],["위치","대륙 동부 [[드레드 분지]]"],["바다","호수가 바다와 직접 이어진다"],["호수","[[카시마르]] 지상 유출지"],["강줄기","네 갈래 — 북 · 서 · 남 · 동"],["행정구역","카스티야령 · 그라나다령 · 아라곤령"],["도시","재단마다 하나씩"],["항구도시","개념이 없다"],["경계","강과 산맥"]],"content":"# 신성제국의 지리\n\n```틀\n신성제국\n```\n\n[[신성제국]]의 국토는 [[드레드 분지]] 하나다. **바다에 닿는데도 항구가 없는 나라다.**\n\n```상세\n드레드 분지\n신성제국\n```\n\n## 분지 하나로 이루어진 나라\n\n사방이 강과 산맥으로 막힌 분지이며, 가운데에 호수가 있다. 이 나라의 역사가 전부 이 안에서 벌어졌다.\n\n[[연방]] 쪽과는 강과 산맥으로 갈려 접점이 적다. 연방이 확장기에 [[크레스티아 제국]]을 먼저 목표로 삼은 이유 중 하나가 이 지형이었다.\n\n## 네 갈래의 강\n\n분지 밖으로 나가는 강줄기가 네 갈래다. 왕국 시절부터 이것이 무역로였고, 2차 전쟁에서는 **공포의 함대**가 이 물길을 따라 진군했다.\n\n| 방향 | 이어지는 곳 |\n|---|---|\n| 북쪽 | 구 [[크레스티아 제국]] 영토 |\n| 서쪽 | 대륙 중부의 강줄기 — [[연방]] 쪽 |\n| 남쪽 | 남부 군도 |\n| 동쪽 | **바다** |\n\n## 바다에 닿는다\n\n**호수가 바다와 직접 이어진다.** 동쪽 강줄기가 그 통로다.\n\n그런데도 이 나라에 **'바다를 향하는 항구도시'라는 개념은 없다.** [[바다]] 자체가 닫힌 곳이기 때문이다 — 노에시스 농도가 수심에 따라 올라가고, 원양에서는 나무 선체가 통째로 부식된다.\n\n[[황립 조선소]]도 도시를 하나 보유하고 있지만 항구도시는 아니다. 대륙에서 거의 유일하게 대형 선박을 짓는 세력이 바다를 앞에 두고도 그렇다.\n\n## 재단이 삼분한 땅\n\n분지 내부는 세 재단이 나눠 갖고 있다.\n\n| 영지 | 재단 |\n|---|---|\n| 카스티야령 | [[카스티야 사령부]] |\n| 그라나다령 | [[그라나다 재단]] |\n| 아라곤령 | [[아라곤 협회]] |\n\n각 재단은 자기 영지에 **수도로 삼는 도시**를 하나씩 둔다. 국가의 수도인 **카스티요**와 별개다.\n\n주(州)나 군(郡) 같은 행정 구획이 아니라 **세력의 권역이 곧 지도**다. → [[신성제국의 정치]]\n\n## 수도\n\n- **수도성** — 선박을 엮어 만든 인공 섬 수도. 호수 한가운데에 띄웠고 [[하얀 일요일]] 때 그 바닥으로 가라앉았다.\n- **카스티요** — 2차 전쟁 승리 후 육지로 옮긴 수도. (잠정)\n\n## 아직 이름이 없는 것들\n\n이 나라의 지형은 중요한 자리마다 이름 없이 불린다.\n\n- **호수** — 이 나라의 모든 사건이 겹친 곳인데도 이름이 나온 적이 없다.\n- **산맥과 강** — [[연방]] 쪽과의 경계이지만 이름이 불린 적이 없다.\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 정치]] · [[신성제국의 문화]] · [[신성제국의 역사]]\n- [[드레드 분지]] · [[카시마르]] · [[바다]]\n- [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n- [[황립 조선소]] · [[잔존 함대]] · [[그렌빌리아 대륙]]\n\n## 여담\n\n**[[연방]]과 물이 정반대다.** 연방은 바다에 닿지 않는 내륙국이고 강을 철로의 방해물로 취급한다. 이 나라는 호수와 네 갈래 강이 국토의 축이고 수도까지 물 위에 올렸다. 같은 대륙에서 물과 선로가 완전히 갈렸다.\n\n**바다에 닿는 것이 이점이 아니다.** [[바다]]가 노에시스 때문에 사실상 막혀 있으므로, 바다로 이어지는 강 하나를 가진 것은 통로가 아니라 **막다른 끝**이다. 그래서 대형 선박을 짓는 기술이 있어도 항구 문화가 생기지 않았다.\n\n**[[잔존 함대]]가 '대륙 외곽'으로 갈 수 있었던 길이 이 동쪽 강이다** (추정). [[하얀 일요일]]로 지휘부를 잃은 함대가 호수에서 빠져나가 대륙 외곽까지 피신했다면, 바다로 이어지는 통로를 쓴 것으로 읽힌다.\n\n**네 갈래 강이 이 나라의 역사를 그대로 설명한다** (추정). 북쪽 강 끝에 구 [[크레스티아 제국]]이 있었으니 두 차례 전쟁의 전선이 거기였고, 남쪽 강 끝의 남부 군도는 [[연말 위기]]에 반 연방 세력으로 함께 섰다. 물길이 닿는 곳이 곧 이 나라가 관계를 맺은 곳이다.","parentId":"holy-empire"},{"title":"아라곤 협회","id":"aragon-association","type":"세력","folder":"02_지역","sortOrder":160,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","재단","외교","3대 재단"],"memo":"원문 486~488행 문장 그대로. 이름은 스페인 아라곤 왕국에서 왔다.","image":"resource/wiki/아라곤 협회.png","imageCaption":"아라곤 협회의 문장","summary":[["성격","3대 재단 — 구 제국의 외교관 집단"],["역할","모든 대외 교류"],["방식","타국과 [[교황]] 사이의 전달"],["위상","해외에 영향력을 행사하는 유일한 세력"],["영지","아라곤령"]],"content":"# 아라곤 협회\n\n```틀\n신성제국\n```\n\n과거 ‘드레드노 제국’의 ‘외교관’ 집단으로 구성된 재단. 신성제국의 대외적인 교류는 모두 이들을 통해 이루어지며, 타국의 의사를 확인 → 교황에게 전달 → 교황의 의사를 확인 → 타국에게 전달하는 방식으로 전달자 역할을 맡는다. 유일하게 해외에 약소하게나마 영향력을 행사할 수 있는 주요 세력으로 여겨진다.\n\n이 재단에는 **학자 계층**도 함께 묶여 있다. 세 재단이 구 제국의 계층을 나눠 받았고, 학문을 맡은 쪽이 여기다.\n\n## 단절된 나라의 유일한 문\n\n[[신성제국]]은 [[하얀 일요일]] 이후 분지 외부와 철저히 단절하기로 했다. 그 단절이 완전하지 않은 이유가 이 재단이다.\n\n다만 이들은 **전달자에 그친다.** 스스로 판단해 협상하지 않고 [[교황]]의 의사를 확인해 옮긴다. 그래서 이 나라의 외교는 항상 한 박자 늦고, 교황의 상태에 그대로 좌우된다.\n\n[[연말 위기]] 때 [[연합]]의 외교관이 교황의 트라우마를 직접 간파하고 회유할 수 있었던 것도, 이 창구를 통해 교황에게 말이 곧바로 닿기 때문이다.\n\n## 통신 연구\n\n[[신성제국]]에는 통신도 언론도 없다. 그나마 이 협회 안에서 **개인 단위·소규모로 연구되는 수준**이다. 바깥과 말을 주고받는 자리에 있는 재단이 소식을 옮기는 수단을 연구한다는 구도다. → [[신성제국의 문화]]\n\n## 관련 문서\n\n- [[신성제국]] · [[교황]] · [[교단]]\n- [[카스티야 사령부]] · [[그라나다 재단]] — 나머지 3대 재단\n- [[연말 위기]] · [[연합]]\n\n## 여담\n\n**이 재단은 나라 밖의 진실을 볼 수 있는 자리에 있다.** 외부에서는 [[하얀 일요일]]을 사건으로 알고 드레드노인의 기사 체제를 '특이한 종교 제의'로 여긴다. 대외 교류를 전담하는 이들이라면 그 시선을 접할 수밖에 없다.\n\n그런데도 인지 조작은 스스로를 드레드노인이라 여기는 사람에게 걸린다. 바깥의 말을 옮기면서도 그 뜻을 알아채지 못하는 자리에 서 있는 셈이다 (추정).","parentId":"holy-empire"},{"title":"연방","id":"federation","type":"국가","folder":"02_지역","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","미트로프","열강"],"memo":"원문 §1 연방(174~348행) 이관. 고친 자리 넷. (1) 국명에서 '메트로시아/메트리카' 폐기(작가 확인). (2) 197행 파벌 정의 교체 — 원문은 통일파를 '대륙을 통일하자는 온건주의', 철도파를 '철도부터 깔자는 급진주의'로 적었으나, 작가가 '철도파=역량을 전 대륙에 투사 / 통일파=내부부터 정리'로 바꿔 확정했고 강경·온건은 각 파벌 안의 갈래로 정리했다. (3) 203행에서 통일파 주장의 근거 중 '전 대륙을 확보한 이후에'를 덜어냈다 — 옛 정의에서만 성립하는 문구였다. 이 건은 작가 확인이 필요하다. (4) 2026-07-31 문체 통일 지시에 따라 「짤막한 역사」의 음슴체를 평서체로 바꿨다. 어순과 내용은 그대로다.","image":"resource/wiki/연방.png","imageCaption":"연방의 문장","summary":[["정식 명칭","미트로프 연방"],["다른 이름","미트로프"],["체제","연방제 — 사실상 귀족 과두정"],["위치","대륙 중부 요충지 — 내륙국"],["수도","[[수도주]]"],["행정구역","수도주 · 북방주 · 동방주 · 남방주 · 서방주"],["기원","[[건국의 아버지들]]이 중부 소국을 규합"],["최고 권력","[[의회]] — 행정·사법 부재"],["법","[[연방 헌법]] — [[누스]]"],["주요 세력","[[대가문]] · [[의회]] 3파벌 · [[철도청]]"],["무력","[[헌병대]] · [[경찰청]] · [[보안관]]"],["대외 기조","비무장 — [[연말 위기]] 조약"],["현재 상태","붕괴 (위키 기준 현재)"],["서사 축","대륙 서사의 핵심"],["핵심 키워드","행정 · 철도 · 치안"]],"content":"# 연방\n\n미트로프\n\n행정과 철도, 치안이 핵심 키워드인 연방제 국가다. 대륙 중부 요충지에 위치한 패권 국가로서, 대륙 서사에 핵심적인 축을 담당한다.\n\n\n```틀\n연방\n```\n\n## 연혁\n\n```연혁\n건국 | [[신성제국]]에서 이탈한 귀족 가문이 대륙 중부 소국들을 규합. 수단은 철도였다\n건국 | 연방 헌법에 **각 주가 제각기 철도 체계를 구성할 수 있다**는 조항이 삽입된다\n통일 직후 | [[철도파]]와 [[통일파]]로 분열. 각각 내부에서 강경·온건으로 다시 갈린다\n확장기 | [[연합]]과의 기술 거래로 군비 확장\n확장기 | **쾨벤하운 왕국 병합** → [[북방주]]. 왕가는 종적을 감춘다\n확장기 | [[크레스티아 제국]]에 선전포고. 고전한다\n확장기 | [[컴퍼니]]의 반란을 몰래 지원 → 제국 멸망. 영토 80%는 연방, 20%는 컴퍼니\n확장기 | 반 연방 세력이 결성되어 **최후통첩**을 보낸다\n**[[연말 위기]]** | [[통일파]]의 쿠데타. 화재로 [[철도파]] 강경파와 [[건국의 아버지들]]이 사라진다\n**[[연말 위기]]** | 조약 체결 — **완전한 비무장화**. [[헌병대]]만 남는다\n신질서 | 대륙 전체에 연방 체계의 철도망. '미트로프 중심 질서'가 선다\n신질서 | 궤간 난립, 의회 신뢰 실추, [[경찰청]]·[[보안관]] 확대와 관할 갈등\n서사 시점 | [[북부동맹]] 독립 선언 → [[미트로프 내전]]\n현재 | 붕괴\n```\n\n## 역사\n\n[[신성제국]]에서 이탈한 귀족 가문이 대륙 중부의 소국들을 철도로 규합해 세운 나라다. 그 규합 과정에서 각 주가 제각기 철도 체계를 가질 수 있다는 조항이 헌법에 들어갔고, 이것이 훗날 사유 철도 난립의 씨앗이 된다.\n\n통일 직후 대외 투사를 주장하는 [[철도파]]와 내부 정리를 주장하는 [[통일파]]로 갈렸다. 쾨벤하운 왕국을 병합해 [[북방주]]로 삼고([[철도파]] 우세), 이어 패권국 [[크레스티아 제국]]을 해체시켜 대륙의 새 패권국이 되었다.\n\n그러자 남은 열강들이 반 연방 세력을 만들어 최후통첩을 보냈고, 개전을 막으려던 [[통일파]]가 쿠데타를 일으켰다. 이것이 [[연말 위기]]다. 조약으로 연방은 **완전한 비무장국가**가 되었고, 지금 이 나라가 앓고 있는 문제는 거의 전부 여기서 나온다.\n\n```상세\n연방의 역사\n연말 위기\n```\n\n## 개관\n\n- **[[연방의 역사]]** — 건국부터 [[연말 위기]] 직후까지\n- **[[연방의 지리]]** — 5주, 강과 평야, 주 경계의 관문. 바다에 닿지 않는 내륙국이다\n- **[[연방의 정치]]** — 행정부와 사법부가 둘 다 없다. 남은 것은 [[의회]] 하나다\n- **[[연방의 문화]]** — 종교가 없고, 도로 대신 트램 선로가 깔린 나라\n\n## 이름\n\n정식 명칭은 **미트로프 연방**이다. '미트로프'가 어디서 온 이름인지는 알려져 있지 않다.\n\n다만 이 나라의 이름 계열 자체는 뚜렷하다. **미국 건국사에서 왔다.** [[건국의 아버지들]](Founding Fathers), [[명백한 운명]](Manifest Destiny), 그리고 [[대가문]]의 이름이 전부 미국 동부의 주도(州都)다. 북부 [[대가문]]이 중부에서 옮겨간 가문이라는 점도 같은 계열이다 — 서부개척시대에 서부로 건너간 이들과 겹치는 위치다.\n\n## 양지의 이해집단\n\n- [[의회]] — 연방의 대표 통치기구\n- [[통합파]] · [[자치파]] — [[통일파]]에서 분화된 현재의 파벌\n- [[철도파]] — 구 철도파에서 살아남은 온건 계열\n- [[건국의 아버지들]] — 연방 건국의 주역. 현재는 와해\n- [[대가문]] — 13개 가문의 기성 권력층\n- [[헌병대]] 🗡️ — 연방의 유일한 군사조직\n- [[경찰청]] 🗡️ · [[보안관]] 🗡️ — 관할을 다투는 두 치안 조직\n- [[철도청]] · [[기동대]] 🗡️\n\n## 음지의 세력\n\n- [[명백한 운명]] 🗡️ — 연방의 붕괴를 목표로 삼는 테러조직\n- [[잭슨의 형제단]] 🗡️ — 열차 강도 사건 7할의 출처\n\n## 여담\n\n**이 문서의 시대는 '서사 시점'이다.** 위 역사와 양지의 이해집단은 의회·철도청·경찰청이 정상 작동하는 시점 기준이다. 위키 기준 현재에 연방은 이미 무너져 있으므로, 붕괴 이후를 다루는 [[명백한 운명]] 같은 문서는 `현대(붕괴 이후)`로 따로 달았다.\n\n**《가문과 가족》 20편이 딛고 있는 판이 전부 연말 위기의 후과다.** 궤간이 뒤죽박죽인 것, 대가문이 독자 행동하는 것, 경찰과 보안관이 관할을 다투는 것, 철도청이 무력을 쓰게 되는 것이 모두 위 「내부 문제」에서 나온다. 연방을 만든 수단(철도)이 연방을 앓게 만든 원인(사유 철도 난립)이라는 구조도 「형성 과정」의 헌법 조항 한 줄에서 시작한다.\n\n\n**수도 도시의 이름이 없다.** 수도가 [[수도주]]에 있다는 것과 그 안의 장소들(연방의회 건물 · 의회 거리 · 중앙역)은 나오지만, 도시 이름 자체는 아직 불린 적이 없다. 각 주의 도시 이름도 마찬가지다.\n\n**통일파가 준주·자치주 편입을 주장한 근거는 분명하지 않다.** 병합한 땅을 먼저 소화하자는 취지로 읽히지만, 그 이유가 직접 설명된 적은 없다.\n\n**연방군의 정체.** 「연말 위기」에서 \"연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성\"이라 하고, 비무장화는 그 정규군을 다시 \"특정 국가에 속하지 않은 용병단으로 환원\"시키는 것이었다. 그래서 [[하노버 용병단]] · [[프로이센 사단]] 같은 이름들이 지금도 남아 있다. 이들은 연방에 직접 속하지 않으므로 `03_세력`으로 분류할 예정이다.","parentId":"grenvillia"},{"title":"연방의 문화","id":"federation-culture","type":"국가","folder":"02_지역","sortOrder":8,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","문화","철도","교육","신분"],"memo":"새로 쓴 문서다. 작가 답변(2026-07-31)으로 확정된 것 — 종교가 없고, 신성제국이 신정으로 전환될 때 이탈했으므로 세속적이며 그래서 연합과 가깝다, 대가문 자제는 고등교육 평민은 기초교육 후 단순 노동자, 대가문의 힘은 그 지역 안에서만 강하고 영역 밖에서는 평민과 차이가 없다, 작중 '단말기'는 뭉뚱그린 표현으로 실제로는 역 내 통신시설이나 공무용 무전기다, 언론은 수도주에 하나뿐이다, 철도는 현실의 자동차에 대응하며 도로 대신 트램 선로가 깔려 있고 궤간 난립도 대부분 여기서 발생한다, 치킨누들 레스토랑은 체인이 아닌 특정 가게다.","image":"resource/wiki/연방의 문화.png","imageCaption":"트램이 지나는 대로변","summary":[["본문서","[[연방]]"],["다루는 범위","종교 · 교육 · 신분 · 생활 기반"],["종교","없음 — 세속 국가"],["이탈 시점","[[신성제국]]의 신정 전환기"],["교육","대가문 고등교육 · 평민 기초교육"],["신분","대가문의 힘은 지역 안에서만"],["교통","철도 (현실의 자동차)"],["도로","없음 — 인도와 트램 선로"],["통신","역 내 통신시설 · 공무용 무전기"],["언론","수도주에 하나"]],"content":"# 연방의 문화\n\n```틀\n연방\n```\n\n**신을 두지 않고 선로를 두었다.** [[신성제국]]에서 갈라져 나온 나라이면서 종교가 없고, 도로 대신 트램 선로가 깔린 곳이다.\n\n## 종교가 없다\n\n연방에는 종교가 없다. 세속 국가다.\n\n이 나라의 뿌리는 [[신성제국]]이지만, 갈라져 나온 시점이 **그쪽이 신정으로 전환할 때**였다. [[건국의 아버지들]]이 제국을 이탈한 것이 곧 신정을 등진 것이며, 그래서 이 나라는 처음부터 세속적이다.\n\n같은 이유로 [[연합]]과 가깝다. 숭배할 [[누스]]가 없어 자연과학으로 기운 헬라스와, 신정을 등지고 나온 연방은 세계를 보는 방식이 닮아 있다. → [[바다 민족]]의 두 갈래\n\n**그 세속성이 [[연방 헌법]]의 자리를 만든다** (추정). 신을 두지 않은 나라에서 절대적인 권위를 갖는 물건이 법전 하나뿐이라면, 그 법전이 실제로 초자연적인 힘의 매개체라는 설정은 이 나라의 성격과 정확히 맞물린다.\n\n## 철도가 곧 생활이다\n\n이 나라의 철도는 국가 기간망이기 전에 **현실의 자동차에 대응하는 교통수단**이다.\n\n- 지상에는 **인도**가 있고, 도로 자리에는 **트램 선로**가 깔려 있다.\n- [[대가문]]의 사치용 트램이 있다.\n- 개인이 직접 운전하는 트램이 있다.\n- 국가가 운영하는 기차가 있다.\n- 철도를 쓰는 교통수단이라면 연방 안에 거의 다 있다.\n\n**[[궤간 통일]]이 숙원인 이유가 여기 있다.** 궤간 난립은 국가 간선 문제가 아니라 대부분 이 생활 층위에서 발생한다. 가문마다, 지역마다, 개인마다 제각기 선로를 깔았기 때문이다.\n\n그래서 이 나라에서는 이동이 곧 환승이다.\n\n```대사\n이걸로 벌써 12번째 환승이야! 언제까지 갈아타야 하는 건데?\n— 동료 A, 1편\n```\n\n열차 강도가 흔한 것도 이 구조의 뒷면이다. 사람과 물건이 전부 선로 위에 있으므로 선로를 끊으면 무엇이든 멈춘다. → [[잭슨의 형제단]]\n\n## 신분\n\n[[대가문]]과 평민의 차이는 **그 지역 안에서만** 뚜렷하다.\n\n가문의 영역 안에서는 강력한 이권을 가진다. 9편의 [[필립]]처럼 [[보안관]]이 법적 관할을 무시하고 밀어붙일 수 있고, 3편처럼 저택이 습격당하면 그것이 곧 정치 사건이 된다.\n\n그러나 **영역 밖으로 나가면 평민과 크게 차이를 느낄 수 없다.** 그래서 [[네빌]]이 [[스프링필드]] 가를 등지고 [[수도주]]로 가서 [[철도청]] 비서가 되는 길이 열려 있고, 반대로 그 선택은 가문 사람에게 특권을 스스로 버리는 일이 된다.\n\n```대사\n대가문은 당신에게 ‘아무것도 아닌 것’ 이어야죠.\n왜요? 특권을 내려놓으려니 망설여지나요?\n— 세라, 16편 회상\n```\n\n## 교육\n\n교육이 신분에 따라 갈린다.\n\n| | 진로 |\n|---|---|\n| [[대가문]] 자제 | 일반적으로 모두 고등교육을 받는다 |\n| 평민 | 대부분 기초교육만 받고, 단순 노동자로 진로가 정해진다 |\n\n[[신성제국]]에 재단과 학원이 있고 [[연합]]이 길드로 기술을 전문화한 것과 달리, 연방의 교육은 계층을 재생산하는 쪽으로 작동한다.\n\n## 통신\n\n작중에 자주 나오는 '단말기'는 뭉뚱그린 표현이다. 실제로는 두 가지다.\n\n- **역 내 통신시설** — 철도망을 따라 놓인다\n- **공무용 무전기** — 직무상 지급되는 것\n\n개인이 늘 들고 다니는 물건이 아니다. 통신이 **철도망과 공무 계통에 얹혀 있으므로**, 선로가 닿지 않는 곳은 연락도 닿지 않는다.\n\n14편에서 [[세라]]가 [[네빌]]을 부를 때 쓴 것도 이 계통이며, 16편에서 \"선배 단말기로 직접 메시지를 남겼겠지\"라는 추론이나 \"단말기를 빼앗기신\" 같은 말이 성립하는 것도 그것이 개인 소유물이 아니라 직무 장비이기 때문이다.\n\n## 언론\n\n**수도주에 하나 있다.**\n\n그래서 여론이 수도주를 통해서만 형성된다 (추정). 지방에서 벌어진 일이 전국에 알려지려면 수도주를 거쳐야 하고, 8편에서 '분리 독립'이 소문의 형태로 연회장에 도는 것도 이 구조와 맞물린다. [[잭]]의 기호가 📰(신문)인 것도 그가 통합파 의원으로서 여론을 다루는 자리에 있다는 표시로 보인다.\n\n## 일상의 자리들\n\n- **치킨누들 레스토랑** — 체인이 아니라 특정 가게 하나다. 낮·저녁·새벽 세 시각의 배경이 등록되어 있다.\n- **[[북방주]]의 술집** — 지방의 사교 장소.\n- **[[수도주]]의 광장** — 아침과 심야의 배경이 있다. 아이들 사이에 \"매년 5월, 이맘때가 되면 새벽의 광장에서 아주 무서운 일이 벌어진다\"는 이야기가 돈다. → [[헌병대]]\n- **의회 연회장** — 의원들의 사교 자리. 8편의 무대다.\n\n## 관련 문서\n\n- [[연방]] · [[연방의 역사]] · [[연방의 지리]] · [[연방의 정치]]\n- [[철도청]] · [[궤간 통일]] · [[대가문]] · [[보안관]]\n- [[연방 헌법]] · [[헌병대]]\n- [[신성제국]] · [[연합]]\n\n## 여담\n\n**갈라져 나온 방향이 문화를 정했다.** [[신성제국]]이 신정으로 갈 때 등지고 나왔으므로 종교가 없고, 그 대신 법전 하나가 이 나라의 유일한 절대적 권위가 된다. 신을 두지 않은 나라에서 [[연방 헌법]]이 [[누스]]라는 설정은 우연이 아니라 이 계보의 결론으로 읽힌다.\n\n**강을 버리고 선로를 택한 것도 같은 성격이다.** 국토가 강과 평야인데 수운을 발달시키지 않고, 강을 '철로에 방해가 되는 것'으로 취급한다. 배를 국가의 축으로 삼은 [[신성제국]]과 정반대다. 물려받은 땅을 그대로 쓰지 않고 자기 방식으로 덮어쓰는 나라다.\n\n**아직 정해지지 않은 것.** 명절과 축제, 복장, 음식, 예술, 그리고 언론사의 이름. 종교가 없는 사회에서 무엇이 사람들을 한자리에 모으는지가 비어 있다.","parentId":"federation"},{"title":"연방의 역사","id":"federation-history","type":"국가","folder":"02_지역","sortOrder":5,"era":"근대","canon":"확정","status":"작성 중","tags":["연방","역사","미트로프"],"memo":"[[연방]] 문서가 길어져 「짤막한 역사」 일곱 절을 떼어낸 문서다. 문장은 원고 §1 연방(184~273행) 그대로이며 문체 통일만 적용했다. 시대는 서술 대상의 대부분이 연말 위기까지이므로 '근대'로 달았다.","image":"resource/wiki/연방의 역사.png","imageCaption":"연방의 역사","summary":[["본문서","[[연방]]"],["다루는 범위","건국 ~ [[연말 위기]] 직후"],["절 수","7"],["분기점","[[연말 위기]] — 시대의 경계"]],"content":"# 연방의 역사\n\n```틀\n연방\n```\n\n[[연방]]의 성립부터 [[연말 위기]] 직후까지. 이 나라의 현재 문제는 거의 전부 이 기간에 만들어졌다.\n\n```상세\n연방\n연말 위기\n```\n\n## 형성 과정\n\n다른 국가들에 비해 길지 않은 역사를 가지고 있다. ‘드레드노 제국’에서 이탈한 귀족 가문을 중심으로, 대륙 중부에 위치한 소국들이 연합 - 통일 과정을 거쳐 형성되었다. 연방 형성의 큰 발단이 된 귀족 가문은 훗날 ‘건국의 아버지들’이라는 명칭으로 불리게 되었다.\n\n대륙 중부 소국들의 기술 중, ‘철도’ 기술만큼은 대륙 내 다른 지역과 비교했을 때 독보적인 수준이었다. ‘건국의 아버지들’은 이러한 철도 기술을 적극적으로 활용해 각 소국들과 대가문들을 규합하는 핵심적인 요소로 활용했다.\n\n다만 그 과정에서 각 소국·대가문들의 자치권을 인정하는 ‘연방 헌법’의 내용에, ‘주’로서 편입될 대가문의 영지, 소국들은 각자의 철도 체계를 구성할 수 있다는 내용을 협상 과정에서 추가하게 되었고, 이러한 조항이 추후 사유 철도가 난립하게 되는 단초를 제공해버렸다.\n\n## 통일과 확장\n\n통일 직후의 연방은 크게 두 파벌로 나뉘어 대립했다. 각 가문들의 막대한 재력과 대륙 중부에서 활동하는 수많은 용병들을 활용하는 것을 바탕으로, ‘연방의 역량을 전 대륙에 투사해야 한다’는 입장의 ‘철도파’와, ‘우선 내부부터 정리해야 한다’는 입장의 ‘통일파’였다. 두 파벌은 각각 내부에서 다시 강경파와 온건파로 갈렸다.\n\n다만 두 파벌 모두 ‘무력 사용’을 전제하고 있었으므로, 연방의 군비 확장은 필연적으로 이루어졌다. 이미 어느정도 기존 소국들과 교류하며 철도망이 확보되어 있었던 ‘비숍스’와의 기술 거래를 통해 부족한 기술력을 충당하고, 어느정도 역량이 확보되자 바로 확장을 시작했다.\n\n첫 번째 타겟은 연방과 북부 국경을 맞대고 있는 강대국 ‘쾨벤하운’이었다. 연방군은 여러 형태의 철도를 통한 빠른 기동 작전으로 쾨벤하운 왕국을 빠르게 함락시킬 수 있었다. 이후 쾨벤하운 왕국을 통째로 병합하였으며, 왕국은 지도에서 사라지게 되었다.\n\n쾨벤하운 왕국을 병합하는 과정에서 철도파와 통일파의 충돌이 이루어졌다. 철도파는 왕국의 영토를 본토로 편입하여 빠르게 철도망을 개발해야 한다고 주장하였고, 통일파는 우선 ‘준주’ 혹은 ‘자치주’로 편입해야 한다고 주장했다.\n\n쾨벤하운과의 전쟁은 너무나도 압도적인 승리였기에, 결과는 철도파 의원들이 우세했고, 결국 쾨벤하운 왕국은 연방의 본토 ‘북방주’로 완전히 편입되어버렸다. 쾨벤하운 왕가는 명목상으로는 연방의 ‘대가문’으로 위치할 수 있었지만, 얼마 지나지 않아 이들은 모두 종적을 감추어버렸다.\n\n## 크레스티아-미트로프 전쟁\n\n연방의 다음 목표는 확장된 영토의 국경과 맞대고 있는 기존의 패권국 ‘크레스티아 제국’이 되었다. 대륙 통일이 목표였으므로 서부의 ‘비숍스 연합’이나, 동부의 ‘드레드노 신성제국’도 노려볼 수 있었지만, 가장 강력한 군사력을 갖춘 ‘크레스티아 제국’이 우선 목표가 되었다.\n\n비숍스의 경우 일시적이지만 연방과의 기술 거래를 통한 협력 관계였고, 드레드노는 강과 산맥으로 분리되어 있었기에, 크레스티아 제국 말고는 별다른 선택지도 없던 상황이었다.\n\n쾨벤하운 왕가의 출신지가 크레스티아 제국의 영토 안에 위치해있었고, 먼 과거 실제로 쾨벤하운 왕국이 크레스티아 제국 영토의 일부를 지배했던 때가 있었으므로, 이를 명분으로 선전포고를 진행했다. 다만, 이때는 쾨벤하운 때와 달리 대륙의 다른 강대국들이 연방을 규탄하기 시작했다.\n\n쾨벤하운 왕국은 대외적으로 고립주의를 표방하고 있어 주재하는 외교관들이 하나도 없었고, 또 병합당해도 크게 힘의 균형이 흔들리지 않는 수준이었다. 하지만 크레스티아 제국은 명백한 열강이자 패권국으로, 다른 국가들과의 이해관계가 복잡하게 얽혀있는 상태였다.\n\n또한 쾨벤하운 왕국을 그대로 ‘병합’해버린 것도 다른 국가들의 긴장감을 강화하게 된 원인으로 작용했다. 다른 국가들의 눈에는 연방이 새로운 패권국으로서 등장했고, 기존 패권국까지 흡수할 경우 대륙 힘의 균형이 완전히 붕괴할 수 있다는 우려로 행동에 나서게 되었다.\n\n그럼에도 연방은 전쟁을 강행했고, 크레스티아 제국에 쾨벤하운 왕국 때와 같이 철도를 통한 전면적인 공세가 시작되었다. 다만 크레스티아 제국 또한 막강한 산업력과 지하 자원, 광대한 영토를 보유하고 있었으므로 쾨벤하운 때와 달리 연방은 고전을 면치 못했다.\n\n## 크레스티아 제국 해체\n\n외부에서 보았을 때, 전쟁은 시간이 지날 수록 크레스티아 제국에게 유리해져 가고 있었다. 연방은 비숍스에서 이전받은 기술을 통해, ‘열차포’로 대표되는 화기까지 발명해 전선에 투입해보았지만, 크레스티아 제국의 압도적인 규모에 밀려나고 있었다.\n\n하지만 연방은 그럼에도 전쟁을 포기하지 않았는데, 이는 크레스티아 제국 내부 혁명 세력이 존재함을 알고, 몰래 지원해주고 있었기 때문이다. 이들은 ‘콘베이아 컴퍼니’를 기반으로 두는 기업가, 부호 세력이었는데, 전쟁 전부터 제국에게 많은 부분을 동원당하고 있어 불만이 많았다.\n\n어느정도 크레스티아 제국의 역량이 분산되었을 시점, 이들은 기다렸다는 듯 반란을 일으켰다. 기존 제국 세력과, 신생 콘베이아 컴퍼니 세력의 내전이 시작되었고, 연방이 지원하던 컴퍼니는 연방과 조약을 맺어 크레스티아 제국을 양쪽에서 압박하게 되었다.\n\n사실 컴퍼니 세력과의 협력은 철도파 내부적으로는 매우 불만스러웠으나, 무턱대고 합병하였을 때의 후폭풍을 우려하여 적국의 내부 세력을 지원하는 방안을 새로 고려해보았고, 그 결과 콘베이아 컴퍼니를 지원하게 되었다.\n\n결국 얼마 지나지 않아 크레스티아 제국은 멸망했다. 기존 제국 영토의 80%는 연방이, 나머지 20%는 콘베이아 컴퍼니의 통제 하에 있는 상태로 전쟁이 끝나고 크레스티아 황가는 모두 콘베이아 컴퍼니 세력에 의해 처형당하게 되었다.\n\n전쟁은 명백한 연방측의 승리로 끝났고, 콘베이아 컴퍼니도 반쯤은 연방의 괴뢰국으로서 기능하고 있었으나, 연방은 다시금 전쟁의 위기에 처하게 되었다. 바로, 대륙의 남은 열강들이 연합하여, 연방에게 최후통첩을 전달한 것이다.\n\n## 연말 위기\n\n연방과의 협력을 파기하고 비숍스 연합이 먼저 드레드노 신성제국에게 연합을 제의했고, 드레드노 제국이 남부 군도의 왕국과 기타 중견국들을 모두 끌어들여 형성된 반 연방 세력은 크레스티아 제국이 멸망하는 것을 마주하자 연방에게 최후통첩을 전달하게 되었다.\n\n최후통첩의 내용은 다음과 같았다. 연방이 점거한 제국 영토를 제국의 후신으로 판단되는 콘베이아 컴퍼니에게 전부 반환할 것, 콘베이아 컴퍼니는 연방에 귀속되지 않으며 일반적인 기업이 아닌 독립된 권리를 가진 ‘기업국가’로서 존속할 것, 과거 연방이 편입한 쾨벤하운 왕국을 독립시킬 것.\n\n최후통첩을 받은 연방은 초기에는 ‘반 연방 세력과도 전쟁하자’는 철도파의 주장이 우세했다. 구 패권국이었던 크레스티아 제국과도 승리했으므로, 나머지 국가들도 어렵지 않게 굴복시킬 수 있다는 생각에서 기인한 주장이었다.\n\n하지만 반대로 전쟁을 반대하는 주장도 적지 않았는데, 크레스티아 제국과의 전쟁에서 소모된 역량이 너무나도 크다는 것이 이유였다. 연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성되어 있었어서 역량은 뛰어나나, 소모되었을 때 보충하는 것이 매우 어려웠다.\n\n객관적으로도 당시 전쟁은 매우 위험한 도박이었으나, 크레스티아 제국에게 승리했다는 사실 하나만으로 고취된 상태라, 연방은 연합의 최후통첩을 무시하기로 결정하고 빠르게 다시 전쟁을 준비하게 되었다.\n\n연방의 전 국경에 군사들이 배치되고, 최후통첩을 거부하고 선전포고문을 작성하기 바로 사흘 전, 전쟁이 코 앞에 다가온 상황에서 전쟁을 반대하던 ‘통일파’ 의원들은 결국 쿠데타를 모의하게 되었다. 선전포고문을 발표하기 전, ‘철도파’ 의원들을 한 곳에 모으고, 한 번에 제거해버리자는 계획이었다.\n\n## 신질서의 시작\n\n통일파 의원들의 계획은 결국 실행되었고, 또 성공하게 되었다. 과정에서 쿠데타 계획이 철도파 의원 한 명에게 노출되었으나 그 의원이 통일파 의원에게 감화되어 계획을 묵인하였고, 장소로의 유인을 위해 통일파 의원 한 명이 끝까지 그 장소를 지키다 사망하는 등의 극적인 과정이 있었다.\n\n철도파 의원들이 모인 곳에서 준비된 큰 화재가 발생하였고, 그 자리에서 급진적인 철도파 의원, 전쟁에 우호적이었던 의원이 대부분 사망하였으며, 그 때에 맞춰 통일파 의원들은 반 연방 세력에게 최후통첩에 대한 협상을 시작하게 되었다.\n\n최후통첩을 받아들이되, ‘쾨벤하운 왕국’은 여전히 연방의 ‘북방주’로 남기는 것을 요구했다. 반 연방 세력은 명분을 따지며 거절했으나, 연방이 대신 조건으로 ‘완전한 비무장화’를 내세웠고, 비무장화를 수용하는 조건으로 쾨벤하운 왕국의 병합을 승인했다.\n\n비무장화의 세부적인 내용은, 연방 정규군을 모두 특정 국가에 속하지 않은 용병단으로 환원시키고, 정규군 조직 중 가장 규모가 작았던 ‘헌병’만 남길 수 있다는 것이었다. 이 조항으로 인해 현대 연방에는 ‘헌병’과 ‘경찰’, ‘보안관’만이 무력집단으로 존재할 수 있는 상태다.\n\n나머지 조건인 컴퍼니의 기업국가화는 승인하되, 콘베이아 컴퍼니의 무역권을 독점하는 조항을 추가하였으며, 컴퍼니에게 영토를 반환하는 대신, 그렌빌리아 대륙 전체에 연방의 체계에 맞춰 철도망을 설립한다는 조항을 추가했다.\n\n철도망 설립에 대한 조항은 비교적 온건한 성향에, 전쟁을 반대하는 측이어서 생존한 철도파 잔존 의원들의 의견이 반영된 결과였다. 처음에는 연방에 너도 나도 할 것 없이 굴욕적인 협상이라고 비판받았으나, 현재까지 이어지는 철도망을 위시한 ‘미트로프 중심 질서’를 만든 일등공신이었다.\n\n## 내부 문제\n\n연말 위기는 막을 내리고, 진보된 연방의 철도망을 위시한 무역 체제가 시작되어 대륙 전체적으로는 희망적인 분위기가 조성되었지만, 연방 내부적으로는 많은 정치적 문제가 뒤따르게 되었다.\n\n첫 번째는 ‘철도를 통한 통합’을 주장하던 철도파 의원, 대가문 세력이 모조리 붕괴하면서, 연방 내의 뒤죽박죽인 철도 궤간, 사유 철도, 각 대가문별 철도 이권들이 난립하여 정작 연방 내부의 철도 체계를 정비할 명분도, 힘도 없어져버린 것이다.\n\n두 번째는 테러와 쿠데타의 발생으로 의회를 향한 신뢰가 떨어지게 되어, 일부 대가문들은 의회에서 벗어나 독자적인 행동을 벌이고, 대가문 중심의 사고방식이 다시 자리잡게 된 것이다. ‘건국의 아버지들’이 통일의 기반으로 다져둔 의회가 신뢰를 잃으며, 통일된 연방 자체의 결속력이 흔들리게 되었다.\n\n마지막으로 비무장화로 인한 치안 악화가 따르게 되었지만, 이러한 문제는 연방 차원에서 관리하는 ‘경찰대’를 엄청나게 늘리고, 대가문과 각 주, 지역들 자체적으로 관리하는 ‘보안관’을 확대하는 방향으로 어느정도 해소할 수 있었다. 다만 과정에서 경찰과 보안관 간의 갈등이 벌어졌다.\n\n## 여담\n\n**이 나라가 갈라져 나온 시점이 성격을 정했다.** [[건국의 아버지들]]이 [[신성제국]]에서 이탈한 것은 **그쪽이 신정으로 전환할 때**였다. 신정을 등지고 나왔으므로 연방은 처음부터 종교를 두지 않는다. → [[연방의 문화]]\n\n**연방을 만든 수단이 연방을 앓게 만들었다.** 「형성 과정」의 헌법 조항 한 줄 — 각 주가 제각기 철도 체계를 구성할 수 있다 — 이 사유 철도 난립의 씨앗이 된다. 철도로 뭉친 나라가 철도 때문에 갈라지는 구조다.\n\n**[[연말 위기]] 이후가 《[[가문과 가족]]》의 판이다.** 궤간이 뒤죽박죽인 것, [[대가문]]이 독자 행동하는 것, [[경찰청]]과 [[보안관]]이 관할을 다투는 것, [[철도청]]이 무력을 쓰게 되는 것이 모두 「내부 문제」에서 나온다.\n\n**'무역권을 독점하는 조항'의 주체는 연방이다.** 위 「신질서의 시작」의 문장은 어느 쪽이 독점하는지가 읽기에 따라 갈리는데, **연방이 [[컴퍼니]]와의 무역권을 독점한다**는 뜻이다. 컴퍼니는 철강·차량·광업의 1차 생산자이고 연방이 그 최대 고객이다. 즉 이 조항은 연방이 내준 것이 아니라 얻은 것이며, 땅은 돌려주고 시장은 가져온 협상이 된다.\n\n**통일파가 준주·자치주 편입을 주장한 근거는 분명하지 않다.** 병합한 땅을 먼저 소화하자는 취지로 읽히지만, 그 이유가 직접 설명된 적은 없다.\n\n**연방군의 정체.** 「연말 위기」에서 \"연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성\"이라 하고, 비무장화는 그 정규군을 다시 \"특정 국가에 속하지 않은 용병단으로 환원\"시키는 것이었다. 그래서 [[하노버 용병단]] · [[프로이센 사단]] 같은 이름들이 지금도 남아 있다.","parentId":"federation"},{"title":"연방의 정치","id":"federation-politics","type":"국가","folder":"02_지역","sortOrder":6,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","정치","의회","과두정"],"memo":"새로 쓴 문서다. 작가 답변(2026-07-31)으로 확정된 것 — 의장은 있으나 권력이 약하고 간접 선거로 뽑힌다, 작중에서는 데이비스의 모략으로 등장하지 못했다, 행정부와 사법부가 둘 다 부재하며 과거 건국의 아버지들이 겸했다, 사법 기능은 보안관·경찰에게 애매하게 승계되었다, 의회는 사실상 귀족 과두정이며 대가문 대표 + 시민 지지 민간인 일정 비율, 시민 참여는 민원·청구·집회·쟁의·결사, '국제법'은 실제 국제법이 아니라 연말 위기 조약 조항이며 하워드가 그렇게 칭하는 것. 관문과 궤간을 잇는 추론은 본문에 추정으로 표시했다.","image":"resource/wiki/연방의 정치.png","imageCaption":"연방의회 본회의장","summary":[["본문서","[[연방]]"],["다루는 범위","입법 · 행정 · 사법 · 의회 구성"],["체제","사실상 귀족 과두정"],["입법","[[의회]]"],["행정","부재 (과거 [[건국의 아버지들]])"],["사법","부재 — [[보안관]]·[[경찰청]]이 승계"],["최상위 의결","부재 — [[건국의 아버지들]]의 빈자리"],["의장","간접 선거 · 권력은 약하다"],["의원 구성","대가문 대표 + 민간인 일정 비율"],["최고 규범","[[연말 위기]] 조약"]],"content":"# 연방의 정치\n\n```틀\n연방\n```\n\n**세 기둥 중 둘이 없는 나라다.** 입법만 남아 있고 행정과 사법이 비어 있으며, 그 위에 있던 최상위 의결 기구마저 사라졌다. 지금 이 나라에서 벌어지는 거의 모든 분쟁이 그 공백에서 나온다.\n\n## 비어 있는 자리\n\n[[건국의 아버지들]]은 최상위 의결 기구이면서 **행정과 사법도 함께 맡고 있었다.** [[연말 위기]]에서 이들이 와해되자 세 기능이 한꺼번에 사라졌다.\n\n| 기능 | 예전 | 지금 |\n|---|---|---|\n| 최상위 의결 | [[건국의 아버지들]] — 만장일치, 법적 논의의 바깥 | **없음** |\n| 행정 | [[건국의 아버지들]] | **없음** |\n| 사법 | [[건국의 아버지들]] | **없음** — [[보안관]]·[[경찰청]]에 애매하게 승계 |\n| 입법 | [[의회]] | [[의회]] |\n\n### 행정부가 없다는 것\n\n이것이 서사에서 벌어지는 일들의 뿌리다.\n\n- **관할 문제가 생긴다.** [[경찰청]]과 [[보안관]]이 같은 땅에서 치안을 다투는데, 위에서 정리해 줄 기관이 없다.\n- **각 부처가 독자적으로 위기에 대응한다.** [[철도청]]이 무력([[기동대]])을 갖고, [[경찰청]]이 스스로 판단해 인력을 움직인다. 12편에서 조작된 [[0호 비상사태]] 지령이 통한 것도 검증할 상급 기관이 없기 때문이다.\n- **부처끼리 조율되지 않는다.** 9편에서 동방주가 조례로 경찰을 무장해제시킬 때, 이를 막을 행정 라인이 존재하지 않는다.\n\n### 사법부가 없다는 것\n\n재판이 필요한 일을 [[보안관]]과 [[경찰청]]이 나눠 맡는다. 어느 쪽 관할인지가 곧 어느 쪽 법을 따를지의 문제가 되므로, 관할 다툼은 단순한 밥그릇 싸움이 아니라 **어느 법으로 판단할지의 싸움**이다.\n\n9편에서 [[필립]]이 법적 관할을 따지는 경찰에게 \"관할이고 뭐고\"라 답할 수 있는 것도 이 구조 때문이다. 판정해 줄 상급심이 없다.\n\n14편에서 [[네빌]]이 반역죄로 몰리는 절차 역시 이 공백 위에서 굴러간다.\n\n## 의회\n\n유일하게 남은 통치 기구다. → [[의회]]\n\n### 구성\n\n**사실상 귀족 과두정이다.**\n\n- **[[대가문]]** — 각 가문이 자체적으로 대표자를 선출해 의원으로 세운다.\n- **민간인** — 시민의 지지를 받는 이들이 일정 비율로 선출된다.\n\n투표로 의원을 뽑는 구조가 아니므로 별도의 '당'이 없고, 대신 성향으로 묶인 파벌이 있다. → [[통합파]] · [[자치파]] · [[철도파]]\n\n### 의장\n\n의장이 있다. 다만 **권력이 크지 않다** — 절차를 주도하고 중재하는 역할에 가깝다. 간접 선거로 선출된다.\n\n《[[가문과 가족]]》에서 의장은 한 번도 등장하지 않는다. [[데이비스]]의 모략으로 등장할 수 없었다. 그래서 [[북부동맹]]이 의회를 장악한 11편 이후의 본회의장에는 절차를 주도할 사람이 없고, 필리버스터와 독립 선언과 개헌이 차례로 통과되어 버린다.\n\n## 법\n\n두 층으로 되어 있다.\n\n| 층 | 정체 |\n|---|---|\n| **'국제법'** | [[연말 위기]]에서 체결된 조약의 조항들. 실제 국제법이 아니라 [[하워드]]가 그렇게 칭하는 것이다 |\n| **연방법** | 연방 자체의 법. 근거인 [[연방 헌법]]이 소실되어 있다 |\n| **조례** | 주 단위 입법. 동방주가 심야 조례로 경찰 무장해제를 통과시킨 것이 그 예다 |\n\n조약이 연방법보다 위에 있다는 것이 이 나라의 처지를 말해 준다. [[하워드]]가 [[연합]]의 개입을 끌어들일 때 쓰는 무기도 이것이다.\n\n```대사\n하워드 의원도 잘 알고 계시겠죠, 연방법보다 ‘국제법’에 더 능하신 분\n— 13편\n```\n\n그리고 [[연방 헌법]]이 소실되어 있으므로 연방법의 근거 자체가 흔들린다. [[헌병대]]가 \"집행할 법이 없다면, 헌병이 무슨 의미가 있을까요\"라 말하는 자리가 여기다.\n\n## 시민\n\n선거 제도는 자리잡지 못했다. 시민은 **각 지역의 대표자에게** 다음 방식으로 참여한다.\n\n- 민원\n- 청구\n- 집회\n- 쟁의\n- 결사\n\n9편에서 파출소를 찾은 [[필립]]이 \"나 민원인 아니고 도버 가 보안관이요\"라 밝히는 대목이 이 통로가 일상적으로 쓰인다는 표시다.\n\n## 관련 문서\n\n- [[연방]] · [[연방의 역사]] · [[연방의 지리]] · [[연방의 문화]]\n- [[의회]] · [[통합파]] · [[자치파]] · [[철도파]] · [[건국의 아버지들]]\n- [[경찰청]] · [[보안관]] · [[헌병대]] · [[철도청]]\n- [[연말 위기]] · [[연방 헌법]] · [[0호 비상사태]]\n\n## 여담\n\n**연말 위기가 이 나라에서 지운 것은 사람이 아니라 기능이다.** 의원 몇 명이 죽은 사건으로 보이지만, 실제로 사라진 것은 행정·사법·최상위 의결이라는 세 층이다. 그 뒤로 이 나라는 입법 기구 하나로 굴러가고, 남은 부처들이 각자 판단해 움직인다.\n\n그래서 《[[가문과 가족]]》의 사건들이 전부 **절차의 빈틈**에서 일어난다. 조작된 지령이 통하고, 심야 조례가 현장에서 집행되고, 민간인이 헌병을 거느리고, 개헌안이 본회의장에서 즉석으로 통과된다. 막을 기관이 없다.\n\n**의장의 부재가 그 마지막 자물쇠였다** (추정). 권력이 약한 자리이지만 절차를 주도하는 사람이므로, 그 자리가 비면 본회의장의 순서 자체를 아무나 쥘 수 있게 된다. [[데이비스]]가 굳이 의장을 막은 이유로 읽힌다.","parentId":"federation"},{"title":"연방의 지리","id":"federation-geography","type":"국가","folder":"02_지역","sortOrder":7,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","지리","행정구역","철도"],"memo":"새로 쓴 문서다. 작가 답변(2026-07-31)으로 확정된 것 — 연방은 바다에 닿지 않는 내륙국이고 남쪽 칼리아리 왕국이 바다로 나가는 주요 통로다, 지형은 강과 평야이며 강은 철로에 방해가 된다고 여겨 적극적으로 이용하지 않는다, 남방주는 칼리아리 왕국과 맞닿아 수출로 먹고 살고 서방주는 연합과 맞닿아 올림피아드 지부가 있으며 기술·연구·교육으로 먹고 산다, 대가문은 수도주 1개 나머지 4주 각 3개, 흡수한 크레스티아 영토는 연말 위기 때 컴퍼니에 반환했다. 관문과 궤간을 잇는 해석은 추정으로 표시했다.","image":"resource/wiki/연방의 지리.png","imageCaption":"연방 전도","summary":[["본문서","[[연방]]"],["다루는 범위","5주 · 지형 · 해로 · 대외 무역"],["위치","대륙 중부 요충지"],["바다","닿지 않는다 (내륙국)"],["바다로 나가는 통로","[[칼리아리 왕국]] (남쪽)"],["지형","강과 평야"],["행정구역","5주 · 주 경계는 관문"],["대가문 배분","수도주 1 · 나머지 4주 각 3"],["대외 무역","[[컴퍼니]] 무역권 독점"],["국토의 뼈대","철도"]],"content":"# 연방의 지리\n\n```틀\n연방\n```\n\n대륙 중부의 요충지를 차지한 **내륙국**이다. 바다에 닿지 않으며, 국토는 강과 평야로 되어 있다. 그 위에 철도가 깔려 있고, 철도가 곧 이 나라의 뼈대다.\n\n## 다섯 주\n\n| 주 | 성격 | 대가문 |\n|---|---|---|\n| **[[수도주]]** | [[의회]]·[[경찰청]]·[[철도청]]이 모인 중심. [[통합파]]의 기반 | 1개 |\n| **[[북방주]]** | 병합한 쾨벤하운 왕국의 영토가 편입된 주. [[대가문]]의 장악력이 가장 세다. [[자치파]]의 기반 | 3개 |\n| **동방주** | [[자치파]]의 기반. 9편에서 심야 조례로 경찰 무장해제를 밀어붙인 곳 | 3개 |\n| **남방주** | [[칼리아리 왕국]]과 접한다. **수출**로 먹고 산다. [[철도파]]의 기반 | 3개 |\n| **서방주** | [[연합]]과 접하고 [[올림피아드]] 지부가 있다. **기술·연구·교육**으로 먹고 산다. [[철도파]]의 기반 | 3개 |\n\n[[대가문]] 13개가 수도주에 하나, 나머지 네 주에 각각 셋씩 나뉜다. **수도주만 하나라는 점이 그 주의 성격을 말해 준다** — 중앙 기구가 모인 곳이라 가문의 힘이 가장 약하다.\n\n## 지형\n\n**강과 평야**로 대표된다. 산악이 국토를 가르지 않으므로 철도를 깔기에는 유리한 땅이다.\n\n다만 **강은 철로를 놓는 데 방해가 된다고 여겨져, 적극적으로 이용되지 않는다.** 수운을 발달시키는 대신 강을 건너는 문제로 취급한다. 배를 국가의 축으로 삼은 [[신성제국]]과 정확히 반대되는 선택이며, 이 나라가 물길이 아니라 선로로 굴러간다는 뜻이다.\n\n## 관문\n\n주와 주 사이에는 **관문**이 있다. 배경 이름이 그 구조를 보여 준다 — `연방 수도주, 북방주 관문` · `연방 동방주, 수도주 관문` · `북방주 관문 지역`. 어느 주에 있으면서 어느 주로 향하는 문인지가 이름에 들어간다.\n\n**주마다 철도 궤간이 다르므로, 관문은 갈아타는 자리이기도 할 것으로 추정된다.** 1편에서 [[네빌]]이 고향까지 가며 열두 번을 환승하는 것이 그 방증이다. [[궤간 통일]]이 [[철도청]]의 숙원인 이유도 여기 있다.\n\n```대사\n이걸로 벌써 12번째 환승이야! 언제까지 갈아타야 하는 건데?\n— 동료 A, 1편\n```\n\n## 바깥으로 나가는 길\n\n바다에 닿지 않으므로 대외 통로가 이웃 나라에 달려 있다.\n\n| 방향 | 접한 곳 | 뜻 |\n|---|---|---|\n| 남 | [[칼리아리 왕국]] | **바다로 나가는 주요 통로.** 남방주의 수출이 여기를 지난다 |\n| 서 | [[연합]] | 기술이 들어오는 창구. 서방주에 [[올림피아드]] 지부 |\n| 북 | [[컴퍼니]] | 옛 [[크레스티아 제국]] 땅. 연방이 **컴퍼니와의 무역권을 독점한다** |\n| 동 | [[신성제국]] | 강과 산맥으로 갈려 접점이 적다 |\n\n**바다가 없다는 것이 이 나라의 약점이다** (추정). 남방주의 수출은 [[칼리아리 왕국]]을 거쳐야 하고, 기술은 [[연합]]이 쥐고 있다. 대륙 전체에 철도망을 깔겠다는 [[연말 위기]] 조약 조항이 굴욕적인 협상으로 비판받았음에도 '일등공신'이 된 이유가 여기서 나온다 — 그것이 이 내륙국이 바깥으로 뻗을 수 있는 유일한 수단이었다.\n\n**북쪽만은 사정이 다르다.** [[컴퍼니]]는 철강·차량·광업의 1차 생산자이고, **연방이 그 최대 고객이다.** [[연말 위기]] 조약으로 연방이 컴퍼니와의 무역권을 독점했으므로, 이 방향은 약점이 아니라 연방이 쥔 몫이다. 땅은 돌려주고 시장은 가져왔다.\n\n## 잃은 땅\n\n[[크레스티아 제국]]을 해체시키며 그 영토의 80%를 차지했으나, **[[연말 위기]] 조약으로 [[컴퍼니]]에 전부 반환했다.** 지금의 5주에는 그 땅이 없다.\n\n땅을 내주면서 **그 땅의 생산물을 사들일 권리를 얻었다.** 영토를 잃은 협상이 경제적으로는 남는 장사가 된 자리다.\n\n## 관련 문서\n\n- [[연방]] · [[연방의 역사]] · [[연방의 정치]] · [[연방의 문화]]\n- [[수도주]] · [[북방주]]\n- [[철도청]] · [[궤간 통일]] · [[대가문]]\n- [[칼리아리 왕국]] · [[연합]] · [[컴퍼니]] · [[신성제국]]\n\n## 여담\n\n**정치 지형이 지리 그대로다.** 중앙 기구가 모인 [[수도주]]는 [[통합파]], 대가문이 센 [[북방주]]·동방주는 [[자치파]], 바깥과 접한 남방주·서방주는 [[철도파]]의 기반이다. 의회의 세 파벌이 지도 위에 그대로 놓여 있다.\n\n**서방주가 조용한 이유가 있다** (추정). 대본에 남방주는 4건, 서방주는 1건뿐이다. 그런데 서방주에는 [[올림피아드]] 지부가 있고 [[철도파]]가 [[연합]]과 협력하는 통로이기도 하다. 11편에서 [[하워드]]가 [[연합]]의 개입을 끌어들이는 대목은 이 주를 거쳐 갔을 가능성이 있다.\n\n**아직 정해지지 않은 것.** 각 주의 도시 이름, 강과 평야의 고유 지명, 그리고 수도의 이름. 주 이름만 있고 도시명은 [[대가문]]의 이름으로만 나온다.","parentId":"federation"},{"title":"의회","id":"parliament","type":"세력","folder":"02_지역","sortOrder":5,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","통치기구"],"memo":"원문 280~285행 문장 그대로. 음슴체가 아니라 원래 평서체로 쓰인 항목이라 어미를 손대지 않았다.","image":"resource/wiki/의회.png","imageCaption":"연방의회 건물","summary":[["소속","[[연방]]"],["성격","연방의 대표 통치기구"],["의원 선출","지역·가문별 할당"],["정당","없음"],["소재","수도주 연방의회 건물"],["결정 사항","군사 소집 · 정책 결정 · 법안 발의"],["파벌","[[통합파]] · [[자치파]] · [[철도파]]"],["직속 무력","[[헌병대]]"],["산하 기구","[[경찰청]] · [[철도청]]"],["표어","우리의 힘은 연결에서 나온다"]],"content":"# 의회\n\n```틀\n연방\n```\n\n연방의 대표 통치기구, 투표를 통해 의원을 선정하는 것이 아닌, 지역, 가문별로 할당된 의원을 주기적으로 배출하는 형태이기에 별도의 ‘당’ 구분이 존재하지 않는다.\n\n주요 장소는 연방 수도주 ‘연방의회’ 건물로, 군사 소집, 정책 결정, 법안 발의 등의 국가적 사안은 모두 의원들이 이 곳에 모여 결정한다.\n\n```표어\n우리의 힘은 연결에서 나온다. ‘의회’는 연방의 가문, 연방의 주, 연방의 사람을 잇는 심장이다\n```\n\n## 남은 하나\n\n[[연말 위기]] 이후 이 나라에 남은 통치 기구는 의회 하나다. 행정부와 사법부는 [[건국의 아버지들]]이 겸하고 있었고, 그들이 와해되면서 함께 사라졌다. → [[연방의 정치]]\n\n### 구성\n\n**사실상 귀족 과두정이다.** [[대가문]]이 자체적으로 선출한 대표자가 의원이 되고, 시민의 지지를 받는 민간인이 일정 비율로 선출된다. 투표로 의원을 뽑는 구조가 아니므로 '당'이 없다.\n\n### 의장\n\n의장이 있다. 다만 권력이 크지 않으며 절차를 주도하고 중재하는 역할에 가깝고, 간접 선거로 선출된다.\n\n《[[가문과 가족]]》에서 의장은 한 번도 등장하지 않는다. [[데이비스]]의 모략으로 등장할 수 없었다. 그래서 [[북부동맹]]이 의회를 장악한 뒤의 본회의장에는 절차를 주도할 사람이 없고, 필리버스터와 독립 선언과 개헌이 차례로 통과된다.\n\n## 관련 문서\n\n- [[연방]]\n- [[통합파]] · [[자치파]] · [[철도파]] — 현재의 파벌\n- [[통일파]] · [[건국의 아버지들]] — 지금은 없는 파벌\n- [[헌병대]] — 의회 직속 무력\n- [[경찰청]] · [[철도청]] — 산하 기구\n- [[대가문]]\n- [[연방의 정치]] — 통치 구조 전반\n\n## 여담\n\n**당이 없다는 것이 이 나라의 정치를 결정한다.** 의원을 투표로 뽑지 않고 지역·가문별 할당으로 배출하므로, 의원은 유권자가 아니라 자기를 보낸 지역과 가문에게 묶인다. [[자치파]]가 [[대가문]]·[[보안관]]을 힘의 통로로 쓰는 것도, 대가문 유력자가 아예 의회에 나오지 않고도 영향력을 갖는 것도 여기서 나온다.\n\n**연말 위기로 잃은 것이 신뢰다.** 테러와 쿠데타가 의회 안에서 벌어진 뒤 일부 대가문이 의회를 떠나 독자 행동을 시작했다. [[건국의 아버지들]]이 통일의 기반으로 다져둔 기구가 무게를 잃으면서 연방의 결속 자체가 흔들렸다. → [[연방]]의 「내부 문제」\n\n**동원 절차가 서사의 장치가 된다.** [[헌병대]]는 의회 직속이지만 법적 절차와 의원 간 이해관계가 맞아야 움직인다. 그래서 '0호 비상사태' 같은 지령이나 의회 진입 여부가 그대로 사건이 된다.","parentId":"federation"},{"title":"자치파","id":"autonomists","type":"세력","folder":"02_지역","sortOrder":30,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 292~295행 문장 그대로. 문서 제목은 '자치파 의원'이 아니라 '자치파'로 두었다 — [[통합파]]와 같은 이유.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","[[통일파]] 온건 계열"],["목표","자치권 확대 · 타 지역 합류"],["지역 기반","북방주 · 동방주"],["힘의 통로","[[대가문]] · [[보안관]]"],["대표 인물","[[데이비스]]"],["귀결","[[북부동맹]] · [[미트로프 내전]]"]],"content":"# 자치파\n\n과거 존재했던 ‘통일파’에서 분화된 성향을 가진 의원 집단. 각 지역의 자치권 확대와 타 지역들의 연방 합류를 핵심 목표로 삼고 활동하는 이들을 지칭한다. ‘북방주’, ‘동방주’ 등을 지역적 기반으로 두고 있으며, ‘대가문’과 ‘보안관’ 등 지역 세력을 통해 정치적 힘을 행사한다.\n\n```표어\n과도한 연결로 인해 연방이 폭주기관차처럼 날뛰게 된 것 아닌가? 오히려 우리는 거리를 두어야 할 필요가 있다.\n```\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 전신\n- [[통합파]] — 같은 뿌리에서 갈라진 상대 파벌\n- [[대가문]] · [[보안관]] — 정치적 힘의 통로\n- [[북부동맹]] — 자치파에서 이어지는 분리 독립 구상\n\n## 여담\n\n**서사에서 가장 멀리 간 파벌이다.** [[데이비스]]는 자치파 의원에서 [[북부동맹]] 위원장으로 옮겨가며, 자치권 확대라는 목표를 결국 분리 독립까지 밀고 간다. 《가문과 가족》 후반부의 [[미트로프 내전]]이 그 결과이고, 붕괴 이후의 [[명백한 운명]]은 그를 잇겠다는 자들이 그의 말을 상징으로 채택한 조직이다.\n\n**목표 두 개가 서로 당긴다.** '각 지역의 자치권 확대'와 '타 지역들의 연방 합류'가 한 문장에 있다. 자치를 넓히면서 새 지역을 끌어들이려면 연방이 느슨한 형태여야 하므로 논리는 통하지만, 결과적으로 연방을 약화시키는 방향이다.","parentId":"federation"},{"title":"잔존 함대","id":"viviendo-armada","type":"세력","folder":"02_지역","sortOrder":170,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","함대","용병","제정 복고"],"memo":"원문 490~492행 문장 그대로. 원어 Viviendo Armada.","image":"resource/wiki/잔존 함대.png","imageCaption":"잔존 함대","summary":[["원어","Viviendo Armada"],["정체","구 제국 '공포의 함대'의 잔존 세력"],["손실","전력의 80%"],["계기","[[하얀 일요일]]로 고립"],["현재 위치","대륙 외곽"],["믿음","황가가 살아 있다"],["목적","제정 복고"],["생계","용병 활동"]],"content":"# 잔존 함대\n\n```틀\n신성제국\n```\n\n**Viviendo Armada**\n\n과거 ‘드레드노 제국’의 대륙함대인 ‘공포의 함대’의 잔존 세력. 과거 강을 통해 크레스티아 제국 국경지대까지 진군한 바 있으나, ‘하얀 일요일’ 사건으로 인해 고립, 크레스티아 제국군에 의해 함대 전력의 80% 정도의 손실을 입고 피신하였다. 잔존함대는 황가가 어딘가에 살아있다고 믿으며, 제정 복고를 위해 용병 활동을 이어가는 중이다.\n\n## 관련 문서\n\n- [[신성제국]] · [[하얀 일요일]]\n- [[황립 조선소]]\n- [[크레스티아 제국]] · [[신성제국의 역사]]\n\n## 여담\n\n**이들이 믿는 것은 틀린 믿음일 수 있다.** [[하얀 일요일]]에 수도와 황가는 호수 바닥으로 침몰했다. 다만 그 호수가 [[카시마르]]가 지상으로 새어나오는 두 곳 중 하나이므로, 그 바닥에 무엇이 있는지는 아무도 확인하지 못했다. 이들의 믿음이 근거 없는 향수인지 남은 단서인지가 갈리지 않는다.\n\n**함대만 남아 나라 밖에 있다** (추정). 지휘부를 한순간에 잃고 대륙 외곽으로 피신했으므로, 이들은 인지 조작이 미치는 자리에서 가장 멀리 떨어져 있다. 스스로를 드레드노인이라 여기는 한 조작에 걸리지만, 제정 복고를 말한다는 것은 [[교황]] 체제를 정당한 국가로 보지 않는다는 뜻이기도 하다.","parentId":"holy-empire"},{"title":"잭슨의 형제단","id":"jacksons-brotherhood","type":"세력","folder":"02_지역","sortOrder":210,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","음지","약탈단","열차 강도"],"memo":"원문 345~348행 문장 그대로. 시대는 '서사 시점'으로 달았다 — 두목 잭슨이 《가문과 가족》 9·14·20편에 등장하기 때문이다. 다만 '명백한 운명과 자주 충돌한다'는 서술은 그 조직이 붕괴 이후의 것이므로 붕괴기 기준이다. 즉 이 조직은 두 시대에 걸쳐 있다.","image":"resource/wiki/잭슨의 형제단.png","imageCaption":"형제단의 열차 습격","summary":[["성격","거대한 약탈단"],["활동 지역","북부 연방 (본거지는 북방주)"],["악명","열차 강도 사건의 7할"],["두목","[[잭슨]]"],["구성","여러 약탈단 두목의 연합"],["결속력","하나의 [[대가문]]에 필적"],["표적","열차만"],["충돌 상대","[[명백한 운명]] · [[기동대]]"]],"content":"# 잭슨의 형제단 🗡️\n\n북부 연방에서 활동하는 거대한 약탈단으로, 연방에서 활동하는 열차 강도 사건의 7할이 이들에게서 발생할 정도로 악명 높은 조직이기도 하다. 조직의 우두머리인 ‘잭슨’과, 그를 따르는 여러 약탈단 두목들로 구성되어 있으며, 이들은 하나의 ‘대가문’에 필적할 정도로 높은 결속력을 자랑한다.\n\n원래부터 북방주에서 활동하던 이들이었고, ‘열차’만을 타겟으로 노리는 통에 ‘명백한 운명’ 조직원들과 자주 충돌하는 편이다.\n\n## 관련 문서\n\n- [[연방]]\n- [[잭슨]] — 두목\n- [[기동대]] — 철도를 지키는 상대\n- [[명백한 운명]] — 사설 철도를 뻗는 쪽과 열차를 노리는 쪽의 충돌\n- [[대가문]] — 결속력의 비교 대상\n\n## 여담\n\n**두 시대에 걸쳐 있는 조직이다.** 두목 [[잭슨]]은 《가문과 가족》 안에서 활동하고, [[명백한 운명]]과의 충돌은 붕괴 이후의 이야기다. 원문 한 항목에 두 시점이 겹쳐 있으므로, 앞으로 갈라 쓸 필요가 생길 수 있다.\n\n**열차만 노리는 것이 정치적 위치를 만든다.** [[명백한 운명]]은 사설 철도를 뻗어 세를 불리고, 형제단은 그 철도 위의 열차를 턴다. 목적이 겹치지 않는데도 자원이 겹치니 부딪친다. 연방을 무너뜨리려는 쪽과 연방에서 뜯어먹으려는 쪽의 차이다.\n\n**결속력이 대가문에 필적한다는 비유가 눈에 걸린다.** 두목 한 명과 그를 따르는 여러 두목들의 구조는 가주와 분가의 구조와 같다. 북방주에서 원래 활동하던 이들이라는 점까지 겹치면, [[대가문]]과 같은 땅에서 자란 다른 형태의 가문처럼 읽힌다.","parentId":"federation"},{"title":"정복자들","id":"conquistadora","type":"세력","folder":"02_지역","sortOrder":200,"era":"현대(붕괴 이후)","canon":"확정","status":"작성 중","tags":["신성제국","음지","기사단","붕괴 이후"],"memo":"원문 504~508행 문장 그대로. 원어 Conquistadora. 기사 체제가 종료된 이후를 전제하므로 시대를 '현대(붕괴 이후)'로 달았다 — 서사 시점에는 체제가 유지되고 있다(작가 확인, 2026-07-31).","image":"resource/wiki/정복자들.png","imageCaption":"정복자들의 표식","summary":[["원어","Conquistadora"],["출신","[[카스티야 사령부]]의 강경 기사단"],["주장","분지 외부를 정복해야 한다"],["결말","분지 외부로 축출"],["내부 분열","주변 땅 점거파 · 분지 귀환파"]],"content":"# 정복자들\n\n```틀\n신성제국\n```\n\n**Conquistadora**\n\n‘하얀 일요일’으로 형성된 기사 체제가 종료된 이후, 타국보다 압도적으로 우월한 군사력을 통해 분지 외부를 ‘정복’해야 한다고 주장하던 ‘카스티야 사령부’측의 강경 기사단이다. 공식적으로 3대 재단이 기사 체제가 붕괴된 이후에도 분지 외부로의 무력 확장은 없다고 못박음과 함께 분지 외부로 축출되었다.\n\n이들 내부에서도 자체적으로 주변 땅을 무단으로 점거하여 국가적인 정체성을 띄우려는 파벌과, 다시 분지 내부로 돌아가려는 파벌이 나뉘어있는 상태이다.\n\n## 관련 문서\n\n- [[신성제국]] · [[카스티야 사령부]]\n- [[편력기사]] — 같은 시기에 늘어나는 또 하나의 세력\n- [[레콩키스타]] · [[하얀 일요일]]\n\n## 여담\n\n**축출의 이유가 이 나라의 뿌리다.** [[레콩키스타]]의 조건이 \"분지에서 나가지 않는다\"였다. 기사 체제가 끝난 뒤에도 3대 재단이 무력 확장을 못박은 것은, 국호와 체제가 바뀌어도 그 계약이 이 나라의 바닥에 남아 있다는 뜻이다.\n\n**[[연방]]의 [[명백한 운명]]과 자리가 같다** (추정). 두 조직 모두 본국에서 분쇄되거나 축출된 강경파의 잔존 세력이고, 붕괴 이후에 국지 세력으로 남는다. 한쪽은 해체를 명백한 운명이라 부르고 다른 쪽은 정복을 말한다.\n\n**이름이 결말을 미리 말한다.** 정복자들(Conquistadora)과 [[레콩키스타]](재정복)는 같은 어근이다. 재정복으로 세워진 나라에서 정복을 말하는 자들이 쫓겨났다.","parentId":"holy-empire"},{"title":"제국기사","id":"imperial-knight","type":"세력","folder":"02_지역","sortOrder":0,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","기사","무력","교단"],"memo":"원문 463~468행 문장 그대로. 960시간이 신성로마제국 제국기사의 동원 한도 40일 패러디라는 것은 작가 확인(2026-07-31).","image":"resource/wiki/제국기사.png","imageCaption":"제국기사의 무장","summary":[["소속","[[교단]]"],["위상","신성제국의 최대 전력"],["선발","토너먼트 최종 승자"],["서임","[[교황]]이 직접"],["부여되는 것","초자연적인 힘"],["매개체","《[[기사행전]]》으로 추정"],["충성 대상","[[교황]]에게만"],["소집 한도","960시간"],["한도 이후","작위 반납 → 새 토너먼트"],["작위 수","정해져 있다"]],"content":"# 제국기사\n\n```틀\n신성제국\n```\n\n신성제국의 최대 전력이자, ‘기사단’에 버금가는 최강의 기사. 몇 년에 한 번씩 정기적으로 교단이 직접 토너먼트를 주최하며, 해당 토너먼트에서 최종 승리한 기사가 신성제국의 ‘제국기사’로 서임될 자격을 얻을 수 있다.\n\n제국기사는 교황이 ‘직접’ 서임을 내리며, 제국기사 작위는 기사에게 ‘초자연적인 힘’을 부여해준다고 알려진다.\n\n제국기사는 다른 기사들과 달리 ‘교황’에게만 충성하는 이들이며, 교황이 이들을 960시간 동안 ‘소집’할 수 있다. 소집할 수 있는 시간이 모두 지난 제국기사는 자신의 작위를 반납해야 하며, 작위가 반납되었을 경우 다시 토너먼트를 개최해 새로운 제국기사를 선출한다. 이는 곧 ‘제국기사 작위’의 수가 정해져있음을 의미한다.\n\n## 960시간\n\n정확히 **40일**이다. 소집에 쓴 시간이 누적되어 그 한도에 닿으면 작위를 내놓아야 한다.\n\n이 나라의 최강 전력은 **쓸 때마다 줄어드는 자원**이다. [[교황]]이 제국기사를 부르는 것은 병력을 움직이는 일이 아니라 정해진 잔량을 소모하는 일이며, 다 쓰면 토너먼트를 다시 열어야 한다.\n\n## 무엇이 힘을 주는가\n\n작위가 초자연적인 힘을 부여한다고 알려져 있으나, 그 힘의 출처는 **[[누스]]**로 추정된다. [[교황]]의 누스인 《[[기사행전]]》이 매개체이고 서임이 그 접근 절차라면, [[연방]]의 [[헌병대]]가 [[연방 헌법]]을 매개체로 [[노에마]]를 구사하는 것과 같은 구조가 된다.\n\n**소집 한도 960시간**이 있다는 점이 다르다. 연방 쪽에는 소모 개념이 없다. → [[기사행전]]\n\n## 관련 문서\n\n- [[교단]] · [[교황]] · [[성좌 기사단]]\n- [[상급기사]] · [[하급기사]]\n- [[노에마]] — '초자연적인 힘'의 정체로 짐작되는 것\n- [[신성제국]]\n\n## 여담\n\n**작위가 소모품이라는 설정이 이 나라의 무력을 설명한다.** 제국기사는 강하지만 총량이 정해져 있고 쓰면 사라진다. 그래서 [[교황]]이 함부로 부르지 않고, 실제 분쟁은 재단들의 [[상급기사]]가 처리한다. [[연방]]의 [[헌병대]]가 동원 절차 때문에 사실상 움직이지 못하는 것과 비슷한 구조다 — 두 나라 모두 최강 전력을 봉인해 두고 있다.\n\n**'초자연적인 힘'은 [[노에마]]로 읽힌다** (추정). [[교황]]이 직접 서임하며 힘을 부여한다는 것은, 교황의 [[누스]]를 매개로 [[노에마]] 능력자를 만드는 절차로 보인다. [[연방]]에서 [[연방 헌법]]이 [[헌병대]]의 매개체인 것과 같은 구조다.","parentId":"curia"},{"title":"철도청","id":"railway-bureau","type":"세력","folder":"02_지역","sortOrder":100,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","철도","국제기구"],"memo":"원문 325~327행 문장 그대로.","image":"resource/wiki/철도청.png","imageCaption":"관리역 내부","summary":[["소속","[[의회]] 산하"],["성격","철도·차량 관리청"],["설치 단위","주별 '관리역'"],["영향 범위","[[그렌빌리아 대륙]] 전체"],["내부 구분","해외지부 / 국내지부"],["해외지부","평범한 공무"],["국내지부","무력이 필요한 업무"],["산하 무력","[[기동대]]"],["숙원","[[궤간 통일]]"],["정치적 통로","[[통합파]] · [[철도파]]"]],"content":"# 철도청\n\n연방 의회 산하의 철도·차량 관리청. 경찰청과 유사하게 각 주마다 정거장들을 총괄하는 ‘관리역’들을 두는 형태로 운영되고 있으나, 경찰청과 달리 그렌빌리아 전체 대륙에 ‘관리역’을 두어 제한적인 영향력을 행사하는 국제기구이다.\n\n내부적으로는 ‘해외지부’와 ‘국내지부’로 분류되며, 해외 지부의 경우 평범한 공무를 맡으나, 국내 지부의 경우 영역 다툼에 연루되는 등 ‘무력의 사용’이 요구되는 업무를 자주 담당하고는 한다.\n\n## 두 지부\n\n| | 관할 | 업무의 성격 |\n|---|---|---|\n| 해외지부 | 그렌빌리아 대륙 각지 | 평범한 공무 |\n| 국내지부 | 연방 내 | 영역 다툼 연루, 무력 사용이 요구되는 업무 |\n\n## 궤간이 왜 난립하는가\n\n연방의 철도는 국가 간선이기 전에 **생활 교통수단**이다. 도로 자리에 트램 선로가 깔려 있고, [[대가문]]의 사치용 트램·개인이 운전하는 트램·국영 기차가 뒤섞여 있다. 궤간 난립은 대부분 이 층위에서 발생한다. → [[연방의 문화]]\n\n여기에 주마다 제각기 철도 체계를 구성할 수 있다는 [[연방 헌법]] 조항이 겹친다. 그래서 주 경계의 **관문**이 갈아타는 자리가 되며, 1편에서 [[네빌]]이 고향까지 열두 번 환승하는 것이 그 결과로 추정된다. → [[연방의 지리]]\n\
