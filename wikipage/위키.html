n## 궤간 통일이라는 명분\n\n[[궤간 통일]]은 철도청의 오랜 숙원이자, 서사에서는 **다른 일의 명분**으로 쓰인다. 16편에서 [[앤드루]]가 궤간 통일을 내세워 지하철도를 비밀리에 굴착하고, [[철도파]]의 [[하워드]]가 의회 쪽에서 이를 뒷받침한다.\n\n```대사\n자네가 그렇게 바라던 ‘궤간 통일’의 과정 중 하나지.\n— 16편\n```\n\n## 관련 문서\n\n- [[연방]] · [[의회]]\n- [[기동대]] — 철도청 산하의 치안조직\n- [[궤간 통일]] — 오래 밀어붙여 온 숙원이자 지하철도의 명분\n- [[하노버 용병단]] — 기록을 남기지 않아야 할 일에 동원되는 외부 세력\n- [[통합파]] · [[철도파]]\n- [[연말 위기]] — 대륙 철도망 설립 조항의 근거\n\n## 여담\n\n**연방의 부처가 국제기구인 이유는 조약 때문이다.** [[연말 위기]] 협상에서 '그렌빌리아 대륙 전체에 연방 체계에 맞춰 철도망을 설립한다'는 조항이 들어갔다. 그 결과 연방 의회 산하 부처가 대륙 전역에 관리역을 두게 되었다. 굴욕적이라 비판받은 협상이 연방에게 남긴 유일한 확장 수단이다.\n\n**국내가 해외보다 위험한 조직이다.** 해외지부는 공무를 보고, 국내지부는 무력을 쓴다. 연방 안에서 사유 철도와 대가문 철도 이권이 난립하고 있으므로, 선로를 관장하려면 [[대가문]]·[[보안관]]과 부딪쳐야 한다. 그래서 철도청이 [[기동대]]라는 무력을 갖는다.\n\n**《가문과 가족》의 무대가 이 조직이다.** [[앤드루]](철도청장) · [[세라]](비서관) · [[네빌]](비서)이 모두 여기 소속이고, 지하 굴착 사업도 철도청 이름으로 굴러간다. 인물 문서는 §3에서 착수 예정.","parentId":"federation"},{"title":"철도파","id":"railroaders","type":"세력","folder":"02_지역","sortOrder":40,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 297~300행 문장 그대로. 다만 원문의 '살아남은 온건주의 의원 집단'이 대본 용어사전의 '적극적인 강경 노선'과 엇갈려 보였는데, 작가 확인(2026-07-31)으로 축이 다른 것으로 정리됐다 — 대외 투사에는 적극적이고, 연말 위기 때 전쟁에 반대한 쪽이 온건파다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","구 철도파 온건 계열"],["노선","역량을 전 대륙에 투사"],["지역 기반","남방주 · 서방주"],["힘의 통로","[[연합]] · [[컴퍼니]]"],["대표 인물","[[하워드]]"],["강경파의 말로","[[연말 위기]] 화재로 숙청"]],"content":"# 철도파\n\n과거 존재했던 ‘철도파’에서 살아남은 온건주의 의원 집단. 철도의 세계화, 대륙의 철도 이권 장악 등 연방의 철도 정책을 중심적으로 다루는 이들을 지칭한다. ‘남방주’, ‘서방주’ 등을 지역적 기반으로 두고 있으며, ‘비숍스’나 ‘컴퍼니’ 등 해외 세력과의 협력을 통해 정치적 힘을 행사한다.\n\n```표어\n우리가 했던 일을 기억합니다. 반드시 필요했지만, 그릇된 방법을 통해 이루려했던…\n```\n\n## 노선과 계보\n\n구 철도파는 **‘연방의 역량을 전 대륙에 투사해야 한다’**는 입장이었고, 파벌 내부는 강경파와 온건파로 갈렸다.\n\n- **강경파** — [[건국의 아버지들]]을 포함해 철도 연합(유나이티드 레일로드)을 강경하게 추진했고, [[연말 위기]] 때 반 연방 세력과의 전쟁까지 주장했다. [[통일파]]의 쿠데타로 화재 속에서 대부분 사망했다.\n- **온건파** — 전쟁을 반대했던 덕에 생존했고, 이들이 지금의 철도파다. 최후통첩 협상에서 '그렌빌리아 대륙 전체에 연방 체계의 철도망을 설립한다'는 조항을 넣어, 현재까지 이어지는 ‘미트로프 중심 질서’를 만든 일등공신이 되었다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 상대 파벌\n- [[건국의 아버지들]] — 구 철도파 강경 계열\n- [[연말 위기]]\n- [[철도청]] · [[궤간 통일]]\n\n## 여담\n\n**두 '강경'이 다른 뜻이다.** 대본 용어사전은 철도파를 \"국력을 밖으로 뻗는 데 적극적인 강경 노선\"이라 하고, 원문은 \"살아남은 온건주의\"라 한다. 모순이 아니다. **대외 투사**에는 여전히 적극적이고, **연말 위기의 전쟁 찬반**에서는 반대편에 섰던 쪽이다. 축이 둘이라는 것을 놓치면 같은 파벌이 강경이면서 온건인 것처럼 보인다.\n\n**지역 기반이 노선을 설명한다.** 남방주는 [[칼리아리 왕국]]과 접해 **수출**로 먹고 살고, 서방주는 [[연합]]과 접해 [[올림피아드]] 지부가 있으며 **기술·연구·교육**으로 먹고 산다. 즉 이 파벌의 두 기반이 모두 **바깥과 맞닿은 주**다. 해외 세력과의 협력을 힘의 통로로 쓰는 것이 이념이 아니라 지리에서 나온다. → [[연방의 지리]]\n\n**살아남은 이유가 노선을 바꿨다.** 무력으로 투사하려던 쪽이 죽고 협상으로 투사하려던 쪽이 남았으니, 지금의 철도파가 [[연합]]·[[컴퍼니]] 같은 해외 세력과의 **협력**을 통로로 쓰는 것이 자연스럽다. 위 인용문(\"반드시 필요했지만, 그릇된 방법을 통해 이루려했던\")도 그 자리에서 나온 말로 읽힌다.\n\n**서사 인물.** [[하워드]](철도파 의원)가 이 파벌 소속이다.","parentId":"federation"},{"title":"추기경","id":"cardinals","type":"세력","folder":"02_지역","sortOrder":20,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["신성제국","교단","통치"],"memo":"원문 457~461행과 470~472행에서 추기경에 관한 서술만 모은 문서다. 인원수나 개별 이름은 원고에 없다.","image":"resource/wiki/추기경.png","imageCaption":"추기경","summary":[["소속","[[교단]]"],["인원","5명"],["임명","[[교황]]과의 관계"],["역할","[[교황]]을 보좌한다"],["직속 무력","[[성좌 기사단]] — 다섯 기사단"],["현재","교단의 실질 운영"]],"content":"# 추기경\n\n```틀\n신성제국\n```\n\n[[교단]]에서 [[교황]]을 보좌하는 이들. 교단은 교황과 이들로 구성된다.\n\n[[교황]]이 직접 주요 세력에게 지시를 내리는 일이 흔치 않으므로, **지금의 교단은 추기경들을 중심으로 굴러간다.** 아주 중요한 사안이나 의례적인 업무를 처리한다.\n\n**다섯 명이며, 되는 기준은 제도가 아니라 [[교황]]과의 관계다.** 시험도 선출도 없다.\n\n[[성좌 기사단]]이 이들에게 충성한다. [[교황]]에게만 충성하는 [[제국기사]]와 달리, 다섯 기사단이 추기경들의 무력이 된다.\n\n## 관련 문서\n\n- [[교단]] · [[교황]]\n- [[성좌 기사단]] · [[제국기사]]\n- [[신성제국]]\n\n## 여담\n\n**교황이 나서지 않는 나라에서 실권을 쥔 자리다** (추정). 교단이 최고 통치기구인데 최종 결정권자는 지시를 거의 내리지 않고, 그 아래에서 실무를 보는 이들이 무력까지 따로 거느린다.\n\n**인원수와 개별 이름은 알려지지 않았다.**","parentId":"curia"},{"title":"카스티야 사령부","id":"castilla-command","type":"세력","folder":"02_지역","sortOrder":140,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","재단","군국주의","3대 재단"],"memo":"원문 480~481행 문장 그대로. 이름은 스페인 카스티야 왕국에서 왔다.","image":"resource/wiki/카스티야 사령부.png","imageCaption":"카스티야 사령부의 문장","summary":[["성격","3대 재단 — 구 제국의 군부"],["산하 교육기관","사관학교"],["위상","가장 강력한 재단 중 하나"],["영지","카스티야령"],["주장","재단 통합 · 외부 확장"],["파생","[[정복자들]] (축출)"]],"content":"# 카스티야 사령부\n\n```틀\n신성제국\n```\n\n과거 ‘드레드노 제국’의 ‘군부’ 인물들로 구성된 재단. 산하 교육기관은 대부분 사관학교의 형태를 띠며, 이 덕분에 신성제국 내에서 가장 강력한 영향력을 행사하는 재단 중 하나이다. 드레드 분지 내에 재단들을 모두 하나로 통합하고, 외부 세계로까지 확장해야 한다는 군국주의적인 가치관을 주장한다.\n\n## 관련 문서\n\n- [[신성제국]] · [[교단]]\n- [[그라나다 재단]] · [[아라곤 협회]] — 나머지 3대 재단\n- [[정복자들]] — 여기서 갈라져 축출된 강경 기사단\n- [[상급기사]] · [[레콩키스타]]\n\n## 여담\n\n**구 제국의 군부가 그대로 남았다.** [[하얀 일요일]]로 황가와 지휘부가 호수 바닥에 가라앉았는데, 군부 계층은 재단으로 묶여 살아남았다. 그래서 이 재단의 주장이 국가의 공식 기조와 정면으로 어긋난다 — 나라는 분지 외부와 단절하기로 했는데 이들은 확장을 말한다.\n\n**[[레콩키스타]]의 조건을 뒤집으려는 쪽이다** (추정). 이 나라의 출발점은 \"분지에서 나가지 않는다\"는 계약이었다. 재단을 통합하고 외부로 확장해야 한다는 주장은 그 맹세를 파기하자는 말이 된다. [[정복자들]]이 축출된 것도 그 선을 넘었기 때문으로 읽힌다.","parentId":"holy-empire"},{"title":"통일파","id":"unionists","type":"세력","folder":"02_지역","sortOrder":10,"era":"근대","canon":"확정","status":"완료","tags":["연방","의회","파벌","해체"],"memo":"원문에 단독 항목이 없던 문서. 197행(작가가 새로 확정한 정의)과 288·292행(분화 서술), 그리고 작가 확인(2026-07-31, '통일파 강경주의는 누스가 소실되고 통일파가 자치파와 통합파로 쪼개지는 과정에서 와해되었다')을 모아 계보 문서로 만들었다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["노선","우선 내부부터 정리"],["내부 갈래","강경파 · 온건파"],["주요 사건","[[연말 위기]] 쿠데타 주도"],["후신","[[통합파]] · [[자치파]]"],["해체","헌법 소실과 파벌 분열"]],"content":"# 통일파\n\n연방 의회의 오래된 파벌. **‘우선 내부부터 정리해야 한다’**는 입장을 취했다. 지금의 [[통합파]]와 [[자치파]]가 여기에서 갈라져 나왔다.\n\n## 노선\n\n[[철도파]]가 연방의 역량을 전 대륙에 투사해야 한다고 본 반면, 통일파는 확장보다 내부 정리를 앞세웠다. 두 파벌이 다툰 축이 바로 이것이다.\n\n단, 통일파 역시 ‘무력 사용’을 전제하고 있었다. 그래서 연방의 군비 확장 자체에는 두 파벌 모두 기여했다.\n\n파벌 내부는 다시 **강경파**와 **온건파**로 갈렸다. [[철도파]]도 같은 구조였다.\n\n- 쾨벤하운 병합 당시 통일파는 본토 편입에 반대하고 우선 ‘준주’ 혹은 ‘자치주’로 편입할 것을 주장했으나, 압도적인 승리에 고취된 분위기에서 철도파에게 밀렸다.\n- [[연말 위기]] 때 전쟁을 반대한 쪽이 통일파였고, 결국 쿠데타를 모의해 [[철도파]] 강경파와 [[건국의 아버지들]]을 화재로 제거했다.\n\n## 해체\n\n쿠데타는 성공했으나 파벌 자체가 오래 남지는 못했다.\n\n- **강경파** — [[연방 헌법]]이 소실되고, 통일파가 [[자치파]]와 [[통합파]]로 쪼개지는 과정에서 와해되었다.\n- **온건파** — [[통합파]]와 [[자치파]]로 분화해 서사 시점의 의회를 구성한다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통합파]] · [[자치파]] — 후신\n- [[철도파]] — 상대 파벌\n- [[연말 위기]]\n- [[건국의 아버지들]]\n\n## 여담\n\n**'통일'의 뜻이 헷갈리기 쉽다.** 대륙을 통일한다는 뜻이 아니라 **연방 내부를 정리한다**는 뜻이다. 대외 투사를 주장한 쪽은 [[철도파]]이며, 강경·온건은 두 파벌 각각의 안에서 갈리는 축이다. 대본 용어사전의 [[통합파]](\"연방의 결속과 궤간 통일 등 내부적인 통합\") 설명도 새 정의와 맞는다.\n\n**강경파의 와해와 헌법 소실이 이어지는 것으로 보인다.** 의회 직속 무력인 [[헌병대]]의 매개체가 [[연방 헌법]]다. 내부를 무력으로 통합하려던 통일파 강경파에게는 그것이 실행 수단이었을 텐데, 연말 위기에 헌법이 80~90% 불타면서 수단을 잃은 셈이 된다. 두 사실이 나란히 전해지므로 이렇게 읽히지만, 명시적으로 설명된 적은 없다.","parentId":"federation"},{"title":"통합파","id":"integrationists","type":"세력","folder":"02_지역","sortOrder":20,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 287~290행 문장 그대로. 원문 소제목은 '통합파 의원'이지만, 세력명은 '통합파'이고 '통합파 의원'은 직함이므로(대본 용어사전·인물관계도의 용법) 문서 제목은 '통합파'로 두었다.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","[[통일파]] 온건 계열"],["목표","연방의 결속 · [[궤간 통일]]"],["지역 기반","수도주"],["힘의 통로","[[경찰청]] · [[철도청]]"],["대표 인물","[[잭]] · [[로버트]]"]],"content":"# 통합파\n\n과거 존재했던 ‘통일파’에서 분화된 성향을 가진 의원 집단. 연방의 결속과, 궤간 통일 등의 내부적인 통합을 핵심 목표로 삼고 활동하는 이들을 지칭한다. ‘수도주’를 지역적 기반으로 두고 있으며, ‘경찰청’과 ‘철도청’ 등의 정부기구를 통해 정치적 힘을 행사한다.\n\n```표어\n‘연말 위기’ 이후, 연방의 연결은 위태로워졌습니다, 우리는, 더 단단히 뭉쳐야합니다!\n```\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 전신\n- [[자치파]] — 같은 뿌리에서 갈라진 상대 파벌\n- [[경찰청]] · [[철도청]] — 정치적 힘의 통로\n\n## 여담\n\n**기반이 대비를 이룬다.** 통합파는 ‘수도주’를 기반으로 [[경찰청]]·[[철도청]]이라는 **중앙 기구**를 통해 힘을 쓰고, [[자치파]]는 북방주·동방주를 기반으로 [[대가문]]·[[보안관]]이라는 **지역 세력**을 통해 힘을 쓴다. 서사에서 경찰과 보안관이 관할을 다투는 것이 그대로 의회의 파벌 다툼이기도 하다.\n\n**서사 인물.** [[잭]](통합파 의원), [[로버트]](통합파 의원 · 전 경찰청장)가 이 파벌 소속이다. 인물 문서는 §3에서 착수 예정.","parentId":"federation"},{"title":"판게아 대륙","id":"pangaea","type":"지역","folder":"02_지역","sortOrder":3,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["대륙","Vol.2","판게아","구대륙","죽음"],"memo":"원고 1194~1206행의 키워드(르네 마그리트 〈빛의 제국〉, 메소아메리카 문화권과 '망자의 날', 아즈텍 신화, '데카당스에 빠진 엘도라도')와 2026-08-04 작가 설명으로 쓴 문서다. 원고 1208~1246행의 초안(대륙 연합의 원정 서사)은 작가 지시로 반영하지 않았다 — 내용이 바뀔 수 있다. 작가 설명으로 확정된 것 — (1) 신이 존재하지 않는다. 죽었는지 떠났는지는 구상되지 않았고 '없다'만 확실하다. (2) 노에시스를 운용할 주체가 없고, 제대로 된 국가 체제도 없으며, 외부 세력들만 들어와 있다. 포스트 아포칼립스의 세계다. (3) 밤에 깨어나는 것은 시체다. (4) 천체 비유(대륙=행성, 바다=우주, 사람=별, 노에시스=복사)에서 이 대륙은 블랙홀에 대응한다. (5) Vol.2이므로 Vol.1의 세 대륙과 성격이 많이 다르다. 확인되지 않은 것 — 신의 행방, 시체를 움직이는 것, 포화도와 병기 수준, 남은 주민의 유무, 외부 세력의 정체, 종족, '데카당스에 빠진 엘도라도'의 정체.","image":"resource/wiki/판게아 대륙.png","imageCaption":"판게아 대륙","summary":[["권","Vol.2"],["주제","죽음"],["구분","구대륙 — 유일하다"],["모티브","망자의 날 · 〈빛의 제국〉"],["노에시스 포화도","알려지지 않았다"],["병기","알려지지 않았다"],["국가","없다 — 외부 세력만"],["종족","알려지지 않았다"],["특이사항","밤마다 시체가 깨어난다"]],"content":"# 판게아 대륙\n\nVol.2 「무인지대」의 무대. 주제는 **죽음**이다. **유일한 구대륙이며, 신도 국가도 산 자의 체제도 없는 땅이다.**\n\n```상세\n큰 그림\n대전쟁\n바다 민족\n```\n\n## 인류의 고향이었다\n\n이 대륙은 [[바다 민족]]의 고향이다. 신대륙 인류 전체가 이 대륙에서 건너간 이들의 후손이므로, 지금 세계의 모든 사람의 발원지가 여기다.\n\n그리고 **[[대전쟁]]이 여기서 벌어졌다.** 대륙 단위의 세력들이 맞붙은 전쟁이며, [[바다]]에 노에시스가 대량으로 녹아 대륙 간 항해가 끊긴 것이 그 결과다. 전쟁 이후 바다 민족은 종적을 감췄고, 신대륙에는 그들의 기록만 남았다.\n\n인류를 낳은 대륙이 인류가 살 수 없는 대륙이 되기까지의 과정은 알려지지 않았다. 확실한 것은 지금의 상태뿐이다 — **제대로 된 국가 체제가 없고, 외부에서 들어온 세력들만 있다.**\n\n## 신이 없다\n\n네 대륙의 신 가운데 이곳의 자리만 비어 있다.\n\n| 대륙 | 그곳의 신 |\n|---|---|\n| [[판노티아 대륙]] | 실제로 활동한다 |\n| [[로디니아 대륙]] | '하늘'로서 관조한다 |\n| [[그렌빌리아 대륙]] | 잠든 채 꿈을 꾼다 |\n| **판게아** | **없다** |\n\n죽었는지 떠났는지조차 알려지지 않았다. 확실한 것은 **부재**뿐이다. 이 대륙의 별칭인 **'태양이 죽은 대륙'**이 그 부재를 가리키는 것으로 추정된다.\n\n## 다루는 자가 없는 노에시스\n\n신대륙의 셋은 각자의 방식으로 [[노에시스]]를 다룬다 — [[그렌빌리아 대륙]]은 바라고, [[로디니아 대륙]]은 정련하고, [[판노티아 대륙]]은 믿는다.\n\n**이 대륙에는 그것을 운용할 주체가 없다.** 네 대륙 중 유일하게 고유한 운용법이 '없음'인 곳이며, 살아 있는 사회가 노에시스를 어떻게 다루는지를 다루는 Vol.1과 이 대륙의 Vol.2를 가르는 선이 여기다.\n\n포화도는 알려지지 않았다.\n\n## 밤마다 깨어나는 것\n\n**해가 지면 시체가 깨어난다.**\n\n다른 대륙에서 죽음은 끝이다. 사람이 죽으면 노에시스는 사라지고 시신은 시신으로 남는다. **이 대륙에서만 죽은 것이 그대로 있지 않는다.**\n\n무엇이 시체를 움직이는지는 알려지지 않았다. 노에시스를 운용할 산 자가 없는 대륙에서 움직이는 것이 죽은 자뿐이라는 사실만 남아 있다.\n\n## 대륙 간 관계\n\n국가 붕괴 이후 신대륙의 셋([[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]])이 '대륙 연합'을 이뤘다. **이 대륙은 그 연합의 바깥이다.**\n\n위키 기준 현재 이 대륙에 들어와 있는 것은 **외부 세력들뿐이며**, 그들이 누구이고 무엇을 하러 왔는지는 알려지지 않았다. → [[바다]]\n\n## 이름\n\n**판게아**(Pangaea) — 실제로 존재했던 초대륙 중 가장 유명한 이름이며, 그리스어로 **'모든 땅'**(πᾶν + Γαῖα)이라는 뜻이다.\n\n모든 땅이라는 이름의 대륙이 모든 인류의 발원지였고, 지금은 아무도 살지 않는다. 이름이 가리키던 것과 정확히 반대가 된 땅이다.\n\n## 관련 문서\n\n- [[큰 그림]] · [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]\n- [[대전쟁]] · [[바다 민족]] · [[바다]]\n- [[노에시스]] · [[세계관 대문]]\n\n## 여담\n\n**천체의 비유가 이 대륙에서 끝까지 간다** (독자의 읽기). [[노에시스]]의 여담에 적어둔 비유 — 대륙은 행성, 바다는 우주, 사람은 별, 노에시스는 복사 — 에서 이 대륙의 자리는 **블랙홀**이다. 복사를 내는 주체가 없고, 신은 없는데 대륙은 밤마다 움직인다. 블랙홀이 그렇다 — 방출하지 않고, 관측되지 않지만, 작용한다.\n\n**죽음의 규칙이 여기서만 뒤집힌다** (독자의 읽기). 그 비유에서 유일하게 어긋나던 자리가 죽음이었다 — 별은 죽으면 잔해를 남기는데, 이 세계의 사람은 잔해 없이 사라진다. 그런데 이 대륙의 시체는 죽은 뒤에도 움직인다. **별이 죽어도 잔해가 남아 작용하는 형태가 이 대륙에만 있다.**\n\n**Vol.1에 이 대륙을 닮은 것이 이미 하나 있다** (독자의 읽기). [[판노티아 대륙]]의 '불신자' — 노에시스를 조금도 방출하지 않으면서, 방출하는 모든 것을 먹어치우려 드는 존재다. 방출하지 않고 삼키기만 하는 형상이 사람 크기로 먼저 나와 있다.\n\n**부제가 이 대륙의 물리다** (독자의 읽기). Vol.2의 문장은 \"죽음을 피할 수 없다면\"이다. 블랙홀은 빛조차 탈출하지 못하는 천체이므로, 피할 수 없음이 그 정의다.\n\n**아직 알려지지 않은 것.** 신이 죽었는지 떠났는지, 시체를 움직이는 것, 포화도와 병기 수준, 남은 주민의 유무, 외부 세력의 정체, 그리고 종족.","parentId":null},{"title":"판노티아 대륙","id":"pannotia","type":"지역","folder":"02_지역","sortOrder":2,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["대륙","Vol.1","판노티아","신정","성체"],"memo":"2026-08-04 작가 확인 — 신은 사람과 완전히 다른 선상의 존재이며, 사람의 강함이 아무리 커져도 그 연장선에 있지 않다. 이 대륙의 국가 문서는 제목에 지역의 고유 명칭만 쓴다(원고 1164행). 대륙 전체의 모티브는 실낙원이다. 원문 1161~1193행에는 대륙 머리글 세 줄과 두 나라의 한 줄 소개만 있다. 2026-08-04 작가 설명으로 확정된 것 — (1) 누스를 통한 노에시스 발현이 표준인 대륙이며, 이곳에서는 누스를 '성체', 노에마를 '표징', 노에시스를 '영', 노모스를 '성지'라 부른다. 누스를 개인장비처럼 다루고 자신의 노에시스를 '믿음'의 형태로 그 누스에 이전한다. (2) 신은 실재하며 실제로 활동하고 있다. 누스는 아니다. 다른 대륙의 신은 상태가 다르다 — 로디니아의 신은 '하늘'로서 관조하고, 그렌빌리아의 신은 잠든 채 꿈을 꾼다. 두 나라가 섬기는 신은 같은 존재다. (3) 노에시스를 밖으로 이전하므로 과포화 문제가 없고, 대신 괴물이 '결핍'에서 나온다. 노에시스를 전혀 방출하지 않게 되어 반쯤 죽은 상태로 노에시스를 방출하는 모든 것을 먹어치우려 한다. 가명은 '불신자'이며 확정된 이름이 아니다. (4) 포화도가 앞의 두 대륙보다 낮아 개인이 노에시스 복사로 상대를 동화·감화시키는 것이 거의 어렵다. (5) 지형은 지옥과 천국의 통상적 묘사에서 고통스러운 것과 평화로운 것을 뺀 모습이며, 동서로 나뉜다. (6) 원래 하나였으나 한 사건으로 갈라졌다. 그 사건은 미정이며 니케아 공의회나 구약의 바벨탑을 구상 중이다. (7) 포화도가 낮아 화기가 성립하지만 대부분 냉병기다. 구조가 복잡한 기계장치일수록 성체로 삼기 어렵기 때문이며, 엘리트 집단은 현대적인 총기를 쓸 수 있으나 이해에 비례해 표징에 한계가 있다. (8) 종족은 천사와 악마 둘이다. (9) 그렌빌리아·로디니아·판노티아 셋 다 신대륙이다. 확인되지 않은 것 — 포화도 수치, 갈라진 사건, 두 나라 중 어느 쪽이 동쪽인지, 신의 정체와 활동 내용, 각국의 역사.","image":"resource/wiki/판노티아 대륙.png","imageCaption":"판노티아 대륙 지도","summary":[["권","Vol.1"],["주제","믿음"],["구분","신대륙"],["모티브","실낙원"],["노에시스 포화도","그렌빌리아보다 낮다"],["병기","냉병기 · 엘리트는 총기"],["국가","두 신정국가가 양분"],["종족","천사 · 악마"],["특이사항","신이 실제로 활동한다"]],"content":"# 판노티아 대륙\n\nVol.1의 무대 셋 중 하나. 주제는 **믿음**이다. **신이 실제로 활동하는 대륙이며, [[누스]]를 통한 발현이 표준이다.**\n\n```상세\n큰 그림\n그렌빌리아 대륙\n로디니아 대륙\n```\n\n## 신이 활동하는 대륙\n\n**이곳의 신은 실재하며, 실제로 활동하고 있다.**\n\n그리고 이것이 이 대륙만의 사정이 아니다. 신은 대륙마다 있으며, 다른 곳에서는 상태가 다르다.\n\n| 대륙 | 그곳의 신 |\n|---|---|\n| **판노티아** | 실제로 **활동한다** |\n| [[로디니아 대륙]] | '하늘'로서 **관조한다** |\n| [[그렌빌리아 대륙]] | 잠든 채 **꿈을 꾼다** |\n| [[판게아 대륙]] | **없다** |\n\n**대륙을 양분한 두 나라가 섬기는 신은 같은 존재다.** 갈리는 것은 그 신을 어떻게 대하는지뿐이다.\n\n신은 사람과 같은 축 위에 있지 않다. 사람이 아무리 강해져도 그 연장선에 신이 있는 것이 아니라, **완전히 다른 선상의 존재**다.\n\n## 두 나라\n\n| 국가 | 신을 대하는 방식 | 주요 가치관 |\n|---|---|---|\n| **헬라이** | 신의 가르침에 따라 신에게 **저항**하고, 신의 깨달음을 얻고자 한다 | 혼돈 · 쾌락 · 광기 |\n| **에데나** | 신의 가르침에 따라 신에게 **충성**하고, 신과 가장 가까운 종이 되고자 한다 | 규율 · 신성 · 독실함 |\n\n**원래는 하나였다.** 한 사건을 계기로 갈라져 지금의 두 나라가 되었다. 그 사건이 무엇이었는지는 알려지지 않았다.\n\n## 지리\n\n대륙이 **동서로 갈린다.** 두 나라가 각각 한쪽을 차지하며, 그 사이에 완충 지대나 제3의 세력은 알려지지 않았다.\n\n**두 땅의 풍경은 이름이 주는 인상과 다르다.** 불타는 땅도 낙원도 아니며, 동산과 절벽과 협곡이 이어지는 평범한 지형이다. 지옥과 천국의 통상적인 묘사에서 고통과 평온을 덜어내면 남는 것이 이 대륙의 모습이다.\n\n**그래서 두 나라를 가르는 것은 지형이 아니다.** 같은 땅 위에서 같은 신을 섬기며, 갈리는 것은 그 신을 향하는 방향뿐이다.\n\n## 종족\n\n인류가 **천사**와 **악마** 둘로 나뉜다.\n\n## 성체와 표징\n\n이 대륙 사람들은 [[노에시스]]를 몸에 쌓지 않는다. **몸 밖의 물건에 맡겨 두고 그것을 통해 쓴다.** 그래서 개념의 이름이 전부 다르다.\n\n| 이 세계의 개념 | 이곳의 이름 |\n|---|---|\n| [[노에시스]] | **영** |\n| [[노에마]] | **표징** |\n| [[누스]] | **성체** |\n| [[노모스]] | **성지** |\n\n**힘을 맡기는 행위가 곧 믿음이다.** 성체를 소지하고 다니면서 자신의 영을 그것에 넘기며, 넘긴 만큼을 표징으로 돌려받는다. 힘의 저장고가 사람이 아니라 물건이므로 **이 대륙에서 강한 자는 많이 지닌 자가 아니라 좋은 성체를 지닌 자**다.\n\n**성체가 되는 조건은 이해다.** 무엇이든 성체가 될 수 있으나, 그러려면 그것이 어떻게 만들어졌고 어떻게 동작하고 어떻게 쓰이는지를 완전히 알아야 한다. 표징의 크기도 그 이해의 깊이를 넘지 못한다.\n\n**그래서 이 대륙에서는 아는 것이 힘의 상한이다.** [[로디니아 대륙]]에서 상한이 수련의 깊이이고 [[그렌빌리아 대륙]]에서 소망의 크기인 것과 다르다.\n\n## 결핍에서 나오는 것\n\n힘을 몸 밖에 두는 대륙이므로 **과포화가 일어나지 않는다.** [[그렌빌리아 대륙]]에서 사람이 반쯤 [[카시마르]]가 되고 [[로디니아 대륙]]에서 키메라가 되는 경로가 이곳에는 아예 없다.\n\n**여기서 사람을 무너뜨리는 것은 모자람이다.** 아무것도 내놓지 않게 된 자들이 있다. 영을 조금도 방출하지 않는 상태로 반쯤 죽은 채 남아, **영을 내놓는 모든 것을 먹어치우려 든다.** **'불신자'**라 불리며 확정된 이름은 아니다.\n\n**믿음으로 힘을 넘기는 대륙에서 괴물이 아무것도 넘기지 않는 자라는 점이 이 이름의 자리다.** 다른 두 대륙의 괴물이 힘이 넘쳐서 생기는 것과 정반대이며, 그래서 이 대륙에서 위험한 자는 강한 자가 아니라 **비어 있는 자**다.\n\n포화도까지 세 대륙 중 가장 낮다. 개인이 자기 영의 복사로 상대를 **동화·감화시키는 일이 거의 없으므로**, 남을 물들여 세력을 만드는 방식이 성립하지 않는다. 이 대륙에서 믿음은 사람을 향하지 않고 물건을 향한다.\n\n## 병기 — 이해가 상한이다\n\n포화도가 낮으므로 [[폭발과 연소]]의 억제도 약하다. **이 대륙에서는 화기가 물리적으로 성립한다.**\n\n그런데도 대부분 냉병기를 쓴다. **구조가 복잡한 기계장치일수록 성체로 삼기 어렵기 때문이다.** 성체의 조건이 완전한 이해인데, 화기가 어떤 원리로 돌아가는지 아는 사람은 많지 않다.\n\n**현대적인 총기가 존재하기는 한다.** 엘리트 집단은 그것을 쓸 수 있다. 다만 표징의 크기가 이해에 비례하므로, 총을 들었다고 더 강한 표징을 행하게 되는 것은 아니다.\n\n세 대륙의 사정이 여기서 갈린다 — [[그렌빌리아 대륙]]은 만들 수 없어서 화기가 없고, [[로디니아 대륙]]은 아예 성립하지 않아서 없고, **이곳은 만들 수 있는데도 다루지 못해서 쓰지 않는다.**\n\n## 주제 — 믿음\n\n**신은 하나이고 해석은 둘이다.** 같은 가르침을 근거로 삼으면서 정반대 방향으로 갈려 대륙을 양분하고 있는 것이 이 대륙의 주제와 이어진다 (독자의 읽기).\n\n그리고 능력의 형태도 믿음이다 — 자기 힘을 자기가 쓰는 것이 아니라 **밖의 대상에 넘겨서** 쓴다. 그 대상을 이해하는 만큼만 힘이 나온다. → [[큰 그림]]\n\n## 대륙 간 관계\n\n**서사 시점까지 다른 대륙과의 접촉은 없다.** [[바다]]가 대륙 사이를 막고 있다.\n\n**접촉은 국가들이 붕괴한 뒤에 생긴다.** 위키 기준 현재에 이 대륙과 [[그렌빌리아 대륙]] · [[로디니아 대륙]]이 **'대륙 연합'**을 이룬다. → [[바다]]\n\n이 셋은 모두 **신대륙**이다. 구대륙은 [[판게아 대륙]]이다.\n\n## 이름\n\n**판노티아**(Pannotia) — 실제로 존재했던 초대륙의 이름이다. [[로디니아 대륙]]이 갈라진 뒤 조각들이 다시 모여 만들어진 것이 이 초대륙이다.\n\n**에데나**는 에덴(Eden)에서 왔다. **헬라이**의 어원은 알려지지 않았으나, 두 이름이 마주 놓인 자리를 보면 에덴의 반대편을 가리키는 것으로 추정된다.\n\n## 관련 문서\n\n- [[큰 그림]] · [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판게아 대륙]]\n- [[누스]] · [[노에시스]] · [[노에마]] · [[노모스]]\n- [[폭발과 연소]] · [[카시마르]] · [[바다]] · [[세계관 대문]]\n\n## 여담\n\n**세 대륙이 [[노에시스]]의 세 개념에 각각 대응한다** (독자의 읽기). [[그렌빌리아 대륙]]은 [[노모스]]로 공간을 덮고, [[로디니아 대륙]]은 [[노에마]]를 체계화해 몸으로 쓰고, 이 대륙은 [[누스]]에 힘을 맡긴다. 주제어도 그에 맞는다 — 소망은 자기 안에서 나오고, 사랑은 자기 몸에서 다듬고, **믿음은 밖의 대상을 향한다.**\n\n**[[신성제국]]이 이 대륙의 축소판이다** (독자의 읽기). [[그렌빌리아 대륙]] 동부에 이미 그런 나라가 하나 있다 — 《[[기사행전]]》이라는 [[누스]]를 법으로 삼고 [[교황]] 한 사람의 해석이 국가를 덮은 신정국가다. 이 대륙은 그 구조가 대륙 전체인 형태다.\n\n**'신의 가르침에 따라 신에게 저항한다'는 문장이 실낙원의 핵심이다.** 사탄의 반역조차 신의 섭리 안에서 벌어진다는 것이 그 작품의 구조인데, 이 대륙은 그것을 국가 두 개로 만들어 마주 세웠다. 저항하는 쪽도 순종하는 쪽도 **같은 가르침을 근거로 삼고, 같은 신을 섬긴다.**\n\n**대륙 이름 자체가 이 구도와 맞는다** (독자의 읽기). 판노티아는 [[로디니아 대륙]]이 갈라진 뒤 다시 **모여서** 만들어진 초대륙이다. 하나였던 것이 갈라졌다가 다시 모이는 이름 위에, 원래 하나였다가 둘로 갈린 대륙이 올라가 있다.\n\n**어느 쪽이 동쪽인지는 알려지지 않았다.** 다만 에덴이 동방에 있었다는 구절을 생각하면 **에데나**가 동쪽으로 추정된다.\n\n**아직 알려지지 않은 것.** 포화도의 정확한 수치, 하나였던 대륙을 갈라놓은 사건, 신의 정체와 그 활동의 내용, 두 나라의 역사, 그리고 '불신자'의 확정된 이름.","parentId":null},{"title":"편력기사","id":"knight-errant","type":"세력","folder":"02_지역","sortOrder":210,"era":"현대(붕괴 이후)","canon":"확정","status":"작성 중","tags":["신성제국","음지","기사","붕괴 이후"],"memo":"원문 510~513행 문장 그대로. 기사 체제 종료 이후 증가한다는 서술이므로 시대를 '현대(붕괴 이후)'로 달았다.","image":"resource/wiki/편력기사.png","imageCaption":"편력기사","summary":[["정의","서임 없이 기사를 칭하는 이들"],["체제 내 기사","[[하급기사]] · [[상급기사]] · [[제국기사]]"],["기사 체제 유지 중","존재감이 크지 않았다"],["체제 종료 이후","수가 늘어나는 추세"],["전설","최초로 양성한 학교"],["소문","그 학교가 아직 존속한다"]],"content":"# 편력기사\n\n```틀\n신성제국\n```\n\n반드시 ‘서임’을 통해 될 수 있는 체제 내의 ‘하급기사’, ‘상급기사’, ‘제국기사’와 달리, 서임 받지 않음에도 기사를 칭하며 활동하는 이들을 부르는 명칭이다. ‘하얀 일요일’로 촉발된 기사 체제가 유지되는 동안에는 크게 존재감을 내비치지 않았으나, 기사 체제 종료 이후 점점 그 수가 늘어나는 추세이다.\n\n이들을 최초로 양성한 학교에 대한 전설이 내려오며, 현재까지도 편력기사를 양성하는 학교가 어딘가에 존속하고 있어, 편력기사들의 수가 늘어나고 있다는 소문이 퍼지고 있다.\n\n## 왜 체제 안에서는 드물었는가\n\n재단의 **의무교육을 마치면 누구나 [[하급기사]] 서임을 받는다.** 서임받지 않은 사람이 외부인이나 어린 아이뿐이라면, 서임 없이 기사를 칭할 자리가 애초에 없다 (추정).\n\n그래서 기사 체제가 유지되는 동안에는 존재감이 없었고, **서임할 사람이 사라진 뒤에** 수가 늘어난다. → [[신성제국의 문화]]\n\n## 관련 문서\n\n- [[신성제국]] · [[하급기사]] · [[상급기사]] · [[제국기사]]\n- [[정복자들]]\n- [[하얀 일요일]]\n\n## 여담\n\n**서임이 무의미해진 자리에서 생긴다.** 이 나라의 기사는 누가 서임했는지로 위계가 정해지는데, 체제가 끝나면 서임할 사람이 없어진다. 그때 남는 것은 스스로 기사를 칭하는 이들이다.\n\n**교황의 노에시스가 기사도 문학이었다는 점과 이어진다** (추정). 편력기사(knight-errant)는 그 문학의 전형적인 인물형이다. 국가가 만든 기사 체제가 끝난 뒤에 남는 것이 이야기 속의 기사상이라는 구도다.\n\n**학교의 전설은 확인되지 않았다.** 최초로 양성한 학교가 어디였는지, 지금도 존속하는지가 소문의 형태로만 전해진다.","parentId":"holy-empire"},{"title":"하급기사","id":"junior-knight","type":"세력","folder":"02_지역","sortOrder":130,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","기사","교육"],"memo":"원문 477~478행 문장 그대로.","image":"resource/wiki/하급기사.png","imageCaption":"하급기사","summary":[["서임","재단의 의무교육 — 남녀 모두"],["실질","졸업하면 받는 기본 신분"],["역량","기초 무술과 호신술"],["생업","농업"],["비서임자","외부인이거나 어린 아이"],["대우","상급기사에 비하면 민간인"]],"content":"# 하급기사\n\n```틀\n신성제국\n```\n\n재단에 속한 교육기관에서 기사 서임을 받은 기사. 서임이라 하지만 교육기관을 졸업하면 부여되는 기본 신분에 가깝다. 기초적인 무술, 호신술을 연마하였지만 상급기사와 비교한다면 영락없는 민간인으로 취급되곤 한다.\n\n## 국민 전체가 여기에 속한다\n\n재단의 **의무교육**을 마치면 서임을 받는다. 일반 교육이 따로 없으므로 이 길만 있으며, **남녀 모두** 대상이다. 서임을 받지 않은 사람은 **외부인이거나 어린 아이다.**\n\n평소 생업은 **농업**이다. 국민 전체가 기사인 나라에서 기사 대다수가 농민이라는 뜻이 된다.\n\n이 신분 덕에 분쟁을 **결투**로 가리는 것이 사회 전체에서 성립한다. → [[신성제국의 정치]] · [[신성제국의 문화]]\n\n## 관련 문서\n\n- [[상급기사]] · [[제국기사]] · [[편력기사]]\n- [[신성제국]]\n\n## 여담\n\n**국민 전체가 기사가 되는 체제의 밑바닥이다.** 장정한 백성이 모두 서임받는다는 것이 실제로는 이 등급을 말한다. 기사라 불리지만 민간인 취급이며, 학교를 마쳤다는 증명서에 가깝다.\n\n**[[연방]]의 교육과 정반대다** (추정). 연방에서 평민은 기초교육만 받고 단순 노동자로 진로가 정해지는데, 이 나라에서는 같은 층위의 사람들이 '기사'라는 신분을 받는다. 실질이 비슷한 두 사회가 이름을 전혀 다르게 붙였다.","parentId":"holy-empire"},{"title":"헌병대","id":"gendarmerie","type":"세력","folder":"02_지역","sortOrder":70,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","무력","노에마","헌병"],"memo":"원문 314~317행 문장 그대로. 작가 확인(2026-07-31)으로 '초자연적인 힘'의 정체가 확정됐다 — 헌병은 구사자가 아니라 노에마 능력자이고, 매개체는 연방 헌법이다. 지휘 계통은 건국의 아버지들의 혈족을 따른다.","image":"resource/wiki/헌병대.png","imageCaption":"헌병의 무장","summary":[["소속","[[의회]] 직속"],["성격","연방의 유일한 군사조직"],["존속 근거","[[연말 위기]] 비무장화 조항"],["전력의 정체","[[노에마]] 능력자 (구사자 아님)"],["매개체","[[연방 헌법]]"],["개인 역량","1인이 1군단에 버금간다"],["규모","소수 집중 양성"],["동원 조건","법적 절차 + 의원 간 합의"],["지휘 계통","[[건국의 아버지들]]의 혈족"]],"content":"# 헌병대 🗡️\n\n```틀\n연방\n```\n\n연방의 유일한 군사조직이자 의회 직속 무력집단. 대외적으로는 군대 내 치안조직만 남겨둠으로서 전쟁 수행 능력을 완전히 상실시켜버리는 목적으로 유지된 집단이지만, 연방 내부적으로는 제한된 인원을 집중적으로 양성하고, ‘초자연적인 힘’을 다루는 이들로 구성하여 헌병 1인의 역량을 하나의 군단에 버금갈 정도로 육성해둔 상태이다.\n\n하지만 헌병대를 동원하는 것은 법적 절차를 거쳐야하고, 의원들간의 이해관계가 맞아떨어져야 하는 등의 제한적인 상황에서만 가능한 행동이기 때문에, 연방 내에서 ‘헌병대’가 실제로 활동하는 모습을 본 이들은 거의 존재하지 않는다.\n\n## 초자연적인 힘의 정체\n\n헌병은 [[노에마]]를 구사하지만 **구사자가 아니라 노에마 능력자**다. 매개체가 [[연방 헌법]]이기 때문이다.\n\n이 구조에서 두 가지가 따라 나온다.\n\n- **헌법이 훼손되면 힘을 잃는다.** [[누스]]는 파손될 경우 그것을 통해 능력을 얻은 이가 능력을 잃을 가능성이 높다. 헌법은 [[연말 위기]]에 80~90%가 소실되었다.\n- **지휘 계통이 혈통을 따른다.** [[건국의 아버지들]]의 혈족이 헌병을 부를 수 있다. 그래서 [[애덤스]]의 딸인 [[세라]]는 의원도 관료도 아닌 민간인 신분으로 헌병을 거느린다.\n\n## 스스로에 대한 규정\n\n헌병은 자신을 이렇게 부른다.\n\n```대사\n연방을 지켜온 최초의 ‘방패’ 이자, 지금은 최후의 ‘칼날’…\n— 세라가 전하는 아버지의 말, 6편\n```\n\n그러나 [[연방 헌법]]이 소실된 뒤로는 그 규정을 스스로 부정한다. 6편에서 한 헌병이 [[세라]]에게 말한다.\n\n```대사\n하하하, 그것도 이제는 옛말이죠. 지금의 우리는 ‘칼날’도, ‘방패’도 될 수 없습니다.\n헌법은 그날 무너졌으니.\n집행할 법이 없다면, 헌병이 무슨 의미가 있을까요. 경찰도, [보안관]도 마찬가지고.\n— 연방 헌병, 6편\n```\n\n**신념을 확인하고 따른다.** 같은 장면에서 헌병은 헌법을 복원하겠다는 세라에게 딱 하나를 묻는다 — \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\" 세라의 대답은 \"…‘가족’ 이요\"였다.\n\n**수도주 광장에 나타난다.** 수도주에 사는 아이들 사이에는 \"매년 5월, 이맘때가 되면 새벽의 광장에서 아주 무서운 일이 벌어진다\"는 이야기가 돈다.\n\n## 서사에서의 등장\n\n- **6편** — 수도주 광장과 밀실. [[세라]]가 헌법을 들고 있는 것을 보고 [[건국의 아버지들]]과의 관계를 짐작한다.\n- **17편** — [[해리엇]]이 세라의 의회 진입을 막으려 하자 \"현재 ‘헌법 복원’이 시급합니다, 귀하께서 비서관을 방해한다면, 우선순위에 따라 배제하겠습니다\"라며 물러서게 만든다. 경찰청장이 \"당신 같은 민간인이 어떻게 헌병을 데리고 있는 거야!?\"라 외치는 장면이다.\n- **18편** — 본회의장. [[데이비스]]가 \"헌병… 세라!! 설마…!\"라 알아채는 순간 판이 뒤집힌다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]]\n- [[노에마]] · [[누스]] · [[연방 헌법]]\n- [[건국의 아버지들]] · [[애덤스]] · [[세라]]\n- [[연말 위기]]\n- [[경찰청]] · [[보안관]] · [[기동대]] — 연방에 남은 다른 무력\n\n## 여담\n\n**비무장화 조항의 구멍이 이 조직이다.** 반 연방 세력은 연방의 전쟁 수행 능력을 없애려 정규군 중 가장 작은 조직만 남기게 했는데, 연방은 그 작은 조직에 초자연 전력을 몰아넣었다. 겉으로는 군대 내 치안조직, 실제로는 1인이 군단급인 집단이다. 조약을 어기지 않으면서 조약의 목적을 무너뜨린 셈이다.\n\n**'소문으로만 아는 무력'이라는 설정이 두 번 설명된다.** 동원 절차가 까다로운 것이 하나, 매개체인 헌법이 대부분 불타 없어진 것이 둘이다. 대본 용어사전이 헌병을 \"좀처럼 모습을 드러내지 않아, 소문으로만 아는 이가 대부분\"이라 적은 것과 맞물린다.\n\n**서사에서 가장 무거운 카드다.** 마왕이 될 [[세라]]가 연방의 유일한 초자연 무력을 쥐고 있고, 그 근거가 혈통이며, 무력화 방법이 헌법 파괴라는 것까지 한 줄로 이어진다.","parentId":"federation"},{"title":"황립 조선소","id":"royal-shipyard","type":"세력","folder":"02_지역","sortOrder":180,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","조선","기술","비밀"],"memo":"원문 494~496행 문장 그대로.","image":"resource/wiki/황립 조선소.png","imageCaption":"황립 조선소","summary":[["기원","드레드노 왕국 시기"],["성격","분지 조선기술의 중심"],["현재","독자적인 세력권"],["기술","대형 선박을 짓는 유일한 곳"],["전수 방식","비밀리에"],["대외 인지도","거의 알려지지 않았다"],["접촉 시도","[[연합]] — [[하얀 일요일]]로 무산"]],"content":"# 황립 조선소\n\n```틀\n신성제국\n```\n\n드레드노 ‘왕국’ 시기부터 형성된 드레드 분지의 조선기술의 중심 세력으로, ‘하얀 일요일’ 이후에도 독자적인 세력권을 형성하고 있다. 대륙 내에서 거의 유일하게 대형 선박을 건조할 수 있는 기술을 보유한 세력이기도 하며, 이들의 기술은 비밀리에 전수되고, 존재 자체도 대외적으로 그렇게 알려져있지 않은 편이다.\n\n과거 ‘연합’ 측에서 접촉을 시도한 바 있으나, ‘하얀 일요일’ 사건으로 인해 무산되어 버렸다.\n\n## 도시\n\n이 세력도 **도시를 하나 보유하고 있다.** 다만 항구도시는 아니다 — [[바다]]가 닫혀 있어 이 나라에 그런 개념 자체가 없다. 대륙에서 거의 유일하게 대형 선박을 짓는 곳이 바다를 앞에 두고도 그렇다. → [[신성제국의 지리]]\n\n## 관련 문서\n\n- [[신성제국]] · [[잔존 함대]]\n- [[연합]] · [[하얀 일요일]]\n- [[바다]] · [[신성제국의 역사]]\n\n## 여담\n\n**이 세력이 이 나라의 역사를 가능하게 했다.** 수도를 선박으로 엮어 호수 한가운데로 옮긴 것도, 눈물의 10년 동안 선박을 무기화해 재정복을 이룬 것도 여기서 나왔다. 국가가 두 번 살아남은 수단이 배였고 그 배를 지은 곳이다.\n\n**[[연합]]이 접촉하려 한 이유가 있다** (추정). [[바다]]는 노에시스 때문에 원양에서 나무 선체가 부식될 정도이고, [[연합]]의 길드는 '날아오르는 이가 진실에 도달한다'는 기록 때문에 항공을 연구한다. 대형 선박을 짓는 유일한 기술이 그 둘 사이 어딘가에서 쓸모가 있었을 것이다.\n\n**대륙에서 거의 유일하다는 점이 [[연방]]과 겹친다.** 연방은 바다에 닿지 않아 배가 필요 없고, 이 나라는 배로 국가를 지켰다. 같은 대륙에서 물과 선로가 완전히 갈렸다.","parentId":"holy-empire"},{"title":"교황","id":"pope","type":"인물","folder":"04_인물","sortOrder":100,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","신성제국","교황","누스"],"memo":"원문 §1 신성제국의 「하얀 일요일」·「신성제국의 탄생」을 근거로 만든 문서다. 작가 답변(2026-07-31) — 이름이 있으나 아직 공개되지 않았고, 기사 체제가 종료되기까지 무슨 일이 있었는지도 앞으로의 이야기에서 밝혀진다.","image":"resource/wiki/교황.png","imageCaption":"교황","summary":[["소속","[[교단]] — 최고 통치자"],["이름","알려지지 않았다"],["발현 시점","2차 크레스티아-드레드노 전쟁 중"],["매개체","고대 바실리아의 [[누스]] (정체 불명)"],["발현 조건","가족을 잃은 트라우마"],["노에시스의 형태","[[레콩키스타]] 기사도 문학"],["법전","《[[기사행전]]》 — [[누스]]"],["후계","없다"],["이룬 것","[[하얀 일요일]] · [[신성제국]] 체제"],["현재","알려지지 않았다"]],"content":"# 교황\n\n```틀\n신성제국\n```\n\n[[신성제국]]의 최고 통치자. **전쟁으로 가족을 잃은 아이 하나가 국가 하나를 갈아치운 인물이다.**\n\n## 발현\n\n2차 크레스티아-드레드노 전쟁이 한창이던 때, 고대 바실리아의 유물인 [[누스]]를 발견했다. 당시 그는 전쟁으로 가족을 잃은 상태였고, **그 트라우마 때문에 누스와 상호작용할 수 있었다.** 결과는 아주 강력한 [[노에마]]의 발현이었다.\n\n**그 누스는 정체 불명이다.** 서사 시점에도, 위키 기준 현재에도 어디에 있는지 무엇인지가 알려져 있지 않다.\n\n그 힘이 승리 직전의 드레드노 제국을 완전히 마비시키고, 물 위에 있던 수도와 황가를 호수 바닥으로 가라앉혔다. → [[하얀 일요일]]\n\n## 노에시스의 형태\n\n[[노에시스]]의 형태는 그 사람의 신념·사상·경험·가치관에 따라 달라진다. 이 인물의 것은 **[[레콩키스타]] 시기의 기사도 문학**으로 상당 부분 이루어져 있었다.\n\n그래서 그가 세운 나라는 기사단국 시절로 회귀했다. 군부·산업가·학자가 모두 재단으로 묶여 기사단을 양성하고, 장정한 백성은 모두 그에게 서임받아 기사가 되고, 가상으로 만들어진 [[카시마르]]를 토벌하는 것이 국가의 1순위 목표가 되었다.\n\n**한 사람이 읽은 이야기가 국가의 형태가 되었다.**\n\n## 트라우마가 국책이 되다\n\n분지 외부와 철저히 단절하는 기조 역시 그의 트라우마에서 나온 것으로 짐작된다. 그 트라우마가 '전쟁'에서 왔기 때문이다.\n\n같은 상처가 반대로 쓰이기도 했다. [[연말 위기]] 당시 [[연합]]의 외교관이 그 트라우마를 간파하고, [[연방]]이 [[크레스티아 제국]]을 완전히 흡수하면 2차 전쟁 같은 일이 재발할 것이라고 회유했다. 그는 **격분해서** 고립주의를 접고 동맹에 응했다.\n\n## 그의 해석이 법이다\n\n이 나라에 성문 헌법은 없다. 대신 그의 기사도 문학 **《[[기사행전]]》**이 있고, 이것은 [[누스]]다. 그 책에 무엇이 적혀 있는지보다 **그가 그것을 어떻게 해석하는가**가 법에 가깝다. → [[신성제국의 정치]]\n\n## 후계가 없다\n\n다음 교황을 정하는 절차도, 후보도 없다. 법의 해석부터 [[제국기사]]의 서임, 국민 전체의 기사 신분, 토벌해야 할 [[카시마르]], [[하얀 일요일]]을 인지하지 못하게 만드는 힘까지 모두 그에게서 나오는데 그것을 이어받을 자리가 비어 있다.\n\n**그래서 체제가 붕괴한다.**\n\n## 지위\n\n- [[제국기사]]를 **직접 서임**하며, 그 작위는 초자연적인 힘을 부여한다.\n- 제국기사는 그에게만 충성하고, 그는 이들을 960시간까지 소집할 수 있다.\n- 다만 그가 직접 주요 세력에게 지시를 내리는 일은 흔치 않다. 지금의 [[교단]]은 [[추기경]]들을 중심으로 굴러간다.\n\n## 관련 문서\n\n- [[신성제국]] · [[교단]] · [[추기경]] · [[제국기사]]\n- [[하얀 일요일]] · [[누스]] · [[노에마]] · [[노에시스]]\n- [[레콩키스타]] · [[카시마르]] · [[연말 위기]]\n\n## 여담\n\n**[[세라]]와 같은 구조다.** 두 사람 다 [[누스]]를 손에 넣어 국가를 자기 신념으로 덮었다. 세라는 [[연방 헌법]]에 '가족'을 새겼고, 이 인물은 기사도 문학을 국가 체제로 만들었다. 상처의 내용만 다르다 — 한쪽은 가문 사람이 아니라 놀림받은 아이였고, 다른 쪽은 전쟁으로 가족을 잃은 아이였다.\n\n**두 사람 다 아이였을 때 그 상처를 받았다.**\n\n**아직 알려지지 않은 것.** 이름, 그리고 기사 체제가 종료되기까지 그에게 무슨 일이 있었는지. 위키 기준 현재에는 체제가 끝나 있다.","parentId":"people"},{"title":"네빌","id":"neville","type":"인물","folder":"04_인물","sortOrder":20,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","스프링필드","네빌"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 프롤로그·1·2·3·5·14·16·17편, _인물관계.md, 주역·기호 배정. 사투리는 의도된 연출이므로 인용에서 고치지 않는다.","image":"resource/wiki/네빌.png","imageCaption":"네빌","summary":[["소속","[[철도청]]"],["직함","비서"],["기호","🎫"],["첫 등장","프롤로그"],["주역 편","1 · 14"],["등장 편","프롤로그 · 1 · 2 · 3 · 5 · 14 · 16 · 17"],["혈연","[[스프링필드]] 가 · [[코네트]]"],["목표","미정 — 자기 일을 의심한다"],["방식","낮은 자리에서 할 말을 한다"],["훗날","미정"],["말투","~함다 / ~슴다 / ~임다 / ~검다"]],"content":"# 네빌\n\n[[철도청]] 비서. 1부의 시선이자, [[스프링필드]] 가를 10년 전에 떠난 사람이다. 청장의 '특별 지시'를 품고 고향 [[북방주]]로 돌아오는 것이 1편이다.\n\n## 인물\n\n**사투리를 쓴다.** `~함다` `~슴다` `~임다` `~검다`로 끝나는 말투가 그의 표식이며, 지방 출신이라는 사실을 문장마다 드러낸다.\n\n낮은 자리에서 정직한 말을 하는 역할이다. 프롤로그에서 이미 자기가 하는 일을 의심한다.\n\n```대사\n…저희가 하는 일이 ‘약탈’이랑 다른 게 뭠까?\n— 네빌, 프롤로그\n```\n\n```대사\n딴 소리 하지 마십쇼. 안되는 건 안되는 검다, 저는 분명 경고했슴다.\n— 네빌, 1편\n```\n\n## 소년 → 비서 → 소년\n\n화자 라벨이 신분을 따라간다.\n\n| 시기 | 라벨 |\n|---|---|\n| 3년 전 (16편 회상) | `소년` — 아직 [[철도청]]에 들어오기 전 |\n| 프롤로그 ~ 16편 | `비서` |\n| 17편 | **`소년`** — 반역죄로 몰린 뒤 |\n\n14편에서 반역죄를 쓰고 나면 더 이상 비서가 아니다. 14편의 부제가 「소년의 영광」이며, 시작한 자리로 되돌아간다.\n\n## 두 번의 이탈\n\n[[대가문]]의 힘은 그 지역 안에서만 통한다. 영역을 벗어나면 평민과 크게 다르지 않으므로, 가문을 떠나 관청에 들어가는 길이 실제로 열려 있다. 다만 대가문 자제는 고등교육을 받고 평민은 기초교육 뒤 단순 노동으로 가는 사회이므로, 그 선택은 특권을 스스로 버리는 일이 된다. → [[연방의 문화]]\n\n\n네빌은 같은 일을 두 번 한다. **속한 곳을 스스로 떠나는 것**이다.\n\n- **10년 전** — [[스프링필드]] 가를 떠나 고향을 등졌다. 4편의 회상이다.\n- **3년 전** — [[대가문]]을 등지고 [[철도청]]에 제 발로 지원했다. [[세라]]가 면접해 받아들였다. 16편의 회상이다.\n\n그리고 서사 안에서 세 번째로 이탈한다. 5편의 사건이 \"[[세라]], 무단이탈한 네빌의 흔적을 쫓기 시작하다\"다.\n\n## 행적\n\n### 프롤로그 — 의뢰인의 일\n\n정체를 감춘 인물들과 함께 있다. 자기 일이 약탈과 무엇이 다른지 묻고, 어릴 때 친하게 지냈던 '가족'이 있다고 말한다. 그 가족이 [[코네트]]다.\n\n### 1편 — 귀향\n\n열두 번의 환승을 거쳐 [[스프링필드]] A 역에 도착한다. 청장의 특별 지시를 품고 있다. 편 부제가 「피는 물보다 진하다」다.\n\n### 2~3편 — 설득\n\n[[철도청]]이 [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'하는 과정에 놓인다. 2편에서 [[기동대]]를 쓰자고 제안했다가 [[앤드루]]에게 거절당한다 — 기록이 남기 때문이다.\n\n### 14편 — 소년의 영광\n\n[[세라]]가 단말기로 불러낸 자리에 나갔다가 반역죄로 몰리고, [[잭슨]]에게 구출된다. 이 편의 주역이며 부제가 「모든 답은 나왔다. 어떻게 살 것인가만 빼고」다.\n\n### 16~17편 — 심문과 그 뒤\n\n지하 심문실에서 [[세라]]에게 [[앤드루]]의 행방을 추궁받는다. 모른다고 답하고, 세라는 침착함을 잃는다. 같은 편의 3년 전 회상에서 그가 [[철도청]]에 지원해 면접을 보는 장면이 나온다.\n\n17편부터 라벨이 `소년`이다.\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[앤드루]] | 고용 | 철도청장과 그를 따라다니는 비서 |\n| [[세라]] | 고용 | 3년 전, 대가문을 등지고 온 그를 면접해 받아들였다 |\n| [[코네트]] | 혈연 | 같은 [[스프링필드]] 가. 어릴 때 친하게 지냈다 |\n| [[잭슨]] | 협력 | 반역죄로 몰린 그를 열차 강도가 빼내다 |\n\n## 여담\n\n**기호가 🎫(승차권)인 이유.** 1편이 열두 번의 환승으로 시작하고, 그가 소속을 바꿔 가며 옮겨 다니는 사람이라는 점과 겹친다. [[철도]]가 이 나라의 뼈대라는 설정에서 가장 낮은 자리의 표가 그의 상징이 된다.\n\n**1부의 눈이지만 주인공은 아니다.** 발화량은 199로 [[세라]] 다음이고 프롤로그의 시선도 그인데, 2부에 들어가면 5편 이후 14·16·17편에만 나온다. 이 작품이 개인의 활약이 아니라 이해관계를 축으로 굴러간다는 방침([[세계관 대문]])이 인물 배치에서도 드러나는 자리다.\n\n**사투리는 교정하지 않는다.** `~검다` `~함다`는 오타가 아니라 의도된 연출이다. `독ㄹ —` 같은 자모 파편도 말이 중간에 끊기는 연출이므로 손대지 않는다.","parentId":"people"},{"title":"데이비스","id":"davis","type":"인물","folder":"04_인물","sortOrder":40,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","의회","북부동맹","데이비스"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·7·8·9·11·12·13·17·18편, _인물관계.md. '명백한 운명'이 그의 말을 상징으로 채택한 조직이라는 것은 작가 확인(2026-07-31)이며, 8편의 해당 대사는 조직명이 아니라 관용구다.","image":"resource/wiki/데이비스.png","imageCaption":"데이비스","summary":[["소속","[[의회]]"],["직함","자치파 의원 → [[북부동맹]] 위원장"],["기호","🎭"],["첫 등장","5편"],["주역 편","8"],["등장 편","5 · 7 · 8 · 9 · 11 · 12 · 13 · 17 · 18"],["혈연","알려진 것 없음"],["목표","북부·동부의 분리 독립"],["방식","남이 먼저 나서게 만든다"],["훗날","[[미트로프 내전]]에서 분쇄"]],"content":"# 데이비스\n\n[[자치파]] 의원에서 [[북부동맹]] 위원장으로 옮겨간 인물. 2부의 판을 짜는 쪽이며, [[대가문]]들을 포섭해 **분리 독립**까지 밀고 간다.\n\n## 인물\n\n기호가 🎭(가면)이다. 실제로 그의 행동은 대부분 **다른 사람이 먼저 나서게 만드는 것**이다.\n\n- [[스프링필드 가주]]에게 '분리 독립'을 제안한다 (8편)\n- [[연방 의원 A]]를 움직여 동방주가 먼저 조례를 던지게 만들고, 나머지는 자기가 맡는다 (9편)\n- [[타게니아]] 감독관의 개입마저 자기 판의 말로 쓴다 (13편)\n\n말투는 여유롭고 능글맞다. 8편의 \"이것도 어쩌면 ‘명백한 운명’ 일지도 모르겠어요~\" 같은 어투가 그의 것이다. 이 표현은 이때는 그냥 관용구인데, 훗날 그를 잇겠다는 자들이 조직 이름으로 삼는다. → [[명백한 운명]]\n\n## 라벨의 변화\n\n화자 라벨이 그의 위치를 따라간다.\n\n| 편 | 라벨 |\n|---|---|\n| 5편 · 7편 초반 | `연방 의원` — **파벌이 나오지 않는다** |\n| 7편 후반 ~ 9편 | `자치파 의원` |\n| 11편 ~ | `북부동맹 위원장` |\n| 18편 회상 | `통일파 의원` |\n\n첫 등장에서 파벌을 감춘 것이 눈에 걸린다. [[세라]]와 마주 앉아 있는 5편에서 그는 그냥 '연방 의원'이고, 자치파라는 사실은 뒤에 드러난다.\n\n## 연말 위기 당시\n\n지금은 [[잭]]과 서로의 마지막 걸림돌이지만, 두 사람은 **한때 같은 [[통일파]]**였다. 둘 다 온건파였고, 통일파가 [[철도파]]를 제거한 쿠데타의 **실행자가 아니라 방관자**에 가까웠다.\n\n[[먼로]]가 헌병을 앞세워 개전 반대파를 침묵시킬 때 그 자리에 함께 있었고, 함께 침묵당했다.\n\n## 행적\n\n### 8편 — 소문\n\n연회장에 '분리 독립'의 소문이 돌고, 북부 습격 소식이 당도한다. 이 편의 주역이며 부제가 「그는 우리의 대변자이시다」다.\n\n### 8편 이후 — 세라의 권유\n\n[[세라]]가 그에게 배후를 캐지 말라고 권한다. '습격당했다'는 상황만 있으면 다른 의원들이 알아서 [[통합파]]의 짓으로 볼 것이라는 논리다. [[북부동맹]]이 세워질 명분이 이 대화에서 나온다.\n\n5편에서 그가 세라에게 남긴 말이 뒤에 다시 읽힌다 — \"비서관님은 가끔 보면 참 재밌단 말이죠…\"\n\n### 9편 — 조례\n\n동방주가 심야 조례를 앞세워 경찰 무장해제에 나선다. [[연방 의원 A]]와 [[필립]]이 현장에서 집행하고, 데이비스는 뒤에 있다.\n\n### 11~13편 — 장악\n\n[[북부동맹]]이 의회를 장악한다. 13편에서는 [[연합]] 감독관 [[타게니아]]의 개입까지 자기 판에 끌어들인다.\n\n### 18편 — 독립 선언\n\n본회의장에서 독립을 선언한다. [[연방 헌법]] 제4조를 근거로 삼고, 독립에 가담한 여섯 [[대가문]]의 이름을 부른다.\n\n```대사\n콩코드, 하트퍼드, [스프링필드]! 그리고 도버, 윌밍턴, 밀퍼드 가문의 인민들은!!\n— 데이비스, 18편 독립 선언\n```\n\n그러나 판은 곧 다시 뒤집힌다. [[세라]]가 [[헌병대]]와 함께 나타난 순간이다.\n\n```대사\n헌병… *뿌득* 세라!! 설마…!\n— 데이비스, 18편\n```\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[잭]] | 적대 | 한때 같은 [[통일파]], 지금은 서로의 마지막 걸림돌 |\n| [[스프링필드 가주]] | 포섭 | 북부 대가문에 '분리 독립'을 제안했다 |\n| [[연방 의원 A]] | 포섭 | 동방주가 먼저 조례를 던지게 만들고, 나머지는 자기가 맡았다 |\n| [[타게니아]] | 이용 | 감독관의 개입마저 자기 판의 말로 썼다 |\n| [[세라]] | 유도 | 배후를 캐지 말라는 권유를 받아 [[북부동맹]]의 명분을 얻었다 |\n| [[먼로]] | 억압 | [[연말 위기]] 당시 헌병 앞에서 함께 침묵당했다 |\n\n## 여담\n\n**연말 위기의 피해자가 다음 위기의 설계자가 된다.** 헌병 앞에서 침묵당한 온건파 의원이, 몇 년 뒤 헌병을 앞세운 [[세라]]에게 다시 판을 빼앗긴다. 두 장면이 같은 구도로 겹친다.\n\n**그의 실패가 조직을 남긴다.** [[미트로프 내전]]에서 독립파가 분쇄된 뒤, 그를 잇겠다는 자들이 [[명백한 운명]]을 세운다. 정작 데이비스 본인은 그 조직을 만들지 않았고, 그가 무심코 쓴 관용구만 상징으로 남는다.\n\n**아직 모르는 것.** 내전 이후 데이비스 본인이 어떻게 되는지. [[명백한 운명]]이 \"그를 잇겠다\"고 하는 것으로 보아 그 시점에는 이미 무대에서 사라진 듯하나, 확인되지 않았다.","parentId":"people"},{"title":"세라","id":"sarah","type":"인물","folder":"04_인물","sortOrder":10,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","마왕","세라"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·6·8·14·16·17·18편, _인물관계.md, 주역·기호 배정. '세라가 마왕'과 '헌법 누스를 복구해 연방을 장악하려 한다'는 작가 확인(2026-07-31). 마왕화의 구조를 노모스로 읽은 부분은 추론이며 메모에만 두었다.","image":"resource/wiki/세라.png","imageCaption":"세라","summary":[["소속","[[철도청]]"],["직함","비서관"],["기호","📕"],["첫 등장","5편"],["주역 편","16 · 17 · 18 (3편 연속)"],["등장 편","5 · 6 · 8 · 14 · 16 · 17 · 18"],["혈연","[[애덤스]] — 아버지"],["목표","'가족'의 이름으로 [[연방]] 재건"],["방식","[[연방 헌법]] 개헌 · [[헌병대]]"],["훗날","마왕"]],"content":"# 세라\n\n[[철도청]] 비서관. 겉으로는 [[앤드루]] 청장 밑의 실무자이고, 실제로는 소실된 [[연방 헌법]]을 복구해 [[연방]]을 장악하려는 인물이다. 훗날 **마왕**이 된다.\n\n## 말투\n\n세라의 말투는 편에 따라 크게 달라진다. 이 변화가 이 인물의 정체를 드러내는 장치다.\n\n### 1부 — 더듬는 소심함\n\n5편과 8편의 세라는 의원 앞에서 말을 더듬는다. `그, 의, 의원님` `자, 잠시만요` `구, 굳이` 같은 토막과 `*꿀꺽*` `*삐질*` 같은 지문이 붙는다.\n\n그런데 그 더듬는 말로 하는 일이 **의원을 원하는 방향으로 몰아가는 것**이다. 8편에서 [[데이비스]]에게 이렇게 말한다.\n\n```대사\n*꿀꺽*… 배후가 누구인지, 굳이 알아보지 않아도 괜찮을 것 같은데요.\n제, 제 말은! 그저 ‘습격당했다’는 상황만 있으면 된다는 뜻입니다, 의원님!\n— 세라, 8편\n```\n\n[[데이비스]]는 그 낌새를 알아챈 듯한 반응을 보인다.\n\n```대사\n비서관님은 가끔 보면 참 재밌단 말이죠…\n— 데이비스, 5편\n```\n\n### 16편 — 반말 명령조\n\n지하 심문실에서 말투가 뒤집힌다. 존대가 사라지고 반말 명령이 나온다. 화자 라벨도 `세라 | 비서관`에서 **`세라 | ???`** 로 바뀐다.\n\n```대사\n길게 끌 생각 없어요, 바로 물어볼게요.\n앤드루, 어딨어.\n— 세라, 16편\n```\n\n```대사\n장난 칠 시간 없다고요, 이미 다 알고 있으니까. 말해.\n— 세라, 16편\n```\n\n원하는 답이 나오지 않으면 침착함이 무너진다 — `이상하네, 부, 분명… 분명 알고 있을텐데…?` `닥쳐, 철도청장이 북부에서 수작을 부리는데…`\n\n### 2부 후반 — 침착한 위엄\n\n17편 이후로는 더듬지 않는다. [[해리엇]] 경찰청장을 [[헌병대]]로 물러서게 만들면서 하는 말은 이것이다.\n\n```대사\n너무 걱정하지 마세요, 제 가족을 해칠 생각은 없으니까요.\n— 세라, 17편\n```\n\n경찰청장에게 '가족'이라 부르는 대목이 핵심이다. 세라에게 가족은 혈연이 아니라 **자기 편으로 규정한 모든 것**이다.\n\n## 유년\n\n아버지 [[애덤스]]와 둘뿐이었다. 어머니가 없고 [[대가문]] 사람도 아니라는 이유로 학교에서 놀림받았다.\n\n```대사\n나는 엄마도 없고… 다른 애들처럼 ‘가문’ 사람도 아니라면서… *훌쩍*\n— 어린 세라, 17편 회상\n```\n\n애덤스는 이렇게 답했다.\n\n```대사\n너무 걱정하지 마. 아빠가 다 해결해줄테니까.\n아빠가 전에 ‘가족’은 뭐라고 했었지?\n— 애덤스, 17편 회상\n```\n\n세라의 대답이 \"무슨 일이 있어도 항상 내 편\"이었다. **이 한 줄이 훗날 헌법 조문이 된다.**\n\n## 행적\n\n### 5편 — 등장\n\n무단이탈한 [[네빌]]의 흔적을 쫓기 시작한다. 이 시점에는 유능하지만 소심한 비서관으로만 보인다.\n\n같은 편의 두 달 전 회상에서 [[앤드루]]와 나누는 대화가 나온다. 청장이 \"진짜 문제는 [[대가문]]이야\"라 하자 세라의 대답은 이랬다.\n\n```대사\n…청장님은 그 단어를 참 좋아하시네요.\n고작 단어 하나에도 정을 붙이시다니, 이상하신 분이라니까요.\n— 세라, 5편 회상\n```\n\n### 6편 — 헌법\n\n수도주 광장에서 [[헌병대]]와 만난다. 헌병이 헌법 소실로 존재 의의를 잃었다고 말하자 세라는 책을 내보인다.\n\n```대사\n*슬쩍* 제가 다시 세울 수 있다면요?\n— 세라, 6편\n```\n\n헌병은 그가 [[건국의 아버지들]]과 관계가 있음을 알아채고, 딱 하나를 묻는다. \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\"\n\n```대사\n…‘가족’ 이요.\n— 세라, 6편\n```\n\n이후 밀실에서 조력자([[식스]])와 함께 헌법을 복원한다. 이 편의 사건 요약은 \"밀실에서 '폭탄'이 완성되어 가다\"다.\n\n### 8편 — 명분\n\n연회장에서 [[데이비스]]에게 북부 습격 소식을 전하며, 배후를 캐지 말고 '습격당했다'는 상황만 쓰자고 권한다. [[대가문]]이 [[경찰청]]과 [[통합파]]와 척을 진 세력이므로 다른 의원들이 알아서 통합파의 짓으로 볼 것이라는 논리다.\n\n[[북부동맹]]이 세워질 명분을 만들어 준 쪽이 세라다.\n\n### 14편 — 부름\n\n[[네빌]]에게 단말기로 메시지를 보내 불러낸다. 화자 라벨이 `세라 | 단말기`다.\n\n```대사\n[네빌, 업무 관련해서 할 얘기가 있으니 이 쪽으로 좀 와주실래요?]\n[위치는 보내드릴게요. 급하게 오실 필요는 없어요.]\n— 세라, 14편\n```\n\n이 편에서 네빌은 반역죄로 몰린다.\n\n### 16편 — 심문\n\n지하 심문실에서 **[[네빌]]을 심문한다.** 묻는 것은 하나다 — [[앤드루]]가 어디 있는지. 네빌이 모른다고 하자 침착함을 잃는다.\n\n이 시점에 세라는 앤드루의 행방을 모른다. 서로 캐지 않기로 한 합의가 이미 깨져 있다.\n\n이 편부터 3편 연속 주역이며, 같은 편의 3년 전 회상에서 네빌을 면접한 장면이 나온다. 그때의 세라는 더듬지 않는다 — \"[[대가문]]은 당신에게 ‘아무것도 아닌 것’ 이어야죠\", \"사실 진작에 합격이었어요, 그냥. 한 번 얼굴이나 보고 싶었거든요.\"\n\n### 17편 — 넘어선 선\n\n[[해리엇]]의 저지를 헌병으로 물리치고 의회로 향한다. 같은 편에서 [[앤드루]]와 서로의 뒷일을 캐지 않기로 합의한 과거가 밝혀지고, 아버지 [[애덤스]]와의 관계도 공개된다. 편 제목이 「가족에 의한 가족」이다.\n\n### 18편 — 수정헌법\n\n본회의장. [[데이비스]]의 독립 선언으로 판이 뒤집힌 직후, 세라가 나타나 판을 다시 뒤집는다.\n\n```조문\n< 모든 인민은. 가족을 위해.>\n< 봉사하라.>\n— 수정헌법 제 1 조, 18편\n```\n\n그리고 이렇게 마친다 — \"가족의, 가족에 의한, 가족을 위한 국가가… 지상에서 사라지지 않기를 바라며…\"\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[애덤스]] | 혈연 | 아버지. [[건국의 아버지들]]의 지도자 |\n| [[네빌]] | 고용 | 3년 전, 대가문을 등지고 온 그를 면접해 받아들였다 |\n| [[앤드루]] | 감시 | 서로가 뒤에서 무슨 일을 벌이는지 알면서도 캐지 않기로 했다 |\n| [[식스]] | 조력 | 떠나라는 말에도 \"세라님만 두고 갈 순 없다\"며 곁에 남았다 |\n| [[코네트]] | 신뢰 | 코네트가 '세라 언니'라 부르며 위기에 먼저 연락했다 |\n| [[데이비스]] | 유도 | 배후를 캐지 말라고 권해 [[북부동맹]]의 명분을 만들어 주었다 |\n| [[해리엇]] | 적대 | 헌병을 거느린 민간인 앞에서 의회 진입을 저지당했다 |\n| [[헌병대]] | 지휘 | 건국의 아버지들의 혈족이므로 부를 수 있다 |\n\n## 여담\n\n**가족이라는 말의 뜻이 계속 넓어진다.** 아버지와 둘뿐인 집 → 자기가 거둔 사람들([[네빌]]·[[식스]]·[[코네트]]) → [[헌병대]] → 마지막에는 연방의 모든 인민. 넓어질수록 원래 뜻에서 멀어지는데, 정작 조문에 박히는 문장은 아버지가 딸을 달래던 그 말과 같다.\n\n**마왕화가 입법 절차의 형태를 취한다**. [[노모스]]는 진입자를 주체의 신념에 동화시키는 영역이고, [[연방 헌법]]은 [[누스]]다. 그 누스에 \"모든 인민은 가족을 위해 봉사하라\"를 새기는 것은 국가 전체를 세라의 신념으로 덮는 일이 된다. 즉 초자연적 폭주가 아니라 개헌이라는 합법 절차로 마왕이 되는 것으로 추정된다.\n\n**대본은 세라가 마왕이라고 한 번도 말하지 않는다.** 초자연 층 자체가 《가문과 가족》에서 은폐되어 있으므로([[세계관 대문]]), 이 문서에는 독자가 아직 모르는 것이 적혀 있다.\n\n**아직 모르는 것.** 어머니가 누구인지, 그리고 어떤 경로로 마왕에 이르는지. [[연방 헌법]]이 마왕 토벌 과정에서 파괴된다는 것까지만 정해져 있다.","parentId":"people"},{"title":"앤드루","id":"andrew","type":"인물","folder":"04_인물","sortOrder":30,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","철도청","앤드루"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 2·3·4·5·7·16·17·19·20편, _인물관계.md. '먼로와의 관계'는 인물관계도에서 '?무슨 사이'로 미공개 처리된 항목이며, 작가 확인에 따라 서사 시점의 먼로 등장은 전부 회상이므로 앤드루가 제지받지 않는 이유는 아직 열려 있다.","image":"resource/wiki/앤드루.png","imageCaption":"앤드루","summary":[["소속","[[철도청]]"],["직함","철도청장"],["기호","🕰️"],["첫 등장","2편"],["주역 편","2 · 19"],["등장 편","2 · 3 · 4 · 5 · 7 · 16 · 17 · 19 · 20"],["혈연","[[잭슨]] — 동생 (20편)"],["목표","갈라진 [[연방]]을 봉합한다"],["방식","기록이 남지 않는 손"],["훗날","미정"]],"content":"# 앤드루\n\n[[철도청]]장. **[[궤간 통일]]을 명분으로 연방 전역의 지하를 파는 사업**의 주인이며, 그 일에 [[하노버 용병단]] 같은 외부의 손을 쓴다.\n\n## 방식\n\n앤드루의 원칙은 하나다. **기록을 남기지 않는다.**\n\n```대사\n[기동대]를 움직이면 반드시 기록이 남잖나, 이런 일에는 적합하지 않아.\n— 앤드루, 2편\n```\n\n[[기동대]]는 연방에서 가장 빠르고 유연한 무력이고 그의 부처 산하다. 그런데도 쓰지 않고 용병을 산다. 이 한 줄이 그의 사업 전체의 성격을 정한다.\n\n## 사업\n\n- **두 달 전** — 보안관들이 선로 보수를 거듭 거부하자, \"진짜 문제는 [[대가문]]\"이라 규정한다. 5편의 회상이다.\n- **몇 달 전** — [[궤간 통일]]을 명분으로 지하철도를 비밀리에 파기 시작하고, [[철도파]]의 [[하워드]]가 의회 쪽에서 뒷받침한다. 16편의 회상이다.\n- **과거 어느 날** — [[잭]]에게 갈라진 연방을 봉합하는 '사업'의 협조를 청하나, 왜 하필 그인지는 끝내 답하지 않는다. 7편의 회상이다.\n- **2~3편** — [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'한다. 3편에서 용병단이 [[스프링필드]] 저택을 습격하고, [[레밍턴]]에게 \"땅속에서 무슨 소리가 들리든 눈감으라\" 요구한다.\n- **19편** — 지하에 숨겨진 사업이 마침내 실체를 드러낸다. 이 편의 주역이다.\n\n## 7편 — 습격과 은신\n\n수도 길거리에서 **경찰복을 입은 무리에게 습격당한다.** [[잭]]에게 보낸 편지로 그 사실이 전해진다.\n\n```대사\n(오늘 아침, 수도 길거리에서 경찰복을 입은 무리에게 습격당했었습니다. 다행히도 크게 다치지는 않았지만…)\n(안 그래도 뒤숭숭한 상황에서, 이제는 정말로 누군가 저를 노리고 있다는 생각을 지우기가 어렵군요.)\n(저는 잠시 믿을만한 사람의 도움을 받아, 몸을 숨기고자 합니다.)\n— 앤드루, 7편 편지\n```\n\n이 은신이 뒤의 일을 설명한다. 16편에서 [[세라]]가 [[네빌]]을 심문하면서까지 \"앤드루, 어딨어\"를 캐묻는 것도, 19편에 그가 지하에 있는 것도 여기서 시작한다. 편지가 말하는 '믿을만한 사람'이 누구인지는 밝혀지지 않는다.\n\n## 19편\n\n지하에서 [[에른스트]]의 통신을 받는다. 북부와 동부 [[대가문]]이 독립을 선언했다는 소식이다.\n\n```대사\n북동부… 의회… 헌병…\n세라는 결국… 그게 목적이었던 건가…?\n— 앤드루, 19편\n```\n\n같은 편에서 [[프로이센 사단]]의 귀환이 언급되고, 연방군 출신이 거의 전부 독립 쪽에 붙었다는 말이 나온다.\n\n## 20편 — 저택으로\n\n폐허가 된 [[스프링필드]] 저택으로 가는 길에 [[코네트]]와 함께 있다. 아이가 휘말린 것에 당혹해하고, 저택 외벽의 파손을 보며 상황을 읽는다.\n\n```대사\n아니면… 이 내전이 점점 ‘총력전’으로 가고 있을 수도 있지.\n— 앤드루, 20편\n```\n\n[[미트로프 내전]]을 '내전'이자 '총력전'으로 부르는 대목이다.\n\n## 이름\n\n동생 [[잭슨]]과 이름을 이어 읽으면 **Andrew Jackson** — 미국 7대 대통령이 된다.\n\n[[연방]]의 이름 계열이 미국 건국사에서 왔고([[건국의 아버지들]] = Founding Fathers, [[명백한 운명]] = Manifest Destiny), 인물 이름도 대통령에서 오는 것을 감안하면 의도된 배치로 추정된다. 한 사람의 이름을 둘로 쪼개, **형은 국가 기구의 수장에게 동생은 열차 강도에게** 나눠 붙인 배치가 된다.\n\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[네빌]] | 고용 | 철도청장과 그를 따라다니는 비서 |\n| [[세라]] | 감시 | 서로가 뒤에서 무슨 일을 벌이는지 알면서도 캐지 않기로 했다 |\n| [[에른스트]] | 고용 | 기록이 남지 않도록 용병단을 앞세워 북부 대가문을 '설득'시켰다 |\n| [[잭]] | 밀약 | 봉합 '사업'에 협조를 청하나, 왜 하필 그인지는 말하지 않았다 |\n| [[하워드]] | 협력 | 지하철도 사업을 의회 쪽에서 뒷받침한다 |\n| [[잭슨]] | 혈연 | 잭슨은 앤드루의 동생. 20편에서 밝혀진다 |\n| [[먼로]] | **?** | 용병을 부려 전역의 지하를 파헤치고도 국가로부터 아무런 제지를 받지 않는다 |\n\n## 여담\n\n**세라와 거울이다.** 둘 다 [[철도청]] 소속이고, 둘 다 정식 절차 밖에서 연방을 다시 만들려 하고, 서로가 그것을 알면서 캐지 않는다. 다른 점은 수단이다. 앤드루는 **기록을 남기지 않는 쪽**으로, 세라는 **기록 그 자체(헌법)를 고쳐 쓰는 쪽**으로 간다. 19편에서 앤드루가 \"세라는 결국… 그게 목적이었던 건가\"라고 뒤늦게 깨닫는 장면이 그 대비의 결말이다.\n\n**제지받지 않는 이유가 미공개다.** [[인물관계도]]에서 [[먼로]]와의 관계가 '?무슨 사이'로 처리되어 있다. 서사 시점에 먼로가 나오는 장면은 전부 회상이므로, [[건국의 아버지들]]이 뒤를 봐주고 있다는 단순한 설명은 성립하지 않는다. 이 자리는 열린 채로 두었다.\n\n**동생이 열차 강도라는 설정이 20편까지 감춰진다.** [[잭슨]]은 9편부터 나오고 [[네빌]]을 구하기까지 하는데, 형제라는 사실은 20편에서야 밝혀진다. 그 사이 앤드루의 사업은 계속 열차와 선로 위에서 굴러간다.","parentId":"people"},{"title":"인물","id":"people","type":"인물","folder":"04_인물","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","안내"],"memo":"원고에 인물 항목이 없어 대본에서 직접 만든 구간이다. 근거는 script/ 대본 22편, _인물관계.md(인물 21·관계 29), _어록.md, storypack의 주역·기호 배정. 인용은 대본에서 화자를 직접 확인한 것만 쓴다 — 어록 파일은 화자를 감춰두었으므로 그것만으로는 귀속하지 않는다.","image":"","imageCaption":"","summary":[["범위","22편 + 원고의 설정 인물"],["등록 인물","21"],["발화 있는 인물","57 (단역 포함)"],["기호를 받은 인물","14"],["주역 없는 편","6편 (유일)"]],"content":"# 인물\n\n```틀\n가문과 가족\n```\n\n《가문과 가족》의 인물들. 이 작품은 개인의 활약보다 **이해관계와 집단**을 축으로 굴러가므로, 인물 문서도 '무엇을 원하는가'와 '누구와 묶여 있는가'를 중심에 둔다.\n\n## 기호\n\n각 편의 주역에게는 기호가 하나씩 배정되어 있다. 화 목록에 이름 대신 각인으로만 표시되며, 독자는 편을 읽고 나서야 그것이 누구였는지 알게 된다.\n\n| 기호 | 인물 | 기호 | 인물 |\n|---|---|---|---|\n| 🎫 | [[네빌]] | 📕 | [[세라]] |\n| 🕰️ | [[앤드루]] | 📰 | [[잭]] |\n| 🧨 | [[에른스트]] | 🎭 | [[데이비스]] |\n| 🛡️ | [[레밍턴]] | 🔦 | [[필립]] |\n| ⛓️ | [[로버트]] | ⚖️ | [[하워드]] |\n| 🎖️ | [[해리엇]] | ♗ | [[타게니아]] |\n| 🗝️ | [[코네트]] | ⚔️ | [[헥터]] |\n\n6편에는 **주역이 아예 배정되어 있지 않다.** 프롤로그·에필로그·잡음 두 편을 빼면 20편 중 유일한 예외이며, 그래서 기호도 없다. 그 편에만 나오는 인물이 [[식스]]다.\n\n## 세력별\n\n- **[[철도청]]** — [[앤드루]](청장) · [[세라]](비서관) · [[네빌]](비서)\n- **[[의회]]** — [[잭]] · [[로버트]](통합파) · [[데이비스]](자치파 → [[북부동맹]] 위원장) · [[하워드]](철도파) · [[연방 의원 A]](동방주 자치파)\n- **[[경찰청]]** — [[해리엇]](청장)\n- **[[대가문]]** — [[레밍턴]](스프링필드 보안관) · [[필립]](도버 보안관) · [[코네트]](스프링필드 가) · [[스프링필드 가주]]\n- **구 군부** — [[에른스트]](하노버 용병단장) · [[잭슨]](열차 강도) · [[프랑크]](바이에른 그룹)\n- **[[연합]]** — [[타게니아]](올림피아드 감독관) · [[에리스]](엑스포)\n- **[[건국의 아버지들]]** — [[먼로]] · [[애덤스]]\n- **???** — [[식스]](조력자)\n- **[[신성제국]]** — [[교황]]([[교단]])\n\n## 발화량 순\n\n대본에서 실제로 말하는 분량이다. 비중을 가늠하는 참고치일 뿐, 중요도와 같지는 않다. 단역까지 세면 발화하는 인물이 57명이고, 아래는 그중 이름이 있는 이들이다.\n\n| 인물 | 발화 | 등장 편 |\n|---|---|---|\n| [[세라]] | 212 | 5 · 6 · 8 · 14 · 16 · 17 · 18 |\n| [[네빌]] | 199 | 프롤로그 · 1 · 2 · 3 · 5 · 14 · 16 · 17 |\n| [[데이비스]] | 196 | 5 · 7 · 8 · 9 · 11 · 12 · 13 · 17 · 18 |\n| [[앤드루]] | 170 | 2 · 3 · 4 · 5 · 7 · 16 · 17 · 19 · 20 |\n| [[에른스트]] | 128 | 1 · 2 · 3 · 15 · 19 · 20 |\n| [[잭]] | 120 | 7 · 8 · 10 · 12 · 13 · 17 · 18 |\n| [[잭슨]] | 88 | 9 · 13 · 14 · 19 · 20 |\n| [[해리엇]] | 73 | 12 · 14 · 15 · 17 · 19 |\n| [[레밍턴]] | 64 | 3 · 4 |\n| [[로버트]] | 56 | 10 · 12 · 13 · 17 · 18 |\n| [[하워드]] | 51 | 11 · 12 · 13 · 16 · 18 |\n| [[코네트]] | 44 | 5 · 20 |\n| [[필립]] | 44 | 9 |\n| [[식스]] | 30 | 6 |\n| [[프랑크]] | 26 | 15 |\n| [[타게니아]] | 15 | 13 · 18 |\n| [[애덤스]] | 8 | 17 (회상) |\n| [[먼로]] | 4 | 18 (회상) |\n\n## 여담\n\n**아직 안 쓴 인물.** [[잭]] · [[에른스트]] · [[해리엇]] · [[레밍턴]] · [[로버트]] · [[하워드]] · [[필립]] · [[잭슨]] · [[타게니아]] · [[프랑크]] · [[먼로]] · [[에리스]] · [[스프링필드 가주]] · [[연방 의원 A]] · [[헥터]].\n\n**[[세라]]가 2부의 축이다.** 16·17·18편 세 편 연속 주역이며, 작품 제목 《가문과 가족》이 그의 논리에서 나온다. 유년의 상처 → \"가족은 무슨 일이 있어도 항상 내 편\"이라는 아버지의 가르침 → 수정헌법 제1조 \"모든 인민은 가족을 위해 봉사하라\"로 이어지는 한 줄이 서사 전체를 관통한다.\n\n**인용 귀속의 원칙.** `_어록.md`는 화자와 출처를 일부러 감춰둔 파일이다(독자에게 먼저 보여주는 용도). 그래서 어록만 보고 누구의 말이라 단정하지 않고, 대본에서 화자 라벨을 직접 확인한 대사만 인물 문서에 인용했다.","parentId":null},{"title":"코네트","id":"cornet","type":"인물","folder":"04_인물","sortOrder":50,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["인물","대가문","스프링필드","코네트"],"memo":"원고에 인물 항목이 없어 대본에서 만든 문서다. 근거: 대본 5·20편, _인물관계.md, 프롤로그의 네빌 대사. 20편 주역이며 기호는 🗝️.","image":"resource/wiki/코네트.png","imageCaption":"코네트","summary":[["소속","[[대가문]] — [[스프링필드]] 가"],["직함","없음 — 가문의 아이"],["기호","🗝️"],["첫 등장","5편"],["주역 편","20"],["등장 편","5 · 20"],["혈연","[[스프링필드 가주]] — 할아버지 · [[네빌]]"],["목표","할아버지와 [[레밍턴]]을 찾는다"],["방식","가문 열쇠를 내주지 않는다"],["훗날","미정"]],"content":"# 코네트\n\n[[스프링필드]] 가의 아이. [[네빌]]이 10년 전 떠난 그 집에 남은 '가족'이며, 20편의 주역이다.\n\n## 인물\n\n아이의 말투를 쓴다. [[세라]]를 '세라 언니', [[레밍턴]]을 '레밍턴 아저씨'라 부른다. 위기가 닥쳤을 때 어른들이 아니라 세라에게 먼저 연락한 것도 그였다(5편).\n\n기호가 🗝️(열쇠)다. 20편에서 그 이유가 나온다. 폐허가 된 저택 앞에서 일행이 문을 열려 하자 코네트는 열쇠를 내놓지 않는다.\n\n```대사\n할아버지가 절대… 절대 우리 가문 열쇠는 남들한테 주면 안된다고 했어요…\n— 코네트, 20편\n```\n\n## 행적\n\n### 프롤로그 — 이름 없이\n\n[[네빌]]이 \"어렸을 때 꽤 친하게 지냈던 ‘가족’이 있는데…\"라 말할 때의 그 가족이다. 이름은 나오지 않는다.\n\n### 5편 — 신고\n\n[[세라]]에게 연락해 저택에서 벌어진 일을 알린다. 화자 라벨이 처음에는 **`???`** 로, 정체가 드러난 뒤에야 `스프링필드 가`로 바뀐다.\n\n아이의 눈으로 본 3편의 습격이 이 대화에 담긴다.\n\n```대사\n어른들이 없는 사이에… 집에… *훌쩍*\n집에 무서운 아저씨들이 와서… 방에 있는 물건을 막 훔쳐가고…\n— 코네트, 5편\n```\n\n'무서운 아저씨들'이 [[하노버 용병단]]이다. [[철도청]]이 벌인 일을 철도청 비서관에게 울며 신고하는 구도가 된다.\n\n같은 편에서 [[네빌]]과 같은 [[스프링필드]] 가라는 사실, 그리고 네빌이 10년 전 가문을 떠났다는 사실이 공개된다.\n\n### 20편 — 귀환\n\n폐허가 된 [[스프링필드]] 저택으로 일행과 함께 돌아온다. 할아버지와 [[레밍턴]]을 찾지만 찾지 못한다. 편 부제가 「언약의 피는 태중의 물보다 진하다」다.\n\n1편의 부제가 「피는 물보다 진하다」였다. **같은 속담의 뒷문장이 마지막 편의 부제가 된다** — 혈연보다 맺은 약속이 앞선다는 쪽으로 뒤집힌다.\n\n## 관계\n\n| 상대 | 관계 | 내용 |\n|---|---|---|\n| [[네빌]] | 혈연 | 같은 [[스프링필드]] 가. 네빌은 10년 전 가문을 떠났다 |\n| [[세라]] | 신뢰 | '세라 언니'라 부르며 위기에 먼저 연락했다 |\n| [[레밍턴]] | 보호 | 저택의 아이를 지키는 보안관 |\n| [[스프링필드 가주]] | 혈연 | '할아버지'라 부르는 가주 |\n\n## 여담\n\n**작품의 두 축이 이 아이 한 명에게 모인다.** [[네빌]]에게는 등지고 떠난 가문이고, [[세라]]에게는 '가족'이라 거둔 사람이며, [[레밍턴]]에게는 목숨으로 지킨 아이다. 세 인물의 동기가 각각 다른 방향에서 코네트로 향한다.\n\n**부제가 1편과 20편을 잇는다.** 「피는 물보다 진하다」(1편) → 「언약의 피는 태중의 물보다 진하다」(20편). 원래 속담의 온전한 형태가 뒤에 오면서, 혈연이 아니라 약속이 앞선다는 뜻으로 바뀐다. [[세라]]가 혈연 아닌 이들을 가족이라 부르는 것과 같은 방향이다.\n\n**아직 모르는 것.** 코네트의 부모. 할아버지와 함께 살고 어머니·아버지 이야기가 나오지 않는다. [[세라]]가 어머니 없이 자란 것과 겹치는 자리일 수 있다.","parentId":"people"},{"title":"대악몽","id":"great-nightmare","type":"사건","folder":"05_사건","sortOrder":2,"era":"고대","canon":"확정","status":"작성 중","tags":["사건","카시마르","바실리아","누스","고대"],"memo":"원문 §1 신성제국의 「형성 과정」(365~376행)을 근거로 만든 문서다. 작가 확인(2026-07-31)으로 대악몽이 카시마르가 대규모로 발생한 사건이라는 점, 그리고 드레드 분지 호수가 카시마르의 지상 유출지라는 점이 확정됐다.","image":"resource/wiki/대악몽.png","imageCaption":"대악몽","summary":[["성격","[[카시마르]] 대규모 발생"],["장소","드레드 분지"],["발단","바실리아가 [[누스]]로 [[노에마]]를 썼다"],["결과","바실리아와 인접국 멸망"],["남긴 것","지층의 [[카시마르]]"],["남긴 이름","드레드(Dread)"],["아는 사람","없다"]],"content":"# 대악몽\n\n```틀\n신성제국\n```\n\n고대 바실리아 공동체와 그 인접 국가들을 모조리 멸망시킨 사건. **[[카시마르]]가 대규모로 발생한 것이다.**\n\n그리고 이 사건이 **[[카시마르]]를 이 대륙에 남겼다.** 지층에 있던 것이 이 사건으로 뿜어져 나온 것이 아니라, 이 사건 때문에 지층에 남은 것이다. 다른 대륙에 카시마르가 없는 이유가 여기 있다.\n\n## 원인\n\n바실리아 공동체는 [[노에시스]]를 **다룰 수 있었던 것이 아니라 숭배했다.** 노에시스와 [[노에마]]의 존재를 인지하고 종교적 의식을 통해 제한적으로 활용하는 데 그쳤다.\n\n이들에게는 [[누스]]가 있었고, 그것을 통해 노에시스에 대한 이해 없이도 [[노에마]]를 쓸 수 있었다. 그렇게 촉발된 것이 대악몽이다.\n\n**그리고 이러한 사실을 아는 대륙의 역사가는 아직 없다.**\n\n## 왜 그곳이었나\n\n드레드 분지의 호수는 [[카시마르]]가 지상으로 새어나오는 두 곳 중 하나다. 바실리아 공동체는 그 옆에 있었다.\n\n이해 없이 [[누스]]를 쓴 것과, 이미 카시마르가 올라오는 자리에 있었던 것이 겹쳤다. → [[카시마르]]\n\n## 남긴 것\n\n이 사건 뒤로 사람들은 그 분지를 멀리하고, 그곳에 **‘드레드’(Dread)**라는 이름을 붙여 가까이하지 못하게 했다. 국호 '드레드노'가 여기서 나온다.\n\n여파가 완전히 사라지지 않아 [[카시마르]]가 소수 잔존했고, 중세에 그 소탕을 위해 맺어진 계약이 [[레콩키스타]]다.\n\n## 관련 문서\n\n- [[카시마르]] · [[누스]] · [[노에마]] · [[노에시스]]\n- [[바다 민족]] — 바실리아를 세운 이들\n- [[레콩키스타]] · [[신성제국]] · [[하얀 일요일]]\n\n## 여담\n\n**같은 호수에서 두 번 벌어졌다.** 고대에는 바실리아가 [[누스]]로 [[노에마]]를 쓰다 이 사건을 불렀고, 근대에는 그 유물을 발견한 아이가 [[하얀 일요일]]을 일으켰다. 두 번 다 시작은 [[누스]]였고 두 번 다 이 분지를 뒤집었다.\n\n**원인을 아는 사람이 없다는 것이 이 세계의 성격이다.** 대륙의 학자들은 바실리아 사람들이 노에시스를 '다룰 수 있는 특수한 이들'이었으리라 추측한다. 실제로는 다루지 못한 채 숭배했고, 그 무지가 문명을 지웠다.","parentId":null},{"title":"대전쟁","id":"great-war","type":"사건","folder":"05_사건","sortOrder":0,"era":"대전쟁","canon":"확정","status":"작성 중","tags":["대전쟁","구대륙","바다"],"memo":"원문에 항목이 없던 문서. 작가 확인(2026-07-31)으로 만들었다 — '대륙간 전쟁이며, 신대륙에 속하는 그렌빌리아·로디니아·판노티아는 영향권 밖이었지만 구대륙의 세력들이 대륙 단위로 거대한 전쟁을 벌인 것. 바다에 노에시스가 많이 녹아있는 이유이기도 하다.' 전쟁의 경과·참전 세력·시기는 전부 미정.","image":"resource/wiki/대전쟁.png","imageCaption":"대전쟁의 흔적","summary":[["성격","대륙간 전쟁"],["무대","[[판게아 대륙]] — 구대륙"],["영향권 밖","[[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]"],["결과","[[바다]] 농도 급증 → 항해 차단"],["실종","[[바다 민족]]"],["참전 세력","미정"],["시기","미정"]],"content":"# 대전쟁\n\n**대륙간 전쟁.** 구대륙의 세력들이 대륙 단위로 벌인 거대한 전쟁이다.\n\n## 확인된 사실\n\n- 구대륙인 [[판게아 대륙]]에서 일어난 전쟁이며, 신대륙에 속하는 [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]은 **영향권 밖**이었다.\n- 이 전쟁이 [[바다]]에 노에시스가 대량으로 녹아 있는 원인이다.\n- [[바다 민족]]은 이 전쟁 이후 완전히 종적을 감추었다.\n\n## 이 사건이 세계 구조를 만들었다\n\n대전쟁은 직접 무대에 오르지 않지만, 지금 세계의 형태를 결정한 사건이다.\n\n전쟁으로 바다의 노에시스 농도가 올라갔고, 그 결과 대륙 간 항해가 불가능해졌다. 대륙들이 서로를 거의 모른 채 독립적으로 굴러가는 것도, [[카시마르]]가 바다와 지층의 축적된 노에시스에서 발생하는 것도, 신대륙의 인류가 [[바다 민족]]의 후손이면서 정작 그 조상의 흔적을 기록으로만 아는 것도 전부 여기서 나온다.\n\n## 관련 문서\n\n- [[바다]]\n- [[바다 민족]]\n- [[노에시스]]\n- [[카시마르]]\n\n## 여담\n\n**미정인 것.** 참전 세력, 전쟁의 원인과 경과, 시기, 승패, 그리고 구대륙이 지금 어떤 상태인지 전부 정해지지 않았다.\n\n**구대륙은 [[판게아 대륙]]이다**. 즉 대전쟁의 무대이자 [[바다 민족]]의 출신지다. 정리 문서 §1의 대륙 넷 중 그렌빌리아 · 로디니아 · 판노티아가 신대륙, 판게아가 구대륙이다.","parentId":null},{"title":"레콩키스타","id":"reconquista","type":"사건","folder":"05_사건","sortOrder":3,"era":"중세","canon":"확정","status":"작성 중","tags":["사건","신성제국","기사","카시마르","중세"],"memo":"원문 §1 신성제국의 「드레드노 기사단국의 분지 정복」·「드레드노 왕국의 성립」(378~389행)을 근거로 만든 문서다. 이름은 이베리아 반도의 재정복 운동에서 왔다.","image":"resource/wiki/레콩키스타.png","imageCaption":"레콩키스타","summary":[["원어","Reconquista"],["성격","세력·기사단 사이의 계약"],["목적","잔존 [[카시마르]] 소탕"],["제안한 쪽","분지를 차지한 기사단"],["조건","분지에서 나가지 않는다"],["참여","대륙 남부·중부·북부"],["보상","보수와 명예"],["귀결","드레드노 왕국 성립"],["남긴 문화","기사도 문학"]],"content":"# 레콩키스타\n\n```틀\n신성제국\n```\n\n드레드 분지의 [[카시마르]]를 소탕하기 위해 맺어진 **계약의 이름.** 이 나라의 출발점이며, 그 조건이 오늘까지 남아 있다.\n\n## 계약\n\n중부 대륙에서 약탈과 잔혹함으로 유명했던 기사단이 주인 없는 땅 드레드 분지를 차지했다. 그런데 그곳에는 [[대악몽]]의 여파로 [[카시마르]]가 소수 잔존하고 있었다.\n\n당시에는 [[노에시스]]와 카시마르에 대한 이해가 매우 부족했으므로, 기사단은 이들을 단순히 '괴물 아니면 악마'로 규정하고 대대적인 소탕에 나섰다. 그리고 중세 세력들에게 이렇게 요청했다.\n\n> 이 분지에서 나가지 않을테니 괴물들을 잡는 것을 도와달라\n\n기사단에게 당한 것이 많았던 세력들은 **분지에서 벗어나지 않는다는 조건으로** 응했다. 그 계약의 이름이 레콩키스타다.\n\n대륙의 남부·중부·북부에서 가릴 것 없이 용맹한 이들이 보수와 명예를 위해 드레드 분지로 뛰어들었다.\n\n## 남긴 것\n\n- **드레드노 왕국** — 오랜 시간이 지나 중세 말에 소탕이 완수되었다. 기사단은 계약에 따라 분지 전체의 영유권을 주장하는 대신, 분지 바깥으로는 영향력을 행사하지 않기로 맹세했다.\n- **기사도 문학** — 분지 지역에서 크게 발달했다. 레콩키스타 시기를 배경으로 하는 작품들이 큰 인기를 얻었다.\n\n그 문학이 훗날 [[교황]]의 [[노에시스]]를 이루고, 국가 전체의 형태가 된다. → [[하얀 일요일]]\n\n## 지금까지 이어지는 조건\n\n\"분지에서 나가지 않는다\"는 계약은 국호와 체제가 여러 번 바뀌어도 이 나라의 바닥에 남았다.\n\n- 드레드노 왕국은 그 맹세를 지켰다.\n- 드레드노 제국은 2차 전쟁에서 그것을 깼고, 그 전쟁의 끝에 [[하얀 일요일]]이 왔다.\n- [[신성제국]]은 다시 분지 안으로 물러났고, 지금도 분지 내에서 레콩키스타를 재현하고 있다.\n- 기사 체제가 끝난 뒤에도 3대 재단은 무력 확장이 없다고 못박았고, [[정복자들]]이 축출되었다.\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 역사]]\n- [[카시마르]] · [[대악몽]]\n- [[교황]] · [[하얀 일요일]] · [[정복자들]]\n- [[상급기사]] · [[하급기사]]\n\n## 여담\n\n**계약이 국가보다 오래 살았다.** 왕국·제국·신성제국으로 세 번 바뀌고 기사 체제까지 끝났는데, \"분지에서 나가지 않는다\"는 조건만은 계속 지켜지거나 깨지거나 다시 지켜진다. 이 나라의 역사는 그 한 줄을 두고 벌어진 일들이다.\n\n**소탕이 끝난 뒤에도 소탕이 계속된다.** 중세에 카시마르는 모조리 토벌당했다. 그런데 [[신성제국]]은 지금도 레콩키스타를 재현하며 [[카시마르]]를 토벌하고 있고, 그 적은 [[교황]]이 만든 가상이다. 끝난 전쟁을 영원히 되풀이하는 나라가 되었다.\n\n**이름은 이베리아 반도의 재정복 운동에서 왔다.** 이 나라의 다른 고유명사가 대부분 스페인에서 온 것과 같은 계열이며, [[카시마르]]가 남긴 말 '재정복의 날'도 같은 이름의 다른 번역이다.","parentId":null},{"title":"연말 위기","id":"year-end-crisis","type":"사건","folder":"05_사건","sortOrder":10,"era":"연말 위기","canon":"확정","status":"작성 중","tags":["사건","연방","연말 위기","비무장화"],"memo":"원고 §1 연방·연합의 「연말 위기」 서술과 대본 18편 회상(3건)을 합쳐 만든 문서다. 헌법 80~90% 소실, 쿠데타 주체가 통일파, 잭·데이비스가 방관자, 철도파 강경파 숙청, 통일파 강경파의 와해 경로는 모두 작가 확인(2026-07-31). 시대는 2026-07-31에 신설한 독립 항목 '연말 위기'다 — 작가가 이 사건을 근대와 서사 시점을 가르는 기준이라 확정했고, 경계는 어느 한쪽에 넣으면 어긋나기 때문이다.","image":"resource/wiki/연말 위기.png","imageCaption":"연말 위기","summary":[["성격","[[연방]]을 비무장국으로 만든 위기"],["발단","열강들의 최후통첩"],["갈림","[[철도파]] 개전론 vs [[통일파]] 반대론"],["분기점","[[먼로]]의 만장일치 통보"],["결말","[[통일파]]의 쿠데타"],["조약","연방 완전 비무장화"],["잃은 것","[[연방 헌법]] 80~90% 소실"],["등장","18편 회상 (3장면)"]],"content":"# 연말 위기\n\n```틀\n연방\n```\n\n[[연방]]이 **완전한 비무장화**를 받아들인 사건. 지금 연방의 모든 문제가 여기서 나온다.\n\n## 발단\n\n[[연방]]은 [[크레스티아 제국]]을 해체시키며 대륙의 새 패권국이 되었다. 그러자 남은 열강들이 뭉쳤다 — [[연합]]이 먼저 [[신성제국]]에 연합을 제의하고, 남부 군도의 왕국과 중견국들까지 끌어들여 **반 연방 세력**이 형성되었다.\n\n### 신성제국을 끌어들인 방법\n\n[[신성제국]]은 [[하얀 일요일]] 이후 고립주의를 지키고 있었고, 처음에는 개입하지 않겠다는 입장을 고수했다.\n\n그것을 깬 것이 [[연합]]의 외교관이다. **[[교황]]의 트라우마를 간파하고**, [[연방]]이 [[크레스티아 제국]]을 완전히 흡수하면 2차 크레스티아-드레드노 전쟁 같은 끔찍한 일이 재발할 것이라며 지속적으로 회유했다. 교황은 **격분해서** 동맹에 응했다.\n\n그리고 신성제국이 [[카고르예 공화국]]과 [[루블린 공국]] 같은 군소국들을 호출했다. 과거 '드레드 체제'에 속했다가 [[크레스티아 제국]]에 흡수되었고, 드레드노 덕에 다시 독립한 나라들이다. 이렇게 반 연방 세력이 최종적으로 완성되었다.\n\n최후통첩의 내용은 셋이었다.\n\n1. 점거한 제국 영토를 [[컴퍼니]]에게 전부 반환할 것\n2. [[컴퍼니]]는 연방에 귀속되지 않으며 독립된 권리를 가진 '기업국가'로 존속할 것\n3. 과거 편입한 쾨벤하운 왕국([[북방주]])을 독립시킬 것\n\n## 의회의 분열\n\n[[철도파]]는 싸우자고 했다. 구 패권국에게 이겼으니 나머지도 굴복시킬 수 있다는 계산이었다.\n\n[[통일파]]는 반대했다. 크레스티아 전쟁에서 소모된 역량이 너무 컸고, 연방 정규군은 대륙 중부의 용병으로 이루어져 있어 소모되면 보충이 어려웠다.\n\n18편 회상에서 그 논쟁이 직접 나온다.\n\n```대사\n철도파 의원들은 국제 정세를 읽지 못하는 건가요? 지금 강대국, 약소국 할 것 없이 대륙의 남은 국가들이 모두 ‘반 연방 전선’을 형성하고 있지 않나요?\n— 데이비스, 18편 회상\n```\n\n```대사\n저희가 병합한 ‘크레스티아 제국’ 영토의 정상적인 통제도 불가능한 상태인데, 이 상황에서 전쟁까지 일으키겠다는 건…\n— 잭, 18편 회상\n```\n\n## 먼로의 통보\n\n논쟁은 결론이 나지 않았다. [[건국의 아버지들]]의 [[먼로]]가 본회의장에 들어와 끝냈다.\n\n```대사\n그만, 의미없는 논쟁은 여기까지 하도록.\n지금은 국가적인 비상사태, 이제부터 법적인 논의는 아무 의미 없다.\n— 먼로, 18편 회상\n```\n\n[[잭]]이 무슨 권한이냐 묻자 먼로 옆의 [[헌병대]]가 답을 대신했다. 이름이 나오는 헌병은 **벤자민** 한 명이며, 대사는 없고 침묵으로만 서 있다.\n\n```대사\n하, 하하… ‘헌병’, 연방군 중에서도 특히 애지중지하시더니. 이런 곳에서 쓰려고 했던 건가요?\n— 데이비스, 18편 회상\n```\n\n```대사\n건국의 아버지들 내에서 만장일치로 결정된 사안이니, 더 이상 이 안건으로 논쟁하지 말도록.\n이상.\n— 먼로, 18편 회상\n```\n\n[[데이비스]]가 [[잭]]에게 남긴 말이 이 장면의 결론이다.\n\n```대사\n이딴 식으로 일을 처리할거면, 우리가 왜 이 자리에 앉아있어야 하는 거냐?\n— 데이비스, 18편 회상\n```\n\n## 쿠데타\n\n선전포고문 발표 사흘 전, 전쟁을 반대한 [[통일파]] 의원들이 쿠데타를 모의했다. [[철도파]] 의원들을 한 곳에 모아 한 번에 제거하는 계획이었다.\n\n과정에 극적인 대목이 둘 있었다. 계획이 철도파 의원 한 명에게 노출되었으나 그가 통일파 의원에게 감화되어 묵인했고, 장소로의 유인을 위해 통일파 의원 한 명이 끝까지 그곳을 지키다 사망했다.\n\n준비된 큰 화재가 발생했다. 급진적인 철도파 의원과 전쟁에 우호적이었던 의원이 대부분 사망하고, [[건국의 아버지들]]도 이 자리에서 대부분의 인원을 잃었다.\n\n[[잭]]과 [[데이비스]]는 당시 통일파 온건파였고, 쿠데타의 **실행자가 아니라 방관자**에 가까웠다.\n\n## 조약\n\n통일파는 곧바로 협상에 들어가, 최후통첩을 받아들이되 [[북방주]]만은 지켰다. 대가는 **완전한 비무장화**였다.\n\n| 조항 | 내용 |\n|---|---|\n| 비무장화 | 정규군을 특정 국가에 속하지 않은 용병단으로 환원. 가장 작은 조직이던 [[헌병대]]만 잔존 |\n| 쾨벤하운 | 독립시키지 않고 [[북방주]]로 유지 |\n| [[컴퍼니]] | 기업국가화 승인. 단 **연방이 컴퍼니와의 무역권을 독점**하는 조항 추가 |\n| 철도망 | 영토 반환 대신 [[그렌빌리아 대륙]] 전체에 연방 체계의 철도망 설립 |\n\n마지막 조항은 살아남은 [[철도파]] 온건파의 의견이었고, 굴욕적이라 비판받았으나 현재까지 이어지는 '미트로프 중심 질서'를 만들었다.\n\n## 남긴 것\n\n- **국가 기능 셋이 한꺼번에 사라졌다.** [[건국의 아버지들]]은 최상위 의결 기구이면서 **행정과 사법도 겸하고 있었다.** 이들이 와해되면서 그 세 기능이 함께 없어졌고, 남은 통치 기구는 [[의회]] 하나가 되었다. 지금 연방에서 벌어지는 관할 다툼과 부처의 독자 행동이 전부 이 공백의 증상이다. → [[연방의 정치]]\n- **[[연방 헌법]]이 80~90% 소실되었다.** 그래서 [[헌병대]]가 무력화되었다 — 매개체를 잃었기 때문이다.\n- **[[철도파]] 강경파와 [[건국의 아버지들]]이 사라졌다.** 철도를 정비할 세력이 통째로 죽어, 궤간과 사유 철도가 난립한 채 남았다.\n- **[[통일파]]도 오래가지 않았다.** 강경파는 헌법 소실과 파벌 분열 과정에서 와해되고, 온건파가 [[통합파]]와 [[자치파]]로 갈라졌다.\n- **의회가 신뢰를 잃었다.** 일부 [[대가문]]이 독자 행동을 시작했다.\n- **치안 공백이 생겼다.** [[경찰청]]을 대폭 늘리고 [[보안관]]을 확대해 메웠고, 그 과정에서 두 조직의 관할 다툼이 생겼다.\n- **[[연합]] 내부도 바뀌었다.** 연방을 잇는 창구였던 [[건국의 아버지들]]이 와해되면서 [[올림피아드]]를 앞세운 엑스포 세력의 발언권이 약해지고, 길드가 다시 권력을 양분하게 되었다.\n\n## 18편에서의 반복\n\n이 회상은 [[세라]]가 본회의장에 들어오기 직전에 배치되어 있다. 그리고 세라의 첫마디가 먼로의 말과 같다.\n\n```대사\n조약이니, 연방법이니 하는 것들…\n법적인 논의는 더 이상 아무런 의미가 없습니다.\n— 세라, 18편\n```\n\n그 자리에 있었던 [[잭]]이 즉시 알아챈다.\n\n```대사\n아무 의미 없다고… 하, 하하. 옆은 헌병이겠군 그래…?\n— 잭, 18편\n```\n\n같은 본회의장, 같은 문장, 옆에 선 같은 [[헌병대]]. 연말 위기에 침묵당한 쪽이 다시 침묵당하는 구도다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[연방 헌법]] · [[헌병대]]\n- [[통일파]] · [[철도파]] · [[통합파]] · [[자치파]] · [[건국의 아버지들]]\n- [[먼로]] · [[잭]] · [[데이비스]] · [[세라]]\n- [[크레스티아 제국]] · [[컴퍼니]] · [[연합]] · [[북방주]]\n- [[경찰청]] · [[보안관]] · [[궤간 통일]]\n\n## 여담\n\n**이 사건이 시대의 경계다**. 근대와 서사 시점을 가르는 기준이며, 그래서 위키의 시대 축에 **`연말 위기`라는 독립 항목**을 두었다. 경계를 어느 한쪽에 넣으면 반드시 어긋나기 때문이다 — 근대에 넣으면 대본의 `< 얼마 지나지 않은 과거 >`라는 캡션과 맞지 않고, 서사 시점에 넣으면 원인과 결과가 같은 칸에 들어간다. 지금 서사 시점에 있는 문서는 전부 이 사건의 결과물이다.\n\n시점은 **10년 전보다 뒤, 3년 전보다 앞**이다. 플레이어 연표의 시대 순서가 `먼 과거 → 10년 전 → 연말 위기 → 과거 어느 날 → 3년 전`이고, [[잭]]과 [[데이비스]]가 그때도 의원이고 지금도 의원인 것과 맞는다.\n\n**[[통일파]]와 [[건국의 아버지들]]은 '근대'에 그대로 둔다.** 이 사건에서 사라지는 구질서이기 때문이다. 사건 하나가 무대의 인물을 통째로 교체하고, 그 다음 칸부터 [[통합파]]·[[자치파]]가 나온다.\n\n**국가사와 개인사가 여기서 하나로 묶인다.** [[세라]]가 [[연방 헌법]]을 손에 넣을 수 있었던 것은 그것이 이때 불타 흩어졌기 때문이고, [[헌병대]]가 그를 따르는 것은 매개체를 되살릴 사람이 그였기 때문이며, [[데이비스]]가 독립으로 간 것은 이 자리에서 \"우리가 왜 이 자리에 앉아있어야 하는 거냐\"고 물었기 때문이다. 사건 하나가 2부의 세 축을 동시에 낳는다.\n\n**이름이 나오는 헌병 — 벤자민.** 대본 전체에서 헌병이 이름으로 불리는 유일한 자리다(18편 114행). 대사는 없다. 인물 문서를 만들 만한지는 미정이다.","parentId":null},{"title":"하얀 일요일","id":"white-sunday","type":"사건","folder":"05_사건","sortOrder":5,"era":"근대","canon":"확정","status":"작성 중","tags":["사건","신성제국","누스","노에마","교황"],"memo":"원문 §1 신성제국의 「하얀 일요일」 절(421~430행)과 「신성제국의 탄생」(432~439행)을 근거로 만든 문서다. 작가 답변(2026-07-31) — 인지 조작은 서사 시점에 유효하고 위키 기준 현재에는 무의미하며, 분지 안에서 훨씬 강하지만 '드레드노인'이라 여기면 바깥에서도 걸린다. 외부에서는 이를 인지 조작이 아니라 특이한 종교 제의로 여긴다. 교황의 이름은 있으나 아직 공개되지 않았고, 그 뒤 행방도 앞으로의 이야기에서 밝혀진다.","image":"resource/wiki/하얀 일요일.png","imageCaption":"호수에 가라앉은 수도성","summary":[["성격","한 아이의 [[노에마]] 발현"],["시점","2차 크레스티아-드레드노 전쟁 중"],["발단","고대 바실리아의 [[누스]] — 정체 불명"],["발현 조건","가족을 잃은 트라우마"],["즉각 결과","제국 마비 · 수도와 황가 침몰"],["함대","대륙 외곽으로 피신"],["이름을 붙인 쪽","외부 국가들"],["귀결","[[신성제국]] 성립"]],"content":"# 하얀 일요일\n\n**한 아이가 [[누스]]를 주워 제국 하나를 갈아치운 날이다.**\n\n2차 크레스티아-드레드노 전쟁이 한창이던 때, 훗날 [[교황]]이라 불릴 아이가 고대 바실리아의 유물인 [[누스]]를 발견했다. 그 아이는 전쟁으로 가족을 잃은 상태였고, **그 트라우마 때문에 누스와 상호작용할 수 있었다.** 결과는 아주 강력한 [[노에마]]의 발현이었다.\n\n## 그날 벌어진 일\n\n승리가 얼마 남지 않았던 드레드노 제국이 **완전히 마비되었다.**\n\n그리고 아직 물 위에 있던 것들이 가라앉았다. 수도를 육지로 옮기는 작업이 진행 중이었는데, 노에마로 인해 선박의 평형 유지 장치가 오작동하면서 **제국의 수도와 황가가 그대로 호수 바닥으로 침몰했다.**\n\n한순간에 지휘부를 잃은 **공포의 함대**는 고립되었다. [[크레스티아 제국]]의 공격에서 벗어나는 과정에서 일부를 잃었지만 대륙 외곽으로 피신하는 데 성공했다. → [[잔존 함대]]\n\n전쟁은 그 전선 그대로 멈췄다. 다른 국가들은 표면적으로 지지 의사만 밝혀 둔 암묵적 동맹이었으므로 별다른 조치를 취하지 않았고, 큰 손실을 입은 [[크레스티아 제국]]도 확장을 멈추고 내정으로 돌아섰다.\n\n## 아무도 같은 것을 보지 않았다\n\n이 사건의 이름은 **외부에서 붙인 것이다.**\n\n| 보는 쪽 | 무엇으로 아는가 |\n|---|---|\n| 드레드노인 | **인지하지 못한다.** [[노에마]]의 인지 조작을 겪는다 |\n| 대륙 중부 소국들 · [[연합]] · [[크레스티아 제국]] | '하얀 일요일'이라 부른다 |\n\n**인지 조작의 범위는 국경이 아니라 정체성이다.** 분지 안에서 훨씬 강하게 걸리지만, 스스로를 '드레드노인'이라 여기는 사람이라면 바깥에 있어도 걸린다.\n\n그리고 **외부에서는 이것을 인지 조작으로 보지 않는다.** 저 나라 사람들이 유별난 종교 제의를 지킨다고 여길 뿐이다. 국민 전체가 기사가 되어 존재하지 않는 적을 토벌하는 나라를, 대륙은 신정 국가의 기이한 풍습으로 이해하고 있다.\n\n인지 조작은 서사 시점에 유효하며, 국가 체제가 모두 무너진 **위키 기준 현재에는 무의미하다.**\n\n## 그 뒤\n\n[[교황]] 통치 아래 사회가 초자연적인 힘으로 완전히 개변되었다. 국호는 신성제국이 되었으나 체제는 기사단국 시절로 회귀했고, 군부·산업가·학자가 모두 재단으로 묶여 기사단을 양성하게 되었다. [[교황]]의 [[노에시스]]가 [[레콩키스타]] 시기의 기사도 문학으로 이루어져 있었기 때문이다.\n\n그리고 장정한 백성은 모두 서임받아 기사가 되어, **가상으로 만들어진 [[카시마르]]**를 토벌하는 것을 1순위 목표로 삼게 되었다.\n\n→ [[신성제국]]\n\n## 관련 문서\n\n- [[신성제국]] · [[신성제국의 역사]]\n- [[교황]] · [[누스]] · [[노에마]] · [[노에시스]]\n- [[잔존 함대]] · [[황립 조선소]] · [[카시마르]]\n- [[레콩키스타]] · [[대악몽]] · [[크레스티아 제국]]\n\n## 여담\n\n**침몰한 자리가 유출지다.** [[카시마르]]가 지상으로 새어나오는 두 곳 중 하나가 드레드 분지의 호수다. 고대 바실리아가 그 옆에서 [[대악몽]]으로 멸망했고, 왕국이 그 위에 수도를 띄웠고, 그 수도가 그 바닥으로 가라앉았다. [[잔존 함대]]가 황가의 생존을 믿는 것도 그 바닥에 무엇이 있는지 아무도 모르기 때문으로 읽힌다.\n\n**세 개의 이름이 같은 것을 가리킨다** (추정). [[대악몽]]과 하얀 일요일은 둘 다 [[누스]]에서 시작해 이 분지를 뒤집은 사건이고, 그 결과로 세워진 체제가 재현하는 것이 [[레콩키스타]]다. 한 호수를 두고 같은 일이 세 번 반복된 셈이다.\n\n**이름의 뜻은 알려지지 않았다.** 왜 '하얀' 일요일인지, 실제로 일요일이었는지가 밝혀지지 않았다.","parentId":null},{"title":"가문과 가족 1부","id":"story-family-1","type":"서사","folder":"08_서사","sortOrder":10,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서. 편별 목록은 만들지 않는다(작가 방침).","image":"resource/wiki/가문과 가족 1부.png","imageCaption":"가문과 가족 1부","summary":[["분량","프롤로그 + 1~10편 + 잡음"],["기간","xx월 07일 ~ 09일 아침"],["무대","[[북방주]] → [[수도주]]"],["주역","네빌 · 앤드루 · 에른스트 · 레밍턴 · 세라 · 잭 · 데이비스 · 필립 · 로버트"],["표어","달리는 기차 위에 중립은 없다"]],"content":"# 가문과 가족 1부\n\n```틀\n가문과 가족\n```\n\n프롤로그와 1~10편. **판이 깔리는 부분**이다. 북부의 저택 습격으로 시작해, 의회 소집일 아침까지 온 세력이 [[수도주]]로 모인다.\n\n```표어\n달리는 기차 위에 중립은 없다.\n```\n\n## 흐름\n\n[[철도청]]이 [[하노버 용병단]]을 앞세워 북부 [[대가문]]들을 차례로 '설득'하는 것이 발단이다(2~3편). 그 습격이 [[스프링필드]] 저택을 덮치고, 보안관 [[레밍턴]]이 배후를 증언한다(4편).\n\n한편 [[데이비스]]는 [[대가문]]들에게 분리 독립을 제안하고(8편), 동방주는 심야 조례로 경찰 무장해제에 나선다(9편). 10편은 의회 소집일 아침, 낯선 검문을 지나는 장면으로 끝난다.\n\n그 사이 6편에서 [[세라]]가 [[연방 헌법]]을 복원하고 있다. 이 편의 사건 요약이 \"밀실에서 '폭탄'이 완성되어 가다\"다.\n\n## 특징\n\n- **북부에서 수도로 이동한다.** 1편은 열두 번의 환승으로 시작하고, 10편은 의회 앞에 선다.\n- **주역이 아홉 번 바뀐다.** 용병단장·보안관·의원·비서관이 번갈아 시점을 잡는다.\n- **6편만 주역이 없다.** 20편 중 유일하게 주역과 기호가 배정되지 않은 편이며, 그 편에만 [[식스]]가 나온다.\n\n## 관련 문서\n\n- [[가문과 가족]] · [[가문과 가족 2부]]\n- [[북방주]] · [[수도주]] · [[스프링필드]]\n- [[철도청]] · [[대가문]] · [[의회]]","parentId":"story-family"},{"title":"가문과 가족 2부","id":"story-family-2","type":"서사","folder":"08_서사","sortOrder":20,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서. 편별 목록은 만들지 않는다(작가 방침).","image":"resource/wiki/가문과 가족 2부.png","imageCaption":"가문과 가족 2부","summary":[["분량","11~20편 + 에필로그 + 잡음"],["기간","09일 → 11~12일 → 며칠 뒤"],["무대","[[의회]] → 지하 → [[스프링필드]] 저택"],["주역","하워드 · 해리엇 · 타게니아 · 네빌 · 에른스트 · 세라(3편) · 앤드루 · 코네트"],["판이 뒤집힌 횟수","3"]],"content":"# 가문과 가족 2부\n\n```틀\n가문과 가족\n```\n\n11~20편과 에필로그. **11~19편이 하루 안에 벌어진다.** [[의회]] 한 곳에서 판이 세 번 뒤집힌다.\n\n## 세 번의 역전\n\n1. **[[북부동맹]]이 의회를 장악한다** (11편). [[하워드]]가 [[연합]]의 개입을 끌어들이는 사이에 벌어진다.\n2. **[[데이비스]]가 독립을 선언한다** (18편). [[연방 헌법]] 제4조를 근거로, 가담한 여섯 [[대가문]]의 이름을 부른다.\n3. **[[세라]]가 수정헌법 제1조를 발표한다** (18편). 같은 편에서 두 번째 역전이 곧바로 뒤집힌다.\n\n그 사이 12편에서 조작된 [[0호 비상사태]] 지령이 경찰청을 흔들고, 13편에는 [[연합]] 감독관 [[타게니아]]가 본회의장에 도착한다.\n\n## 두 겹의 무대\n\n의회에서 정치가 굴러가는 동안, **지하에서 [[앤드루]]의 사업이 따로 굴러간다.** 16편에서 [[궤간 통일]]을 명분으로 파온 지하철도가 언급되고, 19편에서 그 실체가 드러난다. 앤드루가 지하에서 독립 선언 소식을 통신으로 전해 듣는 장면이 두 무대가 만나는 자리다.\n\n## 세라의 세 편\n\n16 · 17 · 18편이 [[세라]] 연속 주역이다. 그림자가 드러나고(16), 돌아올 수 없는 선을 넘고(17), 개헌한다(18). 부제도 이어진다 — 「나는 항상 내 의무에 충실했으며, 죽을 준비를 하고 있었다」 → 「가족은 문명의 핵이다」 → 「…나의 집」.\n\n## 끝\n\n20편은 폐허가 된 [[스프링필드]] 저택으로 돌아오는 이야기다. 주역은 [[코네트]]이고, 부제가 「언약의 피는 태중의 물보다 진하다」다.\n\n에필로그는 [[연합]] 중앙엑스포 청사로 넘어간다. [[타게니아]]의 연락이 끊겼고 연방으로 이어지는 회선이 전부 먹통이라는 보고가 올라오며, 「다음 이야기, ‘마왕과 용사’」로 닫힌다. → [[마왕과 용사]]\n\n## 관련 문서\n\n- [[가문과 가족]] · [[가문과 가족 1부]] · [[마왕과 용사]]\n- [[의회]] · [[북부동맹]] · [[연방 헌법]]\n- [[세라]] · [[앤드루]] · [[데이비스]] · [[코네트]]\n\n## 여담\n\n**독자가 마지막까지 모르는 것.** 이 챕터에서 [[세라]]가 헌법을 고쳐 쓰는 것이 [[누스]]를 이용한 행위라는 사실은 한 번도 설명되지 않는다. 에필로그가 [[연합]] 쪽으로 시점을 옮겨 \"특수 장비\"와 \"최고등급 기술 유출\"을 언급하는 것이 초자연 층으로 넘어가는 첫 단서다.","parentId":"story-family"},{"title":"가문과 가족","id":"story-family","type":"서사","folder":"08_서사","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["서사","가문과 가족"],"memo":"챕터 단위 문서다. 편별 목록은 만들지 않기로 했으므로(작가 방침) 챕터의 성격과 구조만 적는다. 근거: 대본 22편, storypack의 챕터·주역·기호 배정.","image":"resource/wiki/가문과 가족.png","imageCaption":"가문과 가족","summary":[["분량","20편 + 프롤로그 · 에필로그 · 잡음"],["챕터","[[가문과 가족 1부]] · [[가문과 가족 2부]]"],["무대","[[연방]]"],["기간","사흘 (xx월 7~9일) + 에필로그"],["주역 인물","14명 — 편마다 교대"],["다음 이야기","[[마왕과 용사]]"]],"content":"# 가문과 가족\n\n```틀\n가문과 가족\n```\n\n[[연방]]을 무대로 한 20편의 이야기. 개인의 활약이 아니라 **이해관계와 집단**이 움직이며, 편마다 주역이 교대된다.\n\n## 구조\n\n편마다 다른 인물이 주역을 맡고, 그 인물에게 배정된 기호가 화 목록에 이름 대신 표시된다. 독자는 편을 읽고 나서야 그 각인이 누구였는지 알게 된다. → [[인물]]\n\n주역이 14명이라는 것은 **주인공이 없다는 뜻**이다. 발화량이 가장 많은 [[세라]]도 7편에만 나오고, 1부의 시선인 [[네빌]]은 2부에서 3편에만 등장한다.\n\n## 시간\n\n본편의 사건은 거의 전부 **사흘**에 몰려 있다.\n\n| 날짜 | 편 | 밀도 |\n|---|---|---|\n| xx월 07일 | 1 ~ 4편 | 북부에서 시작 |\n| xx월 08일 | 5 ~ 9편 | 8편 연회장 · 9편 밀퍼드는 저녁~밤 (D-1) |\n| xx월 09일 | 10 ~ 19편 | D-day. 하루에 열 편 |\n| 11~12일 | 20편 | 저택 귀환 |\n| 며칠 뒤 | 에필로그 | 연합 중앙엑스포 |\n\n10~19편이 하루라는 것이 이 작품의 밀도다. 의회 하나에서 필리버스터·조작된 지령·감독관 개입·독립 선언·개헌이 연달아 터진다.\n\n## 두 부\n\n- **[[가문과 가족 1부]]** (1~10편) — 북부에서 시작해 의회로 모인다. 판이 깔리는 쪽\n- **[[가문과 가족 2부]]** (11~20편) — 의회에서 판이 세 번 뒤집힌다\n\n사이에 「잡음」 두 편(3.5 · 18.5)이 끼어 있다.\n\n## 처음과 끝\n\n부제가 하나의 속담을 앞뒤로 나눠 쓴다.\n\n- 1편 「피는 물보다 진하다」\n- 20편 「언약의 피는 태중의 물보다 진하다」\n\n원래 속담의 온전한 형태가 마지막에 오면서 뜻이 뒤집힌다 — 혈연보다 **맺은 약속**이 앞선다. [[세라]]가 혈연 아닌 이들을 가족이라 부르는 것과 같은 방향이다.\n\n## 관련 문서\n\n- [[가문과 가족 1부]] · [[가문과 가족 2부]] · [[마왕과 용사]]\n- [[연방]] · [[의회]] · [[철도청]]\n- [[인물]]\n\n## 여담\n\n**초자연 층이 전부 숨겨져 있다.** 22편에 `노에시스` · `노에마` · `누스` · `카시마르`가 한 번도 나오지 않는다. [[연방 헌법]]이 [[누스]]라는 사실조차 법리로만 설명된다. → [[세계관 대문]]\n\n**편별 목록은 만들지 않는다**. 각 편의 부제·사건·주역·기호는 `script/` 대본의 메타 줄과 `storypack.json`에 이미 있고, 플레이어의 연표·화 목록이 그것을 쓴다. 위키는 챕터 단위까지만 다룬다.","parentId":null},{"title":"큰 그림","id":"big-picture","type":"서사","folder":"08_서사","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["구조","대륙","권"],"memo":"원문 3230~3272행 「큰 그림」 이관. 대륙 이름과 주제어, 권별 한 줄 문장은 원고 그대로다. Vol.3 이후의 대륙은 이름과 주제어만 있고 내용이 없다.","image":"resource/wiki/큰 그림.png","imageCaption":"권 구조","summary":[["권","5권"],["대륙","11"],["현재 작성 중","[[그렌빌리아 대륙]] (Vol.1)"],["구성 원칙","대륙 하나에 주제 하나"],["이름 계열","초대륙"],["종착점","현실"]],"content":"# 큰 그림\n\n이 세계관은 **다섯 권**으로 짜여 있고, 각 권의 무대가 대륙이며, **대륙마다 주제어 하나**가 붙어 있다.\n\n## 권과 대륙\n\n| 권 | 대륙 | 주제 | 한 줄 |\n|---|---|---|---|\n| **Vol.1** 커먼웰스<br>Commonwealth | [[그렌빌리아 대륙]]<br>[[로디니아 대륙]]<br>[[판노티아 대륙]] | 소망<br>사랑<br>믿음 | '우리'와 '저들'의 이야기 |\n| **Vol.2** 무인지대<br>No Man's Land | [[판게아 대륙]] | 죽음 | 죽음을 피할 수 없다면 |\n| **Vol.3** 보호자와 피보호자<br>Guardian and Ward | 곤드와나 대륙<br>로라시아 대륙 | 보호<br>지배 | 진짜 '강자'는 누구인가 |\n| **Vol.4** 오, 인류여!<br>Oh, the humanity! | 유라시아 대륙<br>동아시아 대륙<br>오세아니아 대륙 | 전쟁<br>통치<br>사회 | 인류의 멸망에 대하여 |\n| **Vol.5** 창백한 푸른 점<br>Pale Blue Dot | 아프리카 대륙<br>극점<br>현실 | 사람(人)<br>하늘(天)<br>땅(地) | 정말로 하고 싶은 말 |\n\nVol.1의 [[그렌빌리아 대륙]]이 작성 중이고, 나머지는 순서대로 열린다.\n\n## 이름의 순서\n\n대륙 이름은 모두 실제로 존재했던 초대륙의 이름이고, **권의 순서가 그 초대륙들이 갈라진 순서와 같다.**\n\n| 순서 | 실제 |\n|---|---|\n| 그렌빌 조산운동 | 로디니아를 만든 사건 |\n| **로디니아** | 최초의 초대륙 중 하나 |\n| **판노티아** | 로디니아가 갈라진 뒤 다시 모인 것 |\n| **판게아** | 가장 유명한 초대륙 |\n| **곤드와나 · 로라시아** | 판게아가 남북으로 갈라진 것 |\n| **유라시아 · 아프리카 · 오세아니아** | 지금 남아 있는 대륙들 |\n\n권이 진행될수록 지질 시간이 현재로 다가오고, **마지막 칸이 '현실'**이다.\n\n## 관련 문서\n\n- [[세계관 대문]]\n- [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]] · [[판게아 대륙]]\n- [[가문과 가족]] — Vol.1 그렌빌리아의 메인 서사\n\n## 여담\n\n**Vol.1의 세 주제어는 고린도전서다** (독자의 읽기). 소망 · 사랑 · 믿음. 「믿음, 희망, 사랑, 이 세 가지는 항상 남아 있을 것입니다」의 그 셋이며, 순서만 다르다.\n\n같은 계열이 규칙 문서에도 있다 — [[누스]]에 갈라디아서, [[노모스]]에 요한복음이 경구로 붙어 있고, 《[[기사행전]]》의 '행전'은 「사도행전」의 그 행전이다.\n\n**주제어는 그 대륙 사람이 [[노에시스]]를 다루는 방식이고, 그것이 그 대륙 신의 상태와 겹친다** (독자의 읽기).\n\n| 대륙 | 주제 | 그곳의 신 | 다루는 방식 | 대응 개념 |\n|---|---|---|---|---|\n| [[그렌빌리아 대륙]] | 소망 | 잠든 채 꿈을 꾼다 | 바란다 | [[노모스]] |\n| [[로디니아 대륙]] | 사랑 | 하늘로서 관조한다 | 정련한다 | [[노에마]] |\n| [[판노티아 대륙]] | 믿음 | 실제로 활동한다 | 믿는다 | [[누스]] |\n| [[판게아 대륙]] | 죽음 | **없다** | 다루는 자가 없다 | — |\n\n**주제어는 그 대륙 사람이 노에시스를 다루는 방식이다** (독자의 읽기). [[그렌빌리아 대륙]] 사람의 특성이 **소망**이고, 그 대륙의 능력이 강하게 바라면 공간이 통째로 변하는 [[노모스]]이며, 대륙의 주제어가 소망이다. 셋이 한 줄이다.\n\n원고 §0이 \"대륙의 주제에 따라 다르게 동작하는 신물질을 통해 형성하는 대륙별 고유 규칙\"이라 적어둔 것이 이 구조로 보인다. → [[세계관 대문]]\n\n**주제어가 그 대륙의 구조로 나타난다** (독자의 읽기). [[로디니아 대륙]]은 '사랑'인데 가장 강한 나라가 스스로 무력을 제한해 균형을 유지하고, [[판노티아 대륙]]은 '믿음'인데 신이 하나이고 해석이 둘이어서 대륙이 양분되어 있다. 주제가 분위기가 아니라 설계로 들어가 있다.\n\n**Vol.5의 '현실'을 어떻게 다룰지는 알려지지 않았다.** 대륙 자리에 '현실'이 적혀 있고 주제가 '땅(地)'이다.\n\n**Vol.3 이후는 이름과 주제어뿐이다.** 곤드와나 · 로라시아 · 유라시아 · 동아시아 · 오세아니아 · 아프리카 · 극점 · 현실의 여덟 칸에 아직 내용이 없다.","parentId":null},{"title":"위키 작성 규칙","id":"wiki-rules","type":"메모","folder":"09_검토","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["운영","안내"],"memo":"이 문서만은 작가 원고가 아니라 작업 규약이다. 원고 이관 정책이 바뀌면 여기부터 고칠 것.","image":"","imageCaption":"","summary":[],"content":"# 위키 작성 규칙\n\n작가 원고를 이 위키로 옮길 때의 규약. 세계관 설정이 아니라 작업 방식에 대한 문서다.\n\n## 옮길 때 (2026-08-04 개정)\n\n**2026-08-04 변경 — 원고 문장을 그대로 지키지 않는다.** 원고와 작가의 설명을 읽고 **해석과 정리를 더해 위키 문장으로 다시 쓴다.** 아래의 옛 정책은 옮기는 단계에서만 유효했다.\n\n원고 문장을 그대로 옮기던 이유는 위키가 정사의 기준점이 될 것이므로 미세한 차이가 쌓이는 것을 막으려던 것이었다. 지금은 위키 쪽이 기준점이 되었으므로, 사실을 보존하는 것과 문장을 보존하는 것을 분리한다 — **사실은 지키고 문장은 다시 쓴다.** 고친 자리는 `검토메모`에 남긴다.\n\n- **맞춤법은 당연히 고친다** — 명백한 오타와 맞춤법 오류는 조용히 교정하고, 무엇을 고쳤는지 `검토메모`에 남긴다. 예: `띈다`→`띤다`, `깊을 수록`→`깊을수록`, `대륙 별`→`대륙별`, `전해져내려오는`→`전해 내려오는`.\n- **인용은 손대지 않는다** — 경구, 등장인물의 대사, 세력의 표어는 원문 그대로 둔다. 작가가 기획 메모에 쓴 문장을 인용으로 남길 때도 같다.\n- **소제목은 레벨을 올린다** — 원문이 굵은 글씨로 표시한 소제목(`**형성 과정**`)은 `### 형성 과정`으로 올린다. 그래야 뷰어 오른쪽 목차에 잡히고 긴 문서를 훑을 수 있다. 이름이나 원어 표기처럼 소제목이 아닌 굵은 글씨는 그대로 둔다.\n- **덧붙인 것은 분리** — 옮긴 사람이 넣은 링크·추론·요약·정리는 본문에 섞지 않고 문서 끝 `## 여담` 절과 프론트매터 `검토메모`에만 둔다.\n- **수정에는 근거를 남긴다** — 점검을 거쳐 원문을 고친 자리는 무엇을 어떻게 고쳤는지 `검토메모`에 적는다.\n\n## 목소리 (2026-07-31 확정)\n\n**이 위키는 작품을 읽은 독자가 쓴 글이다.** 본문에 '작가'가 등장하지 않는다.\n\n- **확정되지 않은 것은 `~로 추정된다` · `~로 보인다`** 로 쓴다. \"작가 확인을 받지 않았다\" 같은 제작 사정은 본문에 적지 않는다.\n- **작중에 없는 것은 `알려져 있지 않다` · `작중에서 언급되지 않는다`** 로 쓴다.\n- 작가에게 물어볼 것이 생기면 본문에 묻어두지 말고 **대화로 직접 묻는다.**\n- 문서 끝의 보충 절 제목은 **`## 여담`** 이다. 뷰어가 이 제목을 찾아 접으므로 바꾸면 `tools/wiki_template.html`의 `MEMO_HEAD`도 함께 고쳐야 한다.\n- **예외 둘.** 프론트매터의 `검토메모`는 작업 기록이므로 제작 사정을 그대로 적는다. 그리고 이 문서 자체는 작업 규약이라 제작 목소리를 유지한다.\n\n## 문장 (2026-08-04 확정)\n\n**작가의 말을 옮기지 말고, 위키 문장을 쓴다.** 대화로 받은 답은 자료이고, 그 문장이 곧 위키 문장은 아니다.\n\n- **대화체의 강조를 지운다.** 질문에 답하며 붙는 강조는 사실이 아니라 어조다. `인간뿐입니다` → **`인간`**. `셋뿐이며` → `셋이며`. 배타성 자체가 사실인 자리(`지상 유출지는 두 곳뿐`)만 남긴다.\n- **군말을 쓰지 않는다.** `즉` · `정확히는` · `사실상` · `아무튼`. 앞 문장을 고쳐 쓰면 접속어가 필요 없어진다.\n- **`~인 셈이다` · `~로 읽힌다`를 본문에 쓰지 않는다.** 정리하는 사람의 말투다. 본문에는 단정형을, 추론에는 `~로 추정된다`를 쓰고, 해석은 `## 여담`으로 보낸다.\n- **제작·설계 정보는 본문에 쓰지 않는다.** 모티브·차용한 실제 국가·비주얼 컨셉·패러디의 출처·원고 행 번호·문서 제목 규칙은 세계 안의 사실이 아니다. `검토메모`에 두고, 작품 밖의 계열을 짚는 이야기라면 `## 여담`으로 보낸다.\n  - 예외: 개요 표의 `모티브` 행처럼 이미 규격으로 정한 자리는 유지한다. 표는 자료이고 본문은 서술이다.\n- **어원은 본문에 둔다.** 이름의 유래는 백과사전 항목의 정상적인 구성이다. 다만 '어디서 차용했다'가 아니라 '이 이름은 무엇이다'로 쓴다.\n\n## 자료의 우선순위 (2026-07-31 확정)\n\n1. **작가가 직접 확정한 것** — 대화로 정한 사항. 가장 위다.\n2. **대본 (`script/`)** — 이미 완성된 작품이므로 정사다. 원고와 어긋나면 대본을 따른다. 예: 행정구역은 원고의 `중심주`가 아니라 대본의 `수도주`를 쓴다(대본 85건 : 원고 1건).\n3. **`세계관 정리.md` 원고** — 위 둘과 충돌하지 않는 범위에서 그대로 옮긴다.\n4. **`세계관_정합성_점검_메모.md`** — 작가 승인을 받은 항목만 반영한다.\n\n**원고에 없어도 필요하면 만든다** (2026-07-31 확정). 옮기는 단계가 끝나면 작업 방식이 바뀐다 — 작가가 원작을 쓰거나 아이디어를 주고, 그것을 위키 내용으로 채워 넣는 쪽이 된다. 그래서 원고 분량 안에 스스로를 묶지 않는다. '위키라면 이 정도는 있어야 한다' 싶은 것이 있으면 **먼저 물어보고 직접 쓴다.** 다만 만든 문서에는 근거를 반드시 남긴다(대본 몇 편, 작가 확인 언제, 추론인지 아닌지).\n\n**개인 사건은 사건 문서로 만들지 않는다** (작가 방침). 인물의 과거(가출·면접·유년 등)는 해당 인물 문서 안에 둔다. `05_사건`은 국가·대륙 단위 사건만 다룬다.\n\n**편별 목록 문서도 만들지 않는다** (작가 방침). 서사는 챕터 단위까지만 문서로 둔다. 편별 부제·사건·주역·기호는 `script/` 대본 메타와 `storypack.json`에 있고 플레이어가 그것을 쓴다.\n\n**플레이버 텍스트(§5)는 위키 문서에 반영하지 않는다.** 작가 방침이다. 등장인물의 대사이지 설정 서술이 아니므로, 여기서 설정을 끌어오지 않는다. 단 작가가 그 내용을 직접 확정해준 경우는 예외이며, 그때는 플레이버가 아니라 **작가 확인**을 출처로 적는다.\n\n## 문체 (2026-07-31 확정)\n\n**평서체(`~이다` / `~한다`)로 통일한다.** 본문이든 메모든 같다.\n\n원고는 구간마다 문체가 달랐다. §핵심 개념과 §1의 이해집단 설명은 평서체였고, §1의 「짤막한 역사」만 음슴체(`~함` / `~됨` / `~임`)였다. 다수인 평서체로 맞추기로 했으므로, 국가 문서의 역사 절은 옮길 때 어미를 바꾼다. **어순과 내용은 그대로 두고 문장 끝만 고친다.**\n\n- 옮긴 사람의 메모도 평서체로 쓴다. 존댓말(`~입니다` / `~십시오`)을 쓰지 않는다.\n- 물어볼 것이 있으면 `확인이 필요하다` 형태로 적는다. 의문문으로 던지지 않는다.\n- **예외: 인용은 손대지 않는다.** 경구, 등장인물의 대사, 세력의 표어는 원문 그대로 둔다.\n- 문체를 바꾼 문서는 `검토메모`에 그 사실을 적는다.\n\n## 정보 표(개요) 규칙 (2026-07-31 확정)\n\n문서 종류마다 개요 항목이 제각각이면 문서를 비교할 수 없다. 같은 종류의 문서는 **같은 항목을, 같은 순서로** 둔다. 항목을 늘리고 싶으면 그 종류의 모든 문서에 함께 늘린다.\n\n**모르는 것은 행을 빼지 않고 `알려지지 않았다`로 적는다.** 빈 자리도 정보다.\n\n### 값은 한 단어, 길어도 한 문장\n\n표는 훑어보는 자리다. 값에 설명을 붙이지 않는다.\n\n- **원칙** 한 단어를 우선하고, 필요하면 한 구절까지. 문장 두 개는 쓰지 않는다.\n- **여러 주체가 들어가는 행은 예외다.** `주요 세력` · `무력` · `파벌` · `등장 편` 처럼 나열이 곧 내용인 행은 `·`로 이어 붙인다.\n- **`— ` 뒤에 붙는 설명절을 경계한다.** 「부재 — [[보안관]]·[[경찰청]]이 승계」처럼 값을 한정하는 것은 남기고, 「붕괴 — 기사 체제는 서사 시점에 유지되고 현재는 종료되었다」처럼 사정을 늘어놓는 것은 본문으로 보낸다.\n- **표에서 덜어낸 사실은 본문에 있어야 한다.** 표는 본문의 요약이지 저장소가 아니다.\n- 이 규칙으로 2026-07-31에 66문서 471행 중 **207행**을 줄였다.\n\n### 분류\n\n국가와 그 하위 개관 문서는 모두 `국가`다. 하위 문서의 소재가 지리든 역사든, 그 문서가 다루는 대상은 그 나라이기 때문이다.\n\n- `지역`은 실제 장소에만 쓴다 — [[북방주]] · [[수도주]] · [[드레드 분지]] · [[그렌빌리아 대륙]].\n- `사건`은 그 자체로 사건인 것에만 쓴다 — [[연말 위기]] · [[하얀 일요일]]. 나라의 역사를 통째로 서술하는 문서는 `국가`다.\n\n### 국가 본문서 — 고정 15행\n\n정식 명칭 · 다른 이름 · 체제 · 위치 · 수도 · 행정구역 · 기원 · 최고 권력 · **법** · 주요 세력 · 무력 · 대외 기조 · 현재 상태 · 서사 축 · 핵심 키워드\n\n정체 → 지리 → 통치 → 대외 → 현재 → 서사의 순서다. 앞의 13행은 실제 국가 정보이고, 마지막 두 행(`서사 축` · `핵심 키워드`)은 작품에서의 위치를 적는 자리다.\n\n`법`은 2026-07-31에 14행에서 늘린 것이다. 두 나라 모두 최고 규범이 [[누스]]라는 물건으로 존재하며([[연방 헌법]] · 《[[기사행전]]》), 그 대응이 국가를 비교하는 축이 되므로 고정 행으로 올렸다.\n\n- 적용: [[연방]] · [[신성제국]]. 앞으로 쓸 [[연합]] · [[컴퍼니]] · [[크레스티아 제국]]도 같다.\n- 나라마다 다른 세부(연방의 의회 파벌, 신성제국의 기사 체제 같은 것)는 **개요에 행을 더 만들지 않고** 본문이나 하위 문서로 보낸다.\n\n### 대륙 문서 — 고정 9행\n\n권 · 주제 · 구분 · 모티브 · 노에시스 포화도 · 병기 · 국가 · 종족 · 특이사항\n\n- 적용: [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]. [[판게아 대륙]]과 Vol.3 이후의 대륙도 같다.\n- **`포화도`와 `병기`를 나란히 둔 이유가 있다.** [[폭발과 연소]]의 억제 강도가 그 대륙의 포화도를 규칙적으로 따라가므로, 두 행이 붙어 있으면 대륙의 문명 수준이 왜 그렇게 되었는지가 표에서 바로 읽힌다.\n- 2026-08-04에 `이름 규칙` 행을 뺐다. 문서 제목을 어떻게 붙이는지는 세계 안의 사실이 아니라 이 위키의 작업 규칙이므로 `검토메모`로 옮겼다.\n- `주제`는 「큰 그림」(원고 3230~3272행)의 대륙별 주제어를 적는다.\n\n### 국가 하위 개관 문서 — 첫 두 행 고정\n\n`본문서` · `다루는 범위` 를 첫 두 행에 두고, 그 아래 주제 행을 **8행 이내**로 둔다.\n\n- 적용: [[연방의 역사]] · [[연방의 지리]] · [[연방의 정치]] · [[연방의 문화]] · [[신성제국의 역사]] · [[신성제국의 지리]] · [[신성제국의 정치]] · [[신성제국의 문화]]\n- `본문서`가 첫 행인 이유는 이 문서만 열었을 때 어느 나라 이야기인지가 먼저 보여야 하기 때문이다.\n\n### 인물 문서 — 고정 10행\n\n소속 · 직함 · 기호 · 첫 등장 · 주역 편 · 등장 편 · 혈연 · 목표 · 방식 · 훗날\n\n- 적용: 대본에 등장하는 인물([[네빌]] · [[앤드루]] · [[세라]] · [[데이비스]] · [[코네트]]).\n- 대본에 나오지 않는 원고의 설정 인물([[교황]])은 편·기호가 없으므로 이 표를 쓰지 않는다.\n\n## 속성 어휘\n\n위키 도구(`wikipage/index.html`)의 선택 목록과 일치해야 한다. 없는 값을 쓰면 편집 화면에서 선택이 풀린다.\n\n- **분류** 대문 · 개념 · 국가 · 세력 · 인물 · 사건 · 기술 · 병기 · 지역 · 서사 · 연표 · 메모\n- **정사** 확정 · 잠정 · 구 설정 · 폐기 예정\n- **상태** 작성 중 · 검토 필요 · 충돌 의심 · 완료\n- **시대** 시대 공통 · 대전쟁 이전 · 대전쟁 · 고대 · 고전 · 중세 · 근대 · **연말 위기** · 서사 시점 · 현대(붕괴 이후) · 미정\n  - 2026-07-31 확정. 값을 추가·변경하면 뷰어 템플릿(`tools/wiki_template.html`)의 `ERAS` 배열에도 반영해야 한다. 순서가 곧 연표 순서다.\n  - **`연말 위기`는 경계 칸이다.** [[연말 위기]]가 근대와 서사 시점을 가르는 기준이라 독립 항목으로 두었다. 이 사건에서 사라지는 구질서([[통일파]] · [[건국의 아버지들]])는 `근대`, 이 사건의 결과로 생긴 것들([[통합파]] · [[자치파]] · [[경찰청]] 등)은 `서사 시점`이다. 플레이어 연표의 `ERA_ORDER`도 이 사건을 독립 층으로 둔다.\n  - **마왕 사태는 '서사 시점'이다.** 국가 붕괴의 계기이지만 그 자체는 서사 안의 사건이다.\n- **폴더** 00_홈 · 01_핵심 규칙 · 02_지역 · 03_세력 · 04_인물 · 05_사건 · 06_기술과 병기 · 07_연표 · 08_서사 · 09_검토 · 미분류\n\n## 시대 기준\n\n이 위키의 '현재'는 **국가 체제가 모두 무너진 이후**, 국지 세력이 난립하는 시기다. 메인 서사는 모두 그보다 앞이다. 국가와 그 이해집단을 다루는 문서는 '현대(붕괴 이후)'가 아니라 그 국가가 실제로 기능하던 시대를 적는다.\n\n## 아직 열려 있는 결정\n\n- 13개 대가문 중 이름이 확인된 것은 **6개** — 스프링필드 · 콩코드 · 하트퍼드 · 도버 · 윌밍턴 · 밀퍼드(18편 55행). 나머지 7개는 미정.\n- 하위 문서가 상위 문서의 폴더를 강제로 따라간다([index.html:222](../../wikipage/index.html:222)의 `setFolder`, [:223](../../wikipage/index.html:223)의 `setParent`). 국가 밑에 이해집단을 계층으로 매달려면 이 동작을 풀어야 한다.\n- 읽기는 해결됐다. `python tools/build_wiki.py` 가 `lore/` 를 읽어 단일 HTML 뷰어(`wikipage/위키.html`)를 만든다. 편집은 여전히 md에서 한다. `wikipage/index.html`(localStorage 편집기)은 뷰어로 대체됐으므로 쓰지 않는다.","parentId":null}],"folderOrder":["00_홈","01_핵심 규칙","02_지역","03_세력","04_인물","05_사건","06_기술과 병기","07_연표","08_서사","09_검토","미분류"],"templates":{"가문과 가족":{"title":"가문과 가족","hue":"286","groups":[["챕터","[[가문과 가족 1부]] · [[가문과 가족 2부]] · [[마왕과 용사]]"],["무대","[[연방]] · [[의회]] · [[철도청]] · [[스프링필드]]"],["인물","[[세라]] · [[네빌]] · [[앤드루]] · [[데이비스]] · [[코네트]] · [[인물]]"],["사건","[[연말 위기]] · [[미트로프 내전]] · [[연방 헌법]]"]]},"신성제국":{"title":"드레드노 신성제국","hue":"42","groups":[["통치","[[교단]] · [[교황]] · [[추기경]] · [[기사행전]]"],["기사","[[제국기사]] · [[성좌 기사단]] · [[상급기사]] · [[하급기사]]"],["3대 재단","[[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]"],["그 외 세력","[[잔존 함대]] · [[황립 조선소]]"],["음지","[[정복자들]] · [[편력기사]]"],["개관","[[신성제국의 역사]] · [[신성제국의 지리]] · [[신성제국의 정치]] · [[신성제국의 문화]]"],["사건","[[대악몽]] · [[레콩키스타]] · [[하얀 일요일]] · [[연말 위기]]"],["지리","[[드레드 분지]] · [[카스티요]]"]]},"연방":{"title":"미트로프 연방","hue":"208","groups":[["통치","[[의회]] · [[통합파]] · [[자치파]] · [[철도파]] · [[통일파]] · [[건국의 아버지들]]"],["무력","[[헌병대]] · [[경찰청]] · [[보안관]] · [[기동대]]"],["행정","[[철도청]] · [[궤간 통일]] · [[0호 비상사태]]"],["지역","[[수도주]] · [[북방주]] · [[동방주]] · [[남방주]] · [[서방주]]"],["사회","[[대가문]] · [[스프링필드]] · [[콩코드]] · [[하트퍼드]] · [[도버]]"],["음지","[[명백한 운명]] · [[잭슨의 형제단]] · [[북부동맹]]"],["개관","[[연방의 역사]] · [[연방의 지리]] · [[연방의 정치]] · [[연방의 문화]]"],["역사","[[연말 위기]] · [[미트로프 내전]] · [[연방 헌법]]"],["인물","[[앤드루]] · [[세라]] · [[네빌]] · [[잭]] · [[데이비스]] · [[해리엇]]"]]},"핵심 개념":{"title":"이 세계의 규칙","hue":"264","groups":[["근본","[[노에시스]] · [[폭발과 연소]]"],["행위","[[노에마]] · [[노모스]] · [[누스]]"],["존재","[[카시마르]] · [[대악몽]]"],["환경","[[바다]] · [[대전쟁]]"],["사람","[[바다 민족]]"],["사례","[[연방 헌법]] · [[기사행전]]"]]}},"todo":{"0호 비상사태":["가문과 가족 2부","경찰청","연방의 정치"],"감독관":["폭발과 연소"],"궤간 통일":["가문과 가족 2부","그렌빌리아 대륙","앤드루","연말 위기","연방의 문화"," const TYPE_HUE = {"대문":32,"개념":264,"국가":208,"세력":14,"인물":338,"사건":42,
                  "기술":192,"병기":2,"지역":152,"서사":286,"연표":96,"메모":222};
