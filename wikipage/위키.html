<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계관 아카이브</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#fffefb; --panel2:#efece4; --line:#e0dad0;
  --text:#211e18; --muted:#77705f; --accent:#8a5320; --soft:#f2e8d8;
  --warn:#9a6b06; --danger:#a02f26; --ok:#2f6b41;
  --serif:"Nanum Myeongjo","Batang","Apple SD Gothic Neo",Georgia,serif;
  --sans:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 6px 18px rgba(60,45,25,.05);
}
:root[data-theme="dark"]{
  --bg:#14131a; --panel:#1c1b23; --panel2:#25232e; --line:#332f3d;
  --text:#e8e4dc; --muted:#9a92a4; --accent:#dbab68; --soft:#2b2533;
  --warn:#dcb057; --danger:#e58179; --ok:#77c78d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
/* 긴 URL이나 붙어 있는 긴 토큰이 칸을 밀어내지 않게 한다. */
.body,.infobox td,.infobox th,.crumb,.chrono,.quote,.rail{overflow-wrap:anywhere;word-break:normal}
.body pre,.body code{overflow-wrap:normal}
img{max-width:100%;height:auto}
#app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100vh}

/* ── 왼쪽 목록 ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.sidehead{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;flex:1}
.search{margin:12px 14px 4px;position:relative}
.search input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);outline:0;font-family:inherit}
.search input:focus{border-color:var(--accent)}
.tree{overflow:auto;padding:8px 8px 40px;flex:1}
.foldername{padding:12px 8px 5px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.1em;display:flex}
.foldername span{margin-left:auto;opacity:.7}
.doc{width:100%;border:0;background:0;color:var(--muted);text-align:left;display:flex;gap:7px;align-items:center;
  padding:6px 8px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13.5px;line-height:1.35}
.doc:hover{background:var(--panel2);color:var(--text)}
.doc.on{background:var(--soft);color:var(--accent);font-weight:700}
.doc .ic{width:15px;text-align:center;flex:none;opacity:.75}
.doc .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.doc .more{flex:none;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:9px;background:var(--panel2);color:var(--muted);padding:0 4px}
.doc.on .more{background:var(--panel);color:var(--accent)}
.doc:hover .more{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--line)}
.dot.draft{background:var(--warn)}.dot.done{background:var(--ok)}.dot.conflict{background:var(--danger)}

/* ── 본문 ── */
.main{overflow:auto;position:relative}
/* 인포박스를 띄우지 않고 오른쪽 칸에 둔다.
   띄우면 표·틀·시간선마다 clear 를 걸어 피해야 하고, 그때마다 빈 공간과
   끊긴 밑줄이 생긴다. 칸으로 두면 본문은 언제나 한 폭을 쓴다. */
.wrap{display:grid;gap:0 36px;max-width:1140px;margin:0 auto;padding:38px 40px 120px;
  grid-template-columns:minmax(0,1fr) 300px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"main ib" "main toc"}
article{grid-area:main;min-width:0}
.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}
h1.doctitle{font-family:var(--serif);font-size:33px;line-height:1.22;margin:0 0 15px;letter-spacing:-.015em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);
  border:1px solid transparent;letter-spacing:.02em}
.chip.canon-확정{color:var(--ok);border-color:var(--ok)}
.chip.canon-잠정{color:var(--warn);border-color:var(--warn)}
.chip.canon-구\ 설정,.chip.canon-폐기\ 예정{color:var(--danger);border-color:var(--danger)}
.chip.st-충돌\ 의심{color:var(--danger);border-color:var(--danger)}
/* ── 인포박스 ── */
#infobox{grid-area:ib}
.infobox{width:100%;margin:0 0 22px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);overflow:hidden;font-size:12.5px;box-shadow:var(--shadow)}
.infobox .ibhead{padding:10px 13px;background:var(--panel2);border-bottom:1px solid var(--line);
  font-family:var(--serif);font-weight:700;font-size:14.5px;text-align:center;letter-spacing:.01em}
.imgslot{display:block;width:100%;background:var(--panel2);border-bottom:1px solid var(--line)}
.imgslot img{display:block;width:100%;height:auto}
/* 이미지가 없을 때의 자리 — 빈 상자 대신 문양을 깐다. */
.imgph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:172px;padding:20px 14px;color:var(--muted);text-align:center;
  border-bottom:1px solid var(--line);overflow:hidden;
  background:var(--panel2)}
.imgph .motif{position:absolute;inset:0;opacity:.5;pointer-events:none}
.imgph .mark{position:relative;font-size:26px;opacity:.75;color:var(--tone,var(--accent))}
.imgph .lab{position:relative;font-size:11.5px;font-family:var(--serif)}
.imgph .path{position:relative;font-size:10px;word-break:break-all;opacity:.6;font-family:ui-monospace,monospace}
.imgcap{padding:7px 12px;color:var(--muted);font-size:11.5px;text-align:center;border-bottom:1px solid var(--line);line-height:1.5}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:6px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.55}
.infobox th{width:37%;color:var(--muted);font-weight:600;font-size:11.5px;background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.infobox tr:last-child th,.infobox tr:last-child td{border-bottom:0}
.infobox td.tbd{color:var(--warn);opacity:.85}
.body-img{margin:1.4em 0}
.body-img img{max-width:100%;border-radius:8px;display:block}
.body-img figcaption{color:var(--muted);font-size:12px;margin-top:6px;text-align:center}
.body-img .imgph{border:1px dashed var(--line);border-radius:8px}

/* ── 항목별 접기 ── */
details.sec{margin:0}
details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"";flex:none;width:6px;height:6px;margin-top:-3px;
  border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);
  transform:rotate(45deg);transition:transform .15s;opacity:.6}
details.sec:not([open])>summary:before{transform:rotate(-45deg);margin-top:0}
details.sec>summary:hover:before{opacity:1}
details.sec.lv2>summary{margin:2em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
details.sec.lv2>summary .secttl{font-family:var(--serif);font-size:20px}
details.sec.lv3>summary{margin:1.7em 0 .5em}
details.sec.lv3>summary .secttl{font-size:15.5px;color:var(--accent);font-weight:700}
details.sec:not([open])>summary{opacity:.72}
details.sec:not([open])>summary:after{content:"…";color:var(--muted);margin-left:2px}
.foldbar{display:flex;gap:8px;align-items:center;margin:18px 0 2px}
.foldbar button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;
  padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.foldbar button:hover{color:var(--accent);border-color:var(--accent)}
details.memo{margin:14px 0 26px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
details.memo>summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--muted);list-style:none}
details.memo>summary::-webkit-details-marker{display:none}
details.memo>summary:before{content:"▸ ";color:var(--accent)}
details.memo[open]>summary:before{content:"▾ "}
details.memo>summary:hover{color:var(--text);background:var(--panel2)}
details.memo .inner{padding:2px 16px 12px;border-top:1px solid var(--line)}

/* 읽기 편한 본문.
   폭 제한은 '읽는 글'에만 건다. 표·틀·시간선·인용 상자 같은 구조물은
   문서 전체 폭을 쓰게 두어야 인포박스와 오른쪽 끝이 맞는다. */
.body{font-size:15.5px;line-height:1.85}
.body p,.body ul,.body ol,.body>blockquote,.secbody>blockquote{max-width:70ch}
/* 상자 안의 글은 상자 폭을 그대로 쓴다 */
.body .quote p,.body td p,.body th p,.body li>ul,.body li>ol{max-width:none}
.body p{margin:0 0 1.05em}
/* 첫 문단은 도입부처럼 조금 키운다. */
.lead{font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--text);margin:0 0 1.3em;
  max-width:70ch}
.lead em,.lead strong{font-weight:700}
/* 국가 문서의 고유 명칭처럼, 제목 아래 짧게 놓인 한 줄 */
.subtitle{font-family:var(--serif);font-size:14px;color:var(--muted);letter-spacing:.06em;
  margin:-.4em 0 1.2em;padding-bottom:.5em;border-bottom:1px solid var(--line);max-width:70ch}
.body h2{font-family:var(--serif);font-size:20px;margin:2em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.body h3{font-size:15.5px;margin:1.7em 0 .5em;color:var(--accent)}
.body h4{font-size:14px;margin:1.4em 0 .4em;color:var(--muted)}
.body ul,.body ol{margin:0 0 1.05em;padding-left:1.35em}
.body li{margin:.3em 0}
.body li>ul,.body li>ol{margin:.3em 0}
.body blockquote{margin:1.1em 0;padding:.5em 0 .5em 1.1em;border-left:3px solid var(--accent);color:var(--muted);font-family:var(--serif);font-size:15px}

/* ── 분류별 상징색 ── */
.tone{--tone:hsl(var(--hue) 42% 38%)}
:root[data-theme="dark"] .tone{--tone:hsl(var(--hue) 48% 66%)}

/* ── 연표 띠 ── */
.erabar{display:flex;align-items:stretch;gap:3px;margin:0 0 20px;
  border:1px solid var(--line);border-radius:9px;padding:5px;background:var(--panel)}
.erabar .seg{flex:1;min-width:0;padding:5px 4px 6px;border-radius:6px;text-align:center;
  font-size:10px;color:var(--muted);letter-spacing:-.02em;line-height:1.35;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erabar .seg .n{display:block;font-size:9.5px;opacity:.55;margin-top:1px}
.erabar .seg.on{background:color-mix(in srgb,var(--tone,var(--accent)) 16%,transparent);
  border-color:color-mix(in srgb,var(--tone,var(--accent)) 45%,transparent);
  color:var(--tone,var(--accent));font-weight:700}
.erabar .seg.span{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--muted)}
/* 경계 칸 — 시대를 가르는 자리라 좌우에 선을 세운다 */
.erabar .seg.edge{border-left:1px dashed var(--line);border-right:1px dashed var(--line);
  border-radius:3px;font-style:italic}
.erabar .seg.edge.on{border-left-style:solid;border-right-style:solid;font-style:normal}
.erabar.flat{justify-content:center}
.erabar.flat .lab{padding:5px 12px 6px;font-size:11px;color:var(--muted)}

/* 대문의 전체 연표 */
.chrono{margin:1.4em 0;border-left:2px solid var(--line);padding-left:0}
.chrono .row{position:relative;padding:0 0 18px 22px}
.chrono .row:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.chrono .row.empty:before{border-color:var(--line)}
.chrono .era{font-family:var(--serif);font-size:14.5px;font-weight:700;margin-bottom:5px}
.chrono .row.edge:before{border-color:var(--warn);width:12px;height:12px;left:-7px}
.chrono .row.edge .era{color:var(--warn)}
.chrono .edgetag{margin-left:8px;font-family:var(--sans);font-size:10.5px;font-weight:400;
  color:var(--muted);letter-spacing:0}
.chrono .row.empty .era{color:var(--muted);font-weight:400}
.chrono .docs{display:flex;flex-wrap:wrap;gap:5px}
.chrono .docs a{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);
  color:var(--muted);cursor:pointer;border:1px solid transparent}
.chrono .docs a:hover{color:var(--accent);border-color:var(--accent)}
.chrono .none{font-size:12px;color:var(--muted);opacity:.6}

/* ── 틀 (탐색 상자) ── */
.navbox{margin:0 0 22px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);overflow:hidden;font-size:12.5px}
.navbox .nbhead{padding:7px 12px;background:color-mix(in srgb,var(--tone,var(--accent)) 13%,var(--panel2));
  border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:13.5px;
  color:var(--tone,var(--accent));letter-spacing:.01em}
.navbox table{width:100%;border-collapse:collapse}
.navbox th,.navbox td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.7}
.navbox th{width:78px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap;
  background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.navbox tr:last-child th,.navbox tr:last-child td{border-bottom:0}
.navbox.missing{padding:9px 12px;color:var(--danger);font-size:12px}

/* ── 상세 문서 안내 ── */
.seealso{margin:1.1em 0;padding:8px 13px;border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--soft) 45%,transparent);border-radius:0 7px 7px 0;
  font-size:13.5px;color:var(--muted)}
.seealso:before{content:"▸ ";color:var(--accent)}
.seealso a.wiki{font-weight:700}

/* ── 연혁 (문서 안의 시간선) ── */
.histline{list-style:none;margin:1.3em 0;padding:0 0 0 4px}
.histline li{position:relative;display:grid;grid-template-columns:96px 1fr;gap:14px;
  padding:0 0 14px 20px;border-left:2px solid var(--line);align-items:baseline}
.histline li:last-child{border-left-color:transparent;padding-bottom:0}
.histline li:before{content:"";position:absolute;left:-6px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent)}
.histline li.same:before{width:5px;height:5px;left:-4px;top:9px;background:var(--line);border:0}
.histline .when{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--accent);
  text-align:right;line-height:1.6}
.histline li.same .when{color:transparent}
.histline .what{font-size:14.5px;line-height:1.65}
@media(max-width:640px){
  .histline li{grid-template-columns:1fr;gap:2px}
  .histline .when{text-align:left}
}

/* ── 인용 블록 네 종류 ── */
.quote{margin:1.5em 0;padding:0}
.quote p{margin:0 0 .45em}
.quote p:last-of-type{margin-bottom:0}
.quote cite{display:block;margin-top:.7em;font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.02em}

/* 경구 — 문서 머리의 제사 */
.quote.epigraph{margin:0 0 2em;padding:1.15em 0 1.05em;text-align:center;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote.epigraph p{font-family:var(--serif);font-size:16.5px;line-height:1.75;color:var(--text)}
.quote.epigraph cite{margin-top:.55em;font-size:11.5px;opacity:.85}
.quote.epigraph cite:before{content:"— "}

/* 대사 — 대본에서 따온 인물의 말 */
.quote.dialogue{position:relative;padding:.9em 1.15em .85em 2.5em;border-radius:9px;
  background:color-mix(in srgb,var(--soft) 55%,transparent);border:1px solid var(--line)}
.quote.dialogue:before{content:"“";position:absolute;left:.55em;top:.3em;
  font-family:var(--serif);font-size:30px;line-height:1;color:var(--accent);opacity:.45}
.quote.dialogue p{font-family:var(--serif);font-size:15px;line-height:1.7}
.quote.dialogue cite{text-align:right;font-weight:600;color:var(--accent);opacity:.9}
.quote.dialogue cite:before{content:"— "}

/* 표어 — 세력의 구호 */
.quote.motto{text-align:center;padding:.5em 0}
.quote.motto p{font-family:var(--serif);font-size:15.5px;color:var(--accent);letter-spacing:.02em}
.quote.motto p:before{content:"“"}
.quote.motto p:after{content:"”"}

/* 조문 — 법조문 */
.quote.article{padding:1.2em 1.4em;border:1px solid var(--accent);border-radius:9px;
  background:color-mix(in srgb,var(--soft) 40%,transparent);text-align:center}
.quote.article p{font-family:var(--serif);font-size:17px;line-height:1.8;letter-spacing:.03em;font-weight:700}
.quote.article cite{color:var(--accent);opacity:.9}
.body code{background:var(--panel2);padding:.12em .38em;border-radius:4px;font-size:.87em}
.body pre{background:var(--panel2);padding:12px 14px;border-radius:8px;overflow:auto;line-height:1.6}
.body pre code{background:0;padding:0}
.body hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
/* 본문 표는 인포박스 옆에 끼지 않게 아래로 내린다 — 좁은 칸에 눌리면 읽기 어렵다. */
.body table{border-collapse:collapse;width:100%;margin:1.3em 0;font-size:14px;
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.body .tablewrap{overflow-x:auto;margin:1.3em 0}
.body .tablewrap table{margin:0}
.body th,.body td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;line-height:1.6}
.body th{background:var(--panel2);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.body tbody tr:last-child th,.body tbody tr:last-child td{border-bottom:0}
.body tbody tr:hover{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.body strong{font-weight:700}
a.wiki{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}
a.wiki:hover{border-bottom-color:var(--accent)}
a.wiki.missing{color:var(--muted);border-bottom:1px dashed var(--muted)}
a.wiki.missing:after{content:"?";font-size:.75em;vertical-align:super;opacity:.7}

/* ── 오른쪽 목차 ── */
.rail{grid-area:toc;position:sticky;top:38px;align-self:start;font-size:12px}
.rail h5{margin:0 0 7px;color:var(--muted);font-size:10.5px;letter-spacing:.1em;font-weight:800}
.rail a{display:block;color:var(--muted);text-decoration:none;padding:3px 0 3px 9px;border-left:2px solid var(--line);line-height:1.4}
.rail a:hover{color:var(--accent);border-left-color:var(--accent)}
.rail .sub{padding-left:20px;font-size:11.5px}
.rail .box{margin-bottom:22px}
.rail .backlink{border:0;padding:3px 0;color:var(--accent)}
.empty{color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;
  width:30px;height:30px;cursor:pointer;font-size:14px;flex:none}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
#menu{display:none;position:fixed;left:14px;top:14px;z-index:12;width:38px;height:38px;font-size:16px;
  background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8}
#scrim.on{display:block}
@media(max-width:1000px){
  #app{grid-template-columns:1fr}
  #menu{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:9;transform:translateX(-100%);transition:.2s}

<script>
const DATA = {"docs":[{"title":"세계관 대문","id":"home","type":"대문","folder":"00_홈","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["안내","코어"],"memo":"§0 코어 원문(세계관 정리.md 1~44행)을 문장 그대로 옮김. 링크와 시작점 절은 옮긴 사람이 붙인 것으로 본문과 분리해 표시.","image":"","imageCaption":"","summary":[],"content":"# 세계관 대문\n\n### 무슨 목적인가?\n\n과거 존재했던 초대륙들을 하나씩 차용하고, 대륙마다 개별적인 주제를 부여, 주제에 따른 문제 상황을 만들어둔 뒤, 플레이어를 던져놓고 그 문제 상황을 해결하는 경험을 제공하는 세계관\n\n### 무엇이 다른가?\n\n‘명백히 설명할 수 있는 원리’를 가진 세계\n\n대륙 단위로 끊어서 진행할 수 있어 프로젝트 진척과 여러 컨셉을 시도하기에 유리한 설정\n\n다른 IP에서 비교적 조명하지 않는, ‘이해관계’, ‘집단’, ‘세력’ 중심의 전개\n(중요: 그렇다고 ‘캐릭터’의 매력을 포기하겠다는 것이 절대, 절대, 절대로 아님!!!!!!)\n\n### 어떤 게 있는가?\n\n이해관계, 집단, 세력, 인물이 가진 ‘신념’에 따라 동작하는 ‘능력’\n\n세계관 규칙, 개연성을 형성하며, IP의 핵심적인 기둥이 될 ‘신물질’\n\n대륙의 주제에 따라 다르게 동작하는 신물질을 통해 형성하는 대륙별 고유 ‘규칙’\n\n### 어떻게 할 것인가?\n\n심심할 때마다 자잘한 설정이나 큰 틀을 대략적으로 잡아가며 작성\n\n지금 작성된 내용은 추후 프로젝트, 기타 창작 활동에 사용.\n\n먼 훗날 이를 통합하는 대형 프로젝트에 도전\n\n### 무엇을 하고 있는가?\n\n‘대륙에게 개별적인 주제를 부여 -> 주제에 따른 문제 상황’을 만드는 중.\n\n가끔씩 추후 사용될 여지가 있는 ‘캐릭터’도 만드는 중.\n\n그냥 심심해서 이리저리 써보는 것도 있음\n\n[세계관 초안](https://docs.google.com/document/d/1V2rzeJ9Lu-FBoMMDjLTt4QuMs9QgHQCNWIc3HnDbM5I/edit?tab=t.h14bfmmjikhl)\n\n---\n\n## 여담\n\n위 본문은 `세계관 정리.md` §0 코어(1~44행)다. 아래는 원고에 없는, 위키 운항용 안내다.\n\n**시대 기준** — 이 위키의 '현재'는 **국가 체제가 모두 무너진 이후**, 국지 세력이 난립하는 시기다. 《가문과 가족》을 비롯한 메인 서사는 이 기준에서 **과거**에 해당한다. 각 문서의 `시대` 속성은 이 기준을 따른다.\n\n**초자연 층은 독자에게 숨겨져 있다**. 《가문과 가족》 22편 전체에 `노에시스` · `노에마` · `누스` · `카시마르` · `신성제국` · `드레드노`가 **한 번도 등장하지 않는다.** 헌법이 [[누스]]라는 사실조차 대본은 초자연이 아니라 법리로만 설명한다. 초자연 층은 《마왕과 용사》에서 드러나는 구조다.\n\n그래서 이 위키에는 **독자가 아직 모르는 것이 적혀 있다.** 이 위키는 비공개이므로 그대로 적지만, 작중 설명과 여기 적힌 것이 어긋나 보이는 자리는 대개 이 은폐 구조 때문이다. 그런 자리는 두 설명을 함께 적어둔다. → [[연방 헌법]]의 사례\n\n**시작점**\n\n- [[핵심 개념]] — 이 세계의 규칙. 반드시 '진실'만 적는 자리\n- [[그렌빌리아 대륙]] — Vol.1의 무대\n- [[위키 작성 규칙]] — 옮기는 방식과 속성 어휘\n\n**연표** — 시대 순으로 늘어놓은 문서들. 빈 자리가 아직 안 쓴 구간이다.\n\n```연표\n```\n\n**원본 자료**\n\n- 설정 원고 `세계관 정리.md` — 272KB, 3,271줄\n- 정합성 점검 `세계관_정합성_점검_메모.md` — 2026-07-29\n- 대본 단일 원본 `script/` — 《가문과 가족》 20편 + 프롤로그·에필로그","parentId":null},{"title":"노모스","id":"nomos","type":"개념","folder":"01_핵심 규칙","sortOrder":20,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노모스"],"memo":"원문(세계관 정리.md 98~113행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음.","image":"resource/wiki/노모스.png","imageCaption":"노모스가 펼쳐진 영역","summary":[["한 줄 정의","활성 [[노에시스]]만 존재하게 된 영역"],["형성 주체","반드시 구사자로 격상된다"],["주체의 분비량","사고 행위를 통해 거의 무한"],["일반인 진입","동화"],["구사자·능력자 진입","감화"],["주체 이탈 시","활성 노에시스가 주체에게 흡수되고 노모스는 소멸"],["남는 것","흡수한 만큼의 초월적인 힘"]],"content":"# 노모스\n\n```경구\n한처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 하느님과 똑같은 분이셨다.\n— 요한복음 1:1\n```\n\n## 개념\n\n노모스는 어떤 주체로 인해 ‘노에시스’가 연쇄적으로 활성되어 ‘활성 노에시스’만 존재하게 된 영역을 의미한다. 해당 영역 내에서 노에시스를 활성화시킨 주체는 반드시 ‘구사자’로 격상되며, 사고 행위를 통해 ‘활성 노에시스’를 거의 무한히 분비할 수 있게 된다.\n\n노모스에 ‘노에마 능력자’ 혹은 ‘구사자’가 아니면서, 동시에 뚜렷한 가치관이나 철학을 가지고 있지 않은 사람이 진입할 경우, 노모스를 형성한 주체의 신념, 가치관, 사상 등에 **동화**된다.\n\n‘노에마 능력자’ 혹은 ‘구사자’라고 하더라도, 노모스에 진입한 상태에서 주체를 통한 신념, 가치관 등의 변화를 겪게될 경우, 위와 동일한 과정을 거쳐 **감화**될 수 있다.\n\n노모스를 형성한 주체가 노모스 밖으로 벗어날 경우, 활성 노에시스의 안정성이 급격히 붕괴하면서 노모스의 주체에게 흡수되려는 성질을 띠게 된다. 노모스에 존재했던 활성 노에시스가 모두 주체에게 흡수될 경우, 노모스는 사라지나, 그 영향력만큼 주체에게 초월적인 힘을 부여해줄 수 있게 된다.\n\n## 관련 문서\n\n- [[노에시스]]\n- [[노에마]]\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 이 개념은 앞으로 바뀔 여지를 남겨두었다.\n\n**동화와 감화는 다른 절차다.** 뚜렷한 가치관이 없는 일반인은 **동화**, 이미 구사자·능력자인 사람이 노모스 안에서 신념이 흔들려 넘어가는 것은 **감화**다.\n\n**노모스를 스스로 걷는 것이 강해지는 수단이 된다.** 주체가 노모스 밖으로 나가면 그 안의 활성 노에시스가 전부 주체에게 흡수되고, 그만큼 초월적인 힘이 남는다. 규칙만 보면 노모스를 크게 펼친 뒤 걷어들이는 것이 가장 강력한 수순이 된다.","parentId":"core-concepts"},{"title":"노에마","id":"noema","type":"개념","folder":"01_핵심 규칙","sortOrder":10,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노에마"],"memo":"원문(세계관 정리.md 83~96행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음 — 추후 구현 과정에서 극적 효과를 위해 설정이 변동될 수 있는 항목.","image":"resource/wiki/노에마.png","imageCaption":"노에마 구사 장면","summary":[["한 줄 정의","[[노에시스]]를 사용한 모든 초자연적 행위의 총칭"],["동사","구사하다"],["요구 조건","일정 수준의 활성 노에시스"],["사용자 등급","구사자 / 노에마 능력자"],["유형","활성 노에시스를 직접 다루는 쪽 / 에너지로 환원하는 쪽"],["확인된 실례","[[헌병대]] — 매개체는 [[연방 헌법]]"]],"content":"# 노에마\n\n```경구\n어찌 되었든 너희들이 원하는 바를 행하라. 그러나 먼저 의욕할 수 있는 사람이 되어라!\n— 프리드리히 빌헬름 니체 (독일의 철학자)\n```\n\n## 개념\n\n노에마는 ‘노에시스’를 사용한 모든 초자연적 행위를 총칭한다. 노에마는 ‘구사하다’라는 단어로 표현할 수 있다. ‘노에마를 사용하다’와 ‘구사하다’ 모두 ‘노에마를 사용한 초자연적 행위’를 의미한다.\n\n모든 노에마는 일정 수준의 ‘활성 노에시스’를 요구하며, 노에시스를 온전히 활성화시킬 수 있으면서, 본인이 직접 원하는 형태로 다룰 수 있는 사람을 ‘구사자’라고 칭한다.\n\n구사자가 아닌 사람도 ‘특정 매개체’를 통해 노에마를 구사할 수 있으나, 이 경우 ‘구사자’가 아닌 ‘노에마 능력자’라는 이름으로 칭한다.\n\n노에마는 활성 노에시스를 직접 다루는 유형과, 활성 노에시스를 소모해 특정 에너지로 환원해 사용하는 유형으로 분류할 수 있으며, 전자의 경우 ‘활성 노에시스’의 특성이 유지되고, 후자의 경우 개인의 노에시스 형태에 따라 다른 성질의 에너지로 환원된다.\n\n## 관련 문서\n\n- [[노에시스]]\n- [[노모스]]\n- [[누스]] — 구사자가 아닌 사람을 노에마 능력자로 만드는 ‘특정 매개체’\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 노에마·노모스·누스는 앞으로 바뀔 여지를 남겨두었다.\n\n**용어 구분이 헷갈리기 쉬운 자리.** 노에시스를 스스로 활성화해 원하는 형태로 다루는 쪽이 **구사자**, 매개체를 거쳐야 하는 쪽이 **노에마 능력자**다. 둘은 다른 등급이며, [[노모스]] 안에서는 활성화의 주체가 반드시 구사자로 격상된다.\n\n**확인된 실례 — [[헌병대]]**. [[연방]]의 헌병은 구사자가 아니라 **노에마 능력자**이며, 매개체는 [[연방 헌법]]다. 1인의 역량이 하나의 군단에 버금간다고 하므로, 매개체를 거친 능력자라도 위력 자체는 낮지 않다는 뜻이 된다. 대신 매개체에 종속되므로 그 누스가 훼손되면 힘을 잃는다.","parentId":"core-concepts"},{"title":"노에시스","id":"noesis","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노에시스"],"memo":"2026-07-31 정합성 점검 반영 2건. (1) 원문 63행 '공기 중의 70%를 차지'는 부피비로 읽히면 호흡·연소·기압·부력이 전부 깨지므로, 대기와 중첩된 준물질의 '포화도 70'으로 재정의. (2) 원문 67~69행 '연쇄적인 연소 반응을 억제'는 범위가 너무 넓어 흑색화약만 살아남는 이유가 나오지 않으므로, '자기증폭하는 발열 반응의 전파면 붕괴'로 정밀화. 그 외 문장은 원문 그대로.","image":"resource/wiki/노에시스.png","imageCaption":"활성 노에시스의 형질 예시","summary":[["한 줄 정의","사람의 사고 행위에서 분비되는, 물질과 반응 사이의 모호한 개념"],["성격","대기와 중첩되어 존재하는 준물질"],["상태","활성 / 비활성"],["억제 대상","스스로 가속되는 발열 반응의 전파면"],["포화도","그렌빌리아 70 — 대륙 중 최고"],["형태를 결정하는 것","그 사람의 신념 · 사상 · 경험 · 가치관"],["파생 개념","[[노에마]] · [[노모스]] · [[누스]] · [[카시마르]]"]],"content":"# 노에시스\n\n```틀\n핵심 개념\n```\n\n```경구\n생각을 바꾸면 세상이 바뀔 것이다.\n— 노먼 빈센트 필 (미국의 작가)\n```\n\n## 개념\n\n노에시스는 우리가 사는 현실과 이 세계의 가장 근본적인 차이점으로. ‘사람의 사고 행위’에서 분비되는, 물질과 반응 사이의 모호한 개념이다.\n\n노에시스는 대기와 중첩되어 존재하는 준물질이며, 일반적인 기체처럼 공기의 조성비를 차지하지 않는다. 공기 중 노에시스의 농도는 대륙별로 다르며 ‘포화도’로 표기하는데, 이 수치는 대기 조성비가 아니라, 일정 부피 안에서 연쇄반응을 간섭할 수 있는 노에시스의 유효 밀도를 의미한다. 노에시스의 농도가 가장 높은 대륙인 ‘그렌빌리아 대륙’의 포화도는 자그마치 70에 달할 정도이다.\n\n노에시스는 **활성** 상태와 **비활성** 상태로 분류될 수 있으며, 사람의 사고 행위에서 막 분비된 노에시스는 기본적으로 비활성 상태로 존재하며, 이 상태에서의 노에시스는 무색무취의 기체 형태를 띤다.\n\n비활성 상태의 노에시스는 짧은 시간 안에 스스로 가속되는 발열 반응의 전파면을 붕괴시킨다. 반응 속도가 일정 한계 이하인 화염과 표면연소는 유지되지만, 압력 상승과 반응 속도가 서로를 증폭시키기 시작하면 노에시스의 간섭이 급격히 커진다. 이로 인해 대기 중 노에시스의 농도가 높은 대륙 (ex. 그렌빌리아, 로디니아, 판노티아) 등에서는 ‘폭발’이 발생하기 어렵다.\n\n단, ‘연쇄적인 연소 반응’을 억제할 뿐, 연소 자체를 억제하지는 않는다.\n\n## 심화\n\n사람마다 분비하는 노에시스의 형태는 각각 차이가 있으나, 비활성 상태에서 일정 시간이 지나면 그 특징은 모두 휘발된다. 노에시스의 형태는 그 사람의 ‘신념’, ‘사상’, ‘경험’, ‘가치관’에 따라 달라지는 모습을 보였다.\n\n이러한 개개인이 가진 노에시스의 형태는 노에시스가 활성 상태로 전환될 때 나타난다. 특정 ‘노에마’로 주변의 비활성 노에시스가 활성화될 경우, 활성화시킨 주체의 노에시스 특징을 따라간다.\n\n활성 상태의 노에시스는 비활성 상태와는 달리 뚜렷한 물질로 나타났으며, 유체, 고체, 액체, 기체, 플라즈마, 장(field) 등 개인의 노에시스 특성에 따라 다른 물리, 시각적 형질을 지니게 된다.\n\n활성 상태의 노에시스에 노출된 사람은, 활성화시킨 주체의 ‘신념’, ‘사상’, ‘경험’, ‘가치관’ 등을 ‘맹목적으로’ 따르게 되나, 내적으로 그러한 것들을 이미 갖추고 있는 사람은 활성 노에시스의 영향이 미미하게 나타난다.\n\n단, 개인이 가진 이러한 ‘신념’ 등의 것들이 변화할 경우, 노에시스 또한 함께 변칙적으로 변화함을 확인하였다.\n\n## 이름\n\n그리스어 **νόησις**(노에시스) — '사유하는 **작용**'을 뜻하는 철학 용어다.\n\n[[핵심 개념]]의 네 이름이 모두 같은 계열이며, 서로 짝을 이루는 개념들이다.\n\n| 이름 | 원어 | 본래 뜻 |\n|---|---|---|\n| 노에시스 | νόησις | 사유하는 **작용** |\n| [[노에마]] | νόημα | 사유**된 것** |\n| [[노모스]] | νόμος | **법** · 관습 |\n| [[누스]] | νοῦς | **지성** 그 자체 |\n\n배치가 정확하다. 사유의 작용(노에시스)에서 사유된 것(노에마)이 나오고, 누스는 사람 밖의 지성이며, 노모스는 한 사람의 신념이 영역 전체의 규칙이 되는 상태다.\n\n## 관련 문서\n\n- [[폭발과 연소]]\n- [[노에마]]\n- [[노모스]]\n- [[누스]]\n- [[카시마르]]\n- [[바다]]\n\n## 여담\n\n**고친 자리 두 곳.** 위 `검토메모`에 근거를 적어두었다. 원문 대조가 필요하면 `세계관 정리.md` 61~81행.\n\n**포화도 70이라는 숫자 자체는 원문 그대로 두었다.** 단위의 의미만 바꾼 것이므로, 다른 대륙의 포화도를 적을 때 이 척도를 기준으로 삼으면 된다. 로디니아·판노티아도 '높다'고만 되어 있고 수치는 아직 없다.\n\n**맞춤법 교정.** 원문의 ‘띈다’를 ‘띤다’로 고쳤다(2026-07-31). 문장 구조와 어휘는 그대로다.\n\n**노에시스에서 파생되는 것들.** 이 문서 하나가 세계관의 두 갈래를 동시에 낳는다. 하나는 기술사 — 화약이 막히자 증기·제철·철도·전기가 비정상적으로 발달했고, 그 기술을 [[연합]]이 [[올림피아드]]로 독점 공급해 대륙 전체가 스팀펑크가 되었다. 다른 하나는 초자연 — [[노에마]] · [[노모스]] · [[누스]], 그리고 신념이 그대로 힘이 되는 구조. 국가별로 노에시스에 어떻게 대응했는지가 그 나라의 성격을 결정한다.","parentId":"core-concepts"},{"title":"누스","id":"nous","type":"개념","folder":"01_핵심 규칙","sortOrder":30,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","누스"],"memo":"원문(세계관 정리.md 115~129행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음. 개별 누스(연방 헌법, 바실리아의 누스)는 별도 문서로 분리 예정.","image":"resource/wiki/누스.png","imageCaption":"누스의 형태 예시","summary":[["한 줄 정의","사람 이외에 [[노에시스]]를 분비하는 물질의 총칭"],["형태","상징 · 유물 · 보물"],["기능","일반인을 노에마 능력자 또는 구사자로 만든다"],["한계","자체적으로는 노에시스를 활성화할 수 없다"],["약점","파손되면 능력을 잃을 가능성이 높다"],["알려진 누스","[[연방 헌법]] · 바실리아 공동체의 누스"]],"content":"# 누스\n\n```경구\n그러나 나에게는 우리 주 예수 그리스도의 십자가밖에는 아무것도 자랑할 것이 없습니다.\n— 갈라디아서 6:14\n```\n\n## 개념\n\n누스는 ‘사람 이외의 노에시스를 분비하는 물질’을 총칭하는 개념으로서, 주로 특정한 상징, 유물, 보물 등의 형태로 나타날 수 있다.\n\n사물의 성격에 따라 기능도 천차만별이며, 누스를 매개체로 일반인이 노에마를 구사할 수 있게 되거나, 영구적으로 ‘구사자’로 만드는 등의 특수한 활용이 가능하다.\n\n누스를 통해 ‘노에마 능력자’ 혹은 ‘구사자’가 된 사람의 경우, 누스가 파손될 경우 그 능력을 잃어버릴 가능성이 높으나, 이는 상황에 따라 달라질 수 있다.\n\n누스 자체로는 노에시스를 활성화할 수 없으나, 특정한 행위에 감응하여 평소보다 더 넓은 범위의 노에시스를 활성화시키도록 보조하는 역할을 수행할 수도 있다.\n\n## 알려진 누스\n\n- **연방 헌법** — [[헌병대]]가 노에마를 구사하는 **매개체**다. [[연말 위기]] 당시 80~90%가 소실되었고, 남은 부분을 [[세라]]가 복구해 [[연방]]을 장악하려 했다. 세라가 곧 마왕이며, 마왕 토벌 과정에서 이 누스는 완전히 파괴된다. 그래서 위키 기준 현재에는 존재하지 않는다. → [[연방 헌법]]\n- **바실리아 공동체의 누스** — 노에시스에 대한 이해 없이도 노에마를 사용할 수 있게 해주었고, 그로 인해 [[대악몽]]이 촉발되어 공동체와 인접 국가가 모조리 멸망했다. → [[신성제국]]\n\n## 이름\n\n그리스어 **νοῦς**(누스) — '지성' 그 자체를 뜻한다. 사람의 사유 작용([[노에시스]])과 달리, **사람 밖에 있는 지성**이라는 뜻이 이름에 이미 들어 있다.\n\n[[노모스]](νόμος, 법)와 어근이 이어진다. 그래서 [[연방 헌법]]이 누스라는 설정 — 법전이 곧 사람 밖의 지성이라는 구조 — 은 이름 층위에서부터 예고되어 있다.\n\n## 관련 문서\n\n- [[노에시스]]\n- [[노에마]]\n- [[노모스]]\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 이 개념은 앞으로 바뀔 여지를 남겨두었다.\n\n**누스가 서사를 굴리는 방식.** 개념 자체보다 개별 누스가 사건을 만든다. 헌법이 누스라는 설정은 정치 서사를 그대로 초자연 서사로 잇는 장치이고, 바실리아의 누스는 국가 하나를 멸망시킨 원인이다.\n\n**연방 헌법 한 줄로 전부 이어진다**. 헌법이 [[헌병대]]의 매개체이므로, 헌병은 구사자가 아니라 **노에마 능력자**다. 그 헌법이 [[연말 위기]]에 80~90% 불탔으니 헌병이 좀처럼 모습을 드러내지 못하는 것도 설명된다. 지휘권은 [[건국의 아버지들]]의 혈족에게 있어, [[애덤스]]의 딸인 [[세라]]가 민간인 신분으로 헌병을 부릴 수 있다. 그리고 '누스가 파손되면 능력을 잃는다'는 위 규칙 때문에, 헌법의 파괴가 곧 마왕 토벌의 방법이 된다.\n\n**알려진 누스가 아직 둘뿐이다.** 개념의 설명은 자세한데 실례는 [[연방 헌법]]과 바실리아 공동체의 것만 확인된다. 각각 별도 문서로 다룰 예정이다.","parentId":"core-concepts"},{"title":"바다 민족","id":"sea-peoples","type":"개념","folder":"01_핵심 규칙","sortOrder":60,"era":"대전쟁 이전","canon":"확정","status":"완료","tags":["핵심 규칙","바다 민족","고대"],"memo":"원문(세계관 정리.md 145~159행) 문장 그대로. 시대는 '대전쟁 이전'으로 달았다 — 원문이 '대전쟁 이후 완전히 종적을 감추었다'고 하므로 이들의 활동기는 대전쟁 이전이다. '대전쟁'이 무엇인지는 아직 문서가 없다.","image":"resource/wiki/바다 민족.png","imageCaption":"바다 민족의 선단","summary":[["한 줄 정의","신대륙 형성 이전부터 존재했던 구대륙의 민족 집단"],["출신","[[판게아 대륙]] — 구대륙"],["특기","구대륙 최고의 항해술 · 조선술"],["특이 체질","[[바다]]의 노에시스에 일정 수준의 내성"],["후손","현존하는 신대륙 인류 전체"],["소멸","[[대전쟁]] 이후 완전히 종적을 감춤"],["남은 흔적","신대륙에 전해 내려오는 기록뿐"]],"content":"# 바다 민족\n\n```경구\n\"우리는 항해해야 한다. 표류해서도 안 되고, 닻을 내린 채 멈춰서도 안 된다.\"\n— 올리버 웬델 홈스 주니어 (미합중국 연방대법관)\n```\n\n## 개념\n\n신대륙의 형성 이전부터 존재했던 구대륙의 민족 집단. 구대륙의 민족들 중에서도 가장 뛰어난 항해술, 조선술을 갖추고 있었고, 바다에 녹아있는 ‘노에시스’에 대해 일정 수준의 내성을 지니고 있었다.\n\n이러한 특징 덕분에 이들은 구대륙을 벗어나 여러 신대륙에 최초로 발을 들이게 되었으며, 현존하는 신대륙의 인류는 모두 이들의 후손이다.\n\n바다 민족은 여러 다양한 유전적 형질을 가지고 있었다고 전해지며, 이들의 유전적 다양성이 각 대륙별로 다른 인류의 모습에 큰 영향을 주기도 했다.\n\n이들은 ‘대전쟁’ 이후 완전히 종적을 감추어버렸으며, 이들의 흔적조차 신대륙에 한해 전해 내려오는 기록 속에서만 찾아볼 수 있다.\n\n## 그렌빌리아 대륙에서의 계보\n\n[[그렌빌리아 대륙]]에 도달한 바다 민족은 두 갈래로 갈라져 정착했고, 오늘날 두 열강의 기원이 되었다.\n\n- **동부 분지** → 바실리아 공동체 → 훗날의 [[신성제국]]\n- **서부 반도** → 헬라스 공동체 → 훗날의 [[연합]]\n\n같은 뿌리에서 갈라졌지만 방향이 정반대로 갔다. 바실리아에는 숭배할 [[누스]]가 있어 신학으로 기울었고, 헬라스에는 누스가 없어 자연과학으로 기울었다.\n\n## 이름\n\n**Sea Peoples** — 후기 청동기 시대에 지중해를 휩쓸고 여러 문명을 무너뜨린 뒤 사라진, 실재 집단의 학술 명칭이다.\n\n작품의 바다 민족도 같은 궤적을 그린다. 뛰어난 항해술로 여러 대륙에 처음 발을 들이고, [[대전쟁]] 이후 완전히 종적을 감춘다. 실제 '바다 민족'이 청동기 문명 붕괴와 함께 사라져 기록으로만 남은 것과 겹친다.\n\n## 관련 문서\n\n- [[바다]]\n- [[대전쟁]]\n- [[그렌빌리아 대륙]]\n- [[신성제국]]\n- [[연합]]\n\n## 여담\n\n**계보는 흩어져 전해진다.** 바다 민족을 다루는 기록에는 두 갈래의 정착 이야기가 없고, [[신성제국]]과 [[연합]] 각각의 역사 쪽에 따로 남아 있다. 위 절은 그 둘을 한자리에 모은 것이다.\n\n**[[대전쟁]]이 무엇인지 확인됐다**. 구대륙의 세력들이 대륙 단위로 벌인 대륙간 전쟁이며, 신대륙인 그렌빌리아 · 로디니아 · 판노티아는 영향권 밖이었다. 바다 민족은 이 전쟁 이후 사라졌고, [[바다]]의 노에시스 농도도 이 전쟁에서 나왔다. 즉 이들이 사라진 것과 이들이 넘어온 길이 막힌 것이 같은 사건이다.\n\n**구대륙은 [[판게아 대륙]]이다**. 즉 바다 민족의 출신지이자 [[대전쟁]]의 무대다. 그렌빌리아 · 로디니아 · 판노티아가 신대륙, 판게아가 구대륙이라는 구도다. 대륙 이름 넷이 모두 실재한 초대륙에서 온 것이므로([[세계관 대문]]의 \"과거 존재했던 초대륙들을 하나씩 차용\"), 판게아만 구대륙 자리를 맡은 것도 이름의 무게와 맞는다.","parentId":"core-concepts"},{"title":"바다","id":"sea","type":"개념","folder":"01_핵심 규칙","sortOrder":50,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","바다","지리"],"memo":"원문(세계관 정리.md 131~143행) 문장 그대로.","image":"resource/wiki/바다.png","imageCaption":"원양의 노에시스 해역","summary":[["한 줄 정의","대륙과 대륙을 채우며, 엄청난 농도의 [[노에시스]]가 녹아 있는 환경"],["농도","수심이 깊을수록 증가"],["3분 노출","구토감 · 트라우마 · 정신 착란 · 현기증"],["원양","나무로 된 선체가 통째로 부식"],["농도의 유래","[[대전쟁]]"],["낳는 것","[[카시마르]] · 반 카시마르"],["열리는 조건","달의 움직임에 따른 해역별 농도 변화 (주기 미정)"]],"content":"# 바다\n\n```경구\n\"그래도 사람은 패배하기 위해 창조된 게 아니다.\" 그가 말했다. \"인간은 파괴될 순 있지만 패배하지는 않는다.\"\n— 소설 〈노인과 바다〉\n```\n\n## 개념\n\n대륙과 대륙을 채우는 바다에는, 엄청난 농도의 노에시스가 녹아있다. 수심이 깊을수록 노에시스의 농도가 증가하며, 바다에 녹아있는 노에시스는 육지에 존재하는 노에시스와 달리 밀도가 높고, 매우 극단적인 성질을 가지고 있다.\n\n대표적으로, 바다에 녹아있는 노에시스에 약 3분 정도만 노출되어도 정상적인 거동이 불가능할 수준의 구토감, 트라우마, 정신 착란, PTSD 증세, 현기증이 나타나며, 농도가 매우 짙은 원양까지 나갈 경우, 나무로 된 선체는 통째로 부식될 정도이다. 이처럼, 바다는 매우 위험한 환경으로 여겨져 왔다.\n\n과거부터 현대까지 ‘대륙 간’ 교류가 불가능하도록 만드는 주요 원인 중 하나이지만, 아주 먼 과거에는 지금만큼 노에시스 농도가 높지 않았고, ‘달’의 움직임에 따라 특정 해역의 노에시스 농도가 증가하거나, 감소하기도 하는 등. 항해가 아예 불가능한 환경은 아니기도 하다.\n\n## 이 농도는 어디서 왔는가\n\n[[대전쟁]] 때문이다. 구대륙의 세력들이 대륙 단위로 벌인 전쟁이 바다에 노에시스가 대량으로 녹아 있는 원인이다.\n\n## 바다가 낳는 것\n\n- 고인 노에시스는 썩어 [[카시마르]]가 된다. 사람이 자연적으로 분비하는 양보다 바다와 지층에 녹아 있는 양이 압도적으로 많으므로, 카시마르는 사람이 밀집한 곳이 아니라 이렇게 축적된 곳에서 주로 발생한다.\n- 물속에서 이 농도에 **오랜 기간** 노출된 사람은 반쯤 카시마르가 된다. → [[카시마르]]의 '반 카시마르'\n\n## 관련 문서\n\n- [[노에시스]]\n- [[대전쟁]] — 바다의 노에시스 농도를 만든 사건\n- [[카시마르]]\n- [[바다 민족]] — 바다의 노에시스에 내성을 지녔던 유일한 집단\n\n## 여담\n\n**이 설정이 세계관 구조를 결정한다.** 대륙별로 주제를 부여하고 대륙 단위로 끊어서 진행한다는 [[세계관 대문]]의 방침이 성립하는 이유가 바로 이것이다. 바다가 물리적 차단막이라서 대륙끼리 서로를 거의 모른 채 독립적으로 굴러간다.\n\n**동시에 빠져나갈 구멍도 열어두었다.** '아주 먼 과거에는 농도가 낮았다'와 '달의 움직임에 따라 해역별 농도가 변한다'는 두 문장이 대륙 간 왕래를 필요할 때 가능하게 만든다. [[바다 민족]]이 신대륙에 도달한 것도 이 창을 통해서였다.\n\n**고농도의 출처는 확인됐다**. [[대전쟁]]이다. 원문에는 이 연결이 적혀 있지 않았다.\n\n**달의 주기는 아직 미정이다.** 다만 방향은 정해져 있다 — **'타이밍만 잘 맞추면 대륙 간 이동이 가능한 수준'**. 즉 상시 차단이 아니라 조건부로 열리는 문이며, 그 조건을 아는 쪽이 대륙 간 왕래를 독점할 수 있다. 구체적인 주기와 해역 범위는 정해지면 여기에 적을 것.","parentId":"core-concepts"},{"title":"연방 헌법","id":"constitution","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["핵심 규칙","누스","연방","헌법"],"memo":"원문에 항목이 없던 문서. 작가 확인(2026-07-31)의 '헌법은 누스가 맞고, 연말 위기에 80~90%가 불탔다. 남은 부분을 세라가 복구해 연방을 장악하려 한 것이며, 마왕 토벌 과정에서 파괴될 예정이다. 헌병의 매개체가 헌법이다'와 대본 6·17·18편 대조로 작성했다. 물리적 형태(책)와 수정헌법 제1조 조문은 대본에서 확인한 것이다.","image":"resource/wiki/연방 헌법.png","imageCaption":"헌법전","summary":[["성격","[[누스]]"],["귀속","[[연방]]"],["물리적 형태","책"],["기능","[[헌병대]]가 [[노에마]]를 구사하는 매개체"],["접근 권한","[[건국의 아버지들]]의 혈족"],["소실","[[연말 위기]]에 80~90%가 소실"],["복원","[[세라]]가 조력자와 함께 복원"],["개헌","수정헌법 제 1 조"],["현재","존재하지 않음 — 마왕 토벌 과정에서 파괴"]],"content":"# 연방 헌법\n\n```틀\n핵심 개념\n```\n\n[[연방]]의 헌법은 단순한 문서가 아니라 [[누스]]다. 물리적으로는 **책** 한 권의 형태를 띤다.\n\n## 기능\n\n[[헌병대]]가 [[노에마]]를 구사하는 **매개체**다. 그래서 헌병은 구사자가 아니라 노에마 능력자이며, 이 누스의 상태가 헌병의 역량을 그대로 결정한다.\n\n접근 권한은 [[건국의 아버지들]]의 혈족에게 있다. 6편에서 한 헌병은 세라가 그것을 들고 있는 것만 보고 \"그렇다는 건 ‘건국의 아버지들’과 모종의 관계가 있다는 뜻이겠죠\"라고 곧바로 짐작한다.\n\n## 소실과 복원\n\n[[연말 위기]]의 화재로 **80~90%가 소실**되었다.\n\n이 사건이 [[헌병대]]를 사실상 무력화시켰다. 6편에서 헌병 자신이 그 이유를 말한다.\n\n```대사\n연방을 지켜온 최초의 ‘방패’ 이자, 지금은 최후의 ‘칼날’…\n하하하, 그것도 이제는 옛말이죠. 지금의 우리는 ‘칼날’도, ‘방패’도 될 수 없습니다.\n헌법은 그날 무너졌으니.\n집행할 법이 없다면, 헌병이 무슨 의미가 있을까요. 경찰도, [보안관]도 마찬가지고.\n— 세라와 연방 헌병, 6편\n```\n\n남은 부분은 [[세라]]가 조력자와 함께 밀실에서 복원했다. 6편에서 그 작업이 목격되고, 17편에서 헌병은 \"현재 ‘헌법 복원’이 시급합니다\"를 근거로 [[해리엇]]의 의회 진입 저지를 물리친다.\n\n## 수정헌법 제 1 조\n\n18편 본회의장에서 [[세라]]는 복원 사실을 알리며 \"낡은 헌법도 함께 수리해두었다\"고 말한 뒤 개헌안을 발표한다.\n\n```조문\n모든 인민은. 가족을 위해. 봉사하라.\n— 수정헌법 제 1 조, 18편\n```\n\n그리고 이렇게 마친다.\n\n```대사\n그리고 마지막은, 가족의, 가족에 의한, 가족을 위한 국가가… 지상에서 사라지지 않기를 바라며…\n— 세라, 18편\n```\n\n6편에서 헌병이 세라에게 \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\"라 물었고, 세라는 \"…‘가족’ 이요\"라 답했다. 그 대답이 여기서 조문이 된다.\n\n## 소멸\n\n마왕 토벌 과정에서 완전히 파괴된다. 그래서 위키 기준 현재에는 존재하지 않는다.\n\n## 관련 문서\n\n- [[누스]] · [[노에마]] · [[노모스]]\n- [[헌병대]]\n- [[세라]] · [[애덤스]] · [[건국의 아버지들]]\n- [[연말 위기]] · [[의회]]\n- [[연방]]\n\n## 여담\n\n**정치 서사와 초자연 서사가 같은 물건에서 만난다.** 대본은 이 누스를 초자연물로 설명하지 않는다. 헌병이 힘을 잃은 이유를 \"집행할 법이 없으니 헌병이 무슨 의미가 있나\"라는 **법리로** 말한다. 설정 층에서는 같은 사실이 \"매개체가 훼손되어 능력을 잃었다\"는 [[누스]] 규칙으로 설명된다. 한 사건에 두 개의 설명이 겹쳐 있고, 둘 다 맞다.\n\n**개헌이 곧 노모스로 보인다.** [[노모스]]는 주체의 신념·가치관에 진입자를 **동화**시키는 영역이고, [[노에시스]]는 활성화시킨 주체의 신념을 맹목적으로 따르게 만든다. 이 누스에 \"모든 인민은 가족을 위해 봉사하라\"를 새기는 것은, 국가 전체를 [[세라]]의 신념으로 덮는 행위가 된다. 세라의 마왕화가 초자연적 폭주가 아니라 **입법 절차**의 형태를 취하는 것으로 추정된다.\n\n**게티즈버그 연설의 뒤집기.** \"가족의, 가족에 의한, 가족을 위한 국가\"는 \"of the people, by the people, for the people\"에서 people을 family로 바꾼 것이다. 17편 제목 「가족에 의한 가족」도 같은 문형이다.\n\n**소실 규모는 작중에서 언급되지 않는다.** 80~90%가 불탔다고 알려져 있으나, 대본은 \"그 날 이후로 헌법이 소실되는 바람에\"까지만 말한다.","parentId":"nous"},{"title":"카시마르","id":"kasimar","type":"개념","folder":"01_핵심 규칙","sortOrder":40,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["핵심 규칙","카시마르","몬스터"],"memo":"원문에 카시마르 단독 항목이 없어, 흩어진 서술을 모으고 작가 확인(2026-07-31)으로 채운 문서다. 발생 조건·반 카시마르화·등급 체계의 적용 범위·붕괴기 대응은 모두 작가 확인분. 미정: 대륙 표준 등급 체계, '연합 토벌'의 '연합'이 무엇인지.","image":"resource/wiki/카시마르.png","imageCaption":"카시마르의 외형","summary":[["한 줄 정의","[[노에시스]]가 고여서 썩은 곳에서 발생하는 존재"],["분포","[[그렌빌리아 대륙]] 전역"],["발생 조건","[[바다]] · 지층 등 노에시스가 축적된 곳"],["등급 체계","[[신성제국]] 내부 척도 (12등급 언급). 대륙 표준은 미정"],["변종","반 카시마르 — 물속 장기 노출로 반쯤 변한 사람"],["격퇴 수단","노에시스"],["붕괴 이후 대응","통일된 주체 없음. 각자도생"]],"content":"# 카시마르\n\n```틀\n핵심 개념\n```\n\n[[노에시스]]가 고여서 썩은 곳에서 발생하는 존재. [[그렌빌리아 대륙]] 전역에 퍼져 있으며, 이 대륙의 몬스터에 해당한다.\n\n## 발생 조건\n\n카시마르는 노에시스가 **고여서 썩은** 곳에서 나온다.\n\n노에시스는 사람의 사고 행위에서 분비되지만, 사람이 자연적으로 발생시키는 양보다 [[바다]]나 지층에 녹아 있는 양이 압도적으로 많다. 그래서 카시마르는 사람이 밀집한 곳이 아니라, **노에시스가 따로 축적된 곳**에서 주로 발생한다. 바다와 깊은 지층, 광맥이 그런 자리다.\n\n## 반 카시마르\n\n원래 사람이었으나 **물속에서 엄청난 농도의 노에시스에 오랜 기간 노출되어 반쯤 카시마르가 된** 존재가 있다.\n\n[[바다]]의 노에시스는 3분만 노출되어도 정상적인 거동이 불가능할 정도인데, 그것을 오랜 기간 견딘 경우다. 사람의 모습을 유지하고 말과 계략도 가능하다.\n\n## 등급 체계\n\n카시마르에는 등급이 매겨진다. 숫자가 클수록 큰 규모다.\n\n단, 이 체계는 **[[신성제국]] 안에서만 통용되는 것**이다. 대륙 표준 등급 체계는 아직 없다.\n\n## 역사\n\n- 고대에는 노에시스와 카시마르 양쪽에 대한 이해가 매우 부족했기에, 당시 사람들은 이들을 단순히 '괴물 아니면 악마'로 규정했다.\n- [[대악몽]]은 카시마르가 대규모로 발생한 사건이다. 이 사건으로 고대 바실리아 공동체와 그 인접 국가들이 모조리 멸망했다.\n- 대악몽 이후 사람들은 드레드 분지를 멀리했고, 그 지역에 ‘드레드’(Dread)라는 이름을 붙여 가까이하지 못하게 했다.\n- 중세에 드레드 분지를 차지한 기사단이 잔존 개체 소탕에 나섰고, 이때 맺은 각 세력·기사단 간의 계약이 [[레콩키스타]]다. → [[신성제국]]\n- 신성제국에서는 '연합 토벌'이라는 정기적인 행사를 통해 카시마르를 토벌한다. 여기서 '연합'은 [[연합]](헬라스)이 아니라 일반 명사로, 신성제국 내 재단·학원들이 연합한다는 뜻이다.\n\n## 대응\n\n- **격퇴에는 노에시스를 쓴다.**\n- **위키 기준 현재**, 국가 체제가 무너진 이후로는 통일된 대응 주체가 없다. 각 세력이 카시마르 대응을 위해 **각자도생**하는 형태에 가깝다. 국지 세력이 난립하는 원인 중 하나다.\n\n## 관련 문서\n\n- [[노에시스]]\n- [[바다]]\n- [[대전쟁]]\n- [[대악몽]]\n- [[신성제국]]\n- [[레콩키스타]]\n- [[신물질]]\n\n## 여담\n\n**이 문서를 핵심 규칙에 둔 이유.** [[노에시스]]에서 직접 파생되는 존재이고 대륙 전역에 걸쳐 있어서, 특정 국가 문서 밑에 두면 신성제국 소속처럼 보인다. 국가사에서 카시마르가 등장하는 자리는 각 국가 문서에서 이 문서로 링크만 걸 예정이다.\n\n**두 규칙이 하나로 이어진다.** [[대전쟁]]으로 바다에 노에시스가 대량 녹아들었고, 고인 노에시스는 썩어 카시마르가 되고, 그 물에 오래 잠긴 사람은 반 카시마르가 된다. 바다가 단순한 장애물이 아니라 이 세계의 몬스터 발생원이다.\n\n**남은 미정.** 대륙 표준 등급 체계. 현재 있는 것은 신성제국 내부 척도뿐이다.","parentId":"core-concepts"},{"title":"폭발과 연소","id":"combustion","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","화약","기술 규칙"],"memo":"원문 §핵심 개념에는 없던 문서. 2026-07-31 정합성 점검에서 확정한 화약 판정 기준을 한 자리에 모은 것이다. 판정표와 '기술의 기준' 6개 문장은 점검 메모 §2·§3·§5에서 왔고 작가 승인을 받았다. 휴대 병기 계보는 작가 확인(올림피아드가 화포 소형화에 성공, 그것이 감독관의 무장)에 따른 것.","image":"resource/wiki/폭발과 연소.png","imageCaption":"화포의 노에시스 필터 구조","summary":[["한 줄 정의","[[노에시스]]가 무엇을 막고 무엇을 허용하는가에 대한 판정 기준"],["억제 기준","반응이 스스로를 증폭시키는가"],["가능","지속 연소 · 보일러 · 제철 · 전기 발전"],["제한적 가능","흑색화약의 느린 폭연 · 대형 화포"],["불가능","무연화약 · 고폭약 · 내연기관"],["휴대 화기","존재하지 않음. 예외는 [[올림피아드]]의 핸드캐논"]],"content":"# 폭발과 연소\n\n[[노에시스]]가 무엇을 막고 무엇을 허용하는지에 대한 판정 기준. 이 세계의 기술 수준은 거의 전부 이 문서에서 파생된다.\n\n## 기본 규칙\n\n일반적인 화염과 지속 연소는 가능하지만, 압력과 반응 속도가 서로를 증폭시키는 급격한 반응은 비활성 [[노에시스]]의 간섭을 받는다. 비활성 노에시스는 짧은 시간 안에 스스로 가속되는 발열 반응의 전파면을 붕괴시킨다.\n\n즉 억제의 기준은 '연소인가 아닌가'가 아니라 **반응이 스스로를 증폭시키는가**이다.\n\n## 판정표\n\n| 기술 | 가능 여부 | 비고 |\n|---|---|---|\n| 장작·석탄·코크스의 지속 연소 | 가능 | 지속 연소 |\n| 용광로·보일러 | 가능 | 외연기관 |\n| 제철·압연·증기 해머 | 가능 | 폭발이 아니라 열과 기계력을 쓴다 |\n| 전기 발전 | 가능 | |\n| 흑색화약의 느린 폭연 | 약하게 가능 | 표면연소 |\n| 굵은 약립의 대형 화포 | 조건부 가능 | 필터와 긴 포신이 필요 |\n| 무연화약의 빠른 고압 연소 | 거의 불가능 | 반응 전파가 붕괴 |\n| 니트로글리세린·다이너마이트·고폭약 | 불가능 | 폭굉 전파 붕괴 |\n| 내연기관 | 극도로 불안정 | 반복 점화가 유지되지 않는다 |\n\n## 화약 병기의 계보\n\n1. **일반 휴대용 총기** — 존재하지 않는다.\n2. **대형 화포** — '노에시스 필터'를 달아 약실 안에서만 노에시스를 걸러내는 방식. [[연합]]이 전 대륙 최초로 공개했다. 굵은 약립은 표면적이 작아 노에시스와 접촉하는 면적도 줄어들기 때문에, 연소는 느리지만 억제당하는 속도 역시 느리다. 그래서 긴 포신과 큰 약실을 가진 화포에서만 실용적인 압력을 만들 수 있고, 시제품이 사람 두세 명 크기가 되는 이유도 여기에 있다.\n3. **핸드캐논** — [[올림피아드]] 수준에서 화포의 소형화에 성공한 것. 사실상 한 사람이 들고 겨눌 수 있는 화약 병기이며, [[감독관]]의 무장에 포함된다. 대륙에서 이것을 본 사람은 극소수다.\n\n## 기술의 기준\n\n향후 기술·병기 설정을 판정할 때의 기준 문장.\n\n1. 노에시스는 공기를 대체하는 기체가 아니라, 대기와 중첩된 준물질이다.\n2. 노에시스는 일반적인 화염을 끄지 않고, 빠르게 자기증폭하는 발열 반응과 압력 전파를 억제한다.\n3. 흑색화약은 느린 표면연소 덕분에 제한적으로 작동하지만, 무연화약과 고폭약은 반응 전파가 붕괴한다.\n4. 밀폐·정화된 약실에서는 화약의 성능을 회복할 수 있지만, 필터의 부피와 냉각·재정화 시간 때문에 소형화와 연사가 어렵다.\n5. 증기기관, 용광로, 전기 발전과 금속 대량생산은 가능하지만, 내연기관과 고폭약은 실용성이 없다.\n6. 노에시스를 우회하는 기술은 존재하지만, [[연합]]의 독점과 국제조약, 희귀 소재 때문에 대량 보급되지 않는다.\n\n## 여담\n\n**이 세계는 '흑색화약 시대에 멈춘 세계'가 아니다.** 폭발화학만 흑색화약 부근에서 막히고, 증기·전기·재료공학·행정은 근현대까지 뻗었다. 대륙 규모 철도망, 제철소, 컨테이너선, 비행선이 존재하는 것과 모순되지 않는다. \"금속 대량생산이 존재하지 않는다\"는 구 설정은 폐기됐다.\n\n**폐기·보류 항목.**\n- 폐기: `금속 대량생산이 존재하지 않음` — 위와 같은 이유.\n- 폐기: `활과 석궁은 총보다 불편하므로 거의 사용하지 않음` — 휴대용 총기가 없는 세계에서 석궁이 사라질 이유가 없다. 오히려 보병 원거리 무기의 표준이 될 쪽이다. 대체 무기(강철 활대 석궁, 레버식 연발 석궁, 압축공기총, 증기 공성포, 고정식 방전 병기)에 각각 결함을 부여하는 방향이 남아 있다. 아직 안 씀.\n- 보류: 원자력이 불가능한 이유. 핵분열은 화학적 연소가 아니므로 위 규칙으로는 막히지 않는다. '아직 발견하지 못했다'로 두는 쪽과 '노에시스가 자유 중성자에도 간섭한다'는 성질을 추가하는 쪽 중 미결.\n\n**화약 입도는 설정을 고치기로 확정**. 옛 설정은 \"화약의 분말이 굵을수록 더 강력한 폭발력을 가진다\"였는데 현실의 입도 원리와 반대였다. 위 「화약 병기의 계보」 2항이 고친 판이다 — 굵은 약립은 표면적이 작아 노에시스와 접촉하는 면적도 줄어들므로, 연소는 느리지만 억제당하는 속도 역시 느리다.\n\n**작품 어디에도 나오지 않는다.** 설정 원고 3,271줄, 대본 22편, 추출 텍스트 470페이지를 통틀어 `권총` `소총` `머스킷` `볼트액션` `리볼버` `라이플` `산탄` `총기` `방아쇠` `탄환` `총구` `총알` `장전` `탄약` `사격` `저격`은 전부 0건이다. 유일한 휴대 화기는 [18편. 가족, 가족과….md:176](../../script/가문과%20가족%202부/18편.%20가족,%20가족과….md:176)의 타게니아 대사 한 줄이다. 정리 문서 44행에 링크된 Google Docs 「세계관 초안」은 확인하지 못했다.","parentId":"noesis"},{"title":"핵심 개념","id":"core-concepts","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["핵심 규칙"],"memo":"원문(세계관 정리.md 46~52행)의 두 원칙 문장을 그대로 옮김. 하위 6항목은 원문 순서대로.","image":"","imageCaption":"","summary":[["성격","이 세계의 규칙을 적는 자리"],["원칙","반드시 '진실'만 작성한다"],["하위 항목","7밋"],["심화 미작성","[[노에마]] · [[노모스]] · [[누스]] — 작가 메모에 따름"]],"content":"# 핵심 개념\n\n```틀\n핵심 개념\n```\n\n**해당 페이지는 일종의 ‘규칙’을 써두는 공간으로, 반드시 ‘진실’만 작성되어 있음.**\n\n**메모) 노에마, 노모스, 누스 개념은 추후 실제 구현 과정에서 극적인 효과를 위해 설정이 변동될 수 있으므로, ‘심화’까지는 작성하지 않도록 함.**\n\n## 하위 문서\n\n- [[노에시스]] — 사고에서 분비되는 준물질. 이 세계와 현실의 근본적 차이\n  - [[폭발과 연소]] — 노에시스가 무엇을 막고 무엇을 허용하는가\n- [[노에마]] — 노에시스를 사용한 초자연적 행위의 총칭\n- [[노모스]] — 활성 노에시스만 존재하게 된 영역\n- [[누스]] — 사람 이외에 노에시스를 분비하는 물질\n- [[카시마르]] — 노에시스에서 발원한 존재\n- [[바다]] — 대륙을 갈라놓는 고농도 노에시스\n- [[바다 민족]] — 신대륙에 최초로 도달한 구대륙의 민족\n\n## 여담\n\n- 원문 §핵심 개념에는 노에시스·노에마·노모스·누스·바다·바다 민족 6항목만 있다. [[카시마르]]는 원고에서 §1 신성제국사에 흩어져 있던 것을, 그렌빌리아 대륙 전체에 퍼져 있는 존재라는 점에 따라 이 자리로 올렸다. 그래서 정사 등급이 다른 항목보다 낮다.\n- 위 '메모)' 원칙에 따라 [[노에마]] · [[노모스]] · [[누스]]에는 `심화` 절을 쓰지 않았다. [[노에시스]]에만 있다.","parentId":null},{"title":"건국의 아버지들","id":"founding-fathers","type":"세력","folder":"02_지역","sortOrder":50,"era":"근대","canon":"확정","status":"완료","tags":["연방","의회","해체","건국"],"memo":"원문 302~306행 문장 그대로. 작가 확인(2026-07-31)으로 두 가지가 확정됐다 — 이들은 연말 위기 쿠데타의 '대상'이었고 현재 완전히 와해되었으며, 서사 시점에 먼로가 헌병을 부리는 장면은 전부 과거 회상이다. 대본 용어사전은 이들을 현재 기능하는 기구처럼 적고 있는데, 사전이 스포일러를 피하는 서술 방침이므로 의도된 것으로 보고 손대지 않았다.","image":"resource/wiki/건국의 아버지들.png","imageCaption":"건국의 아버지들의 상징","summary":[["원어","Founding Fathers"],["출신","[[신성제국]]에서 이탈한 유력 귀족 가문"],["성격","최상위 의결 기구 — 만장일치, 법적 논의의 바깥"],["파벌","대부분 [[철도파]] 강경 계열"],["표어","여럿으로 이루어진 하나."],["알려진 인물","[[먼로]] · [[애덤스]]"],["현재","와해 — [[연말 위기]] 쿠데타의 대상"],["남긴 것","혈족에게 이어지는 [[헌병대]] 지휘권"]],"content":"# 건국의 아버지들\n\n**Founding Fathers**\n\n연방 건국의 주역이자, 과거 드레드노 제국의 유력한 귀족 가문. 소속된 의원 대부분이 철도파에 소속된 이들이었고, 철도 연합(유나이티드 레일로드)을 강경하게 추진하던 이들이었으나. ‘연말 위기’ 사건 이후 대부분의 인원을 잃고 의회에서 종적을 감추게 되었다.\n\n```표어\n여럿으로 이루어진 하나.\n```\n\n## 성격\n\n- **최상위 의결 기구.** 만장일치로 결정하며, 그 결정은 법적 논의의 바깥에 있다.\n- **[[신성제국]]에서 나왔다.** 드레드노 제국에서 이탈한 귀족 가문이 대륙 중부 소국들을 규합해 [[연방]]을 세웠다. 연방의 뿌리가 동부 열강에 있는 셈이다.\n- **철도 기술을 규합의 수단으로 썼다.** 대륙 중부 소국들의 철도 기술이 독보적이었고, 이들이 그것을 각 소국·대가문을 묶는 핵심 요소로 활용했다.\n- [[연합]]의 [[올림피아드]] 감독관들과 긴밀한 협력 관계를 맺고 있었다. 연방이 예상보다 강경해지자 연합은 이들을 통한 영향력 확대를 포기하고 반 연방 세력을 형성했다.\n\n## 와해\n\n[[연말 위기]] 당시 [[통일파]] 쿠데타의 **대상**이었다. [[철도파]] 강경 계열로서 전쟁을 강행하려 했고, 철도파 의원들과 함께 화재로 대부분 사망했다. 쿠데타가 성공했으므로 현재는 완전히 와해된 상태다.\n\n이들의 와해가 남긴 것이 두 가지다. 연방을 통합할 최상위 권위가 사라졌고, [[연합]]과 연방을 잇던 창구가 끊겼다.\n\n## 혈족\n\n지휘 계통이 혈통을 따라 남아 있다. [[연방 헌법]]을 매개체로 하는 [[헌병대]]는 건국의 아버지들의 혈족에게 반응하므로, [[애덤스]]의 딸인 [[세라]]가 민간인 신분으로 헌병을 부릴 수 있다.\n\n## 이름\n\n**Founding Fathers** — 미국 건국자들을 부르는 말을 그대로 가져왔다.\n\n이 세력과 그 직속 무력의 인물 이름이 모두 같은 계열이다.\n\n| 인물 | 실제 |\n|---|---|\n| [[먼로]] | James Monroe · 미국 5대 대통령 |\n| [[애덤스]] | John Adams · 2대 대통령 |\n| 벤자민 | Benjamin Franklin |\n\n벤자민은 [[헌병대]] 소속이며, 대본 전체에서 헌병이 이름으로 불리는 유일한 자리다(18편). **이 기구와 이 기구가 부리는 무력의 이름이 같은 우물에서 나온다**는 뜻이고, 헌병의 지휘권이 혈족을 따른다는 설정과도 겹친다.\n\n## 알려진 인물\n\n- [[먼로]] — 지도자\n- [[애덤스]] — 지도자. [[세라]]의 아버지\n\n## 관련 문서\n\n- [[연방]]\n- [[연말 위기]]\n- [[철도파]] · [[통일파]]\n- [[연방 헌법]] · [[헌병대]]\n- [[신성제국]] · [[올림피아드]]\n\n## 여담\n\n**오해하기 쉬운 자리다.** 대본 [[인물관계도]]에 \"앤드루 - 먼로 | ?무슨 사이 | 용병을 부려 연방 전역의 지하를 파헤치고도, 국가로부터 아무런 제지를 받지 않는다\"가 있어, 먼로가 서사 시점에 실권을 쥔 것으로 읽었다. 그러나 **서사 시점에 먼로가 나오는 장면은 전부 과거 회상**이다. 그 관계의 라벨이 '?무슨 사이'인 것은 아직 밝혀지지 않은 관계라는 표시이므로, 앤드루가 제지받지 않는 이유는 별개의 미공개 사안으로 남는다.\n\n**건국의 아버지들이 신성제국 출신이라는 점이 크다.** [[연방]]과 [[신성제국]]은 서사에서 강과 산맥으로 갈려 거의 접점이 없는데, 연방의 창건자들이 그쪽에서 이탈한 귀족이다. 두 국가 사이에 아직 쓰이지 않은 실이 하나 있는 셈이다.","parentId":"federation"},{"title":"경찰청","id":"police","type":"세력","folder":"02_지역","sortOrder":80,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","치안","무력"],"memo":"원문 319~320행 문장 그대로.","image":"resource/wiki/경찰청.png","imageCaption":"파출소 풍경","summary":[["소속","[[의회]] 산하"],["성격","연방의 중앙 치안조직"],["설치 단위","각 주마다 관할 경찰청"],["두 갈래","직속 경찰 (경찰서) / 허가 경찰 (파출소)"],["비중","파출소의 수가 압도적으로 많다"],["확대 계기","[[연말 위기]] 비무장화로 인한 치안 공백"],["마찰","[[보안관]]과의 관할 분쟁"],["정치적 통로","[[통합파]]"]],"content":"# 경찰청 🗡️\n\n연방 의회 산하의 치안조직. 각 주마다 관할 경찰청을 두는 형태로 운영되고 있으며, 경찰청에 직접 소속된 직속 경찰과, 경찰청의 허가만 받고 개별적으로 치안 활동을 유지하는 ‘경찰대’가 별도로 존재한다. 이들의 기반이 ‘경찰서’인지, ‘파출소’인지에 따라 소속 경찰과 허가 경찰을 구분할 수 있으며, 파출소의 수가 압도적으로 많다.\n\n## 두 종류의 경찰\n\n| | 기반 | 소속 | 수 |\n|---|---|---|---|\n| 직속 경찰 | 경찰서 | 경찰청 직속 | 적다 |\n| 허가 경찰 (경찰대) | 파출소 | 허가만 받은 개별 조직 | 압도적으로 많다 |\n\n허가 경찰은 경찰청의 허가만 받고 개별적으로 치안 활동을 유지하므로, 경찰대에 따라 [[보안관]]과 협력하는 경우도 다수 제보된다.\n\n## 0호 비상사태\n\n경찰 인력을 즉시 투입해야 하는 최고 등급의 비상 지령이다. 지령문은 이렇게 내려온다.\n\n```조문\n[‘0호 비상사태’ 발생. 해당 메시지를 수신하는 즉시, 연방 의회로 경찰 인력을 투입할 것.]\n— 0호 비상사태 지령문, 12편\n```\n\n12편에서 이 지령이 **조작되어** 발신되고, 경찰청 전체가 흔들린다. 전임 청장의 이름으로 내려온 지령이라 현직 청장도 즉시 부정하지 못한다는 점이 문제의 핵심이다.\n\n## 무장 문제\n\n비무장국가의 치안조직이므로 무엇을 들 수 있는지가 계속 쟁점이 된다.\n\n- 9편 — 동방주에서 심야 조례를 앞세운 경찰 **무장해제**가 [[보안관]]에 의해 현장 집행된다.\n- 13편 — \"동부 경찰청에서 ‘살상용 무기’를 무장하고 있다\"는 정보가 의회로 올라가, 무장해제 조례의 명분이 된다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[통합파]]\n- [[0호 비상사태]]\n- [[보안관]] — 관할을 다투는 상대\n- [[기동대]] — 인력을 제공하는 곳\n- [[헌병대]]\n- [[연말 위기]] — 확대의 계기\n\n## 여담\n\n**숫자로 메운 공백이다.** 비무장화로 정규군이 사라진 자리를 연방은 경찰대를 엄청나게 늘려 메웠다. 그 결과가 '파출소가 압도적으로 많은' 구조이고, 질이 아니라 양으로 버티는 치안이 된다.\n\n**허가 경찰이 회색지대다.** 허가만 받고 개별적으로 운영되므로 통제가 느슨하다. 그래서 [[보안관]]과 협력하기도 하고, 아예 외부 세력에게 통째로 장악되기도 한다. 9편에서 동방주의 한 경찰대가 \"저희 조직원들로 완전히 장악\"되었다는 보고가 나온다.\n\n**중앙 기구라는 점이 정치적으로 중요하다.** [[통합파]]가 [[철도청]]과 함께 경찰청을 힘의 통로로 쓴다. 반대편의 [[자치파]]는 [[대가문]]과 [[보안관]]을 쓴다. 현장의 관할 다툼이 곧 의회의 파벌 다툼이다.","parentId":"federation"},{"title":"그렌빌리아 대륙","id":"grenvillia","type":"지역","folder":"02_지역","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["대륙","Vol.1","신대륙"],"memo":"원문 §1 지역의 대륙 머리글(161~172행)은 작성 지침 두 줄뿐이어서, 이 문서의 개요는 §1 각 국가 항목과 §핵심 개념에서 확인된 사실을 모은 것이다. 하위 국가 문서는 아직 착수하지 않음.","image":"resource/wiki/그렌빌리아 대륙.png","imageCaption":"그렌빌리아 대륙 지도","summary":[["구분","신대륙"],["권","Vol.1"],["노에시스 포화도","70 — 대륙 중 최고"],["열강","[[연방]] · [[신성제국]] · [[연합]] · [[컴퍼니]]"],["중견국·약소국","8"],["정착 계보","동부 분지 바실리아 / 서부 반도 헬라스"],["특이사항","[[카시마르]]가 전역에 분포"],["기술 외형","스팀펑크 — [[올림피아드]]의 증기기관 전파"]],"content":"# 그렌빌리아 대륙\n\nVol.1의 무대. [[노에시스]] 포화도가 가장 높은 신대륙이다.\n\n## 대륙의 성격\n\n- **신대륙**이다. 구대륙인 [[판게아 대륙]]에서 [[바다 민족]]이 건너와 정착했고, [[대전쟁]]의 영향권 밖이었다.\n- 바다 민족은 두 갈래로 갈라져 정착했다. 동부 분지에 정착한 쪽이 바실리아 공동체 → 훗날의 [[신성제국]], 서부 반도에 정착한 쪽이 헬라스 공동체 → 훗날의 [[연합]]이다.\n- [[노에시스]] 포화도 **70**으로 대륙 중 가장 높다. 그래서 '폭발'이 거의 발생하지 않으며, 이 대륙의 기술 수준 전체가 그 제약에서 파생된다. → [[폭발과 연소]]\n- [[카시마르]]가 대륙 전역에 퍼져 있다.\n- 대륙 전체가 스팀펑크의 외형을 띠는 것은 [[연합]]의 [[올림피아드]]가 증기기관을 전 대륙에 전파했기 때문이다.\n\n## 이름\n\n**그렌빌**(Grenville) — 초대륙 로디니아를 만든 조산운동의 이름이다. [[세계관 대문]]의 방침 \"과거 존재했던 초대륙들을 하나씩 차용\"이 대륙 이름에 그대로 적용되어 있다.\n\n| 대륙 | 실제 |\n|---|---|\n| **[[판게아 대륙]]** | Pangaea. 가장 유명한 초대륙 — 유일한 구대륙이다 |\n| **[[로디니아 대륙]]** | Rodinia |\n| **[[판노티아 대륙]]** | Pannotia |\n| **그렌빌리아** | Grenville 조산운동 |\n\n넷 중 판게아만 구대륙이고 나머지가 신대륙인 것도, 판게아가 이름의 무게에서 가장 크다는 점과 맞는다. → [[대전쟁]]\n\n## 열강\n\n| 국가 | 위치 | 핵심 키워드 | 서사에서의 축 |\n|---|---|---|---|\n| [[연방]] | 대륙 중부 요충지 | 행정 · 철도 · 치안 | 대륙 서사의 핵심 축 |\n| [[신성제국]] | 대륙 동부 분지 | 교육 · 기사 · 선박 | [[노에시스]] 서사의 핵심 축 |\n| [[연합]] | 대륙 서부 반도 | 과학 · 기술 · 외교 | 대륙 발전 서사의 핵심 축 |\n| [[컴퍼니]] | 대륙 북부 | (미착수) | (미착수) |\n\n## 중견국 · 약소국\n\n[[카고르예 공화국]] · [[루블린 공국]] · [[오흐리드 왕국]] · [[칼리아리 왕국]] · [[팔레르 기사단국]] · [[헬베티 공국]] · [[바나토국]] · [[쾨벤하운 인민연합]]\n\n## 멸망한 국가\n\n[[크레스티아 제국]] — 구 패권국. [[연방]]과의 전쟁 중 내부 반란으로 해체되었고, 영토의 80%는 연방이, 20%는 [[컴퍼니]]가 차지했다.\n\n## 여담\n\n**이 폴더의 문서 규칙.** 원고 §1 지역의 머리글(161~172행)에 적혀 있다.\n\n- 문서 제목은 고유 명칭을 제외한 **'체제'만** 쓴다. 그래서 제목이 `연방`이고 '미트로프'는 본문 부제로 간다.\n- 국가 문서에는 **'짤막한 역사'와 '이해집단'**만 쓴다.\n- 이해집단은 **그 국가에 직접 속해 있고 영향력을 행사할 수 있는 세력만** 적는다. 그렇지 않은 세력은 `03_세력` 폴더로 따로 분류한다.\n\n**시점이 섞이는 자리.** 위 「중견국 · 약소국」의 [[쾨벤하운 인민연합]]은 서사 시점에는 존재하지 않는다. 서사 시점 중에 [[연방]] 북방주에서 독립해 신생국이 되는 것이므로, 이 목록은 위키 기준 현재의 지도다. 국가 문서를 쓸 때 각각의 `시대` 값을 따로 봐야 한다.\n\n**아직 안 읽은 구간.** [[컴퍼니]](원문 689~836행), 중견국 8개국(836~1037행), [[크레스티아 제국]](1037~1094행)은 아직 읽지 않았다. 위 표와 목록의 이름은 목차에서 딴 것이므로, 각 문서를 쓸 때 내용을 확인해야 한다.","parentId":null},{"title":"기동대","id":"mobile-corps","type":"세력","folder":"02_지역","sortOrder":110,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","철도","무력","치안"],"memo":"원문 329~330행 문장 그대로. 대본 용어사전은 기동대를 '철도청 국내지부의 무력 조직'이라 적는데, 원문은 인력 조달 구조까지 설명한다. 모순이 아니라 보완 관계로 보아 둘 다 반영했다.","image":"resource/wiki/기동대.png","imageCaption":"기동대의 열차 작전","summary":[["소속","[[철도청]] 산하"],["성격","철도 수비를 위한 치안조직"],["주 소속","국내지부"],["인력 조달","[[경찰청]]과 [[보안관]]에게 제공받는다"],["조달 이유","철도청의 중립성과 힘의 균형 유지"],["특화","철도를 중심으로 수행하는 작전"],["평가","연방 내 어떤 무장조직보다 유연하고 기동성이 뛰어나다"]],"content":"# 기동대 🗡️\n\n철도청 산하의 치안조직. 철도 수비를 위한 조직으로, 철도청의 중립성과 힘의 균형을 유지하기 위해 경찰청과 보안관에게 인력을 제공받아 유지되는 무력조직이다. 철도를 중심으로 수행하는 작전에 특화되어 있어, 연방 내 어떤 무장조직보다 유연하고, 뛰어난 기동성을 자랑하기도한다.\n\n## 기록이 남는다\n\n기동대를 움직이면 **반드시 기록이 남는다.** 2편에서 [[네빌]]이 외부 업체 대신 기동대를 쓰자고 제안하자 [[앤드루]]가 거절하는 근거가 이것이다.\n\n```대사\n[기동대]를 움직이면 반드시 기록이 남잖나, 이런 일에는 적합하지 않아.\n— 앤드루, 2편\n```\n\n기록에 남기고 싶지 않은 일에는 대신 [[하노버 용병단]] 같은 외부 세력을 쓴다. 연방에서 가장 빠른 무력을 손에 쥐고도 굳이 용병을 사는 이유가 여기 있다.\n\n## 관련 문서\n\n- [[연방]] · [[철도청]]\n- [[하노버 용병단]] — 기록을 남기지 않으려 할 때의 대체 수단\n- [[경찰청]] · [[보안관]] — 인력을 제공하는 두 조직\n- [[헌병대]]\n- [[잭슨의 형제단]] — 열차를 노리는 상대\n\n## 여담\n\n**인력 조달 방식이 이 조직의 성격이다.** [[경찰청]](중앙)과 [[보안관]](대가문) 양쪽에서 사람을 받는다. 어느 한쪽에 기울지 않게 만든 장치이고, 그래서 [[철도청]]이 '중립'을 주장할 수 있다. 반대로 말하면 기동대 안에 이미 두 진영의 사람이 섞여 있다는 뜻이기도 하다.\n\n**연방에서 가장 빨리 움직이는 무력이다.** [[헌병대]]는 법적 절차 때문에 사실상 움직이지 못하고, 경찰은 관할에 묶이고, 보안관은 지역에 묶인다. 기동대만 철도를 타고 전국을 오갈 수 있다. 비무장국가에서 가장 실용적인 무력이 철도 부처 산하에 있다는 구조다.\n\n**열차 강도와 짝을 이룬다.** [[잭슨의 형제단]]이 열차만 노리므로, 기동대의 상대는 사실상 이들이다.","parentId":"federation"},{"title":"대가문","id":"great-houses","type":"세력","folder":"02_지역","sortOrder":60,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","대가문","기성 권력"],"memo":"원문 308~312행 문장 그대로. 작가 확인(2026-07-31)으로 북부 대가문의 계보가 정리됐다 — 쾨벤하운 시절의 귀족이 아니라 중부에서 옮겨간 가문이다. 대본 18편 55행에서 6개 가문의 이름을 확인했고, 그 여섯이 독립 가담 가문이다(작가 확인). 남은 7개는 미정.","image":"resource/wiki/대가문.png","imageCaption":"대가문의 문장","summary":[["소속","[[연방]]"],["성격","기성 권력층"],["기원","대륙 중부의 소국들과 귀족 공동체"],["가문 수","13개 — 이름 확인은 6개"],["북부 3가문","[[스프링필드]] · [[콩코드]] · [[하트퍼드]]"],["그 외 확인된 가문","[[도버]] · [[윌밍턴]] · [[밀퍼드]]"],["의회 진출","대부분 [[자치파]]"],["산하 무력","[[보안관]]"],["가문 간 관계","천차만별"],["표어","품위, 엄숙함, 교양"]],"content":"# 대가문\n\n```틀\n연방\n```\n\n기존 대륙 중부에 위치해있던 소국들과 귀족 공동체들로 구성된 기성 권력층. 대부분 ‘자치파 의원’으로 의회에 진출해있으나, 의회에서 활동하지 않는 대가문 유력자들도 상당수 존재한다. 13개의 대가문이 존재하며, 각 대가문들끼리의 관계도 천차만별인 점이 특징이다.\n\n```표어\n품위, 엄숙함, 교양\n```\n\n## 알려진 가문\n\n13개 중 6개의 이름이 확인된다. 18편에서 [[데이비스]]가 독립 선언문을 읽으며 여섯 가문을 한 줄로 부르는데, 이 여섯이 곧 **독립에 가담한 가문들**이다.\n\n```대사\n콩코드, 하트퍼드, [스프링필드]! 그리고 도버, 윌밍턴, 밀퍼드 가문의 인민들은!!\n— 데이비스, 18편 독립 선언\n```\n\n- **북부 3가문** — [[스프링필드]] · [[콩코드]] · [[하트퍼드]]. 북부 지역의 실질적인 지배세력이다.\n- **그 외** — [[도버]] · [[윌밍턴]] · [[밀퍼드]]\n\n나머지 7개 가문은 이름이 정해지지 않았고, 독립에 가담하지 않은 쪽이다.\n\n## 이름\n\n확인된 여섯 가문이 모두 **미국 동부의 실재 도시**이며, 그중 넷이 주도(州都)다.\n\n| 가문 | 실제 |\n|---|---|\n| [[스프링필드]] | Springfield · 일리노이 주도 |\n| [[콩코드]] | Concord · 뉴햄프셔 주도 |\n| [[하트퍼드]] | Hartford · 코네티컷 주도 |\n| [[도버]] | Dover · 델라웨어 주도 |\n| [[윌밍턴]] | Wilmington · 델라웨어 |\n| [[밀퍼드]] | Milford · 코네티컷 · 델라웨어 |\n\n**주도 이름이 많은 것이 이 세력의 성격과 맞는다.** 원래 소국이었다가 '주'로 편입된 집단이기 때문이다. 미정인 7개 가문의 이름을 지을 때 이 계열을 이어가면 된다.\n\n## 북부 대가문의 계보\n\n북방주는 [[연방]]이 병합한 쾨벤하운 왕국의 땅이지만, 그곳의 대가문은 쾨벤하운 시절의 귀족이 아니다. **중부에서 옮겨간 가문들**이다. 서부개척시대에 서부로 건너간 이들과 비슷한 위치라고 보면 된다.\n\n병합 당시 쾨벤하운 왕가는 명목상 연방의 ‘대가문’으로 위치할 수 있었으나 얼마 지나지 않아 모두 종적을 감추었고, 남은 쾨벤하운 귀족들은 종적을 감추거나 일반적인 연방 국민으로 살아간다.\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]] · [[자치파]]\n- [[보안관]] — 대가문 산하의 치안조직\n- [[명백한 운명]] — 내전에서 분쇄된 대가문들의 잔존 세력\n\n## 여담\n\n**연방 안의 또 하나의 국가들이다.** 원래 소국이었던 집단이 '주'로 편입되면서 자치권과 각자의 철도 체계를 인정받았다. 그래서 대가문은 자기 영지에 자기 철도와 자기 무력([[보안관]])을 가진다. [[연방]]이 궤간을 통일하지 못하는 이유도, [[경찰청]]과 [[보안관]]이 관할을 다투는 이유도 여기서 나온다.\n\n**의회 밖의 유력자가 중요하다.** \"의회에서 활동하지 않는 대가문 유력자들도 상당수 존재한다\"는 한 줄이 서사에서 큰 자리를 차지한다. 가주와 보안관은 의원이 아니면서 지역을 실질적으로 지배한다.\n\n**미정 7개.** 확인된 여섯 이름(스프링필드 · 콩코드 · 하트퍼드 · 도버 · 윌밍턴 · 밀퍼드)이 모두 미국 동부의 실재 도시명 계열이다. 나머지를 지을 때 참고할 수 있다.\n\n**13개 가문이 6 대 7로 갈렸다**. 독립 선언에서 불린 여섯이 가담한 쪽이고, 남은 일곱이 연방에 남은 쪽이다. 이름이 확인된 가문이 전부 독립파라는 뜻이며, 뒤집어 말하면 **연방에 남은 일곱 가문은 아직 아무 이름도 없다.** [[미트로프 내전]]에서 독립파가 분쇄되므로, 그 뒤 연방의 대가문 층은 이 일곱만 남는다. 이름을 지을 때 그쪽이 더 중요할 수 있다.\n\n**도버는 보안관 이름으로도 확인된다.** 9편에서 [[필립]]이 \"나 민원인 아니고 도버 가 보안관이요\"라 말하며 동방주 경찰 무장해제를 집행한다. 즉 도버는 동방주 쪽 가문으로 보인다.","parentId":"federation"},{"title":"명백한 운명","id":"manifest-destiny","type":"세력","folder":"02_지역","sortOrder":200,"era":"현대(붕괴 이후)","canon":"확정","status":"작성 중","tags":["연방","음지","테러조직","붕괴 이후"],"memo":"원문 338~343행 문장 그대로. 작가 확인(2026-07-31)으로 시점이 정해졌다 — 미트로프 내전은 《가문과 가족》 후반부의 무력 충돌이고, 이 조직은 그 이후에 결성된다. 8편에서 데이비스가 쓰는 '명백한 운명'은 조직명이 아니라 관용구이며, 그를 잇겠다는 자들이 뒤에 그 말을 상징으로 채택한 것이다.","image":"resource/wiki/명백한 운명.png","imageCaption":"명백한 운명의 표식","summary":[["원어","Manifest Destiny"],["성격","거대한 테러조직"],["결성 계기","[[미트로프 내전]]에서 독립파 대가문들이 분쇄된 뒤"],["구성","잔존 세력"],["전력의 축","독립파에 가담했던 [[헌병대]] · [[보안관]]"],["목표","'연방의 붕괴' — 대가문과 연방 구성세력의 독립"],["동기","내전 패배에 대한 보복심리"],["세력 확장","사설 철도를 북부 [[컴퍼니]]로 확장"],["이름의 유래","[[데이비스]]의 말을 상징으로 채택"]],"content":"# 명백한 운명 🗡️\n\n**Manifest Destiny**\n\n‘미트로프 내전’으로 독립파에 가담한 대가문들이 분쇄된 이후, 그 잔존 세력들이 뭉쳐서 형성된 거대한 테러조직.\n\n내전에서 패배하게 되며 연방측을 향한 보복심리를 드러내며, 대가문들과 연방 구성세력들의 독립. 즉 ‘연방의 붕괴’를 ‘명백한 운명’으로 규정하며 최종적인 목표로 삼아 활동하고 있다.\n\n주로 독립파에 가담했던 헌병, 보안관을 중심으로 전력이 형성되어 있으며. 연방의 행정력이 크게 약화된 틈을 타 사설 철도를 북부 컴퍼니로 지속적으로 확장해나가며 세를 불리고 있다.\n\n## 이름\n\n**Manifest Destiny** — 19세기 미국의 팽창주의 표어를 그대로 가져왔다. 본래 \"미국이 대륙 전체로 뻗어나가는 것은 명백히 정해진 운명이다\"라는 뜻이었다.\n\n작품에서는 **뜻이 뒤집혀 쓰인다.** 팽창이 아니라 **해체**가 명백한 운명이라는 것이다 — [[대가문]]과 연방 구성세력의 독립, 즉 연방의 붕괴가 정해진 결말이라는 주장이다. [[연방]]의 다른 이름들(Founding Fathers, 미국 동부 도시명)이 건국 쪽에서 왔는데, 이 조직만 같은 우물에서 해체의 명분을 퍼올린다.\n\n조직명이 [[데이비스]]가 쓴 말에서 온 것도 같은 구조다. 서사 안에서 그 표현은 그저 관용구였고, 그가 조직을 만든 것도 아니다. 뒤에 그를 잇겠다고 하는 자들이 상징으로 채택했다.\n\n## 관련 문서\n\n- [[연방]] — 붕괴시키려는 대상\n- [[미트로프 내전]] — 결성의 계기\n- [[데이비스]] · [[자치파]] · [[북부동맹]] — 계보상의 앞자리\n- [[헌병대]] · [[보안관]] — 전력의 출처\n- [[컴퍼니]] — 사설 철도를 뻗는 방향\n- [[잭슨의 형제단]] — 자주 충돌하는 상대\n\n## 여담\n\n**시대가 '현대(붕괴 이후)'인 이유.** 결성 계기인 [[미트로프 내전]]이 《가문과 가족》 후반부이고, 조직 설명이 \"연방의 행정력이 크게 약화된 틈을 타\"를 전제한다. [[연방]] 문서 본체가 서사 시점인 것과 달리 이 문서만 시대가 뒤로 밀리는 이유다.\n\n**독립파의 무력이 그대로 넘어왔다.** 전력의 축이 [[헌병대]]와 [[보안관]]이다. 보안관은 대가문에 직접 소속된 무력이니 대가문이 등지면 함께 등지고, 헌병은 연방의 유일한 초자연 전력이다. 즉 연방을 지키던 두 무력이 연방을 무너뜨리는 쪽에 서 있다.\n\n**연방의 방식으로 연방을 무너뜨린다.** 목표는 연방의 붕괴인데 수단이 철도다. 사설 철도를 북부 [[컴퍼니]]로 뻗어 세를 불리는 방식은, [[건국의 아버지들]]이 철도로 소국들을 규합해 연방을 만든 것과 정확히 같은 수순이다.","parentId":"federation"},{"title":"보안관","id":"sheriffs","type":"세력","folder":"02_지역","sortOrder":90,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","치안","무력","대가문"],"memo":"원문 322~323행 문장 그대로.","image":"resource/wiki/보안관.png","imageCaption":"보안관의 복장과 표식","summary":[["소속","[[대가문]] 산하"],["성격","지역 치안조직"],["운영 형태","지역별로 소수가 활동"],["소속 관계","각 대가문에 직접 소속된 경우만 존재"],["마찰","[[경찰청]]과의 치안 관할 분쟁"],["협력","허가 경찰(경찰대)과 협력하는 사례 다수"],["정치적 통로","[[자치파]]"]],"content":"# 보안관 🗡️\n\n대가문 산하의 치안조직. 지역별로 소수의 보안관이 활동하는 형태로 운영되고 있으며, 경찰과 달리 각 대가문들에 직접 소속되어 있는 경우만 존재한다. 경찰들과의 치안 관할 분쟁으로 자주 충돌하는 편이지만, ‘허가 경찰’의 경우 경찰대에 따라 보안관과 협력하는 경우도 다수 제보되고 있는 편이다.\n\n## 관할 다툼의 실제\n\n9편에서 [[도버]] 가의 보안관 [[필립]]이 심야 조례를 앞세워 동방주 경찰의 무장해제를 현장에서 집행한다. 경찰이 법적 관할을 따지자 보안관의 대답은 이랬다.\n\n```대사\n관할이고 뭐고.\n— 필립, 9편\n```\n\n법조문보다 그 땅을 실제로 쥔 쪽이 앞선다는 태도이며, 이 편의 다른 장면에서는 \"여기서는 법보다 더 가까운 게 있는 거야\"라는 말도 나온다. 관할 분쟁이 법리 문제가 아니라 실효 지배 문제라는 뜻이다.\n\n## 관련 문서\n\n- [[연방]] · [[대가문]] · [[자치파]]\n- [[필립]] · [[레밍턴]] — 대본에 등장하는 보안관\n- [[도버]] · [[스프링필드]]\n- [[경찰청]] — 관할을 다투는 상대\n- [[기동대]] — 인력을 제공하는 곳\n- [[명백한 운명]] — 독립파에 가담한 보안관들이 전력의 축을 이룬다\n\n## 여담\n\n**경찰과 정반대의 구조다.** [[경찰청]]이 파출소를 잔뜩 깔아 양으로 버티는 반면, 보안관은 지역별로 소수만 활동하고 전원이 대가문에 직접 소속된다. 허가 경찰 같은 회색지대가 없다. 그래서 개별 보안관의 위상과 역량이 경찰 한 명보다 훨씬 높다.\n\n**관할 다툼이 곧 국체 문제다.** 연방의 중앙 기구인 경찰과 대가문의 사병인 보안관이 같은 땅에서 치안을 다툰다. 어느 쪽이 그 지역을 실질적으로 지배하는지를 매번 현장에서 정하는 셈이고, 그것이 [[통합파]]와 [[자치파]]의 대립을 현장 층위에서 반복한다.\n\n**붕괴기의 전력이 된다.** [[명백한 운명]]이 독립파에 가담했던 헌병과 보안관을 중심으로 전력을 꾸린다. 대가문에 직접 소속된 무력이라, 대가문이 연방을 등지면 그대로 반연방 전력이 된다.","parentId":"federation"},{"title":"북방주","id":"north-state","type":"지역","folder":"02_지역","sortOrder":310,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","행정구역","북방주","쾨벤하운"],"memo":"원고에 지역 항목이 없어 대본과 배경 에셋에서 만든 문서다. 등록 배경에 '전쟁 중' 변형(북방주_골목_전쟁_중 · 북방주_대로변_전쟁_중)이 있어 미트로프 내전의 전장임을 확인했다. 북부 대가문이 중부에서 옮겨간 가문이라는 것은 작가 확인(2026-07-31).","image":"resource/wiki/북방주.png","imageCaption":"북방주 대로변","summary":[["소속","[[연방]]"],["본래","쾨벤하운 왕국 — [[연방]]이 병합해 본토로 편입"],["지배 세력","[[스프링필드]] · [[콩코드]] · [[하트퍼드]]"],["정치 기반","[[자치파]]"],["치안","[[보안관]]"],["등록 배경","9장 (전쟁 중 변형 2장 포함)"],["훗날","[[북부동맹]]으로 독립 선언 → [[미트로프 내전]]의 전장"]],"content":"# 북방주\n\n```틀\n연방\n```\n\n[[연방]]의 북부. 본래 **쾨벤하운 왕국**이었고, 연방이 병합해 본토로 편입한 땅이다. 북부 3[[대가문]]의 지배 아래 있다.\n\n## 병합의 흔적\n\n연방의 첫 정복지다. 철도를 통한 기동 작전으로 함락되고 통째로 병합되었으며, 왕국은 지도에서 사라졌다. 쾨벤하운 왕가는 명목상 연방의 [[대가문]]이 되었으나 얼마 지나지 않아 종적을 감추었다.\n\n그래서 지금 이 땅의 대가문은 **쾨벤하운 시절의 귀족이 아니다.** [[스프링필드]]·[[콩코드]]·[[하트퍼드]]는 중부에서 옮겨간 가문들이다. 서부개척시대에 서부로 건너간 이들과 비슷한 위치다. 남은 쾨벤하운 귀족들은 종적을 감추거나 평범한 연방 국민으로 살아간다.\n\n[[연말 위기]]의 최후통첩에는 \"과거 연방이 편입한 쾨벤하운 왕국을 독립시킬 것\"이 들어 있었다. 연방은 **완전한 비무장화**를 대가로 내주고 이 땅만은 지켰다.\n\n## 정치적 위치\n\n[[자치파]]의 지역 기반이다. [[대가문]]과 [[보안관]]이 실질적으로 지배하며, [[경찰청]]의 중앙 통제가 가장 약한 곳이다. 5편에서 \"북방주 관할의 경찰력은 모두 마비시켜두었어요\"라는 보고가 올라오는 것도 이 구조에서 가능하다.\n\n[[잭슨의 형제단]]이 원래부터 활동하던 곳이기도 하다. 연방 열차 강도 사건의 7할이 이 지역에서 나온다.\n\n## 장소\n\n| 장소 | 나오는 자리 |\n|---|---|\n| **[[스프링필드]] A 역 · H 역** | 1편의 도착지. [[네빌]]이 열두 번 환승해 닿는다 |\n| **[[스프링필드]] 저택** | 3편의 습격, 20편의 폐허. 길가·로비·복도 배경이 따로 등록되어 있다 |\n| **하트퍼드 저택** | 저택과 저택 앞 배경이 아침 시각으로 등록되어 있다 |\n| **매표소 · 술집 · 골목 · 대로변** | 지역의 일상 |\n\n## 전쟁\n\n등록된 배경에 **`북방주_골목_전쟁_중`과 `북방주_대로변_전쟁_중`**이 있다. [[스프링필드]] 저택 길가에도 전쟁 중 변형이 있다.\n\n즉 이 주는 [[미트로프 내전]]의 전장이 된다. [[북부동맹]]의 독립 선언에서 불린 여섯 가문 중 셋이 이곳의 가문이고, 내전에서 독립파가 분쇄된 뒤 그 잔존 세력이 [[명백한 운명]]이 된다.\n\n## 관련 문서\n\n- [[연방]] · [[대가문]] · [[보안관]] · [[자치파]]\n- [[스프링필드]] · [[콩코드]] · [[하트퍼드]]\n- [[북부동맹]] · [[미트로프 내전]] · [[명백한 운명]]\n- [[잭슨의 형제단]]\n- [[수도주]] — 대비되는 지역 기반\n\n## 여담\n\n**정복지가 독립의 진원이 된다.** 연방이 비무장화까지 감수하며 지킨 땅이, 결국 연방에서 떨어져 나가려는 쪽의 중심이 된다. 병합 과정에서 [[철도파]]가 \"본토로 편입해 빠르게 철도망을 개발해야 한다\"며 [[통일파]]의 준주·자치주 편입론을 눌렀는데, 소화되지 않은 채 편입된 결과가 여기서 돌아온다.\n\n**아직 모르는 것.** 쾨벤하운 왕가가 \"종적을 감추었다\"는 것의 실제 의미. 그리고 위키 기준 현재의 [[쾨벤하운 인민연합]]이 이 땅에서 어떻게 다시 국가가 되는지.","parentId":"federation"},{"title":"수도주","id":"capital-state","type":"지역","folder":"02_지역","sortOrder":300,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","행정구역","수도주"],"memo":"원고에 지역 항목이 없어 대본과 배경 에셋에서 만든 문서다. 이름은 대본을 따랐다 — 원고의 '중심주'가 아니라 '수도주'(대본 85건 : 원고 1건). 등록된 배경 에셋 12장으로 실제 등장 장소를 확인했다.","image":"resource/wiki/수도주.png","imageCaption":"수도주 의회 거리","summary":[["소속","[[연방]]"],["성격","연방의 수도주"],["있는 것","[[의회]] · [[경찰청]] · [[철도청]]"],["정치 기반","[[통합파]]"],["주요 장소","연방의회 건물 · 광장 · 의회 거리 · 의원실 · 중앙역"],["등록 배경","12장"]],"content":"# 수도주\n\n```틀\n연방\n```\n\n[[연방]]의 수도가 있는 주. **연방의 중앙 기구가 모두 이곳에 있다** — [[의회]], [[경찰청]], [[철도청]].\n\n## 정치적 위치\n\n[[통합파]]의 지역 기반이다. 통합파가 [[경찰청]]·[[철도청]]이라는 중앙 기구를 통해 힘을 쓰는 것도, 그 기구들이 여기 있기 때문이다. 반대편의 [[자치파]]는 [[북방주]]·동방주를 기반으로 [[대가문]]·[[보안관]]을 쓴다.\n\n즉 수도주는 **연방이라는 중앙 체제 그 자체가 서 있는 자리**다. 그래서 《가문과 가족》 2부에서 온 세력이 이곳으로 모이고, 의회 하나에서 판이 세 번 뒤집힌다.\n\n## 장소\n\n| 장소 | 나오는 자리 |\n|---|---|\n| **연방의회 건물** | [[의회]]의 본회의장. 군사 소집·정책 결정·법안 발의가 모두 여기서 결정된다. 11~18편의 무대 |\n| **광장** | [[헌병대]]가 나타나는 자리. 6편에서 [[세라]]가 헌병과 만난다 |\n| **의회 거리** | 아침·낮·저녁 세 시각의 배경이 따로 등록되어 있다. 의회 소집일의 흐름을 이 거리로 보여준다 |\n| **의원실** | 7편에서 [[잭]]이 텅 빈 사무실에서 발버둥을 결심하는 자리 |\n| **중앙역** | 수도주의 철도 관문 |\n| **골목 · 뒷골목 · 대로변** | 아침·낮·저녁 변형이 등록되어 있다 |\n\n## 광장의 이야기\n\n수도주에 사는 아이들 사이에는 이런 소문이 돈다.\n\n```대사\n매년 5월, 이맘때가 되면… 새벽의 광장에서 아주 무서운 일이 벌어진다고요.\n— 세라, 6편\n```\n\n[[헌병대]]가 나타나는 자리다. 연방에서 헌병을 실제로 본 사람이 거의 없다는 설정이, 이 도시에서는 괴담의 형태로 남아 있다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[경찰청]] · [[철도청]]\n- [[통합파]]\n- [[헌병대]]\n- [[북방주]] — 대비되는 지역 기반\n\n## 여담\n\n**이름이 두 개 있었다.** 원고는 `중심주`, 대본은 `수도주`로 쓴다. 대본이 85건, 원고가 1건이므로 대본을 따랐다. → [[위키 작성 규칙]]\n\n**아직 모르는 것.** 수도 도시의 이름. 주 이름만 나오고 도시명은 대본에 등장하지 않는다. [[대가문]]의 이름이 실재 미국 동부 도시명 계열인 것과 달리, 수도는 이름 없이 '수도주'로만 불린다.","parentId":"federation"},{"title":"스프링필드","id":"springfield","type":"세력","folder":"02_지역","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["대가문","스프링필드","북방주"],"memo":"원고에는 용어 설명 한 줄뿐이었고(13개 대가문 중 하나, 북부 3대가문), 나머지는 대본에서 만들었다. 대본 언급 239건으로 전 고유명사 중 최다. 근거: 1·3·4·5·8·20편, _인물관계.md, 배경 에셋.","image":"resource/wiki/스프링필드.png","imageCaption":"스프링필드 가의 문장","summary":[["소속","[[대가문]] — 13개 중 하나"],["지역","[[북방주]]"],["위치","북부 3대가문의 하나"],["가주","[[스프링필드 가주]]"],["보안관","[[레밍턴]]"],["가문 사람","[[코네트]] · [[네빌]](10년 전 떠났다)"],["대본 언급","239건 — 최다"],["독립 선언","가담"]],"content":"# 스프링필드\n\n[[북방주]]의 [[대가문]]. 13개 대가문 중 하나이며, [[콩코드]]·[[하트퍼드]]와 함께 북부 지역의 실질적인 지배세력이다.\n\n**《가문과 가족》에서 가장 많이 불리는 이름이다.** 대본에 239회 등장하며, 이 작품의 '가문'이라는 말이 사실상 이 가문을 가리킨다.\n\n## 이 가문에 모인 인물\n\n한 가문 안에 서사의 축이 거의 다 들어 있다.\n\n| 인물 | 위치 |\n|---|---|\n| [[스프링필드 가주]] | 가주. [[코네트]]가 '할아버지'라 부른다 |\n| [[레밍턴]] | 저택의 보안관. 아이를 지킨다 |\n| [[코네트]] | 가문의 아이. 20편의 주역 |\n| [[네빌]] | 10년 전 가문을 떠났다. 1부의 시선 |\n\n[[세라]]도 이 집에 걸려 있다 — [[코네트]]가 '세라 언니'라 부르며 위기에 먼저 연락한다.\n\n## 저택\n\n서사의 시작과 끝이 이 저택이다.\n\n- **3편** — [[하노버 용병단]]이 습격한다. [[에른스트]]가 보안관 [[레밍턴]]과 거래하며 \"땅속에서 무슨 소리가 들리든 눈감으라\" 요구한다\n- **4편** — 습격이 지나간 밤. 레밍턴이 술에 기대어 배후를 증언한다\n- **20편** — 폐허가 된 저택으로 일행이 돌아온다. [[코네트]]가 가문 열쇠를 내놓지 않는다\n\n배경 에셋에 저택의 **로비·복도·길가**가 각각 등록되어 있고, `수리중`(3편 습격 이후)과 `전쟁 중`([[미트로프 내전]]) 변형까지 있다. 같은 장소가 온전한 상태 → 수리 중 → 전장 → 폐허로 네 번 바뀐다.\n\n## 열쇠\n\n```대사\n할아버지가 절대… 절대 우리 가문 열쇠는 남들한테 주면 안된다고 했어요…\n— 코네트, 20편\n```\n\n[[코네트]]의 기호가 🗝️인 이유다. 가문이 무너진 뒤에도 아이가 열쇠를 쥐고 있다.\n\n## 관련 문서\n\n- [[대가문]] · [[북방주]] · [[보안관]]\n- [[스프링필드 가주]] · [[레밍턴]] · [[코네트]] · [[네빌]]\n- [[하노버 용병단]] · [[에른스트]]\n- [[북부동맹]] · [[미트로프 내전]]\n\n## 여담\n\n**작품 제목의 '가문'이 이 가문이다.** 《가문과 가족》에서 가문 쪽 무게를 스프링필드가 거의 혼자 진다. 반대편의 '가족'은 [[세라]]가 혈연 아닌 이들을 묶어 부르는 말이다. 두 낱말이 각각 한 집과 한 사람에게 대응한다.\n\n**지하가 이 저택 밑을 지난다.** 3편에서 [[에른스트]]가 요구한 것이 \"땅속에서 무슨 소리가 들리든 눈감으라\"였다. [[앤드루]]의 지하철도가 이 저택 아래를 파고 있었다는 뜻이며, 습격의 진짜 목적이 그 묵인이었다.\n\n**아직 모르는 것.** 가문의 문장·연혁·규모. 그리고 [[스프링필드 가주]]와 [[코네트]]의 부모 사이가 어떻게 되는지 — 코네트에게 할아버지만 있고 부모 이야기가 없다.","parentId":"great-houses"},{"title":"연방","id":"federation","type":"국가","folder":"02_지역","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","미트로프","열강"],"memo":"원문 §1 연방(174~348행) 이관. 고친 자리 넷. (1) 국명에서 '메트로시아/메트리카' 폐기(작가 확인). (2) 197행 파벌 정의 교체 — 원문은 통일파를 '대륙을 통일하자는 온건주의', 철도파를 '철도부터 깔자는 급진주의'로 적었으나, 작가가 '철도파=역량을 전 대륙에 투사 / 통일파=내부부터 정리'로 바꿔 확정했고 강경·온건은 각 파벌 안의 갈래로 정리했다. (3) 203행에서 통일파 주장의 근거 중 '전 대륙을 확보한 이후에'를 덜어냈다 — 옛 정의에서만 성립하는 문구였다. 이 건은 작가 확인이 필요하다. (4) 2026-07-31 문체 통일 지시에 따라 「짤막한 역사」의 음슴체를 평서체로 바꿨다. 어순과 내용은 그대로다.","image":"resource/wiki/연방.png","imageCaption":"연방의 문장","summary":[["정식 명칭","미트로프 연방"],["약칭","미트로프"],["체제","연방제"],["위치","대륙 중부 요충지"],["핵심 키워드","행정 · 철도 · 치안"],["서사 축","대륙 서사의 핵심"],["건국 주체","[[건국의 아버지들]]"],["행정구역","수도주 · 북방주 · 동방주 · 남방주 · 서방주"],["무력","[[헌병대]] · [[경찰청]] · [[보안관]] — 정규군 없음"],["의회 파벌","[[통합파]] · [[자치파]] · [[철도파]]"],["대가문","13개 — 이름 확정은 3개"],["현재 상태","붕괴 (위키 기준 현재)"]],"content":"# 연방\n\n미트로프\n\n행정과 철도, 치안이 핵심 키워드인 연방제 국가다. 대륙 중부 요충지에 위치한 패권 국가로서, 대륙 서사에 핵심적인 축을 담당한다.\n\n\n```틀\n연방\n```\n\n## 연혁\n\n```연혁\n건국 | [[신성제국]]에서 이탈한 귀족 가문이 대륙 중부 소국들을 규합. 수단은 철도였다\n건국 | 연방 헌법에 **각 주가 제각기 철도 체계를 구성할 수 있다**는 조항이 삽입된다\n통일 직후 | [[철도파]]와 [[통일파]]로 분열. 각각 내부에서 강경·온건으로 다시 갈린다\n확장기 | [[연합]]과의 기술 거래로 군비 확장\n확장기 | **쾨벤하운 왕국 병합** → [[북방주]]. 왕가는 종적을 감춘다\n확장기 | [[크레스티아 제국]]에 선전포고. 고전한다\n확장기 | [[컴퍼니]]의 반란을 몰래 지원 → 제국 멸망. 영토 80%는 연방, 20%는 컴퍼니\n확장기 | 반 연방 세력이 결성되어 **최후통첩**을 보낸다\n**[[연말 위기]]** | [[통일파]]의 쿠데타. 화재로 [[철도파]] 강경파와 [[건국의 아버지들]]이 사라진다\n**[[연말 위기]]** | 조약 체결 — **완전한 비무장화**. [[헌병대]]만 남는다\n신질서 | 대륙 전체에 연방 체계의 철도망. '미트로프 중심 질서'가 선다\n신질서 | 궤간 난립, 의회 신뢰 실추, [[경찰청]]·[[보안관]] 확대와 관할 갈등\n서사 시점 | [[북부동맹]] 독립 선언 → [[미트로프 내전]]\n현재 | 붕괴\n```\n\n## 역사\n\n[[신성제국]]에서 이탈한 귀족 가문이 대륙 중부의 소국들을 철도로 규합해 세운 나라다. 그 규합 과정에서 각 주가 제각기 철도 체계를 가질 수 있다는 조항이 헌법에 들어갔고, 이것이 훗날 사유 철도 난립의 씨앗이 된다.\n\n통일 직후 대외 투사를 주장하는 [[철도파]]와 내부 정리를 주장하는 [[통일파]]로 갈렸다. 쾨벤하운 왕국을 병합해 [[북방주]]로 삼고([[철도파]] 우세), 이어 패권국 [[크레스티아 제국]]을 해체시켜 대륙의 새 패권국이 되었다.\n\n그러자 남은 열강들이 반 연방 세력을 만들어 최후통첩을 보냈고, 개전을 막으려던 [[통일파]]가 쿠데타를 일으켰다. 이것이 [[연말 위기]]다. 조약으로 연방은 **완전한 비무장국가**가 되었고, 지금 이 나라가 앓고 있는 문제는 거의 전부 여기서 나온다.\n\n```상세\n연방의 역사\n연말 위기\n```\n\n## 이름\n\n정식 명칭은 **미트로프 연방**이다. '미트로프'가 어디서 온 이름인지는 알려져 있지 않다.\n\n다만 이 나라의 이름 계열 자체는 뚜렷하다. **미국 건국사에서 왔다.** [[건국의 아버지들]](Founding Fathers), [[명백한 운명]](Manifest Destiny), 그리고 [[대가문]]의 이름이 전부 미국 동부의 주도(州都)다. 북부 [[대가문]]이 중부에서 옮겨간 가문이라는 점도 같은 계열이다 — 서부개척시대에 서부로 건너간 이들과 겹치는 위치다.\n\n원고에는 `메트로시아`와 `메트리카`라는 이름도 있었으나 **폐기되었다**.\n\n## 양지의 이해집단\n\n- [[의회]] — 연방의 대표 통치기구\n- [[통합파]] · [[자치파]] — [[통일파]]에서 분화된 현재의 파벌\n- [[철도파]] — 구 철도파에서 살아남은 온건 계열\n- [[건국의 아버지들]] — 연방 건국의 주역. 현재는 와해\n- [[대가문]] — 13개 가문의 기성 권력층\n- [[헌병대]] 🗡️ — 연방의 유일한 군사조직\n- [[경찰청]] 🗡️ · [[보안관]] 🗡️ — 관할을 다투는 두 치안 조직\n- [[철도청]] · [[기동대]] 🗡️\n\n## 음지의 세력\n\n- [[명백한 운명]] 🗡️ — 연방의 붕괴를 목표로 삼는 테러조직\n- [[잭슨의 형제단]] 🗡️ — 열차 강도 사건 7할의 출처\n\n## 여담\n\n**이 문서의 시대는 '서사 시점'이다.** 위 역사와 양지의 이해집단은 의회·철도청·경찰청이 정상 작동하는 시점 기준이다. 위키 기준 현재에 연방은 이미 무너져 있으므로, 붕괴 이후를 다루는 [[명백한 운명]] 같은 문서는 `현대(붕괴 이후)`로 따로 달았다.\n\n**《가문과 가족》 20편이 딛고 있는 판이 전부 연말 위기의 후과다.** 궤간이 뒤죽박죽인 것, 대가문이 독자 행동하는 것, 경찰과 보안관이 관할을 다투는 것, 철도청이 무력을 쓰게 되는 것이 모두 위 「내부 문제」에서 나온다. 연방을 만든 수단(철도)이 연방을 앓게 만든 원인(사유 철도 난립)이라는 구조도 「형성 과정」의 헌법 조항 한 줄에서 시작한다.\n\n\n**통일파가 준주·자치주 편입을 주장한 근거는 분명하지 않다.** 병합한 땅을 먼저 소화하자는 취지로 읽히지만, 그 이유가 직접 설명된 적은 없다.\n\n**연방군의 정체.** 「연말 위기」에서 \"연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성\"이라 하고, 비무장화는 그 정규군을 다시 \"특정 국가에 속하지 않은 용병단으로 환원\"시키는 것이었다. 그래서 [[하노버 용병단]] · [[프로이센 사단]] 같은 이름들이 지금도 남아 있다. 이들은 연방에 직접 속하지 않으므로 `03_세력`으로 분류할 예정이다.","parentId":"grenvillia"},{"title":"연방의 역사","id":"federation-history","type":"사건","folder":"02_지역","sortOrder":5,"era":"근대","canon":"확정","status":"작성 중","tags":["연방","역사","미트로프"],"memo":"[[연방]] 문서가 길어져 「짤막한 역사」 일곱 절을 떼어낸 문서다. 문장은 원고 §1 연방(184~273행) 그대로이며 문체 통일만 적용했다. 시대는 서술 대상의 대부분이 연말 위기까지이므로 '근대'로 달았다.","image":"resource/wiki/연방의 역사.png","imageCaption":"연방의 역사","summary":[["다루는 범위","건국 ~ [[연말 위기]] 직후"],["절 수","7"],["분기점","[[연말 위기]] — 근대와 서사 시점의 경계"],["본문서","[[연방]]"]],"content":"# 연방의 역사\n\n```틀\n연방\n```\n\n[[연방]]의 성립부터 [[연말 위기]] 직후까지. 이 나라의 현재 문제는 거의 전부 이 기간에 만들어졌다.\n\n```상세\n연방\n연말 위기\n```\n\n## 형성 과정\n\n다른 국가들에 비해 길지 않은 역사를 가지고 있다. ‘드레드노 제국’에서 이탈한 귀족 가문을 중심으로, 대륙 중부에 위치한 소국들이 연합 - 통일 과정을 거쳐 형성되었다. 연방 형성의 큰 발단이 된 귀족 가문은 훗날 ‘건국의 아버지들’이라는 명칭으로 불리게 되었다.\n\n대륙 중부 소국들의 기술 중, ‘철도’ 기술만큼은 대륙 내 다른 지역과 비교했을 때 독보적인 수준이었다. ‘건국의 아버지들’은 이러한 철도 기술을 적극적으로 활용해 각 소국들과 대가문들을 규합하는 핵심적인 요소로 활용했다.\n\n다만 그 과정에서 각 소국·대가문들의 자치권을 인정하는 ‘연방 헌법’의 내용에, ‘주’로서 편입될 대가문의 영지, 소국들은 각자의 철도 체계를 구성할 수 있다는 내용을 협상 과정에서 추가하게 되었고, 이러한 조항이 추후 사유 철도가 난립하게 되는 단초를 제공해버렸다.\n\n## 통일과 확장\n\n통일 직후의 연방은 크게 두 파벌로 나뉘어 대립했다. 각 가문들의 막대한 재력과 대륙 중부에서 활동하는 수많은 용병들을 활용하는 것을 바탕으로, ‘연방의 역량을 전 대륙에 투사해야 한다’는 입장의 ‘철도파’와, ‘우선 내부부터 정리해야 한다’는 입장의 ‘통일파’였다. 두 파벌은 각각 내부에서 다시 강경파와 온건파로 갈렸다.\n\n다만 두 파벌 모두 ‘무력 사용’을 전제하고 있었으므로, 연방의 군비 확장은 필연적으로 이루어졌다. 이미 어느정도 기존 소국들과 교류하며 철도망이 확보되어 있었던 ‘비숍스’와의 기술 거래를 통해 부족한 기술력을 충당하고, 어느정도 역량이 확보되자 바로 확장을 시작했다.\n\n첫 번째 타겟은 연방과 북부 국경을 맞대고 있는 강대국 ‘쾨벤하운’이었다. 연방군은 여러 형태의 철도를 통한 빠른 기동 작전으로 쾨벤하운 왕국을 빠르게 함락시킬 수 있었다. 이후 쾨벤하운 왕국을 통째로 병합하였으며, 왕국은 지도에서 사라지게 되었다.\n\n쾨벤하운 왕국을 병합하는 과정에서 철도파와 통일파의 충돌이 이루어졌다. 철도파는 왕국의 영토를 본토로 편입하여 빠르게 철도망을 개발해야 한다고 주장하였고, 통일파는 우선 ‘준주’ 혹은 ‘자치주’로 편입해야 한다고 주장했다.\n\n쾨벤하운과의 전쟁은 너무나도 압도적인 승리였기에, 결과는 철도파 의원들이 우세했고, 결국 쾨벤하운 왕국은 연방의 본토 ‘북방주’로 완전히 편입되어버렸다. 쾨벤하운 왕가는 명목상으로는 연방의 ‘대가문’으로 위치할 수 있었지만, 얼마 지나지 않아 이들은 모두 종적을 감추어버렸다.\n\n## 크레스티아-미트로프 전쟁\n\n연방의 다음 목표는 확장된 영토의 국경과 맞대고 있는 기존의 패권국 ‘크레스티아 제국’이 되었다. 대륙 통일이 목표였으므로 서부의 ‘비숍스 연합’이나, 동부의 ‘드레드노 신성제국’도 노려볼 수 있었지만, 가장 강력한 군사력을 갖춘 ‘크레스티아 제국’이 우선 목표가 되었다.\n\n비숍스의 경우 일시적이지만 연방과의 기술 거래를 통한 협력 관계였고, 드레드노는 강과 산맥으로 분리되어 있었기에, 크레스티아 제국 말고는 별다른 선택지도 없던 상황이었다.\n\n쾨벤하운 왕가의 출신지가 크레스티아 제국의 영토 안에 위치해있었고, 먼 과거 실제로 쾨벤하운 왕국이 크레스티아 제국 영토의 일부를 지배했던 때가 있었으므로, 이를 명분으로 선전포고를 진행했다. 다만, 이때는 쾨벤하운 때와 달리 대륙의 다른 강대국들이 연방을 규탄하기 시작했다.\n\n쾨벤하운 왕국은 대외적으로 고립주의를 표방하고 있어 주재하는 외교관들이 하나도 없었고, 또 병합당해도 크게 힘의 균형이 흔들리지 않는 수준이었다. 하지만 크레스티아 제국은 명백한 열강이자 패권국으로, 다른 국가들과의 이해관계가 복잡하게 얽혀있는 상태였다.\n\n또한 쾨벤하운 왕국을 그대로 ‘병합’해버린 것도 다른 국가들의 긴장감을 강화하게 된 원인으로 작용했다. 다른 국가들의 눈에는 연방이 새로운 패권국으로서 등장했고, 기존 패권국까지 흡수할 경우 대륙 힘의 균형이 완전히 붕괴할 수 있다는 우려로 행동에 나서게 되었다.\n\n그럼에도 연방은 전쟁을 강행했고, 크레스티아 제국에 쾨벤하운 왕국 때와 같이 철도를 통한 전면적인 공세가 시작되었다. 다만 크레스티아 제국 또한 막강한 산업력과 지하 자원, 광대한 영토를 보유하고 있었으므로 쾨벤하운 때와 달리 연방은 고전을 면치 못했다.\n\n## 크레스티아 제국 해체\n\n외부에서 보았을 때, 전쟁은 시간이 지날 수록 크레스티아 제국에게 유리해져 가고 있었다. 연방은 비숍스에서 이전받은 기술을 통해, ‘열차포’로 대표되는 화기까지 발명해 전선에 투입해보았지만, 크레스티아 제국의 압도적인 규모에 밀려나고 있었다.\n\n하지만 연방은 그럼에도 전쟁을 포기하지 않았는데, 이는 크레스티아 제국 내부 혁명 세력이 존재함을 알고, 몰래 지원해주고 있었기 때문이다. 이들은 ‘콘베이아 컴퍼니’를 기반으로 두는 기업가, 부호 세력이었는데, 전쟁 전부터 제국에게 많은 부분을 동원당하고 있어 불만이 많았다.\n\n어느정도 크레스티아 제국의 역량이 분산되었을 시점, 이들은 기다렸다는 듯 반란을 일으켰다. 기존 제국 세력과, 신생 콘베이아 컴퍼니 세력의 내전이 시작되었고, 연방이 지원하던 컴퍼니는 연방과 조약을 맺어 크레스티아 제국을 양쪽에서 압박하게 되었다.\n\n사실 컴퍼니 세력과의 협력은 철도파 내부적으로는 매우 불만스러웠으나, 무턱대고 합병하였을 때의 후폭풍을 우려하여 적국의 내부 세력을 지원하는 방안을 새로 고려해보았고, 그 결과 콘베이아 컴퍼니를 지원하게 되었다.\n\n결국 얼마 지나지 않아 크레스티아 제국은 멸망했다. 기존 제국 영토의 80%는 연방이, 나머지 20%는 콘베이아 컴퍼니의 통제 하에 있는 상태로 전쟁이 끝나고 크레스티아 황가는 모두 콘베이아 컴퍼니 세력에 의해 처형당하게 되었다.\n\n전쟁은 명백한 연방측의 승리로 끝났고, 콘베이아 컴퍼니도 반쯤은 연방의 괴뢰국으로서 기능하고 있었으나, 연방은 다시금 전쟁의 위기에 처하게 되었다. 바로, 대륙의 남은 열강들이 연합하여, 연방에게 최후통첩을 전달한 것이다.\n\n## 연말 위기\n\n연방과의 협력을 파기하고 비숍스 연합이 먼저 드레드노 신성제국에게 연합을 제의했고, 드레드노 제국이 남부 군도의 왕국과 기타 중견국들을 모두 끌어들여 형성된 반 연방 세력은 크레스티아 제국이 멸망하는 것을 마주하자 연방에게 최후통첩을 전달하게 되었다.\n\n최후통첩의 내용은 다음과 같았다. 연방이 점거한 제국 영토를 제국의 후신으로 판단되는 콘베이아 컴퍼니에게 전부 반환할 것, 콘베이아 컴퍼니는 연방에 귀속되지 않으며 일반적인 기업이 아닌 독립된 권리를 가진 ‘기업국가’로서 존속할 것, 과거 연방이 편입한 쾨벤하운 왕국을 독립시킬 것.\n\n최후통첩을 받은 연방은 초기에는 ‘반 연방 세력과도 전쟁하자’는 철도파의 주장이 우세했다. 구 패권국이었던 크레스티아 제국과도 승리했으므로, 나머지 국가들도 어렵지 않게 굴복시킬 수 있다는 생각에서 기인한 주장이었다.\n\n하지만 반대로 전쟁을 반대하는 주장도 적지 않았는데, 크레스티아 제국과의 전쟁에서 소모된 역량이 너무나도 크다는 것이 이유였다. 연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성되어 있었어서 역량은 뛰어나나, 소모되었을 때 보충하는 것이 매우 어려웠다.\n\n객관적으로도 당시 전쟁은 매우 위험한 도박이었으나, 크레스티아 제국에게 승리했다는 사실 하나만으로 고취된 상태라, 연방은 연합의 최후통첩을 무시하기로 결정하고 빠르게 다시 전쟁을 준비하게 되었다.\n\n연방의 전 국경에 군사들이 배치되고, 최후통첩을 거부하고 선전포고문을 작성하기 바로 사흘 전, 전쟁이 코 앞에 다가온 상황에서 전쟁을 반대하던 ‘통일파’ 의원들은 결국 쿠데타를 모의하게 되었다. 선전포고문을 발표하기 전, ‘철도파’ 의원들을 한 곳에 모으고, 한 번에 제거해버리자는 계획이었다.\n\n## 신질서의 시작\n\n통일파 의원들의 계획은 결국 실행되었고, 또 성공하게 되었다. 과정에서 쿠데타 계획이 철도파 의원 한 명에게 노출되었으나 그 의원이 통일파 의원에게 감화되어 계획을 묵인하였고, 장소로의 유인을 위해 통일파 의원 한 명이 끝까지 그 장소를 지키다 사망하는 등의 극적인 과정이 있었다.\n\n철도파 의원들이 모인 곳에서 준비된 큰 화재가 발생하였고, 그 자리에서 급진적인 철도파 의원, 전쟁에 우호적이었던 의원이 대부분 사망하였으며, 그 때에 맞춰 통일파 의원들은 반 연방 세력에게 최후통첩에 대한 협상을 시작하게 되었다.\n\n최후통첩을 받아들이되, ‘쾨벤하운 왕국’은 여전히 연방의 ‘북방주’로 남기는 것을 요구했다. 반 연방 세력은 명분을 따지며 거절했으나, 연방이 대신 조건으로 ‘완전한 비무장화’를 내세웠고, 비무장화를 수용하는 조건으로 쾨벤하운 왕국의 병합을 승인했다.\n\n비무장화의 세부적인 내용은, 연방 정규군을 모두 특정 국가에 속하지 않은 용병단으로 환원시키고, 정규군 조직 중 가장 규모가 작았던 ‘헌병’만 남길 수 있다는 것이었다. 이 조항으로 인해 현대 연방에는 ‘헌병’과 ‘경찰’, ‘보안관’만이 무력집단으로 존재할 수 있는 상태다.\n\n나머지 조건인 컴퍼니의 기업국가화는 승인하되, 콘베이아 컴퍼니의 무역권을 독점하는 조항을 추가하였으며, 컴퍼니에게 영토를 반환하는 대신, 그렌빌리아 대륙 전체에 연방의 체계에 맞춰 철도망을 설립한다는 조항을 추가했다.\n\n철도망 설립에 대한 조항은 비교적 온건한 성향에, 전쟁을 반대하는 측이어서 생존한 철도파 잔존 의원들의 의견이 반영된 결과였다. 처음에는 연방에 너도 나도 할 것 없이 굴욕적인 협상이라고 비판받았으나, 현재까지 이어지는 철도망을 위시한 ‘미트로프 중심 질서’를 만든 일등공신이었다.\n\n## 내부 문제\n\n연말 위기는 막을 내리고, 진보된 연방의 철도망을 위시한 무역 체제가 시작되어 대륙 전체적으로는 희망적인 분위기가 조성되었지만, 연방 내부적으로는 많은 정치적 문제가 뒤따르게 되었다.\n\n첫 번째는 ‘철도를 통한 통합’을 주장하던 철도파 의원, 대가문 세력이 모조리 붕괴하면서, 연방 내의 뒤죽박죽인 철도 궤간, 사유 철도, 각 대가문별 철도 이권들이 난립하여 정작 연방 내부의 철도 체계를 정비할 명분도, 힘도 없어져버린 것이다.\n\n두 번째는 테러와 쿠데타의 발생으로 의회를 향한 신뢰가 떨어지게 되어, 일부 대가문들은 의회에서 벗어나 독자적인 행동을 벌이고, 대가문 중심의 사고방식이 다시 자리잡게 된 것이다. ‘건국의 아버지들’이 통일의 기반으로 다져둔 의회가 신뢰를 잃으며, 통일된 연방 자체의 결속력이 흔들리게 되었다.\n\n마지막으로 비무장화로 인한 치안 악화가 따르게 되었지만, 이러한 문제는 연방 차원에서 관리하는 ‘경찰대’를 엄청나게 늘리고, 대가문과 각 주, 지역들 자체적으로 관리하는 ‘보안관’을 확대하는 방향으로 어느정도 해소할 수 있었다. 다만 과정에서 경찰과 보안관 간의 갈등이 벌어졌다.\n\n## 여담\n\n**연방을 만든 수단이 연방을 앓게 만들었다.** 「형성 과정」의 헌법 조항 한 줄 — 각 주가 제각기 철도 체계를 구성할 수 있다 — 이 사유 철도 난립의 씨앗이 된다. 철도로 뭉친 나라가 철도 때문에 갈라지는 구조다.\n\n**[[연말 위기]] 이후가 《[[가문과 가족]]》의 판이다.** 궤간이 뒤죽박죽인 것, [[대가문]]이 독자 행동하는 것, [[경찰청]]과 [[보안관]]이 관할을 다투는 것, [[철도청]]이 무력을 쓰게 되는 것이 모두 「내부 문제」에서 나온다.\n\n**통일파가 준주·자치주 편입을 주장한 근거는 분명하지 않다.** 병합한 땅을 먼저 소화하자는 취지로 읽히지만, 그 이유가 직접 설명된 적은 없다.\n\n**연방군의 정체.** 「연말 위기」에서 \"연방의 정규군은 과거 대륙 중부에서 활약하던 용병들로 구성\"이라 하고, 비무장화는 그 정규군을 다시 \"특정 국가에 속하지 않은 용병단으로 환원\"시키는 것이었다. 그래서 [[하노버 용병단]] · [[프로이센 사단]] 같은 이름들이 지금도 남아 있다.","parentId":"federation"},{"title":"의회","id":"parliament","type":"세력","folder":"02_지역","sortOrder":5,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","통치기구"],"memo":"원문 280~285행 문장 그대로. 음슴체가 아니라 원래 평서체로 쓰인 항목이라 어미를 손대지 않았다.","image":"resource/wiki/의회.png","imageCaption":"연방의회 건물","summary":[["소속","[[연방]]"],["성격","연방의 대표 통치기구"],["의원 선출","투표가 아니라 지역·가문별 할당"],["정당","없음"],["소재","수도주 '연방의회' 건물"],["결정 사항","군사 소집 · 정책 결정 · 법안 발의"],["파벌","[[통합파]] · [[자치파]] · [[철도파]]"],["직속 무력","[[헌병대]]"],["산하 기구","[[경찰청]] · [[철도청]]"],["표어","우리의 힘은 연결에서 나온다"]],"content":"# 의회\n\n```틀\n연방\n```\n\n연방의 대표 통치기구, 투표를 통해 의원을 선정하는 것이 아닌, 지역, 가문별로 할당된 의원을 주기적으로 배출하는 형태이기에 별도의 ‘당’ 구분이 존재하지 않는다.\n\n주요 장소는 연방 수도주 ‘연방의회’ 건물로, 군사 소집, 정책 결정, 법안 발의 등의 국가적 사안은 모두 의원들이 이 곳에 모여 결정한다.\n\n```표어\n우리의 힘은 연결에서 나온다. ‘의회’는 연방의 가문, 연방의 주, 연방의 사람을 잇는 심장이다\n```\n\n## 관련 문서\n\n- [[연방]]\n- [[통합파]] · [[자치파]] · [[철도파]] — 현재의 파벌\n- [[통일파]] · [[건국의 아버지들]] — 지금은 없는 파벌\n- [[헌병대]] — 의회 직속 무력\n- [[경찰청]] · [[철도청]] — 산하 기구\n- [[대가문]]\n\n## 여담\n\n**당이 없다는 것이 이 나라의 정치를 결정한다.** 의원을 투표로 뽑지 않고 지역·가문별 할당으로 배출하므로, 의원은 유권자가 아니라 자기를 보낸 지역과 가문에게 묶인다. [[자치파]]가 [[대가문]]·[[보안관]]을 힘의 통로로 쓰는 것도, 대가문 유력자가 아예 의회에 나오지 않고도 영향력을 갖는 것도 여기서 나온다.\n\n**연말 위기로 잃은 것이 신뢰다.** 테러와 쿠데타가 의회 안에서 벌어진 뒤 일부 대가문이 의회를 떠나 독자 행동을 시작했다. [[건국의 아버지들]]이 통일의 기반으로 다져둔 기구가 무게를 잃으면서 연방의 결속 자체가 흔들렸다. → [[연방]]의 「내부 문제」\n\n**동원 절차가 서사의 장치가 된다.** [[헌병대]]는 의회 직속이지만 법적 절차와 의원 간 이해관계가 맞아야 움직인다. 그래서 '0호 비상사태' 같은 지령이나 의회 진입 여부가 그대로 사건이 된다.","parentId":"federation"},{"title":"자치파","id":"autonomists","type":"세력","folder":"02_지역","sortOrder":30,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 292~295행 문장 그대로. 문서 제목은 '자치파 의원'이 아니라 '자치파'로 두었다 — [[통합파]]와 같은 이유.","image":"","imageCaption":"","summary":[["소속","[[연방]] [[의회]]"],["전신","[[통일파]] 온건 계열"],["목표","각 지역의 자치권 확대 · 타 지역의 연방 합류"],["지역 기반","북방주 · 동방주"],["힘의 통로","[[대가문]] · [[보안관]]"],["대표 인물","[[데이비스]]"],["귀결","[[북부동맹]] · [[미트로프 내전]]"]],"content":"# 자치파\n\n과거 존재했던 ‘통일파’에서 분화된 성향을 가진 의원 집단. 각 지역의 자치권 확대와 타 지역들의 연방 합류를 핵심 목표로 삼고 활동하는 이들을 지칭한다. ‘북방주’, ‘동방주’ 등을 지역적 기반으로 두고 있으며, ‘대가문’과 ‘보안관’ 등 지역 세력을 통해 정치적 힘을 행사한다.\n\n```표어\n과도한 연결로 인해 연방이 폭주기관차처럼 날뛰게 된 것 아닌가? 오히려 우리는 거리를 두어야 할 필요가 있다.\n```\n\n## 관련 문서\n\n- [[연방]]\n- [[의회]]\n- [[통일파]] — 전신\n- [[통합파]] — 같은 뿌리에서 갈라진 상대 파벌\n- [[대가문]] · [[보안관]] — 정치적 힘의 통로\n- [[북부동맹]] — 자치파에서 이어지는 분리 독립 구상\n\n## 여담\n\n**서사에서 가장 멀리 간 파벌이다.** [[데이비스]]는 자치파 의원에서 [[북부동맹]] 위원장으로 옮겨가며, 자치권 확대라는 목표를 결국 분리 독립까지 밀고 간다. 《가문과 가족》 후반부의 [[미트로프 내전]]이 그 결과이고, 붕괴 이후의 [[명백한 운명]]은 그를 잇겠다는 자들이 그의 말을 상징으로 채택한 조직이다.\n\n**목표 두 개가 서로 당긴다.** '각 지역의 자치권 확대'와 '타 지역들의 연방 합류'가 한 문장에 있다. 자치를 넓히면서 새 지역을 끌어들이려면 연방이 느슨한 형태여야 하므로 논리는 통하지만, 결과적으로 연방을 약화시키는 방향이다.","parentId":"federation"},{"title":"잭슨의 형제단","id":"jacksons-brotherhood","type":"세력","folder":"02_지역","sortOrder":210,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["연방","음지","약탈단","열차 강도"],"memo":"원문 345~348행 문장 그대로. 시대는 '서사 시점'으로 달았다 — 두목 잭슨이 《가문과 가족》 9·14·20편에 등장하기 때문이다. 다만 '명백한 운명과 자주 충돌한다'는 서술은 그 조직이 붕괴 이후의 것이므로 붕괴기 기준이다. 즉 이 조직은 두 시대에 걸쳐 있다.","image":"resource/wiki/잭슨의 형제단.png","imageCaption":"형제단의 열차 습격","summary":[["성격","거대한 약탈단"],["활동 지역","북부 연방 (본거지는 북방주)"],["악명","연방 열차 강도 사건의 7할"],["두목","[[잭슨]]"],["구성","잭슨과 그를 따르는 여러 약탈단 두목들"],["결속력","하나의 [[대가문]]에 필적"],["표적","열차만"],["충돌 상대","[[명백한 운명]] · [[기동대]]"]],"content":"# 잭슨의 형제단 🗡️\n\n북부 연방에서 활동하는 거대한 약탈단으로, 연방에서 활동하는 열차 강도 사건의 7할이 이들에게서 발생할 정도로 악명 높은 조직이기도 하다. 조직의 우두머리인 ‘잭슨’과, 그를 따르는 여러 약탈단 두목들로 구성되어 있으며, 이들은 하나의 ‘대가문’에 필적할 정도로 높은 결속력을 자랑한다.\n\n원래부터 북방주에서 활동하던 이들이었고, ‘열차’만을 타겟으로 노리는 통에 ‘명백한 운명’ 조직원들과 자주 충돌하는 편이다.\n\n## 관련 문서\n\n- [[연방]]\n- [[잭슨]] — 두목\n- [[기동대]] — 철도를 지키는 상대\n- [[명백한 운명]] — 사설 철도를 뻗는 쪽과 열차를 노리는 쪽의 충돌\n- [[대가문]] — 결속력의 비교 대상\n\n## 여담\n\n**두 시대에 걸쳐 있는 조직이다.** 두목 [[잭슨]]은 《가문과 가족》 안에서 활동하고, [[명백한 운명]]과의 충돌은 붕괴 이후의 이야기다. 원문 한 항목에 두 시점이 겹쳐 있으므로, 앞으로 갈라 쓸 필요가 생길 수 있다.\n\n**열차만 노리는 것이 정치적 위치를 만든다.** [[명백한 운명]]은 사설 철도를 뻗어 세를 불리고, 형제단은 그 철도 위의 열차를 턴다. 목적이 겹치지 않는데도 자원이 겹치니 부딪친다. 연방을 무너뜨리려는 쪽과 연방에서 뜯어먹으려는 쪽의 차이다.\n\n**결속력이 대가문에 필적한다는 비유가 눈에 걸린다.** 두목 한 명과 그를 따르는 여러 두목들의 구조는 가주와 분가의 구조와 같다. 북방주에서 원래 활동하던 이들이라는 점까지 겹치면, [[대가문]]과 같은 땅에서 자란 다른 형태의 가문처럼 읽힌다.","parentId":"federation"},{"title":"철도청","id":"railway-bureau","type":"세력","folder":"02_지역","sortOrder":100,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","철도","국제기구"],"memo":"원문 325~327행 문장 그대로.","image":"resource/wiki/철도청.png","imageCaption":"관리역 내부","summary":[["소속","[[의회]] 산하"],["성격","철도·차량 관리청. 제한적 국제기구"],["설치 단위","각 주의 정거장을 총괄하는 '관리역'"],["영향 범위","[[그렌빌리아 대륙]] 전체에 관리역"],["내부 구분","해외지부 / 국내지부"],["해외지부","평범한 공무"],["국내지부","영역 다툼 등 무력 사용이 요구되는 업무"],["산하 무력","[[기동대]]"],["숙원","[[궤간 통일]]"],["정치적 통로","[[통합파]] · [[철도파]]"]],"content":"# 철도청\n\n연방 의회 산하의 철도·차량 관리청. 경찰청과 유사하게 각 주마다 정거장들을 총괄하는 ‘관리역’들을 두는 형태로 운영되고 있으나, 경찰청과 달리 그렌빌리아 전체 대륙에 ‘관리역’을 두어 제한적인 영향력을 행사하는 국제기구이다.\n\n내부적으로는 ‘해외지부’와 ‘국내지부’로 분류되며, 해외 지부의 경우 평범한 공무를 맡으나, 국내 지부의 경우 영역 다툼에 연루되는 등 ‘무력의 사용’이 요구되는 업무를 자주 담당하고는 한다.\n\n## 두 지부\n\n| | 관할 | 업무의 성격 |\n|---|---|---|\n| 해외지부 | 그렌빌리아 대륙 각지 | 평범한 공무 |\n| 국내지부 | 연방 내 | 영역 다툼 연루, 무력 사용이 요구되는 업무 |\n\n## 궤간 통일이라는 명분\n\n[[궤간 통일]]은 철도청의 오랜 숙원이자, 서사에서는 **다른 일의 명분**으로 쓰인다. 16편에서 [[앤드루]]가 궤간 통일을 내세워 지하철도를 비밀리에 굴착하고, [[철도파]]의 [[하워드]]가 의회 쪽에서 이를 뒷받침한다.\n\n```대사\n자네가 그렇게 바라던 ‘궤간 통일’의 과정 중 하나지.\n— 16편\n```\n\n## 관련 문서\n\n- [[연방]] · [[의회]]\n- [[기동대]] — 철도청 산하의 치안조직\n- [[궤간 통일]] — 오래 밀어붙여 온 숙원이자 지하철도의 명분\n- [[하노버 용병단]] — 기록을 남기지 않아야 할 일에 동원되는 외부 세력\n- [[통합파]] · [[철도파]]\n- [[연말 위기]] — 대륙 철도망 설립 조항의 근거\n\n## 여담\n\n**연방의 부처가 국제기구인 이유는 조약 때문이다.** [[연말 위기]] 협상에서 '그렌빌리아 대륙 전체에 연방 체계에 맞춰 철도망을 설립한다'는 조항이 들어갔다. 그 결과 연방 의회 산하 부처가 대륙 전역에 관리역을 두게 되었다. 굴욕적이라 비판받은 협상이 연방에게 남긴 유일한 확장 수단이다.\n\n**국내가 해외보다 위험한 조직이다.** 해외지부는 공무를 보고, 국내지부는 무력을 쓴다. 연방 안에서 사유 철도와 대가문 철도 이권이 난립하고 있으므로, 선로를 관장하려면 [[대가문]]·[[보안관]]과 부딪쳐야 한다. 그래서 철도청이 [[기동대]]라는 무력을 갖는다.\n\n**《가문과 가족》의 무대가 이 조직이다.** [[앤드루]](철도청장) · [[세라]](비서관) · [[네빌]](비서)이 모두 여기 소속이고, 지하 굴착 사업도 철도청 이름으로 굴러간다. 인물 문서는 §3에서 착수 예정.","parentId":"federation"},{"title":"철도파","id":"railroaders","type":"세력","folder":"02_지역","sortOrder":40,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","의회","파벌"],"memo":"원문 297~300행 문장 그대로. 다
