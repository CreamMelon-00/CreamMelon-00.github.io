/* '연말 위기'는 근대와 서사 시점을 가르는 경계라서 독립된 칸을 가진다.
   플레이어 연표의 ERA_ORDER 도 이 사건을 독립 층으로 두고 있다. */
const ERAS = ["대전쟁 이전","대전쟁","고대","고전","중세","근대","연말 위기","서사 시점","현대(붕괴 이후)"];
const ERA_SHORT = {"대전쟁 이전":"대전쟁 전","현대(붕괴 이후)":"현대"};
const ERA_EDGE = new Set(["연말 위기"]);   // 경계 칸은 따로 표시한다

function eraBar(d){
  const hue = hueOf(d.type);
  const seg = (e, cls) =>
    `<div class="seg${cls}${ERA_EDGE.has(e) ? " edge" : ""}">${esc(ERA_SHORT[e] || e)}</div>`;
  if(d.era === "시대 공통")
    return `<div class="erabar tone" style="--hue:${hue}">` +
      ERAS.map(e => seg(e, " span")).join("") + `</div>`;
  const i = ERAS.indexOf(d.era);
  if(i < 0)
    return `<div class="erabar flat"><div class="lab">시대 ${esc(d.era || "미정")}</div></div>`;
  return `<div class="erabar tone" style="--hue:${hue}">` +
    ERAS.map((e, j) => seg(e, j === i ? " on" : "")).join("") + `</div>`;
}

/* 대문에 ```연표``` 를 쓰면 전체 연표가 들어간다. */
function chronoHtml(){
  const setting = docs.filter(d => d.type !== "대문" && d.type !== "메모");
  const rows = ERAS.map(e => {
    const list = setting.filter(d => d.era === e).sort(sortDocs);
    return `<div class="row${list.length ? "" : " empty"}${ERA_EDGE.has(e) ? " edge" : ""}">
      <div class="era">${esc(e)}${ERA_EDGE.has(e) ? `<span class="edgetag">근대와 서사 시점의 경계</span>` : ""}</div>
      <div class="docs">${list.length
        ? list.map(d => `<a data-go="${d.id}">${icon(d.type)} ${esc(d.title)}</a>`).join("")
        : `<span class="none">아직 없다</span>`}</div></div>`;
  }).join("");
  const common = setting.filter(d => d.era === "시대 공통").sort(sortDocs);
  const undated = setting.filter(d => d.era === "미정").sort(sortDocs);
  const extra = [["시대 공통", common], ["미정", undated]].filter(([, l]) => l.length).map(([t, l]) =>
    `<div class="row empty"><div class="era">${t}</div><div class="docs">${
      l.map(d => `<a data-go="${d.id}">${icon(d.type)} ${esc(d.title)}</a>`).join("")}</div></div>`).join("");
  return `<div class="chrono">${rows}${extra}</div>`;
}

/* ── 이미지 ──
   lore/ 문서가 가리키는 경로는 저장소 뿌리 기준이다. 뷰어는 wikipage/ 안에 있으므로 ../ 를 붙인다.
   파일이 없으면 빈 상자 대신 제목에서 뽑은 문양을 깐다. */
function imgSrc(p){ return /^(https?:|\.\.\/|\/)/.test(p) ? p : "../" + p }
function hashOf(s){ let h = 0; for(const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h }
function motifSvg(seed, hue){
  const h = hashOf(seed), kind = h % 4;
  const c = `hsl(${hue} 38% 52%)`;
  const g = s => `<svg class="motif" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="${c}" stroke-width=".7">${s}</g></svg>`;
  if(kind === 0) return g([18,28,38,48,58].map(r => `<circle cx="50" cy="52" r="${r}"/>`).join(""));
  if(kind === 1) return g([12,30,48,66,84].map(y => `<path d="M-5 ${y} L50 ${y + 22} L105 ${y}"/>`).join(""));
  if(kind === 2) return g(Array.from({length:9}, (_, i) =>
    `<path d="M${i*14-30} 105 L${i*14+40} -5"/><path d="M${i*14-30} -5 L${i*14+40} 105"/>`).join(""));
  return g(Array.from({length:11}, (_, i) =>
    `<path d="M50 104 L${i*12-10} -6"/>`).join("") + `<circle cx="50" cy="104" r="7"/>`);
}
function placeholder(src, label, type){
  const hue = hueOf(type);
  return `<div class="imgph tone" style="--hue:${hue}">${motifSvg(label || src, hue)}
    <div class="mark">${icon(type)}</div>
    <div class="lab">${esc(label || "이미지 자리")}</div>
    <div class="path">${esc(src)}</div></div>`;
}
/* 이미지가 없을 때. 문양 자리로 바꾸고, 같은 글이 두 번 나오지 않게 캡션 줄은 지운다. */
function imgFail(el){
  const slot = el.closest(".imgslot") || el.closest("figure");
  if(!slot) return;
  const next = slot.nextElementSibling;
  if(next && next.classList.contains("imgcap")) next.remove();
  slot.innerHTML = placeholder(el.dataset.phSrc, el.dataset.phLabel, el.dataset.phType);
}
const phAttrs = (src, label, type) =>
  `data-ph-src="${esc(src)}" data-ph-label="${esc(label || "")}" data-ph-type="${esc(type || "메모")}" onerror="imgFail(this)"`;
let curType = "메모";
function imgHtml(src, alt){
  return `<figure class="body-img"><img src="${esc(imgSrc(src))}" alt="${esc(alt||"")}"
    ${phAttrs(src, alt, curType)}>${alt ? `<figcaption>${esc(alt)}</figcaption>` : ""}</figure>`;
}

/* ── 인용 블록 ──
   ```경구 / ```대사 / ```표어 / ```조문 으로 감싼다.
   '—' 로 시작하는 줄은 출처로 빠진다. */
/* ── 틀 ──
   ```틀
   연방
   ```
   lore/_틀/연방.md 를 불러 탐색 상자로 그린다. */
function navboxHtml(name){
  const t = templates[name];
  if(!t) return `<div class="navbox missing">틀 「${esc(name)}」을 찾지 못했다 — <code>lore/_틀/${esc(name)}.md</code></div>`;
  const hue = t.hue || 222;
  return `<nav class="navbox tone" style="--hue:${hue}">
    <div class="nbhead">${esc(t.title)}</div>
    <table>${t.groups.map(([k, v]) =>
      `<tr><th>${esc(k)}</th><td>${inline(v)}</td></tr>`).join("")}</table></nav>`;
}

/* ── 상세 문서 안내 ──
   ```상세
   연방의 역사
   ``` */
function seeAlsoHtml(lines){
  const names = lines.map(l => l.trim()).filter(Boolean);
  if(!names.length) return "";
  const links = names.map(n => inline(`[[${n}]]`)).join(" · ");
  return `<div class="seealso">자세한 내용은 ${links} 문서를 참고할 것.</div>`;
}

/* ── 연혁 ──
   ```연혁
   건국 | 소국들을 규합했다
   ``` */
function historyHtml(lines){
  let last = "";
  const rows = lines.map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf("|");
    const when = i < 0 ? "" : l.slice(0, i).trim();
    const what = i < 0 ? l : l.slice(i + 1).trim();
    const same = when === last;
    last = when || last;
    return `<li${same ? ' class="same"' : ""}>
      <span class="when">${same ? "" : inline(when)}</span>
      <span class="what">${inline(what)}</span></li>`;
  }).join("");
  return `<ol class="histline">${rows}</ol>`;
}

const FENCE = {"경구":"epigraph", "대사":"dialogue", "표어":"motto", "조문":"article"};
function renderFence(kind, lines){
  if(kind === "연표") return chronoHtml();
  if(kind === "틀") return navboxHtml(lines.map(l=>l.trim()).filter(Boolean)[0] || "");
  if(kind === "상세") return seeAlsoHtml(lines);
  if(kind === "연혁") return historyHtml(lines);
  const cls = FENCE[kind];
  if(!cls) return `<pre><code>${esc(lines.join("\n"))}</code></pre>`;
  const cites = [], body = [];
  lines.forEach(l => (/^\s*—/.test(l) ? cites : body).push(l));
  const text = body.filter(x => x.trim()).map(x => `<p>${inline(x)}</p>`).join("");
  const cite = cites.length
    ? `<cite>${inline(cites.map(c => c.replace(/^\s*—\s*/, "")).join(" · "))}</cite>` : "";
  return `<figure class="quote ${cls}">${text}${cite}</figure>`;
}

/* ── 마크다운 ── */
function inline(raw){
  const tokens = [];
  let s = String(raw).replace(/\[\[([^\]]+)\]\]/g, (_,v) => { tokens.push(v); return `@@W${tokens.length-1}@@` });
  s = esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
            .replace(/\*([^*]+)\*/g,"<em>$1</em>")
            .replace(/~~([^~]+)~~/g,"<del>$1</del>")
            .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_,alt,src) => imgHtml(src, alt))
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  tokens.forEach((v,i) => {
    const p = v.split("|"), target = p[0].split("#")[0].trim(), label = (p[1]||p[0]).trim();
    const cl = findT(target) ? "" : " missing";
    s = s.replace(`@@W${i}@@`, `<a class="wiki${cl}" data-wiki="${esc(target)}">${esc(label)}</a>`);
  });
  return s;
}
function md(text){
  const lines = String(text||"").replace(/\r\n/g,"\n").split("\n");
  let h="", list=null, code=false, buf=[], table=[];
  const close = () => { if(list){ h += `</${list}>`; list=null } };
  const flush = () => {
    if(!table.length) return;
    const row = x => x.trim().replace(/^\||\|$/g,"").split("|").map(v=>v.trim());
    if(table.length>1 && /^\s*\|?[\s:-]+\|/.test(table[1])){
      const hd=row(table[0]), rows=table.slice(2).map(row);
      h += "<table><thead><tr>"+hd.map(x=>`<th>${inline(x)}</th>`).join("")+"</tr></thead><tbody>"
        + rows.map(r=>"<tr>"+r.map(x=>`<td>${inline(x)}</td>`).join("")+"</tr>").join("")+"</tbody></table>";
    } else h += table.map(x=>`<p>${inline(x)}</p>`).join("");
    table=[];
  };
  let fence = "";
  for(const line of lines){
    if(line.startsWith("```")){
      flush();close();
      if(!code){ code=true; fence=line.slice(3).trim(); buf=[] }
      else { h += renderFence(fence, buf); code=false; fence="" }
      continue;
    }
    if(code){ buf.push(line); continue }
    if(line.trim().startsWith("|") && line.includes("|")){ close(); table.push(line); continue } else flush();
    if(!line.trim()){ close(); continue }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.+)$/)){ close(); const n=m[1].length, t=m[2];
      h += `<h${n} id="${slug(t.replace(/[*`\[\]]/g,""))}">${inline(t)}</h${n}>` }
    else if(/^---+$/.test(line.trim())){ close(); h += "<hr>" }
    else if(m = line.match(/^>\s?(.*)$/)){ close(); h += `<blockquote>${inline(m[1])}</blockquote>` }
    else if(m = line.match(/^(\s*)[-*+]\s+(.+)$/)){ if(list!=="ul"){close();list="ul";h+="<ul>"} h += `<li>${inline(m[2])}</li>` }
    else if(m = line.match(/^\s*\d+\.\s+(.+)$/)){ if(list!=="ol"){close();list="ol";h+="<ol>"} h += `<li>${inline(m[1])}</li>` }
    else { close(); h += `<p>${inline(line)}</p>` }
  }
  flush(); close();
  return h || '<p class="empty">내용이 없습니다.</p>';
}

/* ── 상태 ── */
let active = docs.find(d => d.folder === "00_홈") ? docs.find(d => d.folder === "00_홈").id : docs[0].id;
let query = "";

function visibleSet(){
  if(!query) return new Set(docs.map(d=>d.id));
  const q = query.toLowerCase();
  const hit = new Set(docs.filter(d =>
    [d.title,d.folder,d.type,d.era,d.canon,d.status,...(d.tags||[]),d.content,d.memo].join(" ").toLowerCase().includes(q)
  ).map(d=>d.id));
  [...hit].forEach(id => { let d = byId(id); while(d && d.parentId){ hit.add(d.parentId); d = byId(d.parentId) } });
  return hit;
}
/* 목록은 두 단계까지만 보여준다. 그 아래는 문서에 들어가 오른쪽 '하위 문서'로 넘어간다.
   검색 중일 때는 깊이 제한을 풀어, 깊은 문서도 찾을 수 있게 한다. */
const MAX_DEPTH = 1;
function descendantCount(id){
  let n = 0, stack = [id];
  while(stack.length){ const kids = childrenOf(stack.pop()); n += kids.length; kids.forEach(k => stack.push(k.id)) }
  return n;
}
function nodeHtml(d, depth, vis){
  if(!vis.has(d.id)) return "";
  const limited = !query && depth >= MAX_DEPTH;
  const kids = limited ? "" : childrenOf(d.id).map(k => nodeHtml(k, depth + 1, vis)).join("");
  const hidden = limited ? descendantCount(d.id) : 0;
  const badge = hidden ? `<span class="more" title="하위 문서 ${hidden}개">${hidden}</span>` : "";
  return `<button class="doc${d.id === active ? " on" : ""}" data-id="${d.id}" style="padding-left:${8 + depth * 15}px">
    <span class="ic">${icon(d.type)}</span><span class="tt">${esc(d.title)}</span>${badge}<span class="dot ${dotClass(d)}"></span>
  </button>${kids}`;
}
function renderTree(){
  const vis = visibleSet();
  const groups = new Map();
  docs.filter(d=>vis.has(d.id)).forEach(d => {
    if(!groups.has(d.folder)) groups.set(d.folder,0);
    groups.set(d.folder, groups.get(d.folder)+1);
  });
  const order = [...groups.keys()].sort((a,b)=>{
    const x=folderOrder.indexOf(a), y=folderOrder.indexOf(b);
    return (x<0?999:x)-(y<0?999:y) || a.localeCompare(b,"ko");
  });
  $("#tree").innerHTML = order.map(f => {
    const roots = docs.filter(d => d.folder===f && vis.has(d.id) &&
      (!d.parentId || !byId(d.parentId) || byId(d.parentId).folder !== f)).sort(sortDocs);
    return `<section><div class="foldername">${esc(f)}<span>${groups.get(f)}</span></div>
      ${roots.map(d=>nodeHtml(d,0,vis)).join("")}</section>`;
  }).join("") || '<p class="empty" style="padding:10px">결과가 없습니다.</p>';
  $("#tree").querySelectorAll(".doc").forEach(b => b.onclick = () => go(b.dataset.id));
}

function splitMemo(content){
  const i = content.indexOf(MEMO_HEAD);
  if(i < 0) return [content, ""];
  return [content.slice(0,i).trimEnd(), content.slice(i + MEMO_HEAD.length).trim()];
}
/* ```틀 블록은 본문에서 떼어내 문서 맨 위에 따로 놓는다.
   본문 안에 두면 인포박스에 밀려 아래로 내려가고 위에 빈 자리가 생긴다. */
function pullNavbox(text){
  const m = String(text).match(/(?:^|\n)```틀\n([^\n]*)\n```\n?/);
  if(!m) return { name: "", rest: text };
  return { name: m[1].trim(), rest: text.replace(m[0], "\n") };
}

/* 본문 첫 줄의 `# 제목`은 위에 큰 제목으로 이미 나오므로 덜어낸다. */
function dropH1(text, title){
  const lines = String(text).split("\n");
  let i = 0;
  while(i < lines.length && !lines[i].trim()) i++;
  const m = lines[i] && lines[i].match(/^#\s+(.+)$/);
  if(m && m[1].trim() === String(title).trim()) return lines.slice(i+1).join("\n").replace(/^\n+/,"");
  return text;
}
/* ── 인포박스 ── */
function infoboxHtml(d){
  const hasImg = !!d.image, rows = d.summary || [];
  if(!hasImg && !rows.length) return "";
  const img = hasImg
    ? `<div class="imgslot"><img src="${esc(imgSrc(d.image))}" alt="${esc(d.title)}"
        ${phAttrs(d.image, d.imageCaption || d.title, d.type)}></div>`
    : "";
  const cap = d.imageCaption ? `<div class="imgcap">${inline(d.imageCaption)}</div>` : "";
  const table = rows.length
    ? `<table>${rows.map(([k,v]) => {
        const tbd = /^(미정|미착수|없음)$/.test(String(v).trim()) ? " class=\"tbd\"" : "";
        return `<tr><th>${inline(k)}</th><td${tbd}>${inline(v)}</td></tr>`;
      }).join("")}</table>`
    : "";
  return `<aside class="infobox tone" style="--hue:${hueOf(d.type)};border-top:3px solid var(--tone)">
    <div class="ibhead">${esc(d.title)}</div>${img}${cap}${table}</aside>`;
}

/* ── 항목별 접기 ── */
function foldify(nodes, level){
  const frag = document.createDocumentFragment();
  let i = 0;
  while(i < nodes.length){
    const n = nodes[i];
    if(n.tagName === "H" + level){
      const bucket = [];
      let j = i + 1;
      while(j < nodes.length && nodes[j].tagName !== "H" + level){ bucket.push(nodes[j]); j++ }
      const det = document.createElement("details");
      det.className = "sec lv" + level;
      det.open = true;
      if(n.id) det.id = n.id;
      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="secttl">${n.innerHTML}</span>`;
      det.appendChild(sum);
      const body = document.createElement("div");
      body.className = "secbody";
      body.appendChild(level < 3 ? foldify(bucket, level + 1) : listFrag(bucket));
      det.appendChild(body);
      frag.appendChild(det);
      i = j;
    } else { frag.appendChild(n); i++ }
  }
  return frag;
}
function listFrag(nodes){ const f = document.createDocumentFragment(); nodes.forEach(n => f.appendChild(n)); return f }
function revealTo(el){ let p = el; while(p){ if(p.tagName === "DETAILS") p.open = true; p = p.parentElement } }

function crumbOf(d){
  const path = []; let cur = d;
  while(cur){ path.unshift(cur); cur = cur.parentId ? byId(cur.parentId) : null }
  return [d.folder, ...path.slice(0,-1).map(x=>x.title)].join("  ›  ");
}
function render(){
  const d = byId(active) || docs[0];
  const [main, memo] = splitMemo(d.content);
  $("#crumb").textContent = crumbOf(d);
  $("#title").textContent = d.title;
  $("#chips").innerHTML = [
    `<span class="chip">${esc(d.type)}</span>`,
    `<span class="chip">${esc(d.era)}</span>`,
    `<span class="chip canon-${esc(d.canon)}">정사 ${esc(d.canon)}</span>`,
    `<span class="chip st-${esc(d.status)}">${esc(d.status)}</span>`,
    ...(d.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`),
  ].join("");
  $("#memoFm").innerHTML = d.memo
    ? `<details class="memo"><summary>검토 메모</summary><div class="inner body">${md(d.memo)}</div></details>` : "";
  curType = d.type;
  const nav = pullNavbox(main);
  $("#erabar").innerHTML = eraBar(d);
  $("#navbox").innerHTML = nav.name ? navboxHtml(nav.name) : "";
  $("#infobox").innerHTML = infoboxHtml(d);
  $("#body").innerHTML = md(dropH1(nav.rest, d.title));

  /* 첫 소제목 앞의 문단을 손본다. 아주 짧고 마침표가 없는 한 줄은 부제로,
     그 다음(또는 첫) 문단을 도입부로 표시한다. */
  let sawSub = false;
  for(const el of $("#body").children){
    if(/^H[1-6]$/.test(el.tagName) || el.tagName === "DETAILS") break;
    if(el.tagName !== "P") continue;
    const t = el.textContent.trim();
    if(!sawSub && t.length <= 20 && !/[.!?…다]$/.test(t)){ el.classList.add("subtitle"); sawSub = true; continue }
    el.classList.add("lead"); break;
  }

  const heads2 = [...$("#body").querySelectorAll("h2,h3")];
  if(heads2.length){
    const frag = foldify([...$("#body").children], 2);
    $("#body").innerHTML = "";
    $("#body").appendChild(frag);
  }
  $("#foldbar").hidden = !$("#body").querySelector("details.sec");
  $("#memoBody").innerHTML = memo
    ? `<details class="memo"><summary>여담</summary><div class="inner body">${md(memo)}</div></details>` : "";

  document.querySelectorAll("[data-wiki]").forEach(a => a.onclick = () => {
    const t = findT(a.dataset.wiki);
    if(t) go(t.id); else alert(`아직 없는 문서입니다: ${a.dataset.wiki}`);
  });

  // 오른쪽: 이 문서의 목차 + 하위 문서 + 역링크
  const heads = [...$("#body").querySelectorAll("details.sec")].map(s => ({
    id: s.id, text: s.querySelector(".secttl").textContent, tagName: s.classList.contains("lv3") ? "H3" : "H2"
  }));
  const kids = childrenOf(d.id);
  const backs = docs.filter(x => x.id!==d.id &&
    new RegExp(`\\[\\[${d.title.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(\\||#|\\]\\])`).test(x.content));
  /* 목록이 길어지면 접는다. 목차는 항상 펴두고, 역링크는 늘 접어둔다. */
  const link = x => `<a class="backlink" data-go="${x.id}">${icon(x.type)} ${esc(x.title)}</a>`;
  const foldBox = (title, n, inner, open) =>
    `<details class="box fold"${open ? " open" : ""}><summary><h5>${title} <b>${n}</b></h5></summary>
      <div class="boxin">${inner}</div></details>`;

  // 역링크는 분류별로 묶어 훑기 쉽게 한다
  const byType = new Map();
  backs.forEach(b => { if(!byType.has(b.type)) byType.set(b.type, []); byType.get(b.type).push(b) });
  const backInner = [...byType.entries()]
    .sort((a, b) => b[1].length - a[1].length)
    .map(([t, list]) => `<div class="grp"><span class="gl">${esc(t)}</span>${list.map(link).join("")}</div>`)
    .join("");

  $("#rail").innerHTML =
    (heads.length ? `<div class="box"><h5>이 문서</h5>${heads.map(h =>
      `<a class="${h.tagName==="H3"?"sub":""}" data-jump="${esc(h.id)}">${esc(h.text)}</a>`).join("")}</div>` : "") +
    (kids.length ? foldBox("하위 문서", kids.length, kids.map(link).join(""), kids.length <= 8) : "") +
    (backs.length ? foldBox("여기를 가리키는 문서", backs.length, backInner, false) : "");
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = () => go(a.dataset.go));
  $("#rail").querySelectorAll("[data-jump]").forEach(a => a.onclick = () => {
    const el = document.getElementById(a.dataset.jump);
    if(!el) return;
    revealTo(el);
    el.scrollIntoView({behavior:"smooth", block:"start"});
  });

  renderTree();
}
function go(id){
  active = id; query = ""; $("#q").value = "";
  render();
  $("#main").scrollTop = 0;
  if(innerWidth <= 1000) closeSide();
  location.hash = encodeURIComponent(byId(id).title);
}

const setFold = open => $("#body").querySelectorAll("details.sec").forEach(s => s.open = open);
$("#foldAll").onclick = () => setFold(false);
$("#openAll").onclick = () => setFold(true);
const closeSide = () => { $("#side").classList.remove("open"); $("#scrim").classList.remove("on") };
$("#menu").onclick = () => {
  const open = $("#side").classList.toggle("open");
  $("#scrim").classList.toggle("on", open);
};
$("#scrim").onclick = closeSide;
$("#q").oninput = e => { query = e.target.value.trim(); renderTree() };
$("#theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("wiki-theme", next) } catch(e) {}
};
addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#q").focus(); $("#q").select() }
  if(e.key==="Escape" && document.activeElement===$("#q")){ query=""; $("#q").value=""; renderTree(); $("#q").blur() }
});
try {
  const t = localStorage.getItem("wiki-theme");
  document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
} catch(e) { document.documentElement.dataset.theme = "light" }

const fromHash = location.hash ? findT(decodeURIComponent(location.hash.slice(1))) : null;
if(fromHash) active = fromHash.id;
render();
</script>
</body>
</html>
