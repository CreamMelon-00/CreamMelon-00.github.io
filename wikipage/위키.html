<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계관 아카이브</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#fffefb; --panel2:#efece4; --line:#e0dad0;
  --text:#211e18; --muted:#77705f; --accent:#8a5320; --soft:#f2e8d8;
  --warn:#9a6b06; --danger:#a02f26; --ok:#2f6b41;
  --serif:"Nanum Myeongjo","Batang","Apple SD Gothic Neo",Georgia,serif;
  --sans:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 6px 18px rgba(60,45,25,.05);
}
:root[data-theme="dark"]{
  --bg:#14131a; --panel:#1c1b23; --panel2:#25232e; --line:#332f3d;
  --text:#e8e4dc; --muted:#9a92a4; --accent:#dbab68; --soft:#2b2533;
  --warn:#dcb057; --danger:#e58179; --ok:#77c78d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
/* 긴 URL이나 붙어 있는 긴 토큰이 칸을 밀어내지 않게 한다. */
.body,.infobox td,.infobox th,.crumb,.chrono,.quote,.rail{overflow-wrap:anywhere;word-break:normal}
.body pre,.body code{overflow-wrap:normal}
img{max-width:100%;height:auto}
#app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100vh}

/* ── 왼쪽 목록 ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.sidehead{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;flex:1}
.search{margin:12px 14px 4px;position:relative}
.search input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);outline:0;font-family:inherit}
.search input:focus{border-color:var(--accent)}
.tree{overflow:auto;padding:8px 8px 40px;flex:1}
.foldername{padding:12px 8px 5px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.1em;display:flex}
.foldername span{margin-left:auto;opacity:.7}
.doc{width:100%;border:0;background:0;color:var(--muted);text-align:left;display:flex;gap:7px;align-items:center;
  padding:6px 8px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13.5px;line-height:1.35}
.doc:hover{background:var(--panel2);color:var(--text)}
.doc.on{background:var(--soft);color:var(--accent);font-weight:700}
.doc .ic{width:15px;text-align:center;flex:none;opacity:.75}
.doc .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.doc .more{flex:none;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:9px;background:var(--panel2);color:var(--muted);padding:0 4px}
.doc.on .more{background:var(--panel);color:var(--accent)}
.doc:hover .more{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--line)}
.dot.draft{background:var(--warn)}.dot.done{background:var(--ok)}.dot.conflict{background:var(--danger)}

/* ── 본문 ── */
.main{overflow:auto;position:relative}
/* 인포박스를 띄우지 않고 오른쪽 칸에 둔다.
   띄우면 표·틀·시간선마다 clear 를 걸어 피해야 하고, 그때마다 빈 공간과
   끊긴 밑줄이 생긴다. 칸으로 두면 본문은 언제나 한 폭을 쓴다. */
.wrap{display:grid;gap:0 36px;max-width:1140px;margin:0 auto;padding:38px 40px 120px;
  grid-template-columns:minmax(0,1fr) 300px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"main ib" "main toc"}
article{grid-area:main;min-width:0}
.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}
h1.doctitle{font-family:var(--serif);font-size:33px;line-height:1.22;margin:0 0 15px;letter-spacing:-.015em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);
  border:1px solid transparent;letter-spacing:.02em}
.chip.canon-확정{color:var(--ok);border-color:var(--ok)}
.chip.canon-잠정{color:var(--warn);border-color:var(--warn)}
.chip.canon-구\ 설정,.chip.canon-폐기\ 예정{color:var(--danger);border-color:var(--danger)}
.chip.st-충돌\ 의심{color:var(--danger);border-color:var(--danger)}
/* ── 인포박스 ── */
#infobox{grid-area:ib}
.infobox{width:100%;margin:0 0 22px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);overflow:hidden;font-size:12.5px;box-shadow:var(--shadow)}
.infobox .ibhead{padding:10px 13px;background:var(--panel2);border-bottom:1px solid var(--line);
  font-family:var(--serif);font-weight:700;font-size:14.5px;text-align:center;letter-spacing:.01em}
.imgslot{display:block;width:100%;background:var(--panel2);border-bottom:1px solid var(--line)}
.imgslot img{display:block;width:100%;height:auto}
/* 이미지가 없을 때의 자리 — 빈 상자 대신 문양을 깐다. */
.imgph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:172px;padding:20px 14px;color:var(--muted);text-align:center;
  border-bottom:1px solid var(--line);overflow:hidden;
  background:var(--panel2)}
.imgph .motif{position:absolute;inset:0;opacity:.5;pointer-events:none}
.imgph .mark{position:relative;font-size:26px;opacity:.75;color:var(--tone,var(--accent))}
.imgph .lab{position:relative;font-size:11.5px;font-family:var(--serif)}
.imgph .path{position:relative;font-size:10px;word-break:break-all;opacity:.6;font-family:ui-monospace,monospace}
.imgcap{padding:7px 12px;color:var(--muted);font-size:11.5px;text-align:center;border-bottom:1px solid var(--line);line-height:1.5}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:6px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.55}
.infobox th{width:37%;color:var(--muted);font-weight:600;font-size:11.5px;background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.infobox tr:last-child th,.infobox tr:last-child td{border-bottom:0}
.infobox td.tbd{color:var(--warn);opacity:.85}
.body-img{margin:1.4em 0}
.body-img img{max-width:100%;border-radius:8px;display:block}
.body-img figcaption{color:var(--muted);font-size:12px;margin-top:6px;text-align:center}
.body-img .imgph{border:1px dashed var(--line);border-radius:8px}

/* ── 항목별 접기 ── */
details.sec{margin:0}
details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"";flex:none;width:6px;height:6px;margin-top:-3px;
  border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);
  transform:rotate(45deg);transition:transform .15s;opacity:.6}
details.sec:not([open])>summary:before{transform:rotate(-45deg);margin-top:0}
details.sec>summary:hover:before{opacity:1}
details.sec.lv2>summary{margin:2em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
details.sec.lv2>summary .secttl{font-family:var(--serif);font-size:20px}
details.sec.lv3>summary{margin:1.7em 0 .5em}
details.sec.lv3>summary .secttl{font-size:15.5px;color:var(--accent);font-weight:700}
details.sec:not([open])>summary{opacity:.72}
details.sec:not([open])>summary:after{content:"…";color:var(--muted);margin-left:2px}
.foldbar{display:flex;gap:8px;align-items:center;margin:18px 0 2px}
.foldbar button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;
  padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.foldbar button:hover{color:var(--accent);border-color:var(--accent)}
details.memo{margin:14px 0 26px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
details.memo>summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--muted);list-style:none}
details.memo>summary::-webkit-details-marker{display:none}
details.memo>summary:before{content:"▸ ";color:var(--accent)}
details.memo[open]>summary:before{content:"▾ "}
details.memo>summary:hover{color:var(--text);background:var(--panel2)}
details.memo .inner{padding:2px 16px 12px;border-top:1px solid var(--line)}

/* 읽기 편한 본문.
   폭 제한은 '읽는 글'에만 건다. 표·틀·시간선·인용 상자 같은 구조물은
   문서 전체 폭을 쓰게 두어야 인포박스와 오른쪽 끝이 맞는다. */
.body{font-size:15.5px;line-height:1.85}
.body p,.body ul,.body ol,.body>blockquote,.secbody>blockquote{max-width:70ch}
/* 상자 안의 글은 상자 폭을 그대로 쓴다 */
.body .quote p,.body td p,.body th p,.body li>ul,.body li>ol{max-width:none}
.body p{margin:0 0 1.05em}
/* 첫 문단은 도입부처럼 조금 키운다. */
.lead{font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--text);margin:0 0 1.3em;
  max-width:70ch}
.lead em,.lead strong{font-weight:700}
/* 국가 문서의 고유 명칭처럼, 제목 아래 짧게 놓인 한 줄 */
.subtitle{font-family:var(--serif);font-size:14px;color:var(--muted);letter-spacing:.06em;
  margin:-.4em 0 1.2em;padding-bottom:.5em;border-bottom:1px solid var(--line);max-width:70ch}
.body h2{font-family:var(--serif);font-size:20px;margin:2em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.body h3{font-size:15.5px;margin:1.7em 0 .5em;color:var(--accent)}
.body h4{font-size:14px;margin:1.4em 0 .4em;color:var(--muted)}
.body ul,.body ol{margin:0 0 1.05em;padding-left:1.35em}
.body li{margin:.3em 0}
.body li>ul,.body li>ol{margin:.3em 0}
.body blockquote{margin:1.1em 0;padding:.5em 0 .5em 1.1em;border-left:3px solid var(--accent);color:var(--muted);font-family:var(--serif);font-size:15px}

/* ── 분류별 상징색 ── */
.tone{--tone:hsl(var(--hue) 42% 38%)}
:root[data-theme="dark"] .tone{--tone:hsl(var(--hue) 48% 66%)}

/* ── 연표 띠 ── */
.erabar{display:flex;align-items:stretch;gap:3px;margin:0 0 20px;
  border:1px solid var(--line);border-radius:9px;padding:5px;background:var(--panel)}
.erabar .seg{flex:1;min-width:0;padding:5px 4px 6px;border-radius:6px;text-align:center;
  font-size:10px;color:var(--muted);letter-spacing:-.02em;line-height:1.35;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erabar .seg .n{display:block;font-size:9.5px;opacity:.55;margin-top:1px}
.erabar .seg.on{background:color-mix(in srgb,var(--tone,var(--accent)) 16%,transparent);
  border-color:color-mix(in srgb,var(--tone,var(--accent)) 45%,transparent);
  color:var(--tone,var(--accent));font-weight:700}
.erabar .seg.span{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--muted)}
/* 경계 칸 — 시대를 가르는 자리라 좌우에 선을 세운다 */
.erabar .seg.edge{border-left:1px dashed var(--line);border-right:1px dashed var(--line);
  border-radius:3px;font-style:italic}
.erabar .seg.edge.on{border-left-style:solid;border-right-style:solid;font-style:normal}
.erabar.flat{justify-content:center}
.erabar.flat .lab{padding:5px 12px 6px;font-size:11px;color:var(--muted)}

/* 대문의 전체 연표 */
.chrono{margin:1.4em 0;border-left:2px solid var(--line);padding-left:0}
.chrono .row{position:relative;padding:0 0 18px 22px}
.chrono .row:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.chrono .row.empty:before{border-color:var(--line)}
.chrono .era{font-family:var(--serif);font-size:14.5px;font-weight:700;margin-bottom:5px}
.chrono .row.edge:before{border-color:var(--warn);width:12px;height:12px;left:-7px}
.chrono .row.edge .era{color:var(--warn)}
.chrono .edgetag{margin-left:8px;font-family:var(--sans);font-size:10.5px;font-weight:400;
  color:var(--muted);letter-spacing:0}
.chrono .row.empty .era{color:var(--muted);font-weight:400}
.chrono .docs{display:flex;flex-wrap:wrap;gap:5px}
.chrono .docs a{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);
  color:var(--muted);cursor:pointer;border:1px solid transparent}
.chrono .docs a:hover{color:var(--accent);border-color:var(--accent)}
.chrono .none{font-size:12px;color:var(--muted);opacity:.6}

/* ── 틀 (탐색 상자) ── */
.navbox{margin:0 0 22px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);overflow:hidden;font-size:12.5px}
.navbox .nbhead{padding:7px 12px;background:color-mix(in srgb,var(--tone,var(--accent)) 13%,var(--panel2));
  border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:13.5px;
  color:var(--tone,var(--accent));letter-spacing:.01em}
.navbox table{width:100%;border-collapse:collapse}
.navbox th,.navbox td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.7}
.navbox th{width:78px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap;
  background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.navbox tr:last-child th,.navbox tr:last-child td{border-bottom:0}
.navbox.missing{padding:9px 12px;color:var(--danger);font-size:12px}

/* ── 상세 문서 안내 ── */
.seealso{margin:1.1em 0;padding:8px 13px;border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--soft) 45%,transparent);border-radius:0 7px 7px 0;
  font-size:13.5px;color:var(--muted)}
.seealso:before{content:"▸ ";color:var(--accent)}
.seealso a.wiki{font-weight:700}

/* ── 연혁 (문서 안의 시간선) ── */
.histline{list-style:none;margin:1.3em 0;padding:0 0 0 4px}
.histline li{position:relative;display:grid;grid-template-columns:96px 1fr;gap:14px;
  padding:0 0 14px 20px;border-left:2px solid var(--line);align-items:baseline}
.histline li:last-child{border-left-color:transparent;padding-bottom:0}
.histline li:before{content:"";position:absolute;left:-6px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent)}
.histline li.same:before{width:5px;height:5px;left:-4px;top:9px;background:var(--line);border:0}
.histline .when{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--accent);
  text-align:right;line-height:1.6}
.histline li.same .when{color:transparent}
.histline .what{font-size:14.5px;line-height:1.65}
@media(max-width:640px){
  .histline li{grid-template-columns:1fr;gap:2px}
  .histline .when{text-align:left}
}

/* ── 인용 블록 네 종류 ── */
.quote{margin:1.5em 0;padding:0}
.quote p{margin:0 0 .45em}
.quote p:last-of-type{margin-bottom:0}
.quote cite{display:block;margin-top:.7em;font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.02em}

/* 경구 — 문서 머리의 제사 */
.quote.epigraph{margin:0 0 2em;padding:1.15em 0 1.05em;text-align:center;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote.epigraph p{font-family:var(--serif);font-size:16.5px;line-height:1.75;color:var(--text)}
.quote.epigraph cite{margin-top:.55em;font-size:11.5px;opacity:.85}
.quote.epigraph cite:before{content:"— "}

/* 대사 — 대본에서 따온 인물의 말 */
.quote.dialogue{position:relative;padding:.9em 1.15em .85em 2.5em;border-radius:9px;
  background:color-mix(in srgb,var(--soft) 55%,transparent);border:1px solid var(--line)}
.quote.dialogue:before{content:"“";position:absolute;left:.55em;top:.3em;
  font-family:var(--serif);font-size:30px;line-height:1;color:var(--accent);opacity:.45}
.quote.dialogue p{font-family:var(--serif);font-size:15px;line-height:1.7}
.quote.dialogue cite{text-align:right;font-weight:600;color:var(--accent);opacity:.9}
.quote.dialogue cite:before{content:"— "}

/* 표어 — 세력의 구호 */
.quote.motto{text-align:center;padding:.5em 0}
.quote.motto p{font-family:var(--serif);font-size:15.5px;color:var(--accent);letter-spacing:.02em}
.quote.motto p:before{content:"“"}
.quote.motto p:after{content:"”"}

/* 조문 — 법조문 */
.quote.article{padding:1.2em 1.4em;border:1px solid var(--accent);border-radius:9px;
  background:color-mix(in srgb,var(--soft) 40%,transparent);text-align:center}
.quote.article p{font-family:var(--serif);font-size:17px;line-height:1.8;letter-spacing:.03em;font-weight:700}
.quote.article cite{color:var(--accent);opacity:.9}
.body code{background:var(--panel2);padding:.12em .38em;border-radius:4px;font-size:.87em}
.body pre{background:var(--panel2);padding:12px 14px;border-radius:8px;overflow:auto;line-height:1.6}
.body pre code{background:0;padding:0}
.body hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
/* 본문 표는 인포박스 옆에 끼지 않게 아래로 내린다 — 좁은 칸에 눌리면 읽기 어렵다. */
.body table{border-collapse:collapse;width:100%;margin:1.3em 0;font-size:14px;
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.body .tablewrap{overflow-x:auto;margin:1.3em 0}
.body .tablewrap table{margin:0}
.body th,.body td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;line-height:1.6}
.body th{background:var(--panel2);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.body tbody tr:last-child th,.body tbody tr:last-child td{border-bottom:0}
.body tbody tr:hover{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.body strong{font-weight:700}
a.wiki{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}
a.wiki:hover{border-bottom-color:var(--accent)}
a.wiki.missing{color:var(--muted);border-bottom:1px dashed var(--muted)}
a.wiki.missing:after{content:"?";font-size:.75em;vertical-align:super;opacity:.7}

/* ── 오른쪽 목차 ── */
.rail{grid-area:toc;position:sticky;top:38px;align-self:start;font-size:12px}
.rail h5{margin:0 0 7px;color:var(--muted);font-size:10.5px;letter-spacing:.1em;font-weight:800}
.rail a{display:block;color:var(--muted);text-decoration:none;padding:3px 0 3px 9px;border-left:2px solid var(--line);line-height:1.4}
.rail a:hover{color:var(--accent);border-left-color:var(--accent)}
.rail .sub{padding-left:20px;font-size:11.5px}
.rail .box{margin-bottom:22px}
.rail .backlink{border:0;padding:3px 0;color:var(--accent)}
/* 목록이 길어지면 접는다. 레일 자체도 화면을 넘지 않게 안에서 스크롤한다. */
.rail{max-height:calc(100vh - 76px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.rail details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.rail details.fold>summary::-webkit-details-marker{display:none}
.rail details.fold>summary:before{content:"";flex:none;width:5px;height:5px;margin-top:-2px;
  border-right:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);
  transform:rotate(45deg);transition:transform .15s;opacity:.55}
.rail details.fold:not([open])>summary:before{transform:rotate(-45deg);margin-top:0}
.rail details.fold>summary:hover:before{opacity:1}
.rail details.fold>summary h5{margin:0}

<script>
const DATA = {"docs":[{"title":"세계관 대문","id":"home","type":"대문","folder":"00_홈","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["안내","코어"],"memo":"2026-08-04 개편. 이전에는 §0 코어 원문(세계관 정리.md 1~44행)을 문장 그대로 옮겨 본문으로 두었는데, 기획 문서의 목차를 대문에 그대로 올려놓은 형태여서 위키 첫 화면 구실을 하지 못했다. 세계를 소개하는 서술로 다시 쓰고, 원고 §0의 기획 문장은 「기획 메모」 절에 인용으로 옮겼다. '플레이어를 던져놓고', '프로젝트 진척', '심심할 때마다' 같은 제작 사정은 그 절 안에만 둔다.","image":"","imageCaption":"","summary":[],"content":"# 세계관 대문\n\n**설명할 수 있는 원리 하나로 굴러가는 세계다.**\n\n사람의 사고에서 [[노에시스]]라는 준물질이 분비되고, 그것이 대기에 섞여 있다. 이 물질은 스스로를 증폭시키는 반응을 붕괴시키므로 이 세계에서는 화약이 제대로 터지지 않는다. 그래서 문명은 증기와 전기와 철도로 뻗었고, 무기는 칼과 활과 대형 화포에서 멈췄다.\n\n같은 물질이 사람에게 초자연적인 힘을 주고([[노에마]]), 한 사람의 신념으로 공간을 덮고([[노모스]]), 사람 밖의 물건에 담기고([[누스]]), 고여 썩으면 괴물이 된다([[카시마르]]). **이 다섯 개념이 이 세계의 규칙 전부다.** → [[핵심 개념]]\n\n## 대륙마다 규칙이 다르다\n\n[[바다]]에는 엄청난 농도의 노에시스가 녹아 있어 대륙 사이를 건널 수 없다. 그래서 각 대륙이 서로를 거의 모른 채 독립적으로 굴러간다.\n\n그리고 대륙마다 노에시스 **포화도**가 다르고, 그 수치가 억제의 강도를 정한다. 어느 대륙에서 무엇을 만들 수 있는지가 숫자 하나로 갈린다.\n\n| 대륙 | 권 | 주제 | 그곳의 문명 |\n|---|---|---|---|\n| [[그렌빌리아 대륙]] | Vol.1 | 소망 | 포화도 70. 철도와 증기, 대형 화포까지 |\n| [[로디니아 대륙]] | Vol.1 | 사랑 | 포화도 최고. 화기가 없고 냉병기와 무공 |\n| [[판노티아 대륙]] | Vol.1 | 믿음 | 포화도 최저. 화기가 되지만 대부분 냉병기 |\n| [[판게아 대륙]] | Vol.2 | 죽음 | 유일한 구대륙. 국가가 없고 밤마다 시체가 깨어난다 |\n\n전체 구조는 다섯 권, 열한 대륙이다. → [[큰 그림]]\n\n## 신은 실재한다\n\n대륙마다 신이 있고 — 혹은 있었고 — **상태가 다르다.** [[판노티아 대륙]]의 신은 실제로 활동하고, [[로디니아 대륙]]의 신은 '하늘'로서 관조하고, [[그렌빌리아 대륙]]의 신은 잠든 채 꿈을 꾼다. 그리고 [[판게아 대륙]]의 신은 **없다.**\n\n그 상태가 그 대륙 사람들이 [[노에시스]]를 다루는 방식과 겹친다 — 활동하는 신에게는 믿음을 넘기고, 관조하는 하늘 아래에서는 스스로 정련하고, 잠든 신의 대륙에서는 각자 무언가를 바란다.\n\n그리고 **신은 사람이 강해져서 닿는 자리가 아니다.** 국가 하나를 자기 신념으로 덮은 사람([[교황]] · [[세라]])조차 그 연장선의 끝이 아니며, 신은 **완전히 다른 선상의 존재**다.\n\n## 이 세계관이 다루는 것\n\n개인의 활약보다 **이해관계와 집단**이 축이다. 능력은 인물의 재능이 아니라 그가 무엇을 믿는지에 따라 형태가 정해지고, 국가의 최고 규범이 [[누스]]라는 물건이며, 나라가 무너지는 것도 초자연 현상이 아니라 통치 기구가 하나씩 비어가는 과정이다.\n\nVol.1 그렌빌리아의 메인 서사가 《[[가문과 가족]]》이다.\n\n## 시작점\n\n- [[핵심 개념]] — 이 세계의 규칙. 반드시 '진실'만 적는 자리\n- [[큰 그림]] — 다섯 권과 열한 대륙의 구조\n- [[그렌빌리아 대륙]] — Vol.1의 무대\n- [[가문과 가족]] — 그 대륙의 메인 서사\n- [[위키 작성 규칙]] — 이 위키를 쓰는 방식과 속성 어휘\n\n## 연표\n\n시대 순으로 늘어놓은 문서들. 빈 자리가 아직 안 쓴 구간이다.\n\n```연표\n```\n\n## 기획 메모\n\n아래는 원고 §0 코어(1~44행)의 문장을 그대로 옮긴 것이다. 세계 안의 서술이 아니라 이 세계관을 만드는 쪽의 메모다.\n\n**무슨 목적인가?**\n과거 존재했던 초대륙들을 하나씩 차용하고, 대륙마다 개별적인 주제를 부여, 주제에 따른 문제 상황을 만들어둔 뒤, 플레이어를 던져놓고 그 문제 상황을 해결하는 경험을 제공하는 세계관\n\n**무엇이 다른가?**\n'명백히 설명할 수 있는 원리'를 가진 세계 / 대륙 단위로 끊어서 진행할 수 있어 프로젝트 진척과 여러 컨셉을 시도하기에 유리한 설정 / 다른 IP에서 비교적 조명하지 않는, '이해관계', '집단', '세력' 중심의 전개\n\n```경구\n(중요: 그렇다고 '캐릭터'의 매력을 포기하겠다는 것이 절대, 절대, 절대로 아님!!!!!!)\n```\n\n**어떤 게 있는가?**\n이해관계, 집단, 세력, 인물이 가진 '신념'에 따라 동작하는 '능력' / 세계관 규칙, 개연성을 형성하며, IP의 핵심적인 기둥이 될 '신물질' / 대륙의 주제에 따라 다르게 동작하는 신물질을 통해 형성하는 대륙별 고유 '규칙'\n\n**어떻게 할 것인가?**\n심심할 때마다 자잘한 설정이나 큰 틀을 대략적으로 잡아가며 작성 / 지금 작성된 내용은 추후 프로젝트, 기타 창작 활동에 사용 / 먼 훗날 이를 통합하는 대형 프로젝트에 도전\n\n[세계관 초안](https://docs.google.com/document/d/1V2rzeJ9Lu-FBoMMDjLTt4QuMs9QgHQCNWIc3HnDbM5I/edit?tab=t.h14bfmmjikhl)\n\n## 여담\n\n**초자연 층은 독자에게 숨겨져 있다.** 《[[가문과 가족]]》 22편 전체에 `노에시스` · `노에마` · `누스` · `카시마르` · `신성제국` · `드레드노`가 **한 번도 등장하지 않는다.** 헌법이 [[누스]]라는 사실조차 대본은 초자연이 아니라 법리로만 설명한다. 초자연 층은 《마왕과 용사》에서 드러나는 구조다.\n\n그래서 이 위키에는 **독자가 아직 모르는 것이 적혀 있다.** 작중 설명과 여기 적힌 것이 어긋나 보이는 자리는 대개 이 은폐 구조 때문이며, 그런 자리는 두 설명을 함께 적어둔다. → [[연방 헌법]]\n\n**기획 메모의 '신물질'은 [[노에시스]]다.** \"대륙의 주제에 따라 다르게 동작하는 신물질을 통해 형성하는 대륙별 고유 규칙\"이 실제로 그렇게 짜여 있다 — 같은 노에시스를 [[그렌빌리아 대륙]]은 **소망**으로 쓰고([[노모스]]), [[로디니아 대륙]]은 **정련해서** 쓴다(기와 무공). 과포화되었을 때 사람이 무엇이 되는지도 그에 따라 갈린다.\n\n다만 [[카시마르 산맥]]에서 [[컴퍼니]]가 발견한 '신물질'은 별개의 광물로 서술되므로, 같은 말이 두 가지를 가리키고 있다.\n\n**원본 자료**\n\n- 설정 원고 `세계관 정리.md` — 272KB, 3,271줄\n- 정합성 점검 `세계관_정합성_점검_메모.md` — 2026-07-29\n- 대본 단일 원본 `script/` — 《가문과 가족》 20편 + 프롤로그·에필로그","parentId":null},{"title":"기사행전","id":"knights-chronicle","type":"개념","folder":"01_핵심 규칙","sortOrder":1,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["핵심 규칙","누스","신성제국","기사행전"],"memo":"작가 확인(2026-07-31) — 《기사행전》은 [[교황]]의 기사도 문학이며 [[누스]]다. 이것을 교황이 어떻게 해석하는가가 [[신성제국]]의 법에 가깝다. 확인되지 않은 것 — 물리적 형태, [[제국기사]]의 매개체가 이것인지(원문은 '작위가 초자연적인 힘을 부여한다'까지만 적었다), 저술자가 교황 자신인지, 기사 체제 종료 시점의 상태.","image":"resource/wiki/기사행전.png","imageCaption":"기사행전","summary":[["성격","[[누스]]"],["귀속","[[신성제국]]"],["형태","기사도 문학"],["계열","[[레콩키스타]] 시기"],["기능","법 — [[교황]]의 해석"],["매개체","[[제국기사]]로 추정"],["대응","[[연방 헌법]]"],["현재","알려지지 않았다"]],"content":"# 기사행전\n\n```틀\n핵심 개념\n```\n\n[[신성제국]]의 법에 해당하는 기사도 문학. 단순한 책이 아니라 **[[누스]]**다.\n\n## 법이 되는 방식\n\n이 나라에 성문 헌법은 없다. 그 자리에 이 문학이 있다.\n\n다만 **적혀 있는 내용이 곧 법은 아니다.** [[교황]]이 그것을 어떻게 해석하는가가 법에 가깝다. 법의 출처가 문헌이 아니라 한 사람의 독법이다. → [[신성제국의 정치]]\n\n## 교황의 노에시스와 같은 재료다\n\n[[교황]]의 [[노에시스]]는 **[[레콩키스타]] 시기의 기사도 문학**으로 상당 부분 이루어져 있었다. 그래서 그가 장악한 나라가 기사단국 시절로 회귀했다.\n\n이 문학이 같은 계열의 것이라면, 그 나라의 형태와 그 나라의 법이 **한 사람이 읽은 같은 이야기에서 나온다.**\n\n## 무엇의 매개체인가\n\n[[누스]]는 일반인을 [[노에마]] 능력자나 구사자로 만드는 매개체가 될 수 있다. 이 누스가 그 역할을 하는 대상은 **[[제국기사]]로 추정된다.**\n\n두 나라의 구조가 정확히 겹치기 때문이다.\n\n| | [[연방]] | [[신성제국]] |\n|---|---|---|\n| 누스 | [[연방 헌법]] | 《기사행전》 |\n| 그 힘을 받는 이 | [[헌병대]] | [[제국기사]] |\n| 자격의 출처 | [[건국의 아버지들]]의 혈족 | [[교황]]의 직접 서임 |\n| 소모 | 없음 | 소집 한도 960시간 |\n\n[[제국기사]]의 작위가 \"기사에게 초자연적인 힘을 부여해준다\"고 알려진 것이 그 절차에 해당한다. [[교황]]이 손에 넣은 누스는 하나 더 있다 — [[하얀 일요일]]을 일으킨 **고대 바실리아의 누스**다. 다만 그쪽은 서사 시점에도 **정체 불명**이어서, 어디에 있는지도 무엇인지도 알려져 있지 않다. 국가 제도로 굴러가는 서임의 매개체가 그런 물건일 수는 없으므로, 이쪽이 더 유력하다.\n\n## 파손되면\n\n[[누스]]를 통해 능력을 얻은 사람은 **그 누스가 파손되면 능력을 잃을 가능성이 높다.** [[연방]]에서는 그 규칙이 그대로 서사가 되었다 — [[연말 위기]]에 [[연방 헌법]]이 80~90% 불타 [[헌병대]]가 무력해졌고, 헌법의 파괴가 곧 마왕 토벌의 방법이 된다.\n\n같은 규칙이 이쪽에도 걸린다면, 이 누스의 상태가 기사 체제의 존속과 직결된다. **위키 기준 현재에 기사 체제는 종료되어 있다.** 그 사이에 이 누스가 어떻게 되었는지는 알려지지 않았다.\n\n## 이름\n\n'**행전**'(行傳)은 「사도행전」의 그 행전이다. 사도들의 행적을 적은 문헌의 형식을 **기사**에게 옮긴 이름이다.\n\n이 나라의 고유명사가 대부분 스페인에서 왔고, [[누스]] 개념 자체가 그리스어 **νοῦς**(지성)에서 왔다는 점과 겹친다. [[노모스]](νόμος, 법)와 어근이 이어지므로, **법전이 곧 사람 밖의 지성**이라는 구조가 이름 층위에 이미 들어 있고, 그것이 두 나라에서 두 번 실현되었다.\n\n## 관련 문서\n\n- [[누스]] · [[노에시스]] · [[노에마]] · [[노모스]]\n- [[연방 헌법]] — 같은 자리의 누스\n- [[교황]] · [[제국기사]] · [[교단]]\n- [[레콩키스타]] · [[하얀 일요일]]\n- [[신성제국]] · [[신성제국의 정치]]\n\n## 여담\n\n**두 나라의 최고 규범이 둘 다 누스다.** [[연방]]의 헌법과 이 문학이 같은 자리에 있고, 둘 다 사람 밖의 지성이 담긴 물건이다. 다른 점은 **누가 읽느냐**다. 헌법은 [[건국의 아버지들]]의 혈족이면 접근할 수 있는 문서였고, 이것은 [[교황]] 한 사람의 해석으로만 작동한다.\n\n**그래서 후계가 없다는 사실이 더 무겁다** (추정). 법이 텍스트가 아니라 해석이라면, 해석할 사람이 사라질 때 법도 사라진다. [[교황]]에게 후계 개념이 없어 체제가 붕괴한다는 것과 이 누스의 성격이 같은 이야기다.\n\n**[[세라]]는 반대 방향으로 같은 일을 했다** (추정). 세라는 누스에 **문장을 새겨** 국가를 자기 신념으로 덮었고([[연방 헌법]] 수정헌법 제1조), 교황은 이미 있는 문학을 **해석해** 국가를 자기 노에시스의 형태로 만들었다. 하나는 쓰는 쪽이고 하나는 읽는 쪽이다.\n\n**아직 알려지지 않은 것.** 물리적 형태([[연방 헌법]]은 책 한 권이다), 저술자가 [[교황]] 자신인지, 그리고 지금 어디에 있는지.","parentId":"nous"},{"title":"노모스","id":"nomos","type":"개념","folder":"01_핵심 규칙","sortOrder":20,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노모스"],"memo":"원문(세계관 정리.md 98~113행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음. 2026-08-04 작가 확인으로 아래를 덧붙였다 — 노모스는 밀폐 공간에서 노에시스 복사가 계속 증폭되는 흑체복사에 가까운 상태다. 내부에서는 물리법칙이 달라져 활성 주체가 원하면 폭발을 일으킬 수 있으나 화약을 통한 폭발이 아니라 노에시스를 통한 폭발력의 재현이다. 노모스에는 밀도가 있고 공간이 넓을수록, 그리고 주체 본인의 에너지가 아니라 누스에 의존해 형성했을수록 낮다. 주체가 죽으면 공간이 일정 기간 자체 유지되다가 서서히 붕괴하며 그 잔해가 모여 카시마르가 된다. 마왕(세라)이 헌법으로 형성한 노모스는 넓고 누스 의존이라 저밀도·불안정하다.","image":"resource/wiki/노모스.png","imageCaption":"노모스가 펼쳐진 영역","summary":[["한 줄 정의","활성 [[노에시스]]만 존재하게 된 영역"],["성격","밀폐 공간에서 증폭된 복사"],["형성 주체","구사자로 격상된다"],["분비량","거의 무한"],["밀도","좁을수록 진하다"],["진입","일반인 동화 / 구사자 감화"],["내부 물리","주체가 폭발을 재현할 수 있다"],["주체 이탈","소멸 · 주체가 흡수"],["주체 사망","서서히 붕괴 → [[카시마르]]"],["남는 것","초월적인 힘"]],"content":"# 노모스\n\n```경구\n한처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 하느님과 똑같은 분이셨다.\n— 요한복음 1:1\n```\n\n## 개념\n\n노모스는 어떤 주체로 인해 ‘노에시스’가 연쇄적으로 활성되어 ‘활성 노에시스’만 존재하게 된 영역을 의미한다. 해당 영역 내에서 노에시스를 활성화시킨 주체는 반드시 ‘구사자’로 격상되며, 사고 행위를 통해 ‘활성 노에시스’를 거의 무한히 분비할 수 있게 된다.\n\n노모스에 ‘노에마 능력자’ 혹은 ‘구사자’가 아니면서, 동시에 뚜렷한 가치관이나 철학을 가지고 있지 않은 사람이 진입할 경우, 노모스를 형성한 주체의 신념, 가치관, 사상 등에 **동화**된다.\n\n‘노에마 능력자’ 혹은 ‘구사자’라고 하더라도, 노모스에 진입한 상태에서 주체를 통한 신념, 가치관 등의 변화를 겪게될 경우, 위와 동일한 과정을 거쳐 **감화**될 수 있다.\n\n노모스를 형성한 주체가 노모스 밖으로 벗어날 경우, 활성 노에시스의 안정성이 급격히 붕괴하면서 노모스의 주체에게 흡수되려는 성질을 띠게 된다. 노모스에 존재했던 활성 노에시스가 모두 주체에게 흡수될 경우, 노모스는 사라지나, 그 영향력만큼 주체에게 초월적인 힘을 부여해줄 수 있게 된다.\n\n## 위상으로 보면\n\n노모스는 **한 위상이 밀폐 공간을 채워 감쇠하지 않는 상태**다. 주체의 분비량이 \"거의 무한\"해지는 것은 새로 만들어내는 양이 늘어나는 것이 아니라, 빠져나가지도 상쇄되지도 않고 계속 맞아떨어지기 때문이다.\n\n그래서 **노모스의 밀도는 같은 양이 얼마나 좁은 범위에서 맞아떨어졌는지**를 말한다. 넓게 펼치면 옅어지고, [[누스]]에 의존해 만들면 자기 위상이 아니므로 불안정하다. → [[노에시스]]\n\n## 밀폐된 공간에서 증폭된 복사다\n\n노모스의 성격은 **흑체복사**에 가깝다. 밀폐된 공간 안에서 노에시스 복사가 빠져나가지 못하고 계속 증폭되는 상태다.\n\n주체의 분비량이 \"사고 행위를 통해 거의 무한\"인 것도 그래서다. 새로 만들어내는 양이 무한한 것이 아니라, **빠져나가지 않고 쌓이기 때문**이다.\n\n그리고 이 성격이 **동화**를 설명한다. 흑체복사는 스펙트럼이 온도 하나로 완전히 정해지며 내부에 무엇이 있는지는 지워진다. 뚜렷한 가치관이 없는 사람이 주체의 신념으로 통일되는 것이 그 형태다. 이미 구사자·능력자인 사람은 자기 방사가 있으므로 완전히 지워지지 않고 **감화**에 그친다.\n\n## 밀도\n\n노모스는 넓이와 밀도가 따로다. 넓게 펼쳤다고 강한 것이 아니다.\n\n**밀도를 낮추는 것 둘.**\n\n- **공간이 넓다** — 같은 분비량을 넓은 공간에 나누면 옅어진다.\n- **[[누스]]에 의존해 형성했다** — 주체 본인의 에너지로 만든 것보다 밀도가 낮고 불안정하다.\n\n그래서 **가장 진한 노모스는 작은 방 하나**다. 한 사람의 분비량으로 방 하나를 채우면 그것이 최대 밀도다. 밀폐 공간이 좁을수록 갇힌 복사가 진해진다는 위 성격과 같은 이야기다.\n\n## 안에서는 물리법칙이 달라진다\n\n노모스 내부에서는 **활성 주체가 원한다면 폭발을 일으킬 수 있다.**\n\n다만 화약을 통한 폭발이 아니라 **[[노에시스]]를 통한 폭발력의 재현**에 가깝다. [[폭발과 연소]]의 억제 규칙이 깨지는 것이 아니라, 억제 대상인 자기증폭 발열 반응을 쓰지 않고 같은 결과만 만드는 것이다. 규칙은 유지되고 결과가 우회된다. → [[폭발과 연소]]\n\n## 주체가 죽으면\n\n주체가 걸어 나가는 경우는 위 「개념」에 있다 — 활성 노에시스가 주체에게 흡수되고 노모스는 사라진다.\n\n**죽는 경우는 다르다.** 사람의 노에시스는 죽으면 그냥 사라지므로 회수할 주체가 없다.\n\n1. 공간이 **일정 기간 자체적으로 유지된다.**\n2. 그 뒤 **서서히 붕괴하기 시작한다.**\n3. 그 **잔해가 모여 [[카시마르]]가 된다.**\n\n[[카시마르]]의 발생 경로가 둘이 되는 지점이다. 노에시스가 고여 썩은 자리에서 나는 것, 그리고 **주인을 잃은 노모스가 남긴 것**이다.\n\n노모스와 카시마르의 조건이 원래 같다는 점이 여기서 드러난다. 둘 다 노에시스가 갇혀 빠져나가지 못한 공간이며, **주체가 있으면 노모스가 되고 없으면 썩는다.**\n\n## 국가 규모의 노모스\n\n[[신성제국]] 전체가 노모스에 해당할 수 있다 (추정).\n\n[[하얀 일요일]] 이후 드레드노인들은 그 사건을 **인지할 수 없다.** 그리고 국민 전체가 [[교황]]에게 서임받아, 그의 [[노에시스]]를 이룬 기사도 문학 그대로 살아간다. 노모스가 진입자를 주체의 신념·가치관에 **동화**시키는 영역이라는 위 규칙과 정확히 겹친다.\n\n범위가 국경이 아니라 **정체성**이라는 점도 특이하다. 분지 안에서 훨씬 강하게 걸리지만, 스스로를 드레드노인이라 여기는 사람이라면 바깥에 있어도 걸린다.\n\n[[연방]] 쪽은 추정이 아니다. [[세라]]가 [[연방 헌법]]에 \"모든 인민은 가족을 위해 봉사하라\"를 새겨 형성한 것이 국가 규모의 노모스다. → [[연방 헌법]]\n\n**다만 이것은 불안정하고 밀도가 낮다.** 공간이 지나치게 넓고, 세라 본인의 에너지가 아니라 [[연방 헌법]]이라는 [[누스]]에 의존해 형성한 것이기 때문이다. 위 「밀도」의 두 조건에 모두 해당한다.\n\n그래서 이 노모스가 붕괴한다고 해서 그 자리가 곧 [[카시마르]]의 땅이 되지는 않는다. 옅은 만큼 느리게 무너진다.\n\n## 대륙마다 다른 이름\n\n[[판노티아 대륙]]에서는 노모스를 **'성지'**라 부른다. 다만 그 대륙은 [[노에시스]] 포화도가 낮아, 개인이 자기 노에시스의 복사로 상대를 **동화·감화시키는 것이 거의 어렵다.** 믿음을 넘길 대상이 사람이 아니라 물건이기 때문이기도 하다. → [[판노티아 대륙]]\n\n## 현대의 노모스\n\n위키 기준 현재의 주요 갈등이 이 개념에서 나온다.\n\n마왕 사태를 시작으로 여러 사건을 거쳐 국가들이 무너지고, **그 과정에서 [[노에시스]] · 노모스 · [[노에마]] · [[누스]] 개념이 민간에 퍼졌다.**\n\n작은 방에서 무언가를 아주 강하게 바라면 그 공간이 통째로 그렇게 변한다. 그것을 마다할 사람이 많지 않다. **그래서 대다수의 사람들이 자기 노모스 안으로 들어가 버렸다.** [[그렌빌리아 대륙]]의 노에시스 포화도가 높아서 가능한 일이다.\n\n**이것은 [[그렌빌리아 대륙]]만의 일이다.** 포화도가 더 높은 [[로디니아 대륙]]에서도 벌어지지 않는다.\n\n다만 노모스는 노에시스로 공간을 비트는 것일 뿐, 그 사람을 신으로 만들어주지는 않는다. **그 안에서 먹지도 마시지도 않은 채 굶어 죽는다.**\n\n그리고 주체가 죽은 노모스는 서서히 붕괴해 [[카시마르]]가 된다. 밖이 나빠지면 더 많은 사람이 방문을 닫고, 그 사람들이 죽으면 카시마르가 또 늘어난다.\n\n## 관련 문서\n\n- [[노에시스]] · [[노에마]] · [[누스]]\n- [[카시마르]] — 붕괴한 노모스가 남기는 것\n- [[폭발과 연소]] — 노모스 내부는 예외다\n- [[연방 헌법]] · [[세라]] · [[신성제국]]\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 이 개념은 앞으로 바뀔 여지를 남겨두었다.\n\n**동화와 감화는 다른 절차다.** 뚜렷한 가치관이 없는 일반인은 **동화**, 이미 구사자·능력자인 사람이 노모스 안에서 신념이 흔들려 넘어가는 것은 **감화**다.\n\n**노모스를 스스로 걷는 것이 강해지는 수단이 된다.** 주체가 노모스 밖으로 나가면 그 안의 활성 노에시스가 전부 주체에게 흡수되고, 그만큼 초월적인 힘이 남는다.\n\n다만 **크게 펼치는 것이 유리하지는 않다.** 넓을수록 밀도가 떨어지므로, 회수할 것이 많아지는 것과 진해지는 것은 다른 이야기다.\n\n**이 세계의 자연법칙이 자기증폭 반응을 억제하는데, 세계를 끝내는 것은 억제되지 않는 자기증폭 반응이다** (독자의 읽기). [[노에시스]]는 화약의 연쇄반응을 붕괴시키지만 자기 자신의 연쇄반응은 막지 못한다. 카시마르가 늘면 밖이 나빠지고, 밖이 나빠지면 더 많은 사람이 방으로 들어가고, 그 사람들이 죽으면 카시마르가 늘어난다.\n\n**작은 것이 더 위험하다.** 국가 하나를 덮은 마왕의 노모스는 옅고, 골방 하나는 진하다. 세계를 끝내는 것이 거대한 사건이 아니라 무수한 작은 방이라는 구조가 된다.\n\n**살아남는 쪽이 규칙에 이미 적혀 있다** (추정). 일반인은 **동화**되고 구사자·능력자는 **감화**에 그친다. 자기 빛이 있는 사람은 남의 노모스에 삼켜지지 않고, 바깥에서 이미 [[노에마]]를 쓸 수 있으니 방에 들어갈 이유도 적다. 현재의 국지 세력이 그 소수로 이루어져 있을 것으로 보인다.","parentId":"core-concepts"},{"title":"노에마","id":"noema","type":"개념","folder":"01_핵심 규칙","sortOrder":10,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노에마"],"memo":"2026-08-04 작가 확인 — 구사자와 능력자의 단순 비교는 구사자 우세다. 구사자는 몸 안의 기(노에시스)를 자유자재로 다루는 사람이고, 능력자는 환단 같은 외부 물질로 일시적으로 무공(노에마)을 쓰게 된 사람이라는 로디니아식 설명을 받았다. 단 무슨 환단을 먹었는지, 무슨 무공을 쓰는지, 어떤 성격의 기인지에 따라 천차만별이다. 원문(세계관 정리.md 83~96행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음 — 추후 구현 과정에서 극적 효과를 위해 설정이 변동될 수 있는 항목.","image":"resource/wiki/노에마.png","imageCaption":"노에마 구사 장면","summary":[["한 줄 정의","[[노에시스]]를 쓰는 초자연적 행위"],["동사","구사하다"],["요구 조건","활성 노에시스 일정량"],["사용자 등급","구사자 / 노에마 능력자"],["우열","단순 비교는 구사자 우세"],["유형","직접 조작 / 에너지 환원"],["확인된 실례","[[헌병대]] · [[제국기사]]"]],"content":"# 노에마\n\n```경구\n어찌 되었든 너희들이 원하는 바를 행하라. 그러나 먼저 의욕할 수 있는 사람이 되어라!\n— 프리드리히 빌헬름 니체 (독일의 철학자)\n```\n\n## 개념\n\n노에마는 ‘노에시스’를 사용한 모든 초자연적 행위를 총칭한다. 노에마는 ‘구사하다’라는 단어로 표현할 수 있다. ‘노에마를 사용하다’와 ‘구사하다’ 모두 ‘노에마를 사용한 초자연적 행위’를 의미한다.\n\n모든 노에마는 일정 수준의 ‘활성 노에시스’를 요구하며, 노에시스를 온전히 활성화시킬 수 있으면서, 본인이 직접 원하는 형태로 다룰 수 있는 사람을 ‘구사자’라고 칭한다.\n\n구사자가 아닌 사람도 ‘특정 매개체’를 통해 노에마를 구사할 수 있으나, 이 경우 ‘구사자’가 아닌 ‘노에마 능력자’라는 이름으로 칭한다.\n\n노에마는 활성 노에시스를 직접 다루는 유형과, 활성 노에시스를 소모해 특정 에너지로 환원해 사용하는 유형으로 분류할 수 있으며, 전자의 경우 ‘활성 노에시스’의 특성이 유지되고, 후자의 경우 개인의 노에시스 형태에 따라 다른 성질의 에너지로 환원된다.\n\n## 위상으로 보면\n\n노에마는 **자기 위상을 주변의 노에시스에 간섭시키는 행위**다. 활성화된 노에시스가 \"활성화시킨 주체의 노에시스 특징을 따라가는\" 것이 그 간섭의 결과이며, 행할 수 있는 크기는 위상이 얼마나 맞아떨어졌는지에 달린다. → [[노에시스]]\n\n## 구사자와 능력자\n\n노에마를 쓰는 사람은 둘로 갈리고, **단순 비교는 구사자가 우세하다.**\n\n| | 구사자 | 노에마 능력자 |\n|---|---|---|\n| 활성화 | **스스로** 한다 | **외부 매개**를 거친다 |\n| [[로디니아 대륙]]식으로 | 몸 안의 기를 자유자재로 다루는 사람 | 환단 같은 외부 물질로 일시적으로 무공을 쓰게 된 사람 |\n| 약점 | 신념이 흔들리면 감화된다 | 매개체가 곧 급소다 |\n\n**다만 어디까지나 단순 비교다.** 실제 우열은 세 가지에 따라 천차만별이 된다 — **무엇을 매개로 삼았는지**, **어떤 노에마를 쓰는지**, 그리고 **그 노에시스가 어떤 성격인지.**\n\n능력자 계열의 강함은 매개체의 질을 그대로 따라간다. [[연방 헌법]]의 상태가 [[헌병대]]의 역량을 정하고, 성체의 질이 [[판노티아 대륙]]의 표징을 정한다. 그리고 그 대륙은 이 구분에서 특이한 자리에 있다 — **성체를 통한 발현이 표준이므로, 대륙 전체가 능력자의 방식으로 굴러간다.**\n\n## 노모스 안에서\n\n[[노모스]] 내부에서는 활성 주체가 **폭발력을 재현**할 수 있다. [[폭발과 연소]]가 억제하는 자기증폭 발열 반응을 쓰지 않고 같은 결과만 만들어내는 것이므로, 위 「유형」의 **에너지로 환원하는 쪽**이 극단까지 간 형태다. → [[노모스]]\n\n## 대륙마다 다른 이름\n\n[[로디니아 대륙]]에서는 **'무공'**이라 부른다. **체계화된** 노에마를 가리키는 말이며, 재료가 되는 [[노에시스]]도 그곳에서는 정련되어 '기'라 불린다. 화기가 성립하지 않는 대륙이라 냉병기와 함께 이 힘이 무술의 형태로 발달했다.\n\n[[판노티아 대륙]]에서는 **'표징'**이라 부른다. 그곳에서는 [[누스]]('성체')에 자기 노에시스를 넘겨 행하므로, 표징의 크기가 **그 성체를 얼마나 이해하는지**에 비례한다. → [[노에시스]]\n\n## 관련 문서\n\n- [[노에시스]]\n- [[노모스]]\n- [[누스]] — 구사자가 아닌 사람을 노에마 능력자로 만드는 ‘특정 매개체’\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 노에마·노모스·누스는 앞으로 바뀔 여지를 남겨두었다.\n\n**용어 구분이 헷갈리기 쉬운 자리.** 노에시스를 스스로 활성화해 원하는 형태로 다루는 쪽이 **구사자**, 매개체를 거쳐야 하는 쪽이 **노에마 능력자**다. 둘은 다른 등급이며, [[노모스]] 안에서는 활성화의 주체가 반드시 구사자로 격상된다.\n\n**확인된 실례 둘.** [[누스]]를 매개로 능력자를 만드는 구조가 두 나라에서 같은 형태로 나타난다.\n\n| 나라 | 능력자 | 매개체 | 부여하는 쪽 |\n|---|---|---|---|\n| [[연방]] | [[헌병대]] | [[연방 헌법]] | [[건국의 아버지들]]의 혈족 |\n| [[신성제국]] | [[제국기사]] | 《[[기사행전]]》 (추정) | [[교황]]이 직접 서임 |\n\n[[제국기사]]의 작위가 \"기사에게 초자연적인 힘을 부여해준다\"고 알려진 것이 그 절차로 읽힌다. 다만 이쪽은 **소집 한도 960시간**이 있어 쓰면 줄어들고, 다 쓰면 작위를 반납해야 한다. 매개체에 종속된다는 점은 같고 소모 방식이 다르다.\n\n**[[헌병대]]**. [[연방]]의 헌병은 구사자가 아니라 **노에마 능력자**이며, 매개체는 [[연방 헌법]]다. 1인의 역량이 하나의 군단에 버금간다고 하므로, 매개체를 거친 능력자라도 위력 자체는 낮지 않다는 뜻이 된다. 대신 매개체에 종속되므로 그 누스가 훼손되면 힘을 잃는다.","parentId":"core-concepts"},{"title":"노에시스","id":"noesis","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","노에시스"],"memo":"2026-08-04 작가와 함께 정리한 위상 체계를 반영했다. 확정된 것 — (1) 뇌파의 진폭·주파수 두 축 구조를 채택한다. (2) '거의 무한히 분비'는 원문 그대로 둔다. 생각하는 행위 자체가 무제한이라는 견해가 들어간 문장이므로 고치지 않는다. 판타지의 '마나'와 겹치지 않게 하려면 제약을 총량이 아니라 산란에 두어야 하며, 이 체계가 그 방향이다. (3) 어긋남과 맞아떨어짐을 이 위키에서 '위상'이라 부른다. (4) 뇌는 발신원이 아니지만 사고 행위가 거기서 일어나므로 위상이 정해지는 자리다. (5) 이 모형을 세운 세력은 아직 등장하지 않았다. 방안으로 남겨둔 것 — 주파수 축을 실제 뇌파 대역에 대응시키는 안. 감마·베타는 로디니아(의도적 통제), 알파는 판노티아(넘겨주므로 힘을 빼는 쪽), 세타는 그렌빌리아(소망과 잠든 신), 델타는 판게아(죽은 것이 남아 움직임)에 걸린다. 대륙과 대역을 1:1로 묶으면 개인차가 좁아지므로, 사람마다 주력 대역이 있고 대륙이 그 분포를 편향시키는 형태가 대안이다. 채택 여부는 미정. 2026-07-31 작가 확인 — 그렌빌리아는 포화도 최고 대륙이 아니다. 나중에 정해진 설정으로 로디니아가 더 높으며 그쪽은 냉병기만 쓰인다. 원문 63행의 '농도가 가장 높은 대륙'에서 '가장'을 덜어냈다. 2026-07-31 정합성 점검 반영 2건. (1) 원문 63행 '공기 중의 70%를 차지'는 부피비로 읽히면 호흡·연소·기압·부력이 전부 깨지므로, 대기와 중첩된 준물질의 '포화도 70'으로 재정의. (2) 원문 67~69행 '연쇄적인 연소 반응을 억제'는 범위가 너무 넓어 흑색화약만 살아남는 이유가 나오지 않으므로, '자기증폭하는 발열 반응의 전파면 붕괴'로 정밀화. 그 외 문장은 원문 그대로.","image":"resource/wiki/노에시스.png","imageCaption":"활성 노에시스의 형질 예시","summary":[["한 줄 정의","사람의 사고에서 분비되는 개념"],["성격","대기와 중첩된 준물질"],["상태","활성 / 비활성"],["분비","불규칙 — 생각이 물리화된 것"],["분비량","무제한"],["힘의 기준","위상 — 맞아떨어진 양"],["사람이 죽으면","사라진다"],["억제 대상","스스로 가속되는 발열 반응"],["포화도","대륙마다 고정값 · 그렌빌리아 70"],["형태를 결정하는 것","신념 · 사상 · 경험 · 가치관"],["파생 개념","[[노에마]] · [[노모스]] · [[누스]] · [[카시마르]]"]],"content":"# 노에시스\n\n```틀\n핵심 개념\n```\n\n```경구\n생각을 바꾸면 세상이 바뀔 것이다.\n— 노먼 빈센트 필 (미국의 작가)\n```\n\n## 개념\n\n노에시스는 우리가 사는 현실과 이 세계의 가장 근본적인 차이점으로. ‘사람의 사고 행위’에서 분비되는, 물질과 반응 사이의 모호한 개념이다.\n\n노에시스는 대기와 중첩되어 존재하는 준물질이며, 일반적인 기체처럼 공기의 조성비를 차지하지 않는다. 공기 중 노에시스의 농도는 대륙별로 다르며 ‘포화도’로 표기하는데, 이 수치는 대기 조성비가 아니라, 일정 부피 안에서 연쇄반응을 간섭할 수 있는 노에시스의 유효 밀도를 의미한다. 노에시스의 농도가 높은 대륙인 ‘그렌빌리아 대륙’의 포화도는 자그마치 70에 달할 정도이다.\n\n노에시스는 **활성** 상태와 **비활성** 상태로 분류될 수 있으며, 사람의 사고 행위에서 막 분비된 노에시스는 기본적으로 비활성 상태로 존재하며, 이 상태에서의 노에시스는 무색무취의 기체 형태를 띤다.\n\n비활성 상태의 노에시스는 짧은 시간 안에 스스로 가속되는 발열 반응의 전파면을 붕괴시킨다. 반응 속도가 일정 한계 이하인 화염과 표면연소는 유지되지만, 압력 상승과 반응 속도가 서로를 증폭시키기 시작하면 노에시스의 간섭이 급격히 커진다. 이로 인해 대기 중 노에시스의 농도가 높은 대륙 (ex. 그렌빌리아, 로디니아, 판노티아) 등에서는 ‘폭발’이 발생하기 어렵다.\n\n단, ‘연쇄적인 연소 반응’을 억제할 뿐, 연소 자체를 억제하지는 않는다.\n\n## 심화\n\n사람마다 분비하는 노에시스의 형태는 각각 차이가 있으나, 비활성 상태에서 일정 시간이 지나면 그 특징은 모두 휘발된다. 노에시스의 형태는 그 사람의 ‘신념’, ‘사상’, ‘경험’, ‘가치관’에 따라 달라지는 모습을 보였다.\n\n이러한 개개인이 가진 노에시스의 형태는 노에시스가 활성 상태로 전환될 때 나타난다. 특정 ‘노에마’로 주변의 비활성 노에시스가 활성화될 경우, 활성화시킨 주체의 노에시스 특징을 따라간다.\n\n활성 상태의 노에시스는 비활성 상태와는 달리 뚜렷한 물질로 나타났으며, 유체, 고체, 액체, 기체, 플라즈마, 장(field) 등 개인의 노에시스 특성에 따라 다른 물리, 시각적 형질을 지니게 된다.\n\n활성 상태의 노에시스에 노출된 사람은, 활성화시킨 주체의 ‘신념’, ‘사상’, ‘경험’, ‘가치관’ 등을 ‘맹목적으로’ 따르게 되나, 내적으로 그러한 것들을 이미 갖추고 있는 사람은 활성 노에시스의 영향이 미미하게 나타난다.\n\n단, 개인이 가진 이러한 ‘신념’ 등의 것들이 변화할 경우, 노에시스 또한 함께 변칙적으로 변화함을 확인하였다.\n\n## 형태가 국가가 된 예\n\n[[노에시스]]의 형태는 그 사람의 신념·사상·경험·가치관에 따라 달라진다. 이 규칙이 가장 크게 드러난 사례가 [[신성제국]]의 [[교황]]이다.\n\n그의 노에시스는 **[[레콩키스타]] 시기의 기사도 문학**으로 상당 부분 이루어져 있었다. 그래서 그가 [[하얀 일요일]]로 장악한 나라는 기사단국 시절로 회귀했고, 국민 전체가 서임받아 기사가 되어 가상의 [[카시마르]]를 토벌하는 체제가 되었다.\n\n**한 사람이 읽은 이야기가 국가의 형태가 되었다.**\n\n## 두 층위로 나뉜다\n\n같은 노에시스가 환경에서는 규칙적으로, 사람에게서는 불규칙하게 움직인다. 이 둘이 섞이지 않는다.\n\n| | 환경 층위 | 개인 층위 |\n|---|---|---|\n| 값 | **포화도 — 대륙마다 고정** | **분비 — 불규칙** |\n| 정하는 것 | 억제의 강도 ([[폭발과 연소]]) | [[노에마]] · 구사자 · [[노모스]] |\n| 성격 | 예측 가능하다 | 예측할 수 없다 |\n\n개인의 분비가 불규칙한 이유는 그것이 **'생각'이 물리화된 결과**이기 때문이다. 그리고 이 불규칙성이 환경 층위를 흔들지는 못한다.\n\n- **사람이 죽으면 그 노에시스는 그냥 사라진다.** 남지 않는다.\n- **사람이 많아진다고 해서 그 지역의 농도가 즉각 변하지도 않는다.**\n\n그래서 억제는 포화도를 규칙적으로 따라간다. 어느 대륙에서 무엇을 만들 수 있는지가 그 대륙의 수치 하나로 정해진다. → [[폭발과 연소]]\n\n**개인이 이 층을 넘는 유일한 방법이 [[노모스]]다.** 고정값인 환경을 자기 수치로 국소적으로 덮어쓰는 것이다.\n\n## 위상\n\n**분비량에는 상한이 없다.** 생각하는 행위 자체에 한계가 없으므로 노에시스도 무제한으로 나온다. [[노모스]]의 주체가 \"사고 행위를 통해 거의 무한히 분비\"한다고 기록된 것도 이 전제 위에 있다. **이 세계에서 힘이 모자라서 못 하는 일은 없다.**\n\n제약은 다른 곳에 있다. 무제한으로 나오는 노에시스가 **대부분 서로 어긋나 상쇄된다.** 한 사람의 사고는 한 방향이 아니고, 흩어진 것은 합쳐지지 않는다. 그 어긋남과 맞아떨어짐을 **위상**이라 부른다.\n\n**그래서 강한 사람은 많이 만드는 사람이 아니라 만든 것이 서로 어긋나지 않는 사람이다.**\n\n이 기준으로 보면 흩어져 있던 규칙들이 한 줄에 놓인다.\n\n- **동화는 위상이 없는 사람에게 일어난다.** \"뚜렷한 가치관이나 철학을 가지고 있지 않은 사람\"이 [[노모스]]에 동화되는 것은 가진 양이 적어서가 아니라, 자기 위상이 없어 남의 것에 끌려가기 때문이다.\n- **감화는 위상이 흔들리는 것이다.** 구사자와 능력자도 신념이 변하면 넘어간다. 강함이 유지되는 조건이 곧 **위상의 일관성**이다.\n- **[[노모스]]의 밀도도 같은 이야기다.** 좁을수록 진하고 [[누스]]에 의존할수록 묽다는 것은, 같은 양이 얼마나 좁은 범위에서 맞아떨어졌는지를 말한다.\n\n### 두 축\n\n위상은 크기와 성격이 따로 정해진다.\n\n| 축 | 정하는 것 | 이 세계에서 |\n|---|---|---|\n| **진폭** | 힘의 **크기** | 위상이 맞아떨어진 양 |\n| **주파수** | **무엇을 할 수 있는가** | 노에시스의 성격 — 신념 · 사상 · 경험 · 가치관이 정한다 |\n\n활성 노에시스가 \"유체, 고체, 액체, 기체, 플라즈마, 장(field) 등 개인의 노에시스 특성에 따라 다른 물리, 시각적 형질을 지니게 된다\"는 것이 주파수 축의 결과다. 같은 크기의 힘이라도 무엇으로 나타나는지가 사람마다 다르다.\n\n### 다른 개념들의 자리\n\n| 개념 | 위상으로 보면 |\n|---|---|\n| [[노에마]] | 자기 위상을 주변의 노에시스에 **간섭**시키는 행위 |\n| [[노모스]] | 한 위상이 밀폐 공간을 채워 **감쇠하지 않는 상태** |\n| [[누스]] | 사람이 아니면서 노에시스를 내는 물건. **자체적으로 활성화하지 못하는** 것은 자기 위상이 없기 때문으로 추정된다 |\n| [[카시마르]] 계열 | 위상의 균형이 무너진 결과. 넘쳐 침식되거나(반 카시마르), 넘쳐 폭주하거나(키메라), 비어서 굶주린다(불신자) |\n\n### 뇌의 자리\n\n**뇌는 노에시스의 발신원이 아니다.** 다만 사고 행위가 뇌에서 일어나므로 **위상이 정해지는 자리**이며, 그래서 두 가지가 성립한다.\n\n- **몸에 개입해 위상을 바꾸는 방식이 있다.** [[로디니아 대륙]]에서 환단 같은 외부 물질로 일시적으로 무공을 쓰게 되는 것이나, 그 대륙에서 몸을 걸고 벌이는 실험이 여기에 걸린다.\n- **뇌가 사라져도 노에시스가 반드시 끊기지는 않는다.** [[판게아 대륙]]에서 시체가 밤마다 깨어나는 것이 그 예다. 다른 대륙에서 죽음이 곧 소멸인 것과 어긋나는 자리다.\n\n### 아직 아무도 이것을 체계로 세우지 않았다\n\n위상이라는 층위를 학설로 정리한 세력은 없다. 각 대륙이 자기 언어로 일부만 말한다 — [[로디니아 대륙]]은 수련의 깊이로, [[판노티아 대륙]]은 이해의 깊이로, [[그렌빌리아 대륙]]은 그것을 부를 말조차 없다.\n\n## 이름\n\n그리스어 **νόησις**(노에시스) — '사유하는 **작용**'을 뜻하는 철학 용어다.\n\n[[핵심 개념]]의 네 이름이 모두 같은 계열이며, 서로 짝을 이루는 개념들이다.\n\n| 이름 | 원어 | 본래 뜻 |\n|---|---|---|\n| 노에시스 | νόησις | 사유하는 **작용** |\n| [[노에마]] | νόημα | 사유**된 것** |\n| [[노모스]] | νόμος | **법** · 관습 |\n| [[누스]] | νοῦς | **지성** 그 자체 |\n\n배치가 정확하다. 사유의 작용(노에시스)에서 사유된 것(노에마)이 나오고, 누스는 사람 밖의 지성이며, 노모스는 한 사람의 신념이 영역 전체의 규칙이 되는 상태다.\n\n## 대륙마다 다르게 쓴다\n\n같은 물질인데 대륙마다 다루는 방식이 다르고, 그래서 이름도 다르다.\n\n| | [[그렌빌리아 대륙]] | [[로디니아 대륙]] | [[판노티아 대륙]] |\n|---|---|---|---|\n| 노에시스 | 노에시스 | **기**(氣) — 정련된 것 | **영** |\n| [[노에마]] | 노에마 | **무공** — 체계화된 것 | **표징** |\n| [[누스]] | 누스 | 알려지지 않았다 | **성체** |\n| [[노모스]] | 노모스 | 알려지지 않았다 | **성지** |\n| 다루는 방식 | **바란다** — 공간을 덮는다 | **정련한다** — 체내에서 운용한다 | **믿는다** — 대상에 이전한다 |\n| 과포화되면 | 반 [[카시마르]] (침식) | 키메라 (폭주) | 해당 없다 |\n\n[[판노티아 대륙]]은 노에시스를 몸 밖의 [[누스]]에 넘겨 쓰므로 과포화가 일어나지 않는다. 대신 그곳의 병리는 **결핍**이다 — 아무것도 방출하지 않게 된 자들이 방출하는 모든 것을 먹어치우려 든다.\n\n**포화도의 순서도 셋이 다르다.** [[로디니아 대륙]] > [[그렌빌리아 대륙]](70) > [[판노티아 대륙]]. → [[폭발과 연소]]\n\n**[[판게아 대륙]]에는 이것을 운용할 주체가 없다.** 네 대륙 중 유일하며, 그 대륙에서 움직이는 것은 죽은 자뿐이다.\n\n## 관련 문서\n\n- [[폭발과 연소]]\n- [[노에마]]\n- [[노모스]]\n- [[누스]]\n- [[카시마르]]\n- [[바다]]\n\n## 여담\n\n**고친 자리 두 곳.** 위 `검토메모`에 근거를 적어두었다. 원문 대조가 필요하면 `세계관 정리.md` 61~81행.\n\n**이 규칙들을 천체에 대어보면 앞뒤가 맞는다** (독자의 읽기). 대륙을 행성, [[바다]]를 그 사이의 공간, 사람을 별, 노에시스를 복사 에너지로 놓으면 흩어져 있던 규칙들이 한 줄로 정리된다.\n\n- **[[폭발과 연소]]의 억제** — 별이 초신성이 되지 않는 이유가 복사압이다. 핵융합이 폭주하려 할 때마다 복사가 밀어내 평형을 유지한다. 자기증폭 반응만 골라 막는다는 이 세계의 규칙이 그것과 같은 형태다.\n- **[[노모스]]의 동화** — 흑체복사는 스펙트럼이 온도 하나로 정해지고 내부 조성은 지워진다. 진입자가 주체의 신념으로 통일되는 것과 겹친다.\n- **[[누스]]** — 빛은 내지만 스스로 점화하지 못하는 천체. 누스가 \"자체적으로는 노에시스를 활성화할 수 없다\"는 한계와 같다.\n- **[[카시마르]]가 지층에 있는 것** — 행성 지각에 방사성 원소가 박혀 있는 구도다.\n- **노에시스의 형태가 신념·경험으로 정해지는 것** — 별빛을 분광하면 조성이 나오는 것과 같다.\n\n**다만 결정적으로 다른 곳이 있고, 그쪽이 더 중요하다.** 별의 복사는 규칙적인데 노에시스는 불규칙하다. 사람이 죽으면 별처럼 잔해를 남기지 않고 그냥 사라지며, 사람이 모인다고 그 구역이 밝아지지도 않는다. 이 비유는 성질이 통하는 자리를 보여줄 뿐이고, 노에시스가 실제로 복사 에너지인 것은 아니다.\n\n**위상 기준의 귀결이 둘 있다** (독자의 읽기). 하나는 **강함과 온전함이 반비례한다**는 것이다. 유연하고 균형 잡히고 열려 있는 사람 — 건강하다고 부르는 사람 — 이 이 세계에서는 위상이 흩어진 사람이다. 이 세계의 최강자들은 전부 아이 때의 상처로 생각이 하나로 좁혀진 이들이며([[교황]] · [[세라]]), [[헬라이]]가 광기를 가치관으로 삼는 것도 이 기준에서는 합리적인 전략이 된다.\n\n다른 하나는 **축의 양 끝이 둘 다 사람이 아니라는** 것이다. 0은 비어서 굶주리는 자이고, 극한은 골방의 [[노모스]]와 그 잔해다. **강해지는 길의 종점이 사람이 아니게 되는 것**이라는 구조가 체계 자체에 들어 있다. 붕괴 이후 가장 강하게 바란 사람들이 각자의 방에서 굶어 죽은 것도 그 극한값이다.\n\n**포화도 70이라는 숫자 자체는 원문 그대로 두었다.** 단위의 의미만 바꾼 것이므로, 다른 대륙의 포화도를 적을 때 이 척도를 기준으로 삼으면 된다.\n\n**그렌빌리아가 최고는 아니다.** [[로디니아 대륙]]이 이보다 높으며, 그 대륙에서는 화기가 아예 쓰이지 않고 냉병기만 쓰인다. 억제가 포화도를 규칙적으로 따라간다는 점이 대륙을 비교할 때 그대로 드러나는 셈이다. 로디니아·판노티아의 수치는 아직 알려지지 않았다.\n\n**맞춤법 교정.** 원문의 ‘띈다’를 ‘띤다’로 고쳤다(2026-07-31). 문장 구조와 어휘는 그대로다.\n\n**노에시스에서 파생되는 것들.** 이 문서 하나가 세계관의 두 갈래를 동시에 낳는다. 하나는 기술사 — 화약이 막히자 증기·제철·철도·전기가 비정상적으로 발달했고, 그 기술을 [[연합]]이 [[올림피아드]]로 독점 공급해 대륙 전체가 스팀펑크가 되었다. 다른 하나는 초자연 — [[노에마]] · [[노모스]] · [[누스]], 그리고 신념이 그대로 힘이 되는 구조. 국가별로 노에시스에 어떻게 대응했는지가 그 나라의 성격을 결정한다.","parentId":"core-concepts"},{"title":"누스","id":"nous","type":"개념","folder":"01_핵심 규칙","sortOrder":30,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","누스"],"memo":"원문(세계관 정리.md 115~129행) 문장 그대로. 작가 메모에 따라 '심화'는 작성하지 않음. 개별 누스(연방 헌법, 바실리아의 누스)는 별도 문서로 분리 예정.","image":"resource/wiki/누스.png","imageCaption":"누스의 형태 예시","summary":[["한 줄 정의","사람 외에 [[노에시스]]를 분비하는 물질"],["형태","상징 · 유물 · 보물"],["기능","일반인을 능력자로 만든다"],["한계","노에시스를 활성화하지 못한다"],["약점","파손되면 능력을 잃는다"],["카시마르","되지 않는다 · 활용당할 수 있다"],["알려진 누스","[[연방 헌법]] · [[기사행전]] · 바실리아의 누스"]],"content":"# 누스\n\n```경구\n그러나 나에게는 우리 주 예수 그리스도의 십자가밖에는 아무것도 자랑할 것이 없습니다.\n— 갈라디아서 6:14\n```\n\n## 개념\n\n누스는 ‘사람 이외의 노에시스를 분비하는 물질’을 총칭하는 개념으로서, 주로 특정한 상징, 유물, 보물 등의 형태로 나타날 수 있다.\n\n사물의 성격에 따라 기능도 천차만별이며, 누스를 매개체로 일반인이 노에마를 구사할 수 있게 되거나, 영구적으로 ‘구사자’로 만드는 등의 특수한 활용이 가능하다.\n\n누스를 통해 ‘노에마 능력자’ 혹은 ‘구사자’가 된 사람의 경우, 누스가 파손될 경우 그 능력을 잃어버릴 가능성이 높으나, 이는 상황에 따라 달라질 수 있다.\n\n누스 자체로는 노에시스를 활성화할 수 없으나, 특정한 행위에 감응하여 평소보다 더 넓은 범위의 노에시스를 활성화시키도록 보조하는 역할을 수행할 수도 있다.\n\n## 위상으로 보면\n\n누스는 **사람이 아니면서 노에시스를 내는 물건**이다. \"자체적으로는 노에시스를 활성화할 수 없다\"는 한계가 **자기 위상이 없기 때문**으로 추정된다 — 내기는 하는데 방향을 정하지 못하므로, 사람이 자기 위상을 실어야 작동한다.\n\n[[판노티아 대륙]]에서 성체를 가지려면 그 대상을 완전히 이해해야 한다는 조건도 여기서 나온다. 이해하지 못한 물건에는 위상을 실을 수 없다. → [[노에시스]]\n\n## 대륙마다 다른 이름\n\n[[판노티아 대륙]]에서는 누스를 **'성체'**라 부르며, 그곳에서는 이것을 통한 발현이 **표준**이다. 성체를 개인장비처럼 지니고 자신의 [[노에시스]]를 '믿음'의 형태로 그것에 넘겨 [[노에마]]('표징')를 행한다.\n\n**성체를 가지려면 그 대상을 완전히 이해해야 한다** — 어떻게 만들어졌고 어떻게 동작하고 어떻게 쓰는지를 알아야 한다. 그래서 그 대륙에서는 구조가 복잡한 기계장치가 성체가 되기 어렵다. → [[판노티아 대륙]]\n\n[[그렌빌리아 대륙]]에서 누스는 셋뿐인 희귀품이다. 같은 개념이 한 대륙에서는 국가의 최고 규범이고 다른 대륙에서는 개인의 장비다.\n\n## 썩지 않는다\n\n이 세계에서 노에시스는 어떻게든 사라진다. **누스만 예외다.**\n\n| 발신원 | 끝 |\n|---|---|\n| 사람 | 죽으면 노에시스가 **그냥 사라진다** |\n| [[노모스]] | 주체가 죽으면 붕괴해 **[[카시마르]]가 된다** |\n| **누스** | **어느 경로도 타지 않는다** |\n\n**누스 자체는 결코 카시마르가 되지 않는다.** 사람의 수명 밖에서 계속 노에시스를 분비하는, 이 세계에서 유일하게 소멸하지 않는 발신원이다.\n\n**다만 [[카시마르]]가 누스를 활용할 수 있다.** 누스는 일반인을 [[노에마]] 능력자로 만드는 매개체이고, 그것을 쓰는 쪽이 사람이어야 할 이유는 없다.\n\n## 알려진 누스\n\n- **연방 헌법** — [[헌병대]]가 노에마를 구사하는 **매개체**다. [[연말 위기]] 당시 80~90%가 소실되었고, 남은 부분을 [[세라]]가 복구해 [[연방]]을 장악하려 했다. 세라가 곧 마왕이며, 마왕 토벌 과정에서 이 누스는 완전히 파괴된다. 그래서 위키 기준 현재에는 존재하지 않는다. → [[연방 헌법]]\n- **《[[기사행전]]》** — [[교황]]의 기사도 문학이며, [[신성제국]]의 법에 해당한다. 적힌 내용보다 **교황이 그것을 어떻게 해석하는가**가 법이 된다. [[제국기사]]의 매개체로 추정된다. → [[기사행전]]\n- **바실리아 공동체의 누스** — 노에시스에 대한 이해 없이도 노에마를 사용할 수 있게 해주었고, 그로 인해 [[대악몽]]이 촉발되어 공동체와 인접 국가가 모조리 멸망했다. **그리고 천 년 뒤, 그 유물을 발견한 아이가 [[하얀 일요일]]을 일으켜 [[교황]]이 된다.** 같은 누스가 두 번 그 분지를 뒤집었다. **다만 이것은 서사 시점과 위키 기준 현재 모두 정체 불명이다** — 어디에 있는지도, 무엇인지도 알려져 있지 않다. → [[신성제국]]\n\n## 이름\n\n그리스어 **νοῦς**(누스) — '지성' 그 자체를 뜻한다. 사람의 사유 작용([[노에시스]])과 달리, **사람 밖에 있는 지성**이라는 뜻이 이름에 이미 들어 있다.\n\n[[노모스]](νόμος, 법)와 어근이 이어진다. 그래서 [[연방 헌법]]과 《[[기사행전]]》이 누스라는 설정 — 법전이 곧 사람 밖의 지성이라는 구조 — 은 이름 층위에서부터 예고되어 있다. **두 나라의 최고 규범이 둘 다 누스다.**\n\n## 관련 문서\n\n- [[노에시스]]\n- [[노에마]]\n- [[노모스]]\n\n## 여담\n\n**심화는 일부러 비워두었다.** [[핵심 개념]]에 적힌 방침에 따른 것이다 — 이 개념은 앞으로 바뀔 여지를 남겨두었다.\n\n**국가를 누스에 걸어두는 이유가 여기 있다** (추정). 사람의 노에시스는 죽으면 사라지므로, 자기 생각을 자기 수명 밖으로 내보내는 방법은 사라지지 않는 발신원에 옮겨 적는 것뿐이다. [[세라]]가 [[연방 헌법]]에 조문을 새긴 것과 [[교황]]이 《[[기사행전]]》을 국가의 법으로 삼은 것이 같은 수단이다.\n\n**누스가 서사를 굴리는 방식.** 개념 자체보다 개별 누스가 사건을 만든다. 헌법이 누스라는 설정은 정치 서사를 그대로 초자연 서사로 잇는 장치이고, 바실리아의 누스는 국가 하나를 멸망시킨 원인이다.\n\n**연방 헌법 한 줄로 전부 이어진다**. 헌법이 [[헌병대]]의 매개체이므로, 헌병은 구사자가 아니라 **노에마 능력자**다. 그 헌법이 [[연말 위기]]에 80~90% 불탔으니 헌병이 좀처럼 모습을 드러내지 못하는 것도 설명된다. 지휘권은 [[건국의 아버지들]]의 혈족에게 있어, [[애덤스]]의 딸인 [[세라]]가 민간인 신분으로 헌병을 부릴 수 있다. 그리고 '누스가 파손되면 능력을 잃는다'는 위 규칙 때문에, 헌법의 파괴가 곧 마왕 토벌의 방법이 된다.\n\n**알려진 누스가 셋이지만, 셋의 처지가 전부 다르다.** [[연방 헌법]]은 소실·복원·파괴까지 행방이 전부 추적되고, 《[[기사행전]]》은 한 나라의 법으로 기능하는 중이며, 바실리아 공동체의 누스는 **정체 불명이다.** 국가를 두 번 갈아치운 물건인데도 어디에 있는지, 무엇인지가 알려져 있지 않다.","parentId":"core-concepts"},{"title":"바다 민족","id":"sea-peoples","type":"개념","folder":"01_핵심 규칙","sortOrder":60,"era":"대전쟁 이전","canon":"확정","status":"완료","tags":["핵심 규칙","바다 민족","고대"],"memo":"원문(세계관 정리.md 145~159행) 문장 그대로. 시대는 '대전쟁 이전'으로 달았다 — 원문이 '대전쟁 이후 완전히 종적을 감추었다'고 하므로 이들의 활동기는 대전쟁 이전이다. '대전쟁'이 무엇인지는 아직 문서가 없다.","image":"resource/wiki/바다 민족.png","imageCaption":"바다 민족의 선단","summary":[["한 줄 정의","신대륙 형성 이전의 구대륙 민족"],["출신","[[판게아 대륙]] — 구대륙"],["특기","항해술 · 조선술"],["특이 체질","[[바다]]의 노에시스에 내성"],["후손","신대륙 인류 전체"],["소멸","[[대전쟁]] 이후 사라졌다"],["남은 흔적","신대륙의 기록뿐"]],"content":"# 바다 민족\n\n```경구\n\"우리는 항해해야 한다. 표류해서도 안 되고, 닻을 내린 채 멈춰서도 안 된다.\"\n— 올리버 웬델 홈스 주니어 (미합중국 연방대법관)\n```\n\n## 개념\n\n신대륙의 형성 이전부터 존재했던 구대륙의 민족 집단. 구대륙의 민족들 중에서도 가장 뛰어난 항해술, 조선술을 갖추고 있었고, 바다에 녹아있는 ‘노에시스’에 대해 일정 수준의 내성을 지니고 있었다.\n\n이러한 특징 덕분에 이들은 구대륙을 벗어나 여러 신대륙에 최초로 발을 들이게 되었으며, 현존하는 신대륙의 인류는 모두 이들의 후손이다.\n\n바다 민족은 여러 다양한 유전적 형질을 가지고 있었다고 전해지며, 이들의 유전적 다양성이 각 대륙별로 다른 인류의 모습에 큰 영향을 주기도 했다.\n\n이들은 ‘대전쟁’ 이후 완전히 종적을 감추어버렸으며, 이들의 흔적조차 신대륙에 한해 전해 내려오는 기록 속에서만 찾아볼 수 있다.\n\n## 그렌빌리아 대륙에서의 계보\n\n[[그렌빌리아 대륙]]에 도달한 바다 민족은 두 갈래로 갈라져 정착했고, 오늘날 두 열강의 기원이 되었다.\n\n- **동부 분지** → 바실리아 공동체 → [[대악몽]]으로 멸망 → 훗날의 [[신성제국]]\n- **서부 반도** → 헬라스 공동체 → 훗날의 [[연합]]\n\n같은 뿌리에서 갈라졌지만 방향이 정반대로 갔다. 바실리아에는 숭배할 [[누스]]가 있어 신학으로 기울었고, 헬라스에는 누스가 없어 자연과학으로 기울었다.\n\n## 이름\n\n**Sea Peoples** — 후기 청동기 시대에 지중해를 휩쓸고 여러 문명을 무너뜨린 뒤 사라진, 실재 집단의 학술 명칭이다.\n\n작품의 바다 민족도 같은 궤적을 그린다. 뛰어난 항해술로 여러 대륙에 처음 발을 들이고, [[대전쟁]] 이후 완전히 종적을 감춘다. 실제 '바다 민족'이 청동기 문명 붕괴와 함께 사라져 기록으로만 남은 것과 겹친다.\n\n## 왜 이들만 건널 수 있었는가\n\n두 가지가 겹친다.\n\n- **[[바다]]의 노에시스에 내성이 있었다.** 3분 노출로 정상적인 거동이 불가능해지는 환경을 견뎠다.\n- **방향을 잃지 않았다.** 이 바다는 투명해서 하늘을 그대로 비추므로 수평선이 사라진다. 위아래가 구분되지 않는 물 위에서 항로를 유지하는 것이 이들의 항해술이었던 것으로 추정된다.\n\n## 관련 문서\n\n- [[바다]]\n- [[대전쟁]]\n- [[그렌빌리아 대륙]]\n- [[신성제국]]\n- [[연합]]\n\n## 여담\n\n**계보는 흩어져 전해진다.** 바다 민족을 다루는 기록에는 두 갈래의 정착 이야기가 없고, [[신성제국]]과 [[연합]] 각각의 역사 쪽에 따로 남아 있다. 위 절은 그 둘을 한자리에 모은 것이다.\n\n**[[대전쟁]]이 무엇인지 확인됐다**. 구대륙의 세력들이 대륙 단위로 벌인 대륙간 전쟁이며, 신대륙인 그렌빌리아 · 로디니아 · 판노티아는 영향권 밖이었다. 바다 민족은 이 전쟁 이후 사라졌고, [[바다]]의 노에시스 농도도 이 전쟁에서 나왔다. 즉 이들이 사라진 것과 이들이 넘어온 길이 막힌 것이 같은 사건이다.\n\n**구대륙은 [[판게아 대륙]]이다**. 즉 바다 민족의 출신지이자 [[대전쟁]]의 무대다. 그렌빌리아 · 로디니아 · 판노티아가 신대륙, 판게아가 구대륙이라는 구도다. 대륙 이름 넷이 모두 실재한 초대륙에서 온 것이므로([[세계관 대문]]의 \"과거 존재했던 초대륙들을 하나씩 차용\"), 판게아만 구대륙 자리를 맡은 것도 이름의 무게와 맞는다.","parentId":"core-concepts"},{"title":"바다","id":"sea","type":"개념","folder":"01_핵심 규칙","sortOrder":50,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","바다","지리"],"memo":"원문(세계관 정리.md 131~143행) 문장 그대로.","image":"resource/wiki/바다.png","imageCaption":"원양의 노에시스 해역","summary":[["한 줄 정의","[[노에시스]]가 고농도로 녹아 있는 환경"],["성격","세계와 문명을 나누는 영역"],["농도","수심이 깊을수록 증가"],["3분 노출","구토감 · 트라우마 · 정신 착란 · 현기증"],["원양","목재 선체가 부식된다"],["농도의 유래","[[대전쟁]]"],["낳는 것","반 카시마르"],["열리는 조건","달의 주기에 따른 농도 변화 (미정)"]],"content":"# 바다\n\n```경구\n\"그래도 사람은 패배하기 위해 창조된 게 아니다.\" 그가 말했다. \"인간은 파괴될 순 있지만 패배하지는 않는다.\"\n— 소설 〈노인과 바다〉\n```\n\n## 개념\n\n대륙과 대륙을 채우는 바다에는, 엄청난 농도의 노에시스가 녹아있다. 수심이 깊을수록 노에시스의 농도가 증가하며, 바다에 녹아있는 노에시스는 육지에 존재하는 노에시스와 달리 밀도가 높고, 매우 극단적인 성질을 가지고 있다.\n\n대표적으로, 바다에 녹아있는 노에시스에 약 3분 정도만 노출되어도 정상적인 거동이 불가능할 수준의 구토감, 트라우마, 정신 착란, PTSD 증세, 현기증이 나타나며, 농도가 매우 짙은 원양까지 나갈 경우, 나무로 된 선체는 통째로 부식될 정도이다. 이처럼, 바다는 매우 위험한 환경으로 여겨져 왔다.\n\n과거부터 현대까지 ‘대륙 간’ 교류가 불가능하도록 만드는 주요 원인 중 하나이지만, 아주 먼 과거에는 지금만큼 노에시스 농도가 높지 않았고, ‘달’의 움직임에 따라 특정 해역의 노에시스 농도가 증가하거나, 감소하기도 하는 등. 항해가 아예 불가능한 환경은 아니기도 하다.\n\n## 무엇을 나누는가\n\n이 바다의 정체는 항로이기 전에 **세계와 문명끼리를 나누고 있는 거대한 영역**이다. 대륙들이 서로를 거의 모른 채 독립적으로 굴러가는 이유가 이것이다.\n\n그리고 이 바다는 **투명해서 하늘을 그대로 비춘다.** 물 위에 떠 있으면 수평선이 사라지고 위아래가 구분되지 않는다. 마치 우주 위에 떠 있는 것처럼 보인다.\n\n[[바다 민족]]의 항해술이 대단했다는 것이 그래서 두 겹이 된다. 노에시스에 내성이 있었던 것만이 아니라, **방향을 잃게 만드는 바다를 건널 수 있었다**는 뜻이다.\n\n## 이 농도는 어디서 왔는가\n\n[[대전쟁]] 때문이다. 구대륙의 세력들이 대륙 단위로 벌인 전쟁이 바다에 노에시스가 대량으로 녹아 있는 원인이다.\n\n## 바다가 낳는 것\n\n- 고인 노에시스는 썩는다. [[그렌빌리아 대륙]]에서 그 결과가 [[카시마르]]이며, 지상으로 올라오는 곳은 [[카시마르 산맥]]과 드레드 분지 호수 **두 곳뿐**이다. 다만 그 존재가 이 대륙에 남은 것은 [[대악몽]] 때문이고, 다른 대륙에는 카시마르가 없다.\n- 물속에서 이 농도에 **오랜 기간** 노출된 사람은 변한다. [[그렌빌리아 대륙]] 사람은 반쯤 [[카시마르]]가 되고, [[로디니아 대륙]] 사람은 키메라가 된다. → [[카시마르]]의 '반 카시마르'\n\n## 관련 문서\n\n- [[노에시스]]\n- [[대전쟁]] — 바다의 노에시스 농도를 만든 사건\n- [[카시마르]]\n- [[바다 민족]] — 바다의 노에시스에 내성을 지녔던 유일한 집단\n\n## 여담\n\n**접촉은 국가들이 붕괴한 뒤에 생긴다.** 서사 시점까지 대륙끼리는 서로를 거의 모르지만, 위키 기준 현재에 [[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]이 '대륙 연합'을 이룬다. 달의 움직임을 계산해 해역이 열리는 시점을 잡는 것이 그 항해의 조건이다.\n\n**이 설정이 세계관 구조를 결정한다.** 대륙별로 주제를 부여하고 대륙 단위로 끊어서 진행한다는 [[세계관 대문]]의 방침이 성립하는 이유가 바로 이것이다. 바다가 물리적 차단막이라서 대륙끼리 서로를 거의 모른 채 독립적으로 굴러간다.\n\n**동시에 빠져나갈 구멍도 열어두었다.** '아주 먼 과거에는 농도가 낮았다'와 '달의 움직임에 따라 해역별 농도가 변한다'는 두 문장이 대륙 간 왕래를 필요할 때 가능하게 만든다. [[바다 민족]]이 신대륙에 도달한 것도 이 창을 통해서였다.\n\n**고농도의 출처는 확인됐다**. [[대전쟁]]이다. 원문에는 이 연결이 적혀 있지 않았다.\n\n**과포화된 노에시스가 무엇을 낳는지는 대륙마다 다르다.** 이 바다는 모든 대륙을 두르고 수심이 깊을수록 짙어지지만, 그 안에서 사람이 무엇이 되는지는 환경이 아니라 **그 사람이 노에시스를 어떻게 다뤄왔는지**가 정한다. [[그렌빌리아 대륙]] 사람은 반 [[카시마르]]가 되고, [[로디니아 대륙]] 사람은 키메라가 된다. 이 존재들을 묶는 총칭은 아직 없다.\n\n**달의 주기는 아직 미정이다.** 다만 방향은 정해져 있다 — **'타이밍만 잘 맞추면 대륙 간 이동이 가능한 수준'**. 즉 상시 차단이 아니라 조건부로 열리는 문이며, 그 조건을 아는 쪽이 대륙 간 왕래를 독점할 수 있다. 구체적인 주기와 해역 범위는 정해지면 여기에 적을 것.","parentId":"core-concepts"},{"title":"연방 헌법","id":"constitution","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"서사 시점","canon":"확정","status":"작성 중","tags":["핵심 규칙","누스","연방","헌법"],"memo":"원문에 항목이 없던 문서. 작가 확인(2026-07-31)의 '헌법은 누스가 맞고, 연말 위기에 80~90%가 불탔다. 남은 부분을 세라가 복구해 연방을 장악하려 한 것이며, 마왕 토벌 과정에서 파괴될 예정이다. 헌병의 매개체가 헌법이다'와 대본 6·17·18편 대조로 작성했다. 물리적 형태(책)와 수정헌법 제1조 조문은 대본에서 확인한 것이다.","image":"resource/wiki/연방 헌법.png","imageCaption":"헌법전","summary":[["성격","[[누스]]"],["귀속","[[연방]]"],["물리적 형태","책"],["기능","[[헌병대]]의 [[노에마]] 매개체"],["접근 권한","[[건국의 아버지들]]의 혈족"],["소실","[[연말 위기]]에 80~90%"],["복원","[[세라]]와 조력자"],["개헌","수정헌법 제1조"],["현재","마왕 토벌 과정에서 파괴됐다"]],"content":"# 연방 헌법\n\n```틀\n핵심 개념\n```\n\n[[연방]]의 헌법은 단순한 문서가 아니라 [[누스]]다. 물리적으로는 **책** 한 권의 형태를 띤다.\n\n## 기능\n\n[[헌병대]]가 [[노에마]]를 구사하는 **매개체**다. 그래서 헌병은 구사자가 아니라 노에마 능력자이며, 이 누스의 상태가 헌병의 역량을 그대로 결정한다.\n\n접근 권한은 [[건국의 아버지들]]의 혈족에게 있다. 6편에서 한 헌병은 세라가 그것을 들고 있는 것만 보고 \"그렇다는 건 ‘건국의 아버지들’과 모종의 관계가 있다는 뜻이겠죠\"라고 곧바로 짐작한다.\n\n## 소실과 복원\n\n[[연말 위기]]의 화재로 **80~90%가 소실**되었다.\n\n이 사건이 [[헌병대]]를 무력화시켰다. 6편에서 헌병 자신이 그 이유를 말한다.\n\n```대사\n연방을 지켜온 최초의 ‘방패’ 이자, 지금은 최후의 ‘칼날’…\n하하하, 그것도 이제는 옛말이죠. 지금의 우리는 ‘칼날’도, ‘방패’도 될 수 없습니다.\n헌법은 그날 무너졌으니.\n집행할 법이 없다면, 헌병이 무슨 의미가 있을까요. 경찰도, [보안관]도 마찬가지고.\n— 세라와 연방 헌병, 6편\n```\n\n남은 부분은 [[세라]]가 조력자와 함께 밀실에서 복원했다. 6편에서 그 작업이 목격되고, 17편에서 헌병은 \"현재 ‘헌법 복원’이 시급합니다\"를 근거로 [[해리엇]]의 의회 진입 저지를 물리친다.\n\n## 수정헌법 제 1 조\n\n18편 본회의장에서 [[세라]]는 복원 사실을 알리며 \"낡은 헌법도 함께 수리해두었다\"고 말한 뒤 개헌안을 발표한다.\n\n```조문\n< 모든 인민은. 가족을 위해.>\n< 봉사하라.>\n— 수정헌법 제 1 조, 18편\n```\n\n그리고 이렇게 마친다.\n\n```대사\n그리고 마지막은, 가족의, 가족에 의한, 가족을 위한 국가가… 지상에서 사라지지 않기를 바라며…\n— 세라, 18편\n```\n\n6편에서 헌병이 세라에게 \"당신이 새로 만들고자 하는 ‘연방’은, ‘무엇에 의한 국가’ 입니까?\"라 물었고, 세라는 \"…‘가족’ 이요\"라 답했다. 그 대답이 여기서 조문이 된다.\n\n## 소멸\n\n마왕 토벌 과정에서 완전히 파괴된다. 그래서 위키 기준 현재에는 존재하지 않는다.\n\n## 관련 문서\n\n- [[누스]] · [[노에마]] · [[노모스]]\n- [[헌병대]]\n- [[세라]] · [[애덤스]] · [[건국의 아버지들]]\n- [[연말 위기]] · [[의회]]\n- [[연방]]\n\n## 여담\n\n**정치 서사와 초자연 서사가 같은 물건에서 만난다.** 대본은 이 누스를 초자연물로 설명하지 않는다. 헌병이 힘을 잃은 이유를 \"집행할 법이 없으니 헌병이 무슨 의미가 있나\"라는 **법리로** 말한다. 설정 층에서는 같은 사실이 \"매개체가 훼손되어 능력을 잃었다\"는 [[누스]] 규칙으로 설명된다. 한 사건에 두 개의 설명이 겹쳐 있고, 둘 다 맞다.\n\n**개헌이 곧 노모스로 보인다.** [[노모스]]는 주체의 신념·가치관에 진입자를 **동화**시키는 영역이고, [[노에시스]]는 활성화시킨 주체의 신념을 맹목적으로 따르게 만든다. 이 누스에 \"모든 인민은 가족을 위해 봉사하라\"를 새기는 것은, 국가 전체를 [[세라]]의 신념으로 덮는 행위가 된다. 세라의 마왕화가 초자연적 폭주가 아니라 **입법 절차**의 형태를 취하는 것으로 추정된다.\n\n**게티즈버그 연설의 뒤집기.** \"가족의, 가족에 의한, 가족을 위한 국가\"는 \"of the people, by the people, for the people\"에서 people을 family로 바꾼 것이다. 17편 제목 「가족에 의한 가족」도 같은 문형이다.\n\n**소실 규모는 작중에서 언급되지 않는다.** 80~90%가 불탔다고 알려져 있으나, 대본은 \"그 날 이후로 헌법이 소실되는 바람에\"까지만 말한다.","parentId":"nous"},{"title":"카시마르","id":"kasimar","type":"개념","folder":"01_핵심 규칙","sortOrder":40,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["핵심 규칙","카시마르","몬스터"],"memo":"2026-08-04 작가 확인으로 인과를 정정했다. 카시마르가 지층에 있는 것은 대악몽의 결과다 — 지층에 있던 것이 대악몽으로 뿜어져 나온 것이 아니라, 대악몽 때문에 지층에 남은 것이다. 따라서 그렌빌리아 대륙 외에는 카시마르가 존재하지 않는다. 그리고 카시마르라는 용어 자체가 컴퍼니가 붙인 이름이며, 악몽을 뜻하는 러시아어 кошмар의 변형이다. 2026-07-31에 분포를 전면 수정했다. 이전에는 '그렌빌리아 대륙 전역에 퍼져 있다'로 적었으나, 실제로는 대륙 지층에 고루 퍼져 있고 그렌빌리아에서 지상으로 새어나오는 곳은 카시마르 산맥과 드레드 분지 호수 두 곳뿐이다. 국가 체제가 모두 붕괴한 위키 기준 현재에는 지상에도 고루 퍼져 있다. 신성제국이 토벌하는 것은 교황이 만든 가상의 카시마르라는 점도 함께 반영했다. 2026-08-04 작가 확인 — 발생 경로가 하나 더 있다. 주체가 죽은 노모스는 일정 기간 유지되다 서서히 붕괴하며 그 잔해가 모여 카시마르가 된다. 붕괴 이후 지상에 카시마르가 퍼진 것은 지층에서 올라온 것이 아니라 이 경로로 사람들이 만든 결과다. 그리고 누스 자체는 결코 카시마르가 되지 않으나 카시마르가 누스를 활용할 수 있다.","image":"resource/wiki/카시마르.png","imageCaption":"카시마르의 외형","summary":[["한 줄 정의","썩은 [[노에시스]]에서 나는 존재"],["이름","[[컴퍼니]]가 붙였다"],["있는 곳","[[그렌빌리아 대륙]]의 지층"],["원인","[[대악몽]]"],["지상 유출지","[[카시마르 산맥]] · 드레드 분지 호수"],["다른 대륙","존재하지 않는다"],["영향받는 국가","[[컴퍼니]] · [[신성제국]]"],["붕괴 이후","지상에도 고루 퍼진다"],["발생 조건","노에시스가 고여 썩은 곳"],["또 다른 발생","주인을 잃은 [[노모스]]의 잔해"],["변종","반 카시마르"],["누스","되지 않는다 · 활용할 수 있다"],["등급 체계","[[신성제국]] 내부 척도뿐"],["상징","'재정복' — 드레드노의 국가 상징어"]],"content":"# 카시마르\n\n```틀\n핵심 개념\n```\n\n[[노에시스]]가 고여서 썩은 곳에서 발생하는 존재. **[[그렌빌리아 대륙]]의 지층에 고루 퍼져 있고, 다른 대륙에는 존재하지 않는다.**\n\n## 대악몽이 남긴 것\n\n카시마르가 지층에 있는 이유는 **[[대악몽]]** 때문이다.\n\n오랫동안 인과가 반대로 알려져 있었다 — 지층에 있던 카시마르가 대악몽으로 뿜어져 나왔다는 것이다. 실제는 그 반대다. **대악몽 때문에 카시마르가 지층에 남았다.**\n\n그래서 이 존재는 [[그렌빌리아 대륙]]에만 있다. 다른 대륙에는 카시마르가 존재하지 않으며, 노에시스를 다루는 방식이 다른 [[로디니아 대륙]]에서는 병리도 다른 형태로 나타난다.\n\n## 지상으로 새어나오는 두 곳\n\n지층의 카시마르가 지상으로 올라오는 곳은 **딱 두 곳**이다.\n\n| 유출지 | 어디 |\n|---|---|\n| **[[카시마르 산맥]]** | [[컴퍼니]]가 개발하는 산맥. [[신물질]]이 발견된 곳이기도 하다 |\n| **드레드 분지 호수** | [[신성제국]]의 심장. 고대 바실리아 공동체가 그 옆에 있었다 |\n\n**그래서 카시마르에 시달리는 나라는 [[컴퍼니]]와 [[신성제국]] 둘뿐이다.** [[연방]]과 [[연합]]은 이 존재를 소문으로만 안다. 대륙 전체가 몬스터에 쫓기는 세계가 아니라, 두 곳의 구멍이 두 나라의 운명을 결정한 세계다.\n\n## 이름\n\n**'카시마르'는 [[컴퍼니]]가 붙인 이름이다.** '악몽'을 뜻하는 러시아어 **кошмар**(코시마르)를 조금 변형한 것이다.\n\n[[컴퍼니]]의 [[자캅카스 광업회사]]가 [[카시마르 산맥]]을 개발하다 이 존재를 처음 **보고**했고, 그 보고에 쓰인 이름이 대륙에 퍼졌다. 이 세력의 고유명사가 대부분 러시아 계열이라는 점과 같은 줄이다.\n\n즉 **이름이 근대에 붙었다.** 중세에 [[레콩키스타]]로 이것을 소탕한 이들은 카시마르라는 말을 몰랐고, 노에시스에 대한 이해가 부족했기에 '괴물 아니면 악마'로만 규정했다.\n\n## 붕괴 이후\n\n국가 체제가 모두 무너진 위키 기준 현재에는 **지상에도 고루 퍼져 있다.**\n\n지층에서 더 새어나온 것이 아니다. **사람이 만든 것이다.** 국가가 무너지는 과정에서 [[노모스]] 개념이 민간에 퍼지고, 대다수의 사람들이 자기 노모스 안으로 들어가 굶어 죽었다. 주인을 잃은 노모스는 서서히 붕괴하고 그 잔해가 카시마르가 된다. → [[노모스]]\n\n유출지가 두 곳뿐인 세계에서 카시마르가 어디에나 있게 된 이유가 지질이 아니라 인간이라는 뜻이다. 국지 세력이 난립하며 각자도생하는 시기의 배경이 된다.\n\n## 노모스의 잔해\n\n그래서 발생 경로가 둘이다.\n\n| 경로 | 조건 |\n|---|---|\n| **고여 썩는다** | 노에시스가 빠져나가지 못하고 축적된 자리 — 지층 · [[바다]] |\n| **[[노모스]]가 무너진다** | 주체가 죽어 회수되지 못한 활성 노에시스의 잔해 |\n\n두 경로의 조건이 실은 같다. 둘 다 노에시스가 갇힌 공간이며, **주체가 있으면 [[노모스]]가 되고 없으면 썩는다.**\n\n그리고 **좁은 공간일수록 진한 노모스가 되므로, 방 하나가 남기는 카시마르가 국가 규모의 것보다 진하다.**\n\n## 반 카시마르\n\n원래 사람이었으나 **물속에서 엄청난 농도의 노에시스에 오랜 기간 노출되어 반쯤 카시마르가 된** 존재가 있다.\n\n[[바다]]의 노에시스는 3분만 노출되어도 정상적인 거동이 불가능할 정도인데, 그것을 오랜 기간 견딘 경우다. 사람의 모습을 유지하고 말과 계략도 가능하다.\n\n**이것이 이 대륙 사람의 몫이다.** 노에시스가 과포화된 환경에 오래 노출되면 사람이 변하는데, 무엇이 되는지는 그 사람이 노에시스를 어떻게 다뤄왔는지에 따라 갈린다. 이 대륙에는 [[노에시스]]를 정련하는 법이 없고 대신 **소망**이 강하므로, 통제를 잃는 것이 아니라 스며들어 침식된다.\n\n[[로디니아 대륙]]에서는 같은 환경에서 사람이 **키메라**가 된다. 체내에서 기를 운용해온 이들이므로 그 통제를 잃고 폭주하는 쪽이다.\n\n[[판노티아 대륙]]에는 이 경로가 아예 없다. 그곳 사람들은 노에시스를 몸 밖의 [[누스]]에 넘겨 쓰므로 과포화되지 않으며, 대신 **결핍**에서 괴물이 나온다 — 아무것도 방출하지 않게 된 자들이 방출하는 모든 것을 먹어치우려 드는 쪽이다(가명 '불신자').\n\n**이 존재들을 묶는 총칭은 아직 없다.** 넘쳐서 침식되고, 넘쳐서 폭주하고, 비어서 굶주린다. 셋 다 노에시스의 균형이 무너진 결과이지만 무너지는 방향이 다르다.\n\n## 신성제국의 가상 카시마르\n\n[[신성제국]]에는 실재하는 유출지가 있는데, 그 나라의 기사들이 토벌하는 것은 **교황이 만들어낸 가상의 카시마르**다.\n\n[[하얀 일요일]] 이후 세워진 체제에서 장정한 백성은 모두 교황에게 서임받아 기사가 되고, 그 가상의 적을 토벌하는 것을 1순위 목표로 삼는다. 이 나라에서 카시마르는 실재하는 위협이면서 동시에 국가가 국민을 묶는 명분이기도 하다.\n\n**등급 체계도 [[신성제국]] 안에서만 통용된다.** 숫자가 클수록 큰 규모이며, 대륙 표준 척도는 없다.\n\n## 역사\n\n- 고대에는 노에시스와 카시마르 양쪽에 대한 이해가 매우 부족했기에, 당시 사람들은 이들을 단순히 '괴물 아니면 악마'로 규정했다.\n- [[대악몽]]은 카시마르가 대규모로 발생한 사건이다. 이 사건으로 고대 바실리아 공동체와 그 인접 국가들이 모조리 멸망했다. **유출지인 드레드 분지 호수 옆에서 벌어진 일이다.**\n- 대악몽 이후 사람들은 드레드 분지를 멀리했고, 그 지역에 ‘드레드’(Dread)라는 이름을 붙여 가까이하지 못하게 했다.\n- 중세에 드레드 분지를 차지한 기사단이 잔존 개체 소탕에 나섰고, 이때 맺은 각 세력·기사단 간의 계약이 [[레콩키스타]]다. → [[신성제국]]\n- 신성제국에서는 '연합 토벌'이라는 정기적인 행사를 통해 카시마르를 토벌한다. 여기서 '연합'은 [[연합]](헬라스)이 아니라 일반 명사로, 신성제국 내 재단·학원들이 연합한다는 뜻이다.\n\n## 대응\n\n- **격퇴에는 노에시스를 쓴다.**\n- **위키 기준 현재**, 국가 체제가 무너진 이후로는 통일된 대응 주체가 없다. 각 세력이 카시마르 대응을 위해 **각자도생**하는 형태에 가깝다. 국지 세력이 난립하는 원인 중 하나다.\n\n## 누스를 활용한다\n\n**[[누스]] 자체는 결코 카시마르가 되지 않는다.** 사람의 노에시스는 죽으면 사라지고 [[노모스]]의 잔해는 썩지만, 누스는 그 경로를 타지 않는다.\n\n**다만 카시마르가 누스를 활용할 수 있다.** 누스는 일반인을 [[노에마]] 능력자로 만드는 매개체이며, 그것을 쓰는 쪽이 사람이어야 할 이유는 없다.\n\n## '재정복'을 말한다\n\n[[카시마르]]가 **'재정복'이라는 [[신성제국]]의 국가적 상징어를 그대로 사용하는** 장면이 있다. [[레콩키스타]]는 이 존재를 소탕한 계약의 이름이고, 그 말이 이제 반대쪽 입에서 나온다. → [[신성제국의 문화]]\n\n'재정복'은 《[[기사행전]]》의 세계에서 나온 말이다. 그 책은 [[누스]]이고, [[신성제국]]의 법이며, 현재 행방이 알려지지 않았다. 위 「누스를 활용한다」와 겹쳐 읽으면 이 장면이 단순한 아이러니가 아닐 수 있다 (추정).\n\n## 관련 문서\n\n- [[노에시스]] · [[바다]] · [[대전쟁]]\n- [[카시마르 산맥]] · [[신물질]] · [[컴퍼니]]\n- [[신성제국]] · [[대악몽]] · [[레콩키스타]] · [[하얀 일요일]]\n\n## 여담\n\n**사건의 이름에서 존재의 이름이 나왔다** (독자의 읽기). [[대악몽]]은 이 존재가 대량으로 발생한 사건의 이름이고, 근대에 [[컴퍼니]]가 그 존재에 붙인 이름이 러시아어 '악몽'이다. 같은 말이 사건에서 존재로 옮겨온 것이며, 그래서 이 존재의 이름은 고대의 사건을 근대의 언어로 되풀이한 형태가 된다. [[대악몽]] 이후 사람들이 그 땅을 '드레드'(두려움)라 부른 것도 같은 계열이다.\n\n**한 대륙에만 있는 존재다.** 이 세계의 다른 어느 대륙에도 카시마르가 없다. 고대에 한 공동체가 [[누스]]로 [[노에마]]를 남용한 결과가 대륙 하나의 지층에 영구히 남았고, 그것이 근대까지 두 나라의 운명을 결정했다.\n\n**두 구멍이 두 나라를 만들었다.** [[컴퍼니]]는 [[카시마르 산맥]]을 개발하려다 재앙을 만나고, [[신성제국]]은 드레드 분지 호수 옆에서 [[대악몽]]으로 고대 문명을 잃고 그 자리에 기사의 나라를 세웠다. 같은 존재가 한쪽에서는 산업의 걸림돌이 되고 다른 쪽에서는 국가의 존재 이유가 되었다.\n\n**[[신성제국]]에서는 실재와 가상이 겹쳐 있다.** 호수에서 실제로 새어나오는 것이 있고, 교황이 만든 가상의 적이 따로 있다. 기사들이 무엇을 토벌하고 있는지가 그 나라 안에서는 구별되지 않는다. [[그라나다 재단]]이 카시마르가 지속적으로 발생하는 상황에 의문을 품고 체제를 의심하는 것도 이 겹침을 눈치챈 것으로 읽힌다.\n\n**[[연방]]에 카시마르가 없다는 것이 그 나라의 성격을 설명한다.** 지층에만 있고 새어나오지 않으므로, 연방은 초자연적 위협을 겪지 않는 나라다. 그래서 그곳의 서사는 끝까지 정치로만 굴러가고, [[세계관 대문]]에 적힌 은폐 구조도 성립한다.\n\n**사람이 카시마르의 최대 산지가 된다.** 원래 이 존재는 지층과 [[바다]]에 축적된 노에시스에서 났고, 사람이 자연히 분비하는 양은 그에 비하면 미미했다. 그런데 [[노모스]] 개념이 퍼진 뒤로는 **사람 한 명이 방 하나씩 카시마르를 만든다.** 두 개의 구멍이 두 나라의 운명을 결정한 세계가, 무수한 방이 대륙의 운명을 결정하는 세계로 바뀐 셈이다.\n\n**아직 알려지지 않은 것.** 대륙 표준 등급 체계, 왜 하필 그 두 곳에서만 새어나오는지, 그리고 카시마르가 실제로 어떤 [[누스]]를 활용하고 있는지.","parentId":"core-concepts"},{"title":"폭발과 연소","id":"combustion","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"완료","tags":["핵심 규칙","화약","기술 규칙"],"memo":"원문 §핵심 개념에는 없던 문서. 2026-07-31 정합성 점검에서 확정한 화약 판정 기준을 한 자리에 모은 것이다. 판정표와 '기술의 기준' 6개 문장은 점검 메모 §2·§3·§5에서 왔고 작가 승인을 받았다. 휴대 병기 계보는 작가 확인(올림피아드가 화포 소형화에 성공, 그것이 감독관의 무장)에 따른 것.","image":"resource/wiki/폭발과 연소.png","imageCaption":"화포의 노에시스 필터 구조","summary":[["한 줄 정의","노에시스의 반응 억제 판정 기준"],["억제 기준","반응이 스스로를 증폭시키는가"],["억제 강도","그 대륙의 포화도를 따라간다"],["가능","지속 연소 · 보일러 · 제철 · 발전"],["제한적 가능","흑색화약 · 대형 화포"],["불가능","무연화약 · 고폭약 · 내연기관"],["휴대 화기","없음 — 예외는 [[올림피아드]]"],["예외","[[노모스]] 내부"]],"content":"# 폭발과 연소\n\n[[노에시스]]가 무엇을 막고 무엇을 허용하는지에 대한 판정 기준. 이 세계의 기술 수준은 거의 전부 이 문서에서 파생된다.\n\n## 기본 규칙\n\n일반적인 화염과 지속 연소는 가능하지만, 압력과 반응 속도가 서로를 증폭시키는 급격한 반응은 비활성 [[노에시스]]의 간섭을 받는다. 비활성 노에시스는 짧은 시간 안에 스스로 가속되는 발열 반응의 전파면을 붕괴시킨다.\n\n억제의 기준은 '연소인가 아닌가'가 아니라 **반응이 스스로를 증폭시키는가**이다.\n\n## 억제 강도는 포화도를 따라간다\n\n[[노에시스]]의 분비는 개인 층위에서 불규칙하지만, **대륙의 포화도는 고정값이고 억제는 그 수치를 규칙적으로 따라간다.** 그래서 어느 대륙에서 무엇을 만들 수 있는지가 수치 하나로 정해진다.\n\n아래 판정표는 [[그렌빌리아 대륙]](포화도 70) 기준이다.\n\n세 대륙의 포화도 순서가 정해져 있다.\n\n| 대륙 | 포화도 | 화기 |\n|---|---|---|\n| [[로디니아 대륙]] | 가장 높다 | **성립하지 않는다** — 냉병기만 |\n| [[그렌빌리아 대륙]] | 70 | 흑색화약의 폭연과 대형 화포까지 |\n| [[판노티아 대륙]] | 가장 낮다 | **물리적으로 성립한다** |\n\n[[판노티아 대륙]]에서도 실제로 쓰이는 것은 대부분 냉병기다. 억제가 약해서 화기가 작동하는데도 그렇다 — 그 대륙에서 무기는 [[누스]]('성체')로 삼아야 힘이 되고, **구조가 복잡한 기계장치일수록 성체로 삼기 어렵기** 때문이다. 현대적인 총기가 존재하고 엘리트 집단이 그것을 쓰지만, 표징의 크기가 이해에 비례하므로 총을 들었다고 더 강해지지는 않는다.\n\n**포화도가 곧 그 문명의 병기 상한선이다.**\n\n## 판정표\n\n| 기술 | 가능 여부 | 비고 |\n|---|---|---|\n| 장작·석탄·코크스의 지속 연소 | 가능 | 지속 연소 |\n| 용광로·보일러 | 가능 | 외연기관 |\n| 제철·압연·증기 해머 | 가능 | 폭발이 아니라 열과 기계력을 쓴다 |\n| 전기 발전 | 가능 | |\n| 흑색화약의 느린 폭연 | 약하게 가능 | 표면연소 |\n| 굵은 약립의 대형 화포 | 조건부 가능 | 필터와 긴 포신이 필요 |\n| 무연화약의 빠른 고압 연소 | 거의 불가능 | 반응 전파가 붕괴 |\n| 니트로글리세린·다이너마이트·고폭약 | 불가능 | 폭굉 전파 붕괴 |\n| 내연기관 | 극도로 불안정 | 반복 점화가 유지되지 않는다 |\n\n## 화약 병기의 계보\n\n1. **일반 휴대용 총기** — 존재하지 않는다.\n2. **대형 화포** — '노에시스 필터'를 달아 약실 안에서만 노에시스를 걸러내는 방식. [[연합]]이 전 대륙 최초로 공개했다. 굵은 약립은 표면적이 작아 노에시스와 접촉하는 면적도 줄어들기 때문에, 연소는 느리지만 억제당하는 속도 역시 느리다. 그래서 긴 포신과 큰 약실을 가진 화포에서만 실용적인 압력을 만들 수 있고, 시제품이 사람 두세 명 크기가 되는 이유도 여기에 있다.\n3. **핸드캐논** — [[올림피아드]] 수준에서 화포의 소형화에 성공한 것. 한 사람이 들고 겨눌 수 있는 화약 병기이며, [[감독관]]의 무장에 포함된다. 대륙에서 이것을 본 사람은 극소수다.\n\n## 노모스 안에서는 예외다\n\n[[노모스]] 내부에서는 **활성 주체가 원한다면 폭발을 일으킬 수 있다.**\n\n다만 위 판정표가 뒤집히는 것이 아니다. 화약을 통한 폭발이 아니라 **[[노에시스]]를 통한 폭발력의 재현**이다. 억제 대상인 자기증폭 발열 반응을 쓰지 않고 같은 결과만 만들어내므로, 규칙은 그대로 유지되고 결과가 우회된다.\n\n노모스는 개인이 고정값인 환경 층위를 **국소적으로 덮어쓰는** 유일한 수단이며, 그 안에서는 이 문서의 판정이 주체의 것으로 바뀐다. → [[노모스]]\n\n## 기술의 기준\n\n향후 기술·병기 설정을 판정할 때의 기준 문장.\n\n1. 노에시스는 공기를 대체하는 기체가 아니라, 대기와 중첩된 준물질이다.\n2. 노에시스는 일반적인 화염을 끄지 않고, 빠르게 자기증폭하는 발열 반응과 압력 전파를 억제한다.\n3. 흑색화약은 느린 표면연소 덕분에 제한적으로 작동하지만, 무연화약과 고폭약은 반응 전파가 붕괴한다.\n4. 밀폐·정화된 약실에서는 화약의 성능을 회복할 수 있지만, 필터의 부피와 냉각·재정화 시간 때문에 소형화와 연사가 어렵다.\n5. 증기기관, 용광로, 전기 발전과 금속 대량생산은 가능하지만, 내연기관과 고폭약은 실용성이 없다.\n6. 노에시스를 우회하는 기술은 존재하지만, [[연합]]의 독점과 국제조약, 희귀 소재 때문에 대량 보급되지 않는다.\n7. 억제 강도는 그 대륙의 포화도를 규칙적으로 따라간다. 판정은 대륙별로 다르며, 위 표는 [[그렌빌리아 대륙]] 기준이다.\n8. [[노모스]] 내부는 예외다. 주체가 폭발력을 재현할 수 있으나 화약을 통한 것이 아니다.\n\n## 여담\n\n**이 세계는 '흑색화약 시대에 멈춘 세계'가 아니다.** 폭발화학만 흑색화약 부근에서 막히고, 증기·전기·재료공학·행정은 근현대까지 뻗었다. 대륙 규모 철도망, 제철소, 컨테이너선, 비행선이 존재하는 것과 모순되지 않는다. \"금속 대량생산이 존재하지 않는다\"는 구 설정은 폐기됐다.\n\n**폐기·보류 항목.**\n- 폐기: `금속 대량생산이 존재하지 않음` — 위와 같은 이유.\n- 폐기: `활과 석궁은 총보다 불편하므로 거의 사용하지 않음` — 휴대용 총기가 없는 세계에서 석궁이 사라질 이유가 없다. 오히려 보병 원거리 무기의 표준이 될 쪽이다. 대체 무기(강철 활대 석궁, 레버식 연발 석궁, 압축공기총, 증기 공성포, 고정식 방전 병기)에 각각 결함을 부여하는 방향이 남아 있다. 아직 안 씀.\n- 보류: 원자력이 불가능한 이유. 핵분열은 화학적 연소가 아니므로 위 규칙으로는 막히지 않는다. '아직 발견하지 못했다'로 두는 쪽과 '노에시스가 자유 중성자에도 간섭한다'는 성질을 추가하는 쪽 중 미결.\n\n**화약 입도는 설정을 고치기로 확정**. 옛 설정은 \"화약의 분말이 굵을수록 더 강력한 폭발력을 가진다\"였는데 현실의 입도 원리와 반대였다. 위 「화약 병기의 계보」 2항이 고친 판이다 — 굵은 약립은 표면적이 작아 노에시스와 접촉하는 면적도 줄어들므로, 연소는 느리지만 억제당하는 속도 역시 느리다.\n\n**작품 어디에도 나오지 않는다.** 설정 원고 3,271줄, 대본 22편, 추출 텍스트 470페이지를 통틀어 `권총` `소총` `머스킷` `볼트액션` `리볼버` `라이플` `산탄` `총기` `방아쇠` `탄환` `총구` `총알` `장전` `탄약` `사격` `저격`은 전부 0건이다. 유일한 휴대 화기는 [18편. 가족, 가족과….md:176](../../script/가문과%20가족%202부/18편.%20가족,%20가족과….md:176)의 타게니아 대사 한 줄이다. 정리 문서 44행에 링크된 Google Docs 「세계관 초안」은 확인하지 못했다.","parentId":"noesis"},{"title":"핵심 개념","id":"core-concepts","type":"개념","folder":"01_핵심 규칙","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["핵심 규칙"],"memo":"원문(세계관 정리.md 46~52행)의 두 원칙 문장을 그대로 옮김. 하위 6항목은 원문 순서대로.","image":"","imageCaption":"","summary":[["성격","이 세계의 규칙"],["원칙","'진실'만 적는다"],["하위 항목","7개 · 사례 2개"],["심화 미작성","[[노에마]] · [[노모스]] · [[누스]]"]],"content":"# 핵심 개념\n\n```틀\n핵심 개념\n```\n\n**해당 페이지는 일종의 ‘규칙’을 써두는 공간으로, 반드시 ‘진실’만 작성되어 있음.**\n\n**메모) 노에마, 노모스, 누스 개념은 추후 실제 구현 과정에서 극적인 효과를 위해 설정이 변동될 수 있으므로, ‘심화’까지는 작성하지 않도록 함.**\n\n## 하위 문서\n\n- [[노에시스]] — 사고에서 분비되는 준물질. 이 세계와 현실의 근본적 차이\n  - [[폭발과 연소]] — 노에시스가 무엇을 막고 무엇을 허용하는가\n- [[노에마]] — 노에시스를 사용한 초자연적 행위의 총칭\n- [[노모스]] — 활성 노에시스만 존재하게 된 영역\n- [[누스]] — 사람 이외에 노에시스를 분비하는 물질\n  - [[연방 헌법]] — [[연방]]의 누스. [[헌병대]]의 매개체\n  - [[기사행전]] — [[신성제국]]의 누스. 그 나라의 법\n- [[카시마르]] — 노에시스에서 발원한 존재\n- [[바다]] — 대륙을 갈라놓는 고농도 노에시스\n- [[바다 민족]] — 신대륙에 최초로 도달한 구대륙의 민족\n\n## 여담\n\n- 원문 §핵심 개념에는 노에시스·노에마·노모스·누스·바다·바다 민족 6항목만 있다. [[카시마르]]는 원고에서 §1 신성제국사에 흩어져 있던 것을, 특정 국가에 묶이지 않고 대륙의 지층에 퍼져 있는 존재라는 점에 따라 이 자리로 올렸다. 그래서 정사 등급이 다른 항목보다 낮다.\n- 위 '메모)' 원칙에 따라 [[노에마]] · [[노모스]] · [[누스]]에는 `심화` 절을 쓰지 않았다. [[노에시스]]에만 있다.\n- 다만 2026-08-04에 [[노모스]]의 규칙이 크게 늘었다 — 밀폐 공간의 복사 증폭이라는 성격, 밀도, 내부에서의 폭발 재현, 주체가 죽었을 때의 붕괴와 [[카시마르]] 생성. `심화` 절을 새로 만든 것은 아니고 확정된 규칙을 본문에 반영한 것이다.","parentId":null},{"title":"건국의 아버지들","id":"founding-fathers","type":"세력","folder":"02_지역","sortOrder":50,"era":"근대","canon":"확정","status":"완료","tags":["연방","의회","해체","건국"],"memo":"원문 302~306행 문장 그대로. 작가 확인(2026-07-31)으로 두 가지가 확정됐다 — 이들은 연말 위기 쿠데타의 '대상'이었고 현재 완전히 와해되었으며, 서사 시점에 먼로가 헌병을 부리는 장면은 전부 과거 회상이다. 대본 용어사전은 이들을 현재 기능하는 기구처럼 적고 있는데, 사전이 스포일러를 피하는 서술 방침이므로 의도된 것으로 보고 손대지 않았다.","image":"resource/wiki/건국의 아버지들.png","imageCaption":"건국의 아버지들의 상징","summary":[["원어","Founding Fathers"],["출신","[[신성제국]]에서 이탈한 귀족 가문"],["성격","최상위 의결 기구 — 만장일치"],["파벌","대부분 [[철도파]] 강경 계열"],["표어","여럿으로 이루어진 하나."],["알려진 인물","[[먼로]] · [[애덤스]]"],["현재","와해 — 쿠데타의 대상"],["남긴 것","[[헌병대]] 지휘권 (혈족 상속)"]],"content":"# 건국의 아버지들\n\n**Founding Fathers**\n\n연방 건국의 주역이자, 과거 드레드노 제국의 유력한 귀족 가문. 소속된 의원 대부분이 철도파에 소속된 이들이었고, 철도 연합(유나이티드 레일로드)을 강경하게 추진하던 이들이었으나. ‘연말 위기’ 사건 이후 대부분의 인원을 잃고 의회에서 종적을 감추게 되었다.\n\n```표어\n여럿으로 이루어진 하나.\n```\n\n## 성격\n\n- **세 기능을 겸했다.** 최상위 의결 기구이면서 **행정과 사법도 함께 맡고 있었다.** 그래서 이들의 와해는 한 세력의 소멸이 아니라 국가 기능 셋이 동시에 사라진 사건이 된다. → [[연방의 정치]]\n- **만장일치로 결정하며, 그 결정은 법적 논의의 바깥에 있다.**\n- **[[신성제국]]에서 나왔다.** 드레드노 제국에서 이탈한 귀족 가문이 대륙 중부 소국들을 규합해 [[연방]]을 세웠다. 이탈한 시점이 **그쪽이 신정으로 전환할 때**였으므로, 이들이 세운 나라는 처음부터 종교를 두지 않는다. → [[연방의 문화]]\n- **철도 기술을 규합의 수단으로 썼다.** 대륙 중부 소국들의 철도 기술이 독보적이었고, 이들이 그것을 각 소국·대가문을 묶는 핵심 요소로 활용했다.\n- [[연합]]의 [[올림피아드]] 감독관들과 긴밀한 협력 관계를 맺고 있었다. 연방이 예상보다 강경해지자 연합은 이들을 통한 영향력 확대를 포기하고 반 연방 세력을 형성했다.\n\n## 와해\n\n[[연말 위기]] 당시 [[통일파]] 쿠데타의 **대상**이었다. [[철도파]] 강경 계열로서 전쟁을 강행하려 했고, 철도파 의원들과 함께 화재로 대부분 사망했다. 쿠데타가 성공했으므로 현재는 완전히 와해된 상태다.\n\n이들의 와해가 남긴 것이 넷이다. 연방을 통합할 최상위 권위가 사라졌고, **행정부와 사법부가 함께 사라졌으며**, [[연합]]과 연방을 잇던 창구가 끊겼다.\n\n지금 이 나라에 남은 통치 기구는 [[의회]] 하나다. → [[연방의 정치]]\n\n## 혈족\n\n지휘 계통이 혈통을 따라 남아 있다. [[연방 헌법]]을 매개체로 하는 [[헌병대]]는 건국의 아버지들의 혈족에게 반응하므로, [[애덤스]]의 딸인 [[세라]]가 민간인 신분으로 헌병을 부릴 수 있다.\n\n## 이름\n\n**Founding Fathers** — 미국 건국자들을 부르는 말을 그대로 가져왔다.\n\n이 세력과 그 직속 무력의 인물 이름이 모두 같은 계열이다.\n\n| 인물 | 실제 |\n|---|---|\n| [[먼로]] | James Monroe · 미국 5대 대통령 |\n| [[애덤스]] | John Adams · 2대 대통령 |\n| 벤자민 | Benjamin Franklin |\n\n벤자민은 [[헌병대]] 소속이며, 대본 전체에서 헌병이 이름으로 불리는 유일한 자리다(18편). **이 기구와 이 기구가 부리는 무력의 이름이 같은 우물에서 나온다**는 뜻이고, 헌병의 지휘권이 혈족을 따른다는 설정과도 겹친다.\n\n## 알려진 인물\n\n- [[먼로]] — 지도자\n- [[애덤스]] — 지도자. [[세라]]의 아버지\n\n## 관련 문서\n\n- [[연방]]\n- [[연말 위기]]\n- [[철도파]] · [[통일파]]\n- [[연방 헌법]] · [[헌병대]]\n- [[신성제국]] · [[올림피아드]]\n\n## 여담\n\n**오해하기 쉬운 자리다.** 대본 [[인물관계도]]에 \"앤드루 - 먼로 | ?무슨 사이 | 용병을 부려 연방 전역의 지하를 파헤치고도, 국가로부터 아무런 제지를 받지 않는다\"가 있어, 먼로가 서사 시점에 실권을 쥔 것으로 읽었다. 그러나 **서사 시점에 먼로가 나오는 장면은 전부 과거 회상**이다. 그 관계의 라벨이 '?무슨 사이'인 것은 아직 밝혀지지 않은 관계라는 표시이므로, 앤드루가 제지받지 않는 이유는 별개의 미공개 사안으로 남는다.\n\n**건국의 아버지들이 신성제국 출신이라는 점이 크다.** [[연방]]과 [[신성제국]]은 서사에서 강과 산맥으로 갈려 거의 접점이 없는데, 연방의 창건자들이 그쪽에서 이탈한 귀족이다. 두 국가 사이에 아직 쓰이지 않은 실이 하나 있는 셈이다.","parentId":"federation"},{"title":"경찰청","id":"police","type":"세력","folder":"02_지역","sortOrder":80,"era":"서사 시점","canon":"확정","status":"완료","tags":["연방","치안","무력"],"memo":"원문 319~320행 문장 그대로.","image":"resource/wiki/경찰청.png","imageCaption":"파출소 풍경","summary":[["소속","[[의회]] 산하"],["성격","연방의 중앙 치안조직"],["설치 단위","주별 관할 경찰청"],["두 갈래","직속 경찰 (경찰서) / 허가 경찰 (파출소)"],["비중","파출소가 압도적으로 많다"],["확대 계기","[[연말 위기]] 이후의 치안 공백"],["마찰","[[보안관]]과 관할 분쟁"],["정치적 통로","[[통합파]]"]],"content":"# 경찰청 🗡️\n\n연방 의회 산하의 치안조직. 각 주마다 관할 경찰청을 두는 형태로 운영되고 있으며, 경찰청에 직접 소속된 직속 경찰과, 경찰청의 허가만 받고 개별적으로 치안 활동을 유지하는 ‘경찰대’가 별도로 존재한다. 이들의 기반이 ‘경찰서’인지, ‘파출소’인지에 따라 소속 경찰과 허가 경찰을 구분할 수 있으며, 파출소의 수가 압도적으로 많다.\n\n## 두 종류의 경찰\n\n| | 기반 | 소속 | 수 |\n|---|---|---|---|\n| 직속 경찰 | 경찰서 | 경찰청 직속 | 적다 |\n| 허가 경찰 (경찰대) | 파출소 | 허가만 받은 개별 조직 | 압도적으로 많다 |\n\n허가 경찰은 경찰청의 허가만 받고 개별적으로 치안 활동을 유지하므로, 경찰대에 따라 [[보안관]]과 협력하는 경우도 다수 제보된다.\n\n## 사법 기능의 승계\n\n[[연말 위기]]로 사법부가 사라진 뒤, 재판이 필요한 일이 [[보안관]]과 경찰에게 **애매하게 승계되었다.** 두 조직이 같은 땅에서 치안을 다투는 것은 밥그릇 싸움이 아니라 **어느 법으로 판단할지의 싸움**이기도 하다. → [[연방의 정치]]\n\n판정해 줄 상급심이 없으므로 분쟁은 현장에서 끝난다. 9편에서 [[필립]]이 법적 관할을 따지는 경찰에게 \"관할이고 뭐고\"라 답할 수 있는 것이 그 구조다.\n\n## 0호 비상사태\n\n경찰 인력을 즉시 투입해야 하는 최고 등급의 비상 지령이다. 지령문은 이렇게 내려온다.\n\n```조문\n[‘0호 비상사태’ 발생. 해당 메시지를 수신하는 즉시, 연방 의회로 경찰 인력을 투입할 것.]\n— 0호 비상사태 지령문, 12편\n```\n\n12편에서 이 지령이 **조작되어** 발신되고, 경찰청 전체가 흔들린다. 전임 청장의 이름으로 내려온 지령이라 현직 청장도 즉시 부정하지 못한다는 점이 문제의 핵심이다.\n\n**행정부가 없기 때문에 검증할 상급 기관도 없다.** 각 부처가 독자적으로 판단해 대응하는 구조에서, 위조된 지령 하나가 그대로 통한다. → [[연방의 정치]]\n\n## 무장 문제\n\n비무장국가의 치안조직이므로 무엇을 들 수 있는지가 계속 쟁점이 된다.\n\n- 9편 — 동방주에서 심야 조례를 앞세운 경찰 **무장해제**가 [[보안관]]에 의해 현장 집행된다.\n- 13편 — \"동부 경찰청에서 ‘살상용 무기’를 무장하고 있다\"는 정보가 의회로 올라가, 무장해제 조례의 명분이 된다.\n\n## 관련 문서\n\n- [[연방]] · [[의회]] · [[통합파]]\n- [[0호 비상사태]]\n- [[보안관]] — 관할을 다투는 상대\n- [[기동대]] — 인력을 제공하는 곳\n- [[헌병대]]\n- [[연말 위기]] — 확대의 계기\n\n## 여담\n\n**숫자로 메운 공백이다.** 비무장화로 정규군이 사라진 자리를 연방은 경찰대를 엄청나게 늘려 메웠다. 그 결과가 '파출소가 압도적으로 많은' 구조이고, 질이 아니라 양으로 버티는 치안이 된다.\n\n**허가 경찰이 회색지대다.** 허가만 받고 개별적으로 운영되므로 통제가 느슨하다. 그래서 [[보안관]]과 협력하기도 하고, 아예 외부 세력에게 통째로 장악되기도 한다. 9편에서 동방주의 한 경찰대가 \"저희 조직원들로 완전히 장악\"되었다는 보고가 나온다.\n\n**중앙 기구라는 점이 정치적으로 중요하다.** [[통합파]]가 [[철도청]]과 함께 경찰청을 힘의 통로로 쓴다. 반대편의 [[자치파]]는 [[대가문]]과 [[보안관]]을 쓴다. 현장의 관할 다툼이 곧 의회의 파벌 다툼이다.","parentId":"federation"},{"title":"교단","id":"curia","type":"세력","folder":"02_지역","sortOrder":110,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","교단","통치기구"],"memo":"원문 457~461행 문장 그대로. 원래 평서체로 쓰인 항목이라 어미를 손대지 않았다.","image":"resource/wiki/교단.png","imageCaption":"교단의 문장","summary":[["소속","[[신성제국]]"],["성격","최고 통치기구"],["최종 결정권","[[교황]]"],["보좌","[[추기경]]"],["직속 무력","[[제국기사]] · [[성좌 기사단]]"],["조세","재단에게 작위를 주고 공유"],["현재","추기경 중심 — 중요 사안과 의례"]],"content":"# 교단\n\n```틀\n신성제국\n```\n\n신성제국의 최고 통치기구. ‘교황’이 모든 최종 결정권을 쥐며, 이를 보좌하는 ‘추기경’들로 구성되어 있다. ‘재단’과 ‘기사단’ 모두 명목상 교황을 따르는 이들이지만, 실질적으로 교황이 직접 신성제국 내 주요 세력에게 특정한 지시를 내리는 경우는 흔치 않다.\n\n현재는 추기경들을 중심으로 아주 중요한 사안 혹은 의례적인 업무만 처리하고 있는 상황이다.\n\n## 두 갈래의 충성\n\n교단이 거느리는 기사가 두 종류이고, 충성의 대상이 다르다.\n\n| 기사단 | 충성 대상 | 뽑는 방식 |\n|---|---|---|\n| [[제국기사]] | **[[교황]]** | 교단 주최 토너먼트의 최종 승자 |\n| [[성좌 기사단]] | **[[추기경]]** | 토너먼트 탈락자 중 교단이 눈여겨본 이 |\n\n## 조세\n\n세금을 걷는 것은 재단이고, 교단은 **재단에게 작위를 부여하는 것으로** 그 일정량을 공유한다. 직접 징수 기구를 두지 않고 작위를 내주는 대가로 몫을 받는 구조다. → [[신성제국의 정치]]\n\n## 관련 문서\n\n- [[신성제국]] · [[교황]] · [[추기경]]\n- [[제국기사]] · [[성좌 기사단]]\n- [[카스티야 사령부]] · [[그라나다 재단]] · [[아라곤 협회]]\n\n## 여담\n\n**최고 통치기구인데 통치하지 않는다.** [[교황]]이 직접 지시를 내리는 일이 드물고, 지금은 [[추기경]]들이 의례적인 업무만 처리한다. 재단과 기사단이 명목상 교황을 따른다는 것은, 실제로는 각 재단이 알아서 굴러간다는 뜻이다.\n\n**그래서 재단 사이의 분쟁이 국가의 정치가 된다** (추정). 위에서 정리해 주지 않으므로 [[카스티야 사령부]]와 [[그라나다 재단]]의 노선 차이가 그대로 힘겨루기가 된다. [[연방]]에 행정부가 없어 부처끼리 다투는 것과 닮은 구조다.","parentId":"holy-empire"},{"title":"그라나다 재단","id":"granada-foundation","type":"세력","folder":"02_지역","sortOrder":150,"era":"서사 시점","canon":"확정","status":"완료","tags":["신성제국","재단","경제","3대 재단"],"memo":"원문 483~484행 문장 그대로. 이름은 스페인 그라나다에서 왔다.","image":"resource/wiki/그라나다 재단.png","imageCaption":"그라나다 재단의 문장","summary":[["성격","3대 재단 — 구 제국의 재상 집단"],["산하 교육기관","산학복합체"],["역할","신성제국 경제의 핵심"],["영지","그라나다령"],["성향","실용주의"],["의심","[[카시마르]] 발생과 체제 자체"]],"content":"# 그라나다 재단\n\n```틀\n신성제국\n```\n\n과거 ‘드레드노 제국’의 ‘재상’ 집단으로 구성된 재단. 산하 교육기관은 대부분 산학복합체의 형태를 띠며, 신성제국 경제를 책임지는 핵심 재단이다. 실용주의적인 성향을 띠고 있어 카시마르가 지속적으로 발생하는 상황에 대해 의문을 품고 있으며, 신성제국 체제의 의문을 가지고 있는 재단 중 하나이다.\n\n이 재단이 물려받은 것은 구 제국의 **산업가·자본가 계층**이다.\n\n## 무엇을 의심하는가\n\n이 재단이 품은 의문의 정체가 이 나라의 비밀이다.\n\n기사들이 토벌하는 [[카시마르]]는 **[[교황]]이 만들어낸 가상**이다. 실제 유출지는 드레드 분지의 호수 하나이며, 그런데도 토벌할 적이 끝없이 나온다. 경제를 계산하는 쪽에서 보면 수치가 맞지 않는다.\n\n**인지 조작의 틈을 숫자로 눈치챈 쪽**이다.\n\n## 관련 문서\n\n- [[신성제국]] · [[교단]]\n- [[카스티야 사령부]] · [[아라곤 협회]] — 나머지 3대 재단\n- [[카시마르]] · [[하얀 일요일]] · [[교황]]\n- [[상급기사]]\n\n## 여담\n\n**실용주의가 이 나라에서는 불신이 된다.** 국민 전체가 기사가 되어 존재하지 않는 적을 토벌하는 체제에서, 손익을 따지는 집단이 가장 먼저 이상함을 느낀다. 무력([[카스티야 사령부]])도 외교([[아라곤 협회]])도 아니라 회계가 체제를 흔드는 자리에 서 있다.\n\n**[[하얀 일요일]]의 인지 조작이 완전하지 않다는 증거다** (추정). 드레드노인은 그 사건을 인지할 수 없다지만, 이 재단은 사건 자체가 아니라 **결과의 앞뒤가 맞지 않는다**는 것을 짚는다. 조작이 기억은 덮어도 장부는 덮지 못한 셈이다.","parentId":"holy-empire"},{"title":"그렌빌리아 대륙","id":"grenvillia","type":"지역","folder":"02_지역","sortOrder":0,"era":"시대 공통","canon":"확정","status":"작성 중","tags":["대륙","Vol.1","신대륙","인간"],"memo":"원문 §1 지역의 대륙 머리글(161~172행)은 작성 지침 두 줄뿐이므로, 이 문서는 §1의 각 국가 항목과 §핵심 개념에서 확인된 사실을 모은 것이다. 2026-08-04에 원문 689~1094행(컴퍼니 · 중견국 8개국 · 멸망한 국가)을 읽어 열강 표와 중견국 표, 「멸망한 국가」를 채웠다. 같은 날 작가 확인 — 이 대륙에는 오로지 인간만 존재하고, 대륙 간 접촉은 국가 붕괴 이후에 생기며, 노모스 대유행은 이 대륙만의 일이다.","image":"resource/wiki/그렌빌리아 대륙.png","imageCaption":"그렌빌리아 대륙 지도","summary":[["권","Vol.1"],["주제","소망"],["구분","신대륙"],["모티브","국가별로 다르다"],["노에시스 포화도","70"],["병기","대형 화포까지 · 스팀펑크"],["국가","열강 4 · 중견국 8"],["종족","인간"],["특이사항","[[카시마르]]가 지층에 분포"]],"content":"# 그렌빌리아 대륙\n\nVol.1의 무대 셋 중 하나. 주제는 **소망**이다. 신대륙이며, [[노에시스]] 포화도 70으로 화기가 대형 화포에서 막히는 대륙이다.\n\n```상세\n큰 그림\n로디니아 대륙\n판노티아 대륙\n```\n\n## 연혁\n\n```연혁\n고대 | 구대륙 [[판게아 대륙]]에서 [[바다 민족]]이 건너와 **동부 분지(바실리아)**와 **서부 반도(헬라스)**로 갈라져 정착한다\n고대 | [[대악몽]]으로 바실리아가 멸망. 분지를 벗어난 이들이 남부 군도와 중부로 흩어진다\n고대 | 군도의 바나토 섬을 중심으로 신정 대제국 **도미누스 제국**이 서고, 미개척지였던 중부를 정복해 **'귀족'과 '가문' 문화를 심는다**\n고전 | 정복왕 테오도르의 두 자식이 남북으로 갈라 통치한다. 서부에서는 **헬레니아 제국**이 성장한다\n고전 말 | 북도미누스가 헬레니아 침공을 시도하자 중부의 헬라스인들이 반란. 중부가 **가문 단위 소국들로 쪼개진다**\n중세 | 남도미누스가 보수 신정으로 굳어 **알비온 제국**으로 불린다. 카타니아 섬의 등대를 봉쇄한다\n중세 | 중부의 기사단이 드레드 분지를 차지하고 **[[레콩키스타]]**를 완수해 드레드노 왕국을 세운다\n중세 후기 | 레콩키스타 소식에 알비온 제국이 흔들려 각 섬의 독립을 허용하고 해체된다 → [[바나토국]]\n근대 | 북부에서 **[[크레스티아 제국]]**이 일어나 패권국이 된다\n근대 | **[[하얀 일요일]]** — 동부가 [[신성제국]]이 된다\n근대 | 중부 소국들이 철도로 규합되어 **[[연방]]**이 선다\n근대 | 연방이 쾨벤하운을 병합하고 크레스티아를 해체시킨다. 그 자리에 **[[컴퍼니]]**가 선다\n**[[연말 위기]]** | 반 연방 세력의 최후통첩과 [[통일파]]의 쿠데타. 연방이 비무장국이 된다\n신질서 | 대륙 전체에 연방 체계의 철도망 — '미트로프 중심 질서'\n서사 시점 | [[북부동맹]] 독립 선언 → [[미트로프 내전]] → 마왕 사태\n현재 | 네 국가 체제가 모두 붕괴. '유나이티드 레일로드' 중심 체제로 전환되고 [[쾨벤하운 인민연합]]이 독립한다\n```\n\n## 지리\n\n| 권역 | 지형 | 지금 있는 것 |\n|---|---|---|\n| **중부** | 요충지 · 강과 평야 | [[연방]] |\n| **동부** | 분지와 호수 | [[신성제국]] |\n| **서부** | 반도 | [[연합]] |\n| **북부** | 산악지대 | [[컴퍼니]] · [[카고르예 공화국]] · [[오흐리드 왕국]] |\n| **중북부** | — | [[루블린 공국]] · [[쾨벤하운 인민연합]] |\n| **남부** | 해협과 군도 | [[칼리아리 왕국]] · [[팔레르 기사단국]] · [[헬베티 공국]] · [[바나토국]] |\n\n**이 대륙의 역사는 물길을 따라 움직였다.**\n\n중부에서 남부 해협까지 강 하나가 이어진다. 고대에 도미누스 제국이 그 강을 타고 올라가 미개척지였던 중부를 정복했으므로, 이 대륙에서 가장 오래된 권력의 이동 경로가 이것이다.\n\n남부 해협은 암초가 많고 조류가 빨라 **등대의 유도 없이는 지날 수 없다.** 항로를 통제하는 것이 곧 그 등대를 쥐는 일이 되며, 지금 그 자리에 [[팔레르 기사단국]]이 있다.\n\n**닿지 않는 곳도 그만큼 오래 작동했다.** 북부는 산악지대라 배가 들어가지 못했다. 도미누스 제국이 대륙의 거의 전부를 지배하면서도 북부만은 손대지 못한 것이 그 때문이고, 훗날 [[컴퍼니]]가 무력 없이 자본만으로 그곳을 쥐고 열강이 된 것도 같은 지형 위에서 벌어진 일이다.\n\n## 노에시스 환경\n\n- **포화도 70.** [[로디니아 대륙]]보다 낮고 [[판노티아 대륙]]보다 높은 중간값이다. 그래서 흑색화약의 폭연과 대형 화포까지는 제한적으로 가능하다. → [[폭발과 연소]]\n- **[[카시마르]]가 있는 유일한 대륙이다.** [[대악몽]]이 이 존재를 이 대륙의 지층에 남겼기 때문이며, 다른 대륙에는 존재하지 않는다. 지상으로 새어나오는 곳은 [[카시마르 산맥]]([[컴퍼니]])과 드레드 분지 호수([[신성제국]]) **두 곳뿐**이며, 그래서 이 존재에 시달리는 나라도 그 둘뿐이다.\n- 인류는 **인간 하나**다. [[로디니아 대륙]]처럼 종족이 나뉘어 있지 않다.\n- **[[노모스]] 대유행은 이 대륙만의 일이다.** 국가들이 무너지는 과정에서 [[노에시스]]·[[노에마]]·노모스·[[누스]] 개념이 민간에 퍼지고, 대다수의 사람들이 자기 노모스 안에서 굶어 죽었다. 그 잔해가 [[카시마르]]가 되어 지상에 퍼졌다.\n\n**이 대륙의 신은 잠든 채 꿈을 꾼다.** 활동하지도 관조하지도 않는다. → [[판노티아 대륙]]\n\n## 주제 — 소망\n\n이 대륙의 세력들이 **이루지 못한 것을 바라는 형태로** 움직인다 (독자의 읽기).\n\n- [[연방]]의 [[궤간 통일]]은 건국 이래의 숙원이고, [[철도청]]이 무력을 쓰게 되는 이유다.\n- [[세라]]는 무너진 나라를 '가족'의 이름으로 다시 세우려 한다.\n- [[교황]]은 자기가 읽은 이야기 그대로의 나라를 만들었다.\n- [[컴퍼니]]는 제국의 압제에 맞선 연대에서 출발해 기업국가가 되었다.\n- [[잔존 함대]]는 황가가 어딘가에 살아 있다고 믿고 제정 복고를 목적으로 삼는다.\n\n그리고 [[노모스]] 대유행이 이 대륙에서만 벌어진 것도 같은 줄에 있다 — **작은 방에서 무언가를 아주 강하게 바라면 그 공간이 통째로 그렇게 변한다**는 것을 알게 된 사람들의 이야기다.\n\n## 열강\n\n| 국가 | 위치 | 핵심 키워드 | 서사에서의 축 |\n|---|---|---|---|\n| [[연방]] | 대륙 중부 요충지 | 행정 · 철도 · 치안 | 대륙 서사의 핵심 축 |\n| [[신성제국]] | 대륙 동부 분지 | 교육 · 기사 · 선박 | [[노에시스]] 서사의 핵심 축 |\n| [[연합]] | 대륙 서부 반도 | 과학 · 기술 · 외교 | 대륙 발전 서사의 핵심 축 |\n| [[컴퍼니]] | 대륙 북부 산악지대 | 산업 · 물류 · 효율 | **일상 서사**의 핵심 축 |\n\n[[컴퍼니]]는 넷 중 역사가 가장 짧고 정상적인 국가라 하기에 애매하지만, [[크레스티아 제국]]의 산업력과 자원을 온전히 승계했기에 열강으로 취급된다. **가장 광대한 영토를 보유하지만 중심지를 제외하면 행정력을 온전히 투사하지 못한다.**\n\n## 중견국 · 약소국\n\n열강 넷을 제외하면 여덟 나라가 남는다. 대부분 군도와 북부 변경에 몰려 있다.\n\n| 국가 | 위치 | 성격 | 등급 |\n|---|---|---|---|\n| [[카고르예 공화국]] | 북부 | 극한의 추위. **사냥꾼** 중심의 작지만 강한 세력 | 소국 |\n| [[루블린 공국]] | 중북부 | 강력한 민족 의식. **차량 기동력** | 소국 |\n| [[오흐리드 왕국]] | 북부 — [[연합]] 북쪽 국경 | 주요국 제외 최대 체급. 전 국토가 **숲과 산지의 요새** | 중견국 |\n| [[칼리아리 왕국]] | 남부 — [[연방]]과 국경 | 남부 **군도**를 향해 확장하려는 왕국 | 중견국 |\n| [[팔레르 기사단국]] | 남동부 군도 | 남부 해협의 **등대**를 관리한다 | 소국 |\n| [[헬베티 공국]] | 남서부 군도 | **조종술과 항해술**. 비행선과 함선을 다룬다 | 소국 |\n| [[바나토국]] | 남부 군도 최대 섬 | 신정국가. **알비온 제국의 후신** | 소국 |\n| [[쾨벤하운 인민연합]] | 중북부 — [[연방]]과 [[컴퍼니]] 사이 | 왕가가 실종되어 뚜렷한 체제가 없다 | 소국 |\n\n[[카고르예 공화국]]과 [[루블린 공국]]은 [[크레스티아 제국]]에 합병되었다가 제국이 붕괴하며 독립했고, 그래서 [[연말 위기]] 때 [[신성제국]]의 호출을 받아 반 연방 세력에 섰다.\n\n## 멸망한 국가\n\n### 도미누스 제국\n\n고대 바실리아 공동체에서 출발해 **남부 군도부터 중부까지 지배한 해상 패권국**이다. [[대악몽]] 직후 드레드 분지를 벗어난 바실리아인들이 흩어지는 과정에서, 군도의 바나토 섬을 중심으로 신정 체제가 자리잡아 세워졌다.\n\n확장의 뿌리에 **[[대악몽]]에 대항하기 위해 바실리아 자체의 힘을 키운다**는 의식이 있었고, 스스로를 '대악몽의 유일한 대적자'로 천명했다.\n\n**이 제국이 남긴 것이 지금 대륙의 골격이다.**\n\n| 남긴 것 | 지금 |\n|---|---|\n| 중부에 심은 **'귀족'과 '가문' 문화** | [[연방]]의 [[대가문]] |\n| 북도미누스가 쪼개져 생긴 **가문 단위 소국들** | 규합되어 [[연방]]이 된다 |\n| 봉쇄해버린 **카타니아 섬의 등대** | [[팔레르 기사단국]]의 거점 |\n| 순수 신정 국가로 축소된 최종 형태 | [[바나토국]] |\n\n멸망의 계기가 **[[레콩키스타]]의 완수**였다는 점이 특이하다. 대악몽에 맞서는 것을 사명으로 삼은 나라였는데, 그 성지가 다른 이들의 손에 구제되는 것을 보고 나라의 방향성 자체가 흔들렸다.\n\n### 크레스티아 제국\n\n근대의 패권국. 순수 무력으로 대륙 북부를 통제했다. [[연방]]과의 전쟁 중 내부 반란으로 해체되었고, 영토의 80%는 연방이, 20%는 [[컴퍼니]]가 차지했다. 황가는 컴퍼니 세력에게 처형되었다.\n\n## 대륙 간 관계\n\n**서사 시점까지 다른 대륙과의 접촉은 없다.** [[바다]]가 물리적 차단막이라서 대륙끼리 서로를 거의 모른 채 독립적으로 굴러간다.\n\n**접촉은 국가들이 붕괴한 뒤에 생긴다.** 위키 기준 현재에 이 대륙과 [[로디니아 대륙]] · [[판노티아 대륙]]이 **'대륙 연합'**을 이룬다. 항해에는 달의 움직임을 계산해 해역이 열리는 시점을 잡아야 한다. → [[바다]]\n\n## 이 대륙에서만 통하는 것\n\n대륙 표준이 없어서 한 나라 안에서만, 혹은 이 대륙 안에서만 통용되는 것들이 있다.\n\n- **[[카시마르]] 등급 체계** — [[신성제국]] 내부 척도뿐이다.\n- **철도 궤간** — 각 주가 제각기 철도 체계를 구성할 수 있다는 [[연방]] 헌법 조항 때문에 난립했다. → [[궤간 통일]]\n- **'국제법'** — 작중에서 그렇게 불리는 것은 [[연말 위기]] 조약의 조항이다.\n- **[[노에시스]]를 정련하는 법이 없다** — [[로디니아 대륙]]에는 정련된 노에시스('기')와 체계화된 [[노에마]]('무공')가 있는데, 이 대륙에는 그 체계가 없다. 대신 이곳 사람들은 소망이 강해 능력이 [[노모스]] 쪽으로 나타난다.\n\n## 이름\n\n**그렌빌**(Grenville) — 초대륙 [[로디니아 대륙]]을 만든 조산운동의 이름이다. 이 세계의 대륙 이름은 모두 실제로 존재했던 초대륙에서 왔다.\n\n**[[그렌빌리아 대륙]] · [[로디니아 대륙]] · [[판노티아 대륙]]은 모두 신대륙이다.** 구대륙은 [[판게아 대륙]]이며, [[바다 민족]]이 거기서 이 대륙으로 건너왔다. 나머지 두 신대륙에도 같은 계보가 닿았는지는 알려지지 않았다. → [[대전쟁]]\n\n**권 순서가 초대륙이 갈라진 순서다.** 그렌빌은 로디니아를 만든 조산운동이므로 그 앞자리다. → [[큰 그림]]\n\n## 관련 문서\n\n- [[큰 그림]] · [[로디니아 대륙]] · [[판노티아 대륙]] · [[판게아 대륙]]\n- [[연방]] · [[신성제국]] · [[연합]] · [[컴퍼니]]\n-
